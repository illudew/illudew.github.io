n class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对零向量另行约定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>垂直判定。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>内积空间中正交的定义。</p></section></div>`},{id:'elementary_math-c3s1-20',name:'向量夹角',tags:["def", "thm", "der", "app", "note"],brief:'两向量夹角由数量积与模的比值确定。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两向量夹角由数量积与模的比值确定。</p><div class="la-fml">$$\\cos\\theta=\\frac{\\vec{a}\\cdot\\vec{b}}{|\\vec{a}||\\vec{b}|}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cos\\theta=\\frac{\\vec{a}\\cdot\\vec{b}}{|\\vec{a}||\\vec{b}|}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由数量积定义反解cosθ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求两向量夹角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>θ∈[0,π]。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>高维空间中夹角的定义。</p></section></div>`},{id:'elementary_math-c3s1-21',name:'向量投影',tags:["def", "thm", "der", "app", "note"],brief:'向量a在b方向上的投影数量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量a在b方向上的投影数量。</p><div class="la-fml">$$\\text{proj}_{\\vec{b}}\\vec{a}=\\frac{\\vec{a}\\cdot\\vec{b}}{|\\vec{b}|}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{proj}_{\\vec{b}}\\vec{a}=\\frac{\\vec{a}\\cdot\\vec{b}}{|\\vec{b}|}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由|a|cosθ=|a||b|cosθ/|b|=a·b/|b|。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解向量、物理计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>投影是数量（可正可负）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>投影向量为proj·(b/|b|)。</p></section></div>`},{id:'elementary_math-c3s1-22',name:'向量模的计算',tags:["def", "thm", "der", "app", "note"],brief:'向量的模等于坐标平方和的平方根。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量的模等于坐标平方和的平方根。</p><div class="la-fml">$$|\\vec{a}|=\\sqrt{x^2+y^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\vec{a}|=\\sqrt{x^2+y^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由a·a=x²+y²=|a|²。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求向量长度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>即两点间距离。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>距离公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维欧氏范数。</p></section></div>`}]},{name:'3.2 平面几何',color:'#7c3aed',desc:'三角形、圆、多边形',items:[{id:'elementary_math-c3s2-1',name:'三角形分类',tags:["def", "der", "app", "note"],brief:'按角分：锐角、直角、钝角三角形；按边分：不等边、等腰、等边三角形。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>按角分：锐角、直角、钝角三角形；按边分：不等边、等腰、等边三角形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角和边的特征分类。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角形研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等边是特殊的等腰。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>几何基本分类。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>球面三角形分类不同。</p></section></div>`},{id:'elementary_math-c3s2-2',name:'三角形内角和',tags:["def", "thm", "der", "app", "note"],brief:'三角形三个内角之和为180°。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形三个内角之和为180°。</p><div class="la-fml">$$A+B+C=180^\\circ$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$A+B+C=180^\\circ$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>过一顶点作对边平行线，利用平行线内错角相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求三角形内角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是欧氏几何的基本定理，依赖平行公理。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧几里得证明。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>非欧几何中内角和≠180°。</p></section></div>`},{id:'elementary_math-c3s2-3',name:'三角形外角',tags:["def", "thm", "der", "app", "note"],brief:'三角形的一个外角等于与它不相邻的两个内角之和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形的一个外角等于与它不相邻的两个内角之和。</p><div class="la-fml">$$\\text{外角}=\\text{不相邻两内角和}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{外角}=\\text{不相邻两内角和}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由内角和与邻补角关系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>外角大于任一不相邻内角。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>外角定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多边形外角和恒为360°。</p></section></div>`},{id:'elementary_math-c3s2-4',name:'三角形三边关系',tags:["def", "thm", "der", "app", "note"],brief:'三角形任意两边之和大于第三边，任意两边之差小于第三边。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形任意两边之和大于第三边，任意两边之差小于第三边。</p><div class="la-fml">$$a+b>c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a+b>c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两点之间线段最短。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断三边能否构成三角形。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a-b<c<a+b。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>几何不等关系。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>是三角形存在的充要条件。</p></section></div>`},{id:'elementary_math-c3s2-5',name:'等腰三角形性质',tags:["def", "der", "app", "note"],brief:'等腰三角形两底角相等，顶角平分线、底边上的中线、高互相重合（三线合一）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等腰三角形两底角相等，顶角平分线、底边上的中线、高互相重合（三线合一）。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>作底边上的高，证明两三角形全等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等腰三角形计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等边对等角，等角对等边。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古希腊几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等腰三角形是轴对称图形。</p></section></div>`},{id:'elementary_math-c3s2-6',name:'等边三角形性质',tags:["def", "der", "app", "note"],brief:'等边三角形三边相等，三个内角都是60°。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等边三角形三边相等，三个内角都是60°。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>三边相等→三角相等→各60°。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>正三角形计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>有一个角为60°的等腰三角形是等边三角形。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>正多边形的特例。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等边三角形是最对称的三角形。</p></section></div>`},{id:'elementary_math-c3s2-7',name:'直角三角形性质',tags:["def", "thm", "der", "app", "note"],brief:'直角三角形两直角边平方和等于斜边平方（勾股定理）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>直角三角形两直角边平方和等于斜边平方（勾股定理）。</p><div class="la-fml">$$a^2+b^2=c^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^2+b^2=c^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>面积法或相似三角形。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求边长、判断直角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>斜边最长；斜边中线等于斜边一半。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>商高、毕达哥拉斯。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>勾股数组的通解。</p></section></div>`},{id:'elementary_math-c3s2-8',name:'勾股定理',tags:["def", "thm", "der", "app", "note"],brief:'直角三角形两直角边平方和等于斜边平方。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>直角三角形两直角边平方和等于斜边平方。</p><div class="la-fml">$$a^2+b^2=c^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^2+b^2=c^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>多种证法：赵爽弦图、面积拼接、相似三角形。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求距离、判断直角三角形。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>逆定理也成立：若a²+b²=c²则为直角三角形。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>中国商高、古希腊毕达哥拉斯分别发现。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>费马大定理是其推广（n>2时无正整数解）。</p></section></div>`},{id:'elementary_math-c3s2-9',name:'三角形全等',tags:["def", "der", "app", "note"],brief:'能够完全重合的两个三角形全等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>能够完全重合的两个三角形全等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由重合定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明线段相等、角相等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>全等三角形对应边相等、对应角相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>几何证明基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>SSS,SAS,ASA,AAS,HL判定。</p></section></div>`},{id:'elementary_math-c3s2-10',name:'全等判定SSS',tags:["def", "der", "app", "note"],brief:'三边对应相等的两个三角形全等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三边对应相等的两个三角形全等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由三角形的确定性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明三角形全等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是三角形稳定性的体现。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧几里得几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>是最基本的全等判定。</p></section></div>`},{id:'elementary_math-c3s2-11',name:'全等判定SAS',tags:["def", "der", "app", "note"],brief:'两边及其夹角对应相等的两个三角形全等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两边及其夹角对应相等的两个三角形全等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由夹角确定形状。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明全等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须是夹角，SSA不能判定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧几里得几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>两边一对角（SSA）一般不能判定全等。</p></section></div>`},{id:'elementary_math-c3s2-12',name:'全等判定ASA/AAS',tags:["def", "der", "app", "note"],brief:'两角及其夹边（或对边）对应相等的两个三角形全等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两角及其夹边（或对边）对应相等的两个三角形全等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由三角形内角和确定第三角。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明全等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>ASA是夹边，AAS是对边。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧几里得几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>由内角和定理AAS可转化为ASA。</p></section></div>`},{id:'elementary_math-c3s2-13',name:'直角三角形全等HL',tags:["def", "der", "app", "note"],brief:'斜边和一条直角边对应相等的两个直角三角形全等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>斜边和一条直角边对应相等的两个直角三角形全等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由勾股定理确定第三边，转化为SSS。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明直角三角形全等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>仅适用于直角三角形。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>特殊全等判定。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>是SSA在直角三角形中的特例。</p></section></div>`},{id:'elementary_math-c3s2-14',name:'三角形相似',tags:["def", "der", "app", "note"],brief:'对应角相等、对应边成比例的两个三角形相似。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对应角相等、对应边成比例的两个三角形相似。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由相似定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求比例、测量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>相似比k，面积比k²。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>相似图形。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>相似变换是保角变换。</p></section></div>`},{id:'elementary_math-c3s2-15',name:'相似判定AA',tags:["def", "der", "app", "note"],brief:'两角对应相等的两个三角形相似。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两角对应相等的两个三角形相似。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>第三角必相等，由内角和。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明相似。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>最常用的相似判定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>相似几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>类似全等的AAS。</p></section></div>`},{id:'elementary_math-c3s2-16',name:'相似判定SAS',tags:["def", "der", "app", "note"],brief:'两边对应成比例且夹角相等的两个三角形相似。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两边对应成比例且夹角相等的两个三角形相似。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由比例和夹角确定形状。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明相似。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须是夹角。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>相似几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与全等SAS对应。</p></section></div>`},{id:'elementary_math-c3s2-17',name:'相似判定SSS',tags:["def", "der", "app", "note"],brief:'三边对应成比例的两个三角形相似。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三边对应成比例的两个三角形相似。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由比例确定形状。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明相似。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>比例相等即可。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>相似几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与全等SSS对应。</p></section></div>`},{id:'elementary_math-c3s2-18',name:'三角形中位线',tags:["def", "thm", "der", "app", "note"],brief:'连接三角形两边中点的线段平行于第三边且等于第三边的一半。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>连接三角形两边中点的线段平行于第三边且等于第三边的一半。</p><div class="la-fml">$$\\text{中位线}\\parallel\\text{第三边},\\ \\text{且}=\\frac{1}{2}\\text{第三边}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{中位线}\\parallel\\text{第三边},\\ \\text{且}=\\frac{1}{2}\\text{第三边}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>构造平行四边形或用相似证明。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明平行、求长度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>中位线定理。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>几何定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到梯形中位线。</p></section></div>`},{id:'elementary_math-c3s2-19',name:'角平分线定理',tags:["def", "thm", "der", "app", "note"],brief:'三角形角平分线分对边的比等于邻边之比。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形角平分线分对边的比等于邻边之比。</p><div class="la-fml">$$\\frac{AB}{AC}=\\frac{BD}{DC}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{AB}{AC}=\\frac{BD}{DC}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用面积法或正弦定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求线段比例。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>逆定理也成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>几何定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>外角平分线也有类似定理。</p></section></div>`},{id:'elementary_math-c3s2-20',name:'圆的定义',tags:["def", "thm", "der", "app", "note"],brief:'平面内到定点距离等于定长的点的集合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平面内到定点距离等于定长的点的集合。</p><div class="la-fml">$$(x-a)^2+(y-b)^2=r^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(x-a)^2+(y-b)^2=r^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆的方程、几何研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定点是圆心，定长是半径。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>最完美的几何图形。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>球是圆的三维推广。</p></section></div>`},{id:'elementary_math-c3s2-21',name:'垂径定理',tags:["def", "der", "app", "note"],brief:'垂直于弦的直径平分弦且平分弦所对的两条弧。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>垂直于弦的直径平分弦且平分弦所对的两条弧。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由圆的对称性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求弦长、弧长。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>推论：平分弦（非直径）的直径垂直于弦。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆的基本定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>圆是轴对称图形。</p></section></div>`},{id:'elementary_math-c3s2-22',name:'圆周角定理',tags:["def", "thm", "der", "app", "note"],brief:'同弧所对的圆周角等于圆心角的一半。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同弧所对的圆周角等于圆心角的一半。</p><div class="la-fml">$$\\text{圆周角}=\\frac{1}{2}\\text{圆心角}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{圆周角}=\\frac{1}{2}\\text{圆心角}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>分三种情况证明（圆心在角内、边上、外）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>同弧所对圆周角相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆的重要定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>直径所对圆周角为直角。</p></section></div>`},{id:'elementary_math-c3s2-23',name:'切线性质',tags:["def", "der", "app", "note"],brief:'圆的切线垂直于过切点的半径。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>圆的切线垂直于过切点的半径。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用反证法或极限思想。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>切线问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>切线与圆只有一个公共点。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆的切线。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>切线长定理：从圆外一点引两条切线长相等。</p></section></div>`},{id:'elementary_math-c3s2-24',name:'切线判定',tags:["def", "der", "app", "note"],brief:'经过半径外端且垂直于这条半径的直线是圆的切线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>经过半径外端且垂直于这条半径的直线是圆的切线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>切线性质的逆定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明切线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>判定方法：d=r或垂直半径外端。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>切线判定。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>切线是割线的极限。</p></section></div>`},{id:'elementary_math-c3s2-25',name:'圆与圆位置关系',tags:["def", "der", "app", "note"],brief:'两圆位置关系由圆心距d与半径R,r决定：外离d>R+r，外切d=R+r，相交R-r<d<R+r，内切d=R-r，内含d<…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两圆位置关系由圆心距d与半径R,r决定：外离d>R+r，外切d=R+r，相交R-r<d<R+r，内切d=R-r，内含d<R-r。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由圆心距和半径比较。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断两圆关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>相切时切点在连心线上。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆与圆关系。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>共轴圆系。</p></section></div>`},{id:'elementary_math-c3s2-26',name:'正多边形',tags:["def", "der", "app", "note"],brief:'各边相等、各角也相等的多边形。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>各边相等、各角也相等的多边形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由边和角都相等定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>正n边形内角=(n-2)·180°/n。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古希腊研究正多边形作图。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>正多边形可内接于圆。</p></section></div>`},{id:'elementary_math-c3s2-27',name:'圆内接四边形',tags:["def", "der", "app", "note"],brief:'四个顶点都在同一圆上的四边形。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>四个顶点都在同一圆上的四边形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由共圆定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明四点共圆。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对角互补，外角等于内对角。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆内接四边形。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>托勒密定理：对边乘积和等于对角线乘积。</p></section></div>`},{id:'elementary_math-c3s2-28',name:'圆的切线长定理',tags:["def", "thm", "der", "app", "note"],brief:'从圆外一点引圆的两条切线，切线长相等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从圆外一点引圆的两条切线，切线长相等。</p><div class="la-fml">$$PA=PB$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$PA=PB$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>证明两个直角三角形全等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求切线长。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>连心线平分两切线夹角。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>切线性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>切线长公式PA=√(PO²-r²)。</p></section></div>`},{id:'elementary_math-c3s2-29',name:'三角形重心',tags:["def", "der", "app", "note"],brief:'三角形三条中线的交点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形三条中线的交点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>三条中线交于一点。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角形中心。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>重心分中线为2:1（顶点到重心:重心到中点）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>几何中心。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>重心坐标为三顶点坐标平均。</p></section></div>`},{id:'elementary_math-c3s2-30',name:'三角形外心',tags:["def", "der", "app", "note"],brief:'三角形三边垂直平分线的交点，即外接圆圆心。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形三边垂直平分线的交点，即外接圆圆心。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>垂直平分线上的点到两端点距离相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>外接圆。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>外心到三顶点距离相等=外接圆半径R。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角形五心之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>直角三角形外心在斜边中点。</p></section></div>`},{id:'elementary_math-c3s2-31',name:'三角形内心',tags:["def", "der", "app", "note"],brief:'三角形三条角平分线的交点，即内切圆圆心。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形三条角平分线的交点，即内切圆圆心。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>角平分线上的点到两边距离相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>内切圆。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>内心到三边距离相等=内切圆半径r。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角形五心之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>面积S=r·s（s为半周长）。</p></section></div>`},{id:'elementary_math-c3s2-32',name:'三角形垂心',tags:["def", "der", "app", "note"],brief:'三角形三条高的交点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形三条高的交点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>三条高交于一点。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角形高线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>锐角三角形垂心在内部，钝角在外部，直角在顶点。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角形五心之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>垂心与外心、重心共线（欧拉线）。</p></section></div>`},{id:'elementary_math-c3s2-33',name:'三角形旁心',tags:["def", "der", "app", "note"],brief:'三角形一个内角平分线与另外两个外角平分线的交点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形一个内角平分线与另外两个外角平分线的交点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>类似内心但用外角平分线。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>旁切圆。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>旁心到一边及另两边延长线距离相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角形五心之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>每个三角形有三个旁心。</p></section></div>`},{id:'elementary_math-c3s2-34',name:'多边形内角和',tags:["def", "thm", "der", "app", "note"],brief:'n边形内角和为(n-2)×180°。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n边形内角和为(n-2)×180°。</p><div class="la-fml">$$(n-2)\\times 180^\\circ$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(n-2)\\times 180^\\circ$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>从一个顶点引对角线分成n-2个三角形。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求多边形内角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>n≥3。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>多边形基本公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>正n边形每个内角=(n-2)·180°/n。</p></section></div>`},{id:'elementary_math-c3s2-35',name:'多边形外角和',tags:["def", "thm", "der", "app", "note"],brief:'任意多边形外角和恒为360°。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任意多边形外角和恒为360°。</p><div class="la-fml">$$360^\\circ$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$360^\\circ$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>每个内角+相邻外角=180°，总和n·180°-(n-2)·180°=360°。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求正多边形外角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与边数无关，恒为360°。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>多边形性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>正n边形每个外角=360°/n。</p></section></div>`},{id:'elementary_math-c3s2-36',name:'相交弦定理',tags:["def", "thm", "der", "app", "note"],brief:'圆内两弦AB,CD交于P，则PA·PB=PC·PD。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>圆内两弦AB,CD交于P，则PA·PB=PC·PD。</p><div class="la-fml">$$PA\\cdot PB=PC\\cdot PD$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$PA\\cdot PB=PC\\cdot PD$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由相似三角形。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆内线段计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>P在圆内时。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆幂定理之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>P在圆外时为割线定理。</p></section></div>`},{id:'elementary_math-c3s2-37',name:'切割线定理',tags:["def", "thm", "der", "app", "note"],brief:'从圆外一点P引切线PT和割线PAB，则PT²=PA·PB。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从圆外一点P引切线PT和割线PAB，则PT²=PA·PB。</p><div class="la-fml">$$PT^2=PA\\cdot PB$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$PT^2=PA\\cdot PB$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由弦切角定理证相似。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆外线段计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>切线长平方等于割线两段乘积。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆幂定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>统一为圆幂定理。</p></section></div>`}]},{name:'3.3 立体几何',color:'#0f766e',desc:'空间线面、多面体',items:[{id:'elementary_math-c3s3-1',name:'平面',tags:["def", "der", "app", "note"],brief:'几何中最基本的概念之一，无限延展、无厚薄。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>几何中最基本的概念之一，无限延展、无厚薄。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由现实抽象。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>立体几何基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>平面用平行四边形表示，用α,β,γ或字母表示。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧几里得几何基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二维流形。</p></section></div>`},{id:'elementary_math-c3s3-2',name:'平面基本性质',tags:["def", "der", "app", "note"],brief:'公理1：直线上两点在平面内则直线在平面内；公理2：不共线三点确定一平面；公理3：两平面有公共点则有过该点的公共直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>公理1：直线上两点在平面内则直线在平面内；公理2：不共线三点确定一平面；公理3：两平面有公共点则有过该点的公共直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>公理体系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间推理基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三个公理是立体几何的基石。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧几里得公理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>希尔伯特公理体系。</p></section></div>`},{id:'elementary_math-c3s3-3',name:'空间直线位置关系',tags:["def", "der", "app", "note"],brief:'空间中两条直线有：平行、相交、异面三种位置关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间中两条直线有：平行、相交、异面三种位置关系。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由是否共面和是否有公共点分类。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间线线关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>异面直线不同在任何一个平面内。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>异面直线所成角、距离。</p></section></div>`},{id:'elementary_math-c3s3-4',name:'异面直线',tags:["def", "der", "app", "note"],brief:'不同在任何一个平面内的两条直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不同在任何一个平面内的两条直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不平行也不相交。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间线线关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>所成角范围(0°,90°]。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何特有概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>异面直线的公垂线和距离。</p></section></div>`},{id:'elementary_math-c3s3-5',name:'线面平行判定',tags:["def", "der", "app", "note"],brief:'若平面外一条直线与平面内一条直线平行，则该直线与此平面平行。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若平面外一条直线与平面内一条直线平行，则该直线与此平面平行。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>反证法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明线面平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>线线平行⇒线面平行。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线面平行⇒线面无公共点。</p></section></div>`},{id:'elementary_math-c3s3-6',name:'线面平行性质',tags:["def", "der", "app", "note"],brief:'若直线与平面平行，过此直线的平面与已知平面相交，则交线与该直线平行。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若直线与平面平行，过此直线的平面与已知平面相交，则交线与该直线平行。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由线面平行定义推出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>由线面平行证线线平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>线面平行⇒线线平行（交线）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>平行关系的传递。</p></section></div>`},{id:'elementary_math-c3s3-7',name:'线面垂直判定',tags:["def", "der", "app", "note"],brief:'若一条直线与平面内两条相交直线都垂直，则该直线垂直于这个平面。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若一条直线与平面内两条相交直线都垂直，则该直线垂直于这个平面。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由两条相交直线确定平面方向。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明线面垂直。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须是两条相交直线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线面垂直⇒线垂直于面内所有直线。</p></section></div>`},{id:'elementary_math-c3s3-8',name:'线面垂直性质',tags:["def", "der", "app", "note"],brief:'若两条直线都垂直于同一平面，则这两条直线平行。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若两条直线都垂直于同一平面，则这两条直线平行。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由线面垂直定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>由线面垂直证线线平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>垂直于同一平面的两直线平行。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>平面的法向量。</p></section></div>`},{id:'elementary_math-c3s3-9',name:'面面平行判定',tags:["def", "der", "app", "note"],brief:'若一个平面内有两条相交直线都平行于另一个平面，则两平面平行。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若一个平面内有两条相交直线都平行于另一个平面，则两平面平行。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由两条相交直线确定平面。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明面面平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须是两条相交直线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>面面平行⇒无公共点。</p></section></div>`},{id:'elementary_math-c3s3-10',name:'面面平行性质',tags:["def", "der", "app", "note"],brief:'若两个平行平面同时与第三个平面相交，则交线平行。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若两个平行平面同时与第三个平面相交，则交线平行。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由面面平行定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>由面面平行证线线平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>面面平行⇒交线平行。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>夹在平行平面间的平行线段相等。</p></section></div>`},{id:'elementary_math-c3s3-11',name:'面面垂直判定',tags:["def", "der", "app", "note"],brief:'若一个平面过另一个平面的一条垂线，则两平面垂直。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若一个平面过另一个平面的一条垂线，则两平面垂直。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由二面角为直角。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明面面垂直。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>线面垂直⇒面面垂直。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二面角的平面角为90°。</p></section></div>`},{id:'elementary_math-c3s3-12',name:'面面垂直性质',tags:["def", "der", "app", "note"],brief:'若两平面垂直，在一个平面内垂直于交线的直线垂直于另一平面。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若两平面垂直，在一个平面内垂直于交线的直线垂直于另一平面。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由二面角定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>由面面垂直证线面垂直。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>关键是垂直于交线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>面面垂直⇒可构造线面垂直。</p></section></div>`},{id:'elementary_math-c3s3-13',name:'二面角',tags:["def", "der", "app", "note"],brief:'从一条直线出发的两个半平面组成的图形。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从一条直线出发的两个半平面组成的图形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由两个半平面和棱定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求两个平面的夹角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>二面角大小用其平面角度量，范围[0°,180°]。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二面角的平面角作法。</p></section></div>`},{id:'elementary_math-c3s3-14',name:'棱柱',tags:["def", "thm", "der", "app", "note"],brief:'有两个面互相平行，其余各面都是四边形，相邻四边形公共边互相平行的多面体。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有两个面互相平行，其余各面都是四边形，相邻四边形公共边互相平行的多面体。</p><div class="la-fml">$$V=Sh$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$V=Sh$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由面的特征定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何体研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>侧棱平行且相等；体积=底面积×高。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>多面体。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>直棱柱、正棱柱。</p></section></div>`},{id:'elementary_math-c3s3-15',name:'棱锥',tags:["def", "thm", "der", "app", "note"],brief:'一个面是多边形，其余各面是有公共顶点的三角形的多面体。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一个面是多边形，其余各面是有公共顶点的三角形的多面体。</p><div class="la-fml">$$V=\\frac{1}{3}Sh$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$V=\\frac{1}{3}Sh$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由面的特征定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何体研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>体积=1/3×底面积×高。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>多面体。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>正棱锥各侧面全等。</p></section></div>`},{id:'elementary_math-c3s3-16',name:'棱台',tags:["def", "thm", "der", "app", "note"],brief:'用平行于棱锥底面的平面截棱锥，截面与底面间的部分。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用平行于棱锥底面的平面截棱锥，截面与底面间的部分。</p><div class="la-fml">$$V=\\frac{1}{3}h(S+\\sqrt{SS'}+S')$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$V=\\frac{1}{3}h(S+\\sqrt{SS'}+S')$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由棱锥截得。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何体研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>体积公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>多面体。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>正棱台各侧面全等等腰梯形。</p></section></div>`},{id:'elementary_math-c3s3-17',name:'圆柱',tags:["def", "thm", "der", "app", "note"],brief:'以矩形一边为轴旋转一周所得的旋转体。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>以矩形一边为轴旋转一周所得的旋转体。</p><div class="la-fml">$$V=\\pi r^2h,\\ S_\\text{侧}=2\\pi rh$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$V=\\pi r^2h,\\ S_\\text{侧}=2\\pi rh$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由旋转定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何体研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>侧面展开是矩形。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>旋转体。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>圆柱的轴截面是矩形。</p></section></div>`},{id:'elementary_math-c3s3-18',name:'圆锥',tags:["def", "thm", "der", "app", "note"],brief:'以直角三角形一条直角边为轴旋转一周所得旋转体。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>以直角三角形一条直角边为轴旋转一周所得旋转体。</p><div class="la-fml">$$V=\\frac{1}{3}\\pi r^2h,\\ S_\\text{侧}=\\pi rl$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$V=\\frac{1}{3}\\pi r^2h,\\ S_\\text{侧}=\\pi rl$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由旋转定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何体研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>侧面展开是扇形，母线l=√(r²+h²)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>旋转体。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>圆锥轴截面是等腰三角形。</p></section></div>`},{id:'elementary_math-c3s3-19',name:'球',tags:["def", "thm", "der", "app", "note"],brief:'空间中到定点距离等于定长的点的集合（球面）及其内部。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间中到定点距离等于定长的点的集合（球面）及其内部。</p><div class="la-fml">$$V=\\frac{4}{3}\\pi R^3,\\ S=4\\pi R^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$V=\\frac{4}{3}\\pi R^3,\\ S=4\\pi R^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>球体计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>球的截面是圆，过球心的截面是大圆。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>最对称的立体。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>球的表面积和体积公式。</p></section></div>`},{id:'elementary_math-c3s3-20',name:'点到平面距离',tags:["def", "der", "app", "note"],brief:'平面外一点到平面的垂线段长度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平面外一点到平面的垂线段长度。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由垂直定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是点到平面的最短距离。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等体积法求距离。</p></section></div>`},{id:'elementary_math-c3s3-21',name:'线面角',tags:["def", "der", "app", "note"],brief:'直线与平面所成角是直线与它在平面内射影的夹角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>直线与平面所成角是直线与它在平面内射影的夹角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由射影定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求线面夹角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>范围[0°,90°]。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线面角的正弦=点到面距离/斜线长。</p></section></div>`}]},{name:'3.4 解析平面几何',color:'#c2410c',desc:'直线、圆锥曲线',items:[{id:'elementary_math-c3s4-1',name:'直线斜率',tags:["def", "thm", "der", "app", "note"],brief:'直线的斜率等于两点纵坐标差除以横坐标差，也等于倾斜角的正切。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>直线的斜率等于两点纵坐标差除以横坐标差，也等于倾斜角的正切。</p><div class="la-fml">$$k=\\frac{y_2-y_1}{x_2-x_1}=\\tan\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$k=\\frac{y_2-y_1}{x_2-x_1}=\\tan\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由倾斜角定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求直线斜率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>垂直于x轴的直线斜率不存在。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>斜率是直线方向的数量刻画。</p></section></div>`},{id:'elementary_math-c3s4-2',name:'直线方程点斜式',tags:["def", "thm", "der", "app", "note"],brief:'已知直线上一点(x₁,y₁)和斜率k的直线方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>已知直线上一点(x₁,y₁)和斜率k的直线方程。</p><div class="la-fml">$$y-y_1=k(x-x_1)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y-y_1=k(x-x_1)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由斜率定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求直线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>斜率存在时使用。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>直线方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>斜截式、两点式等。</p></section></div>`},{id:'elementary_math-c3s4-3',name:'直线方程斜截式',tags:["def", "thm", "der", "app", "note"],brief:'已知斜率k和y轴截距b的直线方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>已知斜率k和y轴截距b的直线方程。</p><div class="la-fml">$$y=kx+b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=kx+b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>点斜式的特例（过(0,b)）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求直线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>b是直线与y轴交点的纵坐标。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>直线方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>斜率不存在时不能用。</p></section></div>`},{id:'elementary_math-c3s4-4',name:'直线方程两点式',tags:["def", "thm", "der", "app", "note"],brief:'已知两点(x₁,y₁),(x₂,y₂)的直线方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>已知两点(x₁,y₁),(x₂,y₂)的直线方程。</p><div class="la-fml">$$\\frac{y-y_1}{y_2-y_1}=\\frac{x-x_1}{x_2-x_1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{y-y_1}{y_2-y_1}=\\frac{x-x_1}{x_2-x_1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由斜率相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求直线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>x₁≠x₂,y₁≠y₂时使用。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>直线方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>可化为一般式。</p></section></div>`},{id:'elementary_math-c3s4-5',name:'直线方程一般式',tags:["def", "thm", "der", "app", "note"],brief:'直线的一般方程，A,B不同时为零。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>直线的一般方程，A,B不同时为零。</p><div class="la-fml">$$Ax+By+C=0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$Ax+By+C=0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由各种形式统一。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>直线方程的统一形式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>所有直线都可写成一般式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>直线方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>法向量为(A,B)。</p></section></div>`},{id:'elementary_math-c3s4-6',name:'两直线平行',tags:["def", "thm", "der", "app", "note"],brief:'两直线平行当且仅当斜率相等且截距不等（斜率存在时）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两直线平行当且仅当斜率相等且截距不等（斜率存在时）。</p><div class="la-fml">$$k_1=k_2\\ (b_1\\neq b_2)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$k_1=k_2\\ (b_1\\neq b_2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由斜率定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一般式中A₁B₂-A₂B₁=0且不重合。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>平行直线无交点。</p></section></div>`},{id:'elementary_math-c3s4-7',name:'两直线垂直',tags:["def", "thm", "der", "app", "note"],brief:'两直线垂直当且仅当斜率乘积为-1（斜率存在时）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两直线垂直当且仅当斜率乘积为-1（斜率存在时）。</p><div class="la-fml">$$k_1k_2=-1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$k_1k_2=-1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方向向量点积为零。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断垂直。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一条斜率为0，另一条不存在时也垂直。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般式中A₁A₂+B₁B₂=0。</p></section></div>`},{id:'elementary_math-c3s4-8',name:'两直线交点',tags:["def", "der", "app", "note"],brief:'联立两直线方程求解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>联立两直线方程求解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>方程组的解即交点。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求交点。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>无解⟺平行；无穷多解⟺重合。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>交点坐标是方程组的解。</p></section></div>`},{id:'elementary_math-c3s4-9',name:'点到直线距离',tags:["def", "thm", "der", "app", "note"],brief:'点(x₀,y₀)到直线Ax+By+C=0的距离。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>点(x₀,y₀)到直线Ax+By+C=0的距离。</p><div class="la-fml">$$d=\\frac{|Ax_0+By_0+C|}{\\sqrt{A^2+B^2}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$d=\\frac{|Ax_0+By_0+C|}{\\sqrt{A^2+B^2}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由垂线方向向量推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求点到直线距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分子绝对值保证非负。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>两平行线距离。</p></section></div>`},{id:'elementary_math-c3s4-10',name:'两平行线距离',tags:["def", "thm", "der", "app", "note"],brief:'两平行线Ax+By+C₁=0和Ax+By+C₂=0间的距离。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两平行线Ax+By+C₁=0和Ax+By+C₂=0间的距离。</p><div class="la-fml">$$d=\\frac{|C_1-C_2|}{\\sqrt{A^2+B^2}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$d=\\frac{|C_1-C_2|}{\\sqrt{A^2+B^2}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>转化为点到直线距离。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求平行线距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>要求两方程A,B相同。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>可在一条线上取点算距离。</p></section></div>`},{id:'elementary_math-c3s4-11',name:'圆的标准方程',tags:["def", "thm", "der", "app", "note"],brief:'以(a,b)为圆心、r为半径的圆的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>以(a,b)为圆心、r为半径的圆的方程。</p><div class="la-fml">$$(x-a)^2+(y-b)^2=r^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(x-a)^2+(y-b)^2=r^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离公式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆的方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>圆心(a,b)，半径r。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般方程x²+y²+Dx+Ey+F=0。</p></section></div>`},{id:'elementary_math-c3s4-12',name:'圆的一般方程',tags:["def", "thm", "der", "app", "note"],brief:'圆的一般方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>圆的一般方程。</p><div class="la-fml">$$x^2+y^2+Dx+Ey+F=0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x^2+y^2+Dx+Ey+F=0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由标准方程展开。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆的方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>D²+E²-4F>0时表示圆，圆心(-D/2,-E/2)，半径√(D²+E²-4F)/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>圆的方程的统一形式。</p></section></div>`},{id:'elementary_math-c3s4-13',name:'直线与圆位置关系',tags:["def", "der", "app", "note"],brief:'由圆心到直线距离d与半径r比较：d>r相离，d=r相切，d<r相交。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由圆心到直线距离d与半径r比较：d>r相离，d=r相切，d<r相交。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离和半径。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断直线与圆关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>也可联立方程用判别式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>相交时弦长=2√(r²-d²)。</p></section></div>`},{id:'elementary_math-c3s4-14',name:'椭圆定义',tags:["def", "thm", "der", "app", "note"],brief:'平面内到两定点F₁,F₂距离之和为常数(2a>2c)的点的轨迹。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平面内到两定点F₁,F₂距离之和为常数(2a>2c)的点的轨迹。</p><div class="la-fml">$$|PF_1|+|PF_2|=2a>2c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|PF_1|+|PF_2|=2a>2c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离条件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>行星轨道、光学。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两定点叫焦点，距离2c叫焦距，2a叫长轴长。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆锥曲线。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>椭圆的光学性质。</p></section></div>`},{id:'elementary_math-c3s4-15',name:'椭圆标准方程',tags:["def", "thm", "der", "app", "note"],brief:'焦点在x轴上的椭圆标准方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>焦点在x轴上的椭圆标准方程。</p><div class="la-fml">$$\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1\\ (a>b>0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1\\ (a>b>0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>椭圆方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>c²=a²-b²；长轴2a，短轴2b。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>焦点在y轴上时x²/b²+y²/a²=1。</p></section></div>`},{id:'elementary_math-c3s4-16',name:'椭圆性质',tags:["def", "der", "app", "note"],brief:'椭圆关于x轴、y轴、原点对称，顶点(±a,0),(0,±b)，离心率e=c/a∈(0,1)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>椭圆关于x轴、y轴、原点对称，顶点(±a,0),(0,±b)，离心率e=c/a∈(0,1)。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由标准方程分析。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>椭圆分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>e越接近0越圆，越接近1越扁。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆锥曲线。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>椭圆的准线、焦半径。</p></section></div>`},{id:'elementary_math-c3s4-17',name:'双曲线定义',tags:["def", "thm", "der", "app", "note"],brief:'平面内到两定点距离之差的绝对值为常数(2a<2c)的点的轨迹。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平面内到两定点距离之差的绝对值为常数(2a<2c)的点的轨迹。</p><div class="la-fml">$$||PF_1|-|PF_2||=2a<2c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$||PF_1|-|PF_2||=2a<2c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离条件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>双曲线轨迹。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>2a<2c否则无轨迹。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆锥曲线。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>双曲线的光学性质。</p></section></div>`},{id:'elementary_math-c3s4-18',name:'双曲线标准方程',tags:["def", "thm", "der", "app", "note"],brief:'焦点在x轴上的双曲线标准方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>焦点在x轴上的双曲线标准方程。</p><div class="la-fml">$$\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>双曲线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>c²=a²+b²；实轴2a，虚轴2b。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>渐近线y=±(b/a)x。</p></section></div>`},{id:'elementary_math-c3s4-19',name:'双曲线渐近线',tags:["def", "thm", "der", "app", "note"],brief:'双曲线无限接近但不相交的直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>双曲线无限接近但不相交的直线。</p><div class="la-fml">$$y=\\pm\\frac{b}{a}x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\pm\\frac{b}{a}x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>当x,y→∞时方程近似为x²/a²-y²/b²=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>双曲线分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是双曲线的重要特征。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆锥曲线。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等轴双曲线渐近线互相垂直。</p></section></div>`},{id:'elementary_math-c3s4-20',name:'抛物线定义',tags:["def", "thm", "der", "app", "note"],brief:'平面内到定点F和定直线l距离相等的点的轨迹。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平面内到定点F和定直线l距离相等的点的轨迹。</p><div class="la-fml">$$|PF|=d$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|PF|=d$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离相等条件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抛物线轨迹、光学。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定点F是焦点，定直线l是准线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆锥曲线。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>抛物线的光学性质（平行光聚焦）。</p></section></div>`},{id:'elementary_math-c3s4-21',name:'抛物线标准方程',tags:["def", "thm", "der", "app", "note"],brief:'顶点在原点、焦点在x轴正半轴的抛物线方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>顶点在原点、焦点在x轴正半轴的抛物线方程。</p><div class="la-fml">$$y^2=2px\\ (p>0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y^2=2px\\ (p>0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抛物线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>焦点(p/2,0)，准线x=-p/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>四种开口方向的标准方程。</p></section></div>`},{id:'elementary_math-c3s4-22',name:'圆锥曲线统一定义',tags:["def", "thm", "der", "app", "note"],brief:'到定点距离与到定直线距离之比为常数e的点的轨迹：e<1椭圆，e=1抛物线，e>1双曲线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>到定点距离与到定直线距离之比为常数e的点的轨迹：e<1椭圆，e=1抛物线，e>1双曲线。</p><div class="la-fml">$$e=\\frac{|PF|}{d}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$e=\\frac{|PF|}{d}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由离心率统一。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一研究圆锥曲线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>e是离心率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>阿波罗尼奥斯圆锥曲线论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>极坐标方程。</p></section></div>`}]},{name:'3.5 解析立体几何',color:'#7c3aed',desc:'空间向量、空间方程',items:[{id:'elementary_math-c3s5-1',name:'空间向量',tags:["def", "thm", "der", "app", "note"],brief:'空间中的向量，用三维坐标表示。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间中的向量，用三维坐标表示。</p><div class="la-fml">$$\\vec{a}=(x,y,z)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}=(x,y,z)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平面向量推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间几何计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>运算规则与平面向量类似。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>立体几何代数化。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>n维向量。</p></section></div>`},{id:'elementary_math-c3s5-2',name:'空间向量运算',tags:["def", "thm", "der", "app", "note"],brief:'空间向量加减、数乘、数量积的坐标运算。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间向量加减、数乘、数量积的坐标运算。</p><div class="la-fml">$$(x_1,y_1,z_1)\\pm(x_2,y_2,z_2)=(x_1\\pm x_2,y_1\\pm y_2,z_1\\pm z_2)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(x_1,y_1,z_1)\\pm(x_2,y_2,z_2)=(x_1\\pm x_2,y_1\\pm y_2,z_1\\pm z_2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平面向量推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间向量计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>数量积=x₁x₂+y₁y₂+z₁z₂。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维。</p></section></div>`},{id:'elementary_math-c3s5-3',name:'空间向量共线',tags:["def", "thm", "der", "app", "note"],brief:'空间两向量共线条件。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间两向量共线条件。</p><div class="la-fml">$$\\vec{a}=\\lambda\\vec{b}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}=\\lambda\\vec{b}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>与平面类似。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断空间线线平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>b≠0时。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维。</p></section></div>`},{id:'elementary_math-c3s5-4',name:'空间向量共面',tags:["def", "thm", "der", "app", "note"],brief:'空间三向量共面条件：存在λ,μ使c=λa+μb。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间三向量共面条件：存在λ,μ使c=λa+μb。</p><div class="la-fml">$$\\vec{c}=\\lambda\\vec{a}+\\mu\\vec{b}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{c}=\\lambda\\vec{a}+\\mu\\vec{b}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平面向量基本定理推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断共面、线面平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a,b不共线时。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>混合积为零。</p></section></div>`},{id:'elementary_math-c3s5-5',name:'空间向量数量积',tags:["def", "thm", "der", "app", "note"],brief:'空间向量的数量积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间向量的数量积。</p><div class="la-fml">$$\\vec{a}\\cdot\\vec{b}=|\\vec{a}||\\vec{b}|\\cos\\theta=x_1x_2+y_1y_2+z_1z_2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}\\cdot\\vec{b}=|\\vec{a}||\\vec{b}|\\cos\\theta=x_1x_2+y_1y_2+z_1z_2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平面推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求空间角、证垂直。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a⊥b⟺a·b=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>内积空间。</p></section></div>`},{id:'elementary_math-c3s5-6',name:'空间向量模',tags:["def", "thm", "der", "app", "note"],brief:'空间向量的模。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间向量的模。</p><div class="la-fml">$$|\\vec{a}|=\\sqrt{x^2+y^2+z^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\vec{a}|=\\sqrt{x^2+y^2+z^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由数量积a·a。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求空间距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>即向量长度。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>距离公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>欧氏范数。</p></section></div>`},{id:'elementary_math-c3s5-7',name:'空间两点距离',tags:["def", "thm", "der", "app", "note"],brief:'空间中两点间的距离公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间中两点间的距离公式。</p><div class="la-fml">$$d=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$d=\\sqrt{(x_2-x_1)^2+(y_2-y_1)^2+(z_2-z_1)^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由向量模或勾股定理推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求空间距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>平面距离公式的推广。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维。</p></section></div>`},{id:'elementary_math-c3s5-8',name:'直线方向向量',tags:["def", "der", "app", "note"],brief:'与直线平行的非零向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>与直线平行的非零向量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平行定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定直线方向。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>不唯一，可差非零倍数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>直线的方向余弦。</p></section></div>`},{id:'elementary_math-c3s5-9',name:'空间直线方程',tags:["def", "thm", "der", "app", "note"],brief:'过点(x₀,y₀,z₀)方向向量(a,b,c)的直线方程（点向式）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过点(x₀,y₀,z₀)方向向量(a,b,c)的直线方程（点向式）。</p><div class="la-fml">$$\\frac{x-x_0}{a}=\\frac{y-y_0}{b}=\\frac{z-z_0}{c}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{x-x_0}{a}=\\frac{y-y_0}{b}=\\frac{z-z_0}{c}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方向向量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间直线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>也可写参数方程。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般式为两平面交线。</p></section></div>`},{id:'elementary_math-c3s5-10',name:'平面法向量',tags:["def", "der", "app", "note"],brief:'垂直于平面的非零向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>垂直于平面的非零向量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由垂直定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定平面方向。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>不唯一。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>平面法向量可由面内两向量叉积得到。</p></section></div>`},{id:'elementary_math-c3s5-11',name:'空间平面方程',tags:["def", "thm", "der", "app", "note"],brief:'过点(x₀,y₀,z₀)法向量(A,B,C)的平面方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过点(x₀,y₀,z₀)法向量(A,B,C)的平面方程。</p><div class="la-fml">$$A(x-x_0)+B(y-y_0)+C(z-z_0)=0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$A(x-x_0)+B(y-y_0)+C(z-z_0)=0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由法向量和点法式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间平面方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一般式Ax+By+Cz+D=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>法向量(A,B,C)。</p></section></div>`},{id:'elementary_math-c3s5-12',name:'线面角向量法',tags:["def", "thm", "der", "app", "note"],brief:'用方向向量v和法向量n求线面角θ。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用方向向量v和法向量n求线面角θ。</p><div class="la-fml">$$\\sin\\theta=\\frac{|\\vec{v}\\cdot\\vec{n}|}{|\\vec{v}||\\vec{n}|}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\theta=\\frac{|\\vec{v}\\cdot\\vec{n}|}{|\\vec{v}||\\vec{n}|}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>线面角与方向向量和法向量夹角互余。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求线面角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>θ∈[0,90°]。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>避免找角的困难。</p></section></div>`},{id:'elementary_math-c3s5-13',name:'二面角向量法',tags:["def", "thm", "der", "app", "note"],brief:'用法向量求二面角，注意法向量方向选择。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用法向量求二面角，注意法向量方向选择。</p><div class="la-fml">$$\\cos\\theta=\\pm\\frac{\\vec{n_1}\\cdot\\vec{n_2}}{|\\vec{n_1}||\\vec{n_2}|}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cos\\theta=\\pm\\frac{\\vec{n_1}\\cdot\\vec{n_2}}{|\\vec{n_1}||\\vec{n_2}|}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>二面角与法向量夹角相等或互补。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求二面角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需判断锐角还是钝角。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>法向量夹角与二面角的关系。</p></section></div>`},{id:'elementary_math-c3s5-14',name:'点到平面距离向量法',tags:["def", "thm", "der", "app", "note"],brief:'点A到平面的距离，P是平面上一点，n是法向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>点A到平面的距离，P是平面上一点，n是法向量。</p><div class="la-fml">$$d=\\frac{|\\vec{AP}\\cdot\\vec{n}|}{|\\vec{n}|}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$d=\\frac{|\\vec{AP}\\cdot\\vec{n}|}{|\\vec{n}|}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由向量投影。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求点面距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>AP是从A到平面上一点P的向量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>比几何法更简便。</p></section></div>`},{id:'elementary_math-c3s5-15',name:'异面直线距离向量法',tags:["def", "thm", "der", "app", "note"],brief:'异面直线间距离，A,B分别在两直线上，n是公垂线方向。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>异面直线间距离，A,B分别在两直线上，n是公垂线方向。</p><div class="la-fml">$$d=\\frac{|\\vec{AB}\\cdot\\vec{n}|}{|\\vec{n}|}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$d=\\frac{|\\vec{AB}\\cdot\\vec{n}|}{|\\vec{n}|}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由向量投影。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求异面直线距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>n可取两直线方向向量的叉积。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>公垂线方向n=v₁×v₂。</p></section></div>`},{id:'elementary_math-c3s5-16',name:'空间直线参数方程',tags:["def", "thm", "der", "app", "note"],brief:'过点(x₀,y₀,z₀)方向向量(a,b,c)的直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过点(x₀,y₀,z₀)方向向量(a,b,c)的直线。</p><div class="la-fml">$$\\frac{x-x_0}{a}=\\frac{y-y_0}{b}=\\frac{z-z_0}{c}=t$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{x-x_0}{a}=\\frac{y-y_0}{b}=\\frac{z-z_0}{c}=t$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方向向量参数化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>空间直线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>方向数a,b,c不全为0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>参数式x=x₀+at等。</p></section></div>`},{id:'elementary_math-c3s5-17',name:'空间平面一般方程',tags:["def", "thm", "der", "app", "note"],brief:'空间平面的一般式，法向量(A,B,C)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>空间平面的一般式，法向量(A,B,C)。</p><div class="la-fml">$$Ax+By+Cz+D=0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$Ax+By+Cz+D=0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由法向量和点法式展开。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>平面方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>A²+B²+C²≠0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>截距式x/a+y/b+z/c=1。</p></section></div>`},{id:'elementary_math-c3s5-18',name:'空间平面截距式',tags:["def", "thm", "der", "app", "note"],brief:'在x,y,z轴截距分别为a,b,c的平面。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在x,y,z轴截距分别为a,b,c的平面。</p><div class="la-fml">$$\\frac{x}{a}+\\frac{y}{b}+\\frac{z}{c}=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{x}{a}+\\frac{y}{b}+\\frac{z}{c}=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由一般方程令两坐标为0推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>已知截距求平面。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a,b,c均不为0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>便于画图。</p></section></div>`},{id:'elementary_math-c3s5-19',name:'两平面位置关系',tags:["def", "der", "app", "note"],brief:'平行、相交（垂直是特例）、重合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平行、相交（垂直是特例）、重合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由法向量关系判断。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断平面关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>法向量平行则平面平行或重合。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>空间几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二面角由法向量夹角求。</p></section></div>`},{id:'elementary_math-c3s5-20',name:'直线与平面位置关系',tags:["def", "der", "app", "note"],brief:'平行、相交（垂直是特例）、在平面内。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平行、相交（垂直是特例）、在平面内。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方向向量与法向量关系判断。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断线面关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>方向向量与法向量垂直则线面平行或在面内。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>空间几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线面角是方向向量与法向量夹角的余角。</p></section></div>`},{id:'elementary_math-c3s5-21',name:'球面方程',tags:["def", "thm", "der", "app", "note"],brief:'球心(a,b,c)半径R的球面。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>球心(a,b,c)半径R的球面。</p><div class="la-fml">$$(x-a)^2+(y-b)^2+(z-c)^2=R^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(x-a)^2+(y-b)^2+(z-c)^2=R^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由空间两点距离公式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>球面方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一般式x²+y²+z²+Dx+Ey+Fz+G=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>球的体积和表面积。</p></section></div>`},{id:'elementary_math-c3s5-22',name:'空间中点到直线距离',tags:["def", "der", "app", "note"],brief:'点到空间直线的距离。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>点到空间直线的距离。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用向量叉积：d=|v×PA|/|v|。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>距离计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>v是直线方向向量，P是直线上一点。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>空间几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>平行直线间距离同理。</p></section></div>`},{id:'elementary_math-c3s5-23',name:'空间两直线夹角',tags:["def", "thm", "der", "app", "note"],brief:'两直线方向向量夹角（取锐角）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两直线方向向量夹角（取锐角）。</p><div class="la-fml">$$\\cos\\theta=\\frac{|\\vec{v_1}\\cdot\\vec{v_2}|}{|\\vec{v_1}||\\vec{v_2}|}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cos\\theta=\\frac{|\\vec{v_1}\\cdot\\vec{v_2}|}{|\\vec{v_1}||\\vec{v_2}|}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由向量点积。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求线线角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>取绝对值保证为锐角。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>空间几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>垂直时点积为0。</p></section></div>`}]}]},
{id:'elementary_math-ch4',num:'第四章',title:'概率与统计',en:'PROBABILITY & STATISTICS',sub:'计数原理 · 排列组合 · 概率 · 统计',desc:'从计数原理到概率统计，构建数据与不确定性的数学体系。',sections:[{name:'4.1 计数原理与排列组合',color:'#2563eb',desc:'分类分步、排列组合',items:[{id:'elementary_math-c4s1-1',name:'分类加法计数原理',tags:["def", "thm", "der", "app", "note"],brief:'完成一件事有n类办法，各类办法数相加得总方法数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>完成一件事有n类办法，各类办法数相加得总方法数。</p><div class="la-fml">$$N=m_1+m_2+\\cdots+m_n$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$N=m_1+m_2+\\cdots+m_n$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>互斥情形相加。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计数问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>各类办法互斥。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>计数原理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>加法原理。</p></section></div>`},{id:'elementary_math-c4s1-2',name:'分步乘法计数原理',tags:["def", "thm", "der", "app", "note"],brief:'完成一件事需n个步骤，各步骤方法数相乘得总方法数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>完成一件事需n个步骤，各步骤方法数相乘得总方法数。</p><div class="la-fml">$$N=m_1\\times m_2\\times\\cdots\\times m_n$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$N=m_1\\times m_2\\times\\cdots\\times m_n$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>独立步骤相乘。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计数问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>各步骤相互独立，缺一不可。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>计数原理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>乘法原理。</p></section></div>`},{id:'elementary_math-c4s1-3',name:'排列',tags:["def", "thm", "der", "app", "note"],brief:'从n个不同元素中取m个按一定顺序排成一列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从n个不同元素中取m个按
