<script>
const LA_FIG = {  };
const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', his:'注 记'};
const LA_DATA = [
{id:'la-ch1',num:'第一章',title:'三角函数与反三角',en:'TRIGONOMETRY',sub:'角度与弧度、三角恒等式',desc:'三角函数是初等数学的核心工具。本章复习角度制与弧度制、基本恒等式、和差化积与反三角函数。',sections:[{name:'1.1 角度与弧度',color:'#2563eb',desc:'两种度量方式的换算',items:[{id:'la-k1-1',name:'弧度制',tags:["def", "exa"],brief:'$180^\\circ = \\pi$ 弧度，弧长 $l=r\\theta$。',body:`<p><strong>定义</strong>　在半径为 $r$ 的圆中，弧长等于半径的圆心角为 1 弧度（rad）。</p><div class="la-fml">$$\\theta(\\text{rad}) = \\frac{\\pi}{180^\\circ}\\theta(^\\circ)$$</div><p>常见换算：$30^\\circ=\\pi/6$，$45^\\circ=\\pi/4$，$60^\\circ=\\pi/3$，$90^\\circ=\\pi/2$。</p>`},{id:'la-k1-2',name:'基本恒等式',tags:["thm"],brief:'$\\sin^2\\theta+\\cos^2\\theta=1$，商数与倒数关系。',body:`<p><strong>定理</strong>　对任意角 $\\theta$：</p><div class="la-fml">$$\\sin^2\\theta+\\cos^2\\theta=1,\\quad \\tan\\theta=\\frac{\\sin\\theta}{\\cos\\theta},\\quad \\cot\\theta=\\frac{\\cos\\theta}{\\sin\\theta}$$</div>`}]},{name:'1.2 和差角与倍角',color:'#7c3aed',desc:'三角恒等变换的核心公式',items:[{id:'la-k1-3',name:'和差角公式',tags:["thm", "der"],brief:'$\\sin(\\alpha\\pm\\beta)=\\sin\\alpha\\cos\\beta\\pm\\cos\\alpha\\sin\\beta$。',body:`<p><strong>推导</strong>　利用单位圆上两点距离可证：</p><div class="la-fml">$$\\cos(\\alpha-\\beta)=\\cos\\alpha\\cos\\beta+\\sin\\alpha\\sin\\beta$$</div><p>由此推出和差角正弦、余弦、正切公式。</p>`},{id:'la-k1-4',name:'二倍角与半角',tags:["thm"],brief:'$\\sin2\\theta=2\\sin\\theta\\cos\\theta$，$\\cos2\\theta=\\cos^2\\theta-\\sin^2\\theta$。',body:`<p>令 $\\alpha=\\beta=\\theta$ 即得二倍角公式。半角公式：</p><div class="la-fml">$$\\sin\\frac{\\theta}{2}=\\pm\\sqrt{\\frac{1-\\cos\\theta}{2}},\\quad \\cos\\frac{\\theta}{2}=\\pm\\sqrt{\\frac{1+\\cos\\theta}{2}}$$</div>`}]},{name:'1.3 反三角函数',color:'#0f766e',desc:'三角方程的解与主值',items:[{id:'la-k1-5',name:'反正弦与反余弦',tags:["def"],brief:'$\\arcsin x\\in[-\\pi/2,\\pi/2]$，$\\arccos x\\in[0,\\pi]$。',body:`<p><strong>定义</strong>　$y=\\arcsin x$ 是 $y=\\sin x$ 在 $[-\\pi/2,\\pi/2]$ 上的反函数；$y=\\arccos x$ 是 $y=\\cos x$ 在 $[0,\\pi]$ 上的反函数。</p><div class="la-fml">$$\\arcsin x+\\arccos x=\\frac{\\pi}{2}\\quad(|x|\\le 1)$$</div>`}]}]},
{id:'la-ch2',num:'第二章',title:'向量与极坐标',en:'VECTORS & POLAR',sub:'向量运算、坐标系转换',desc:'向量是描述物理量的基本语言。本章复习向量的加减、点积、叉乘，以及极坐标与直角坐标的换算。',sections:[{name:'2.1 向量代数',color:'#2563eb',desc:'线性运算、点积、叉乘',items:[{id:'la-k2-1',name:'向量的线性运算',tags:["def", "exa"],brief:'加法满足平行四边形法则，数乘缩放长度。',body:`<p><strong>定义</strong>　向量 $\\boldsymbol{a}=(a_1,a_2,a_3)$，数乘 $\\lambda\\boldsymbol{a}=(\\lambda a_1,\\lambda a_2,\\lambda a_3)$。</p><div class="la-fml">$$|\\lambda\\boldsymbol{a}|=|\\lambda|\\,|\\boldsymbol{a}|$$</div>`},{id:'la-k2-2',name:'点积与叉乘',tags:["def", "thm"],brief:'$\\boldsymbol{a}\\cdot\\boldsymbol{b}=|a||b|\\cos\\theta$，叉乘垂直于两向量。',body:`<p><strong>点积</strong>：$\\boldsymbol{a}\\cdot\\boldsymbol{b}=a_1b_1+a_2b_2+a_3b_3$，结果为标量。</p><p><strong>叉乘</strong>：$\\boldsymbol{a}\\times\\boldsymbol{b}=(a_2b_3-a_3b_2,\\,a_3b_1-a_1b_3,\\,a_1b_2-a_2b_1)$，方向由右手定则确定。</p><div class="la-fml">$$|\\boldsymbol{a}\\times\\boldsymbol{b}|=|a||b|\\sin\\theta$$</div>`}]},{name:'2.2 极坐标',color:'#7c3aed',desc:'平面点的另一种表示',items:[{id:'la-k2-3',name:'极坐标与直角坐标',tags:["def", "exa"],brief:'$x=r\\cos\\theta$，$y=r\\sin\\theta$。',body:`<p>极坐标用 $(r,\\theta)$ 表示平面点，与直角坐标互换：</p><div class="la-fml">$$r=\\sqrt{x^2+y^2},\\quad \\theta=\\arctan\\frac{y}{x}$$</div>`}]}]},
{id:'la-ch3',num:'第三章',title:'数列与不等式',en:'SEQUENCES & INEQUALITIES',sub:'等差等比数列、均值不等式',desc:'数列是函数的离散形式，不等式是估计与证明的工具。',sections:[{name:'3.1 数列',color:'#0f766e',desc:'等差、等比与求和',items:[{id:'la-k3-1',name:'等差数列',tags:["def", "thm"],brief:'$a_n=a_1+(n-1)d$，$S_n=\\frac{n(a_1+a_n)}{2}$。',body:`<p>公差为 $d$ 的等差数列，通项与前 $n$ 项和：</p><div class="la-fml">$$a_n=a_1+(n-1)d,\\quad S_n=na_1+\\frac{n(n-1)}{2}d$$</div>`},{id:'la-k3-2',name:'等比数列',tags:["def", "thm"],brief:'$a_n=a_1q^{n-1}$，$S_n=a_1\\frac{1-q^n}{1-q}$。',body:`<p>公比为 $q$ 的等比数列。当 $|q|<1$ 时无穷级数收敛：</p><div class="la-fml">$$S=\\lim_{n\\to\\infty}S_n=\\frac{a_1}{1-q}$$</div>`}]},{name:'3.2 重要不等式',color:'#c2410c',desc:'均值不等式与柯西',items:[{id:'la-k3-3',name:'均值不等式',tags:["thm"],brief:'$\\frac{a+b}{2}\\ge\\sqrt{ab}\\ge\\frac{2ab}{a+b}$。',body:`<p>对正数 $a,b$，调和平均 $\\le$ 几何平均 $\\le$ 算术平均：</p><div class="la-fml">$$\\frac{2}{\\frac{1}{a}+\\frac{1}{b}}\\le\\sqrt{ab}\\le\\frac{a+b}{2}$$</div>`}]}]},
{id:'la-ch4',num:'第四章',title:'解析几何',en:'ANALYTIC GEOMETRY',sub:'直线、圆锥曲线',desc:'用代数方法研究几何图形。直线、圆、椭圆、双曲线、抛物线。',sections:[{name:'4.1 直线与圆',color:'#2563eb',desc:'直线方程与圆的方程',items:[{id:'la-k4-1',name:'直线方程',tags:["def", "exa"],brief:'点斜式 $y-y_0=k(x-x_0)$，一般式 $Ax+By+C=0$。',body:`<p>斜率 $k=\\tan\\alpha$，两点 $(x_1,y_1),(x_2,y_2)$ 连线斜率：</p><div class="la-fml">$$k=\\frac{y_2-y_1}{x_2-x_1}$$</div>`},{id:'la-k4-2',name:'圆的方程',tags:["def", "thm"],brief:'$(x-a)^2+(y-b)^2=r^2$。',body:`<p>圆心 $(a,b)$、半径 $r$ 的圆。一般方程 $x^2+y^2+Dx+Ey+F=0$，圆心 $(-D/2,-E/2)$。</p>`}]},{name:'4.2 圆锥曲线',color:'#7c3aed',desc:'椭圆、双曲线、抛物线',items:[{id:'la-k4-3',name:'椭圆',tags:["def", "thm"],brief:'$\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$，离心率 $e=c/a<1$。',body:`<p>到两焦点距离之和为定值 $2a$ 的点轨迹。$c^2=a^2-b^2$。</p>`},{id:'la-k4-4',name:'双曲线与抛物线',tags:["def"],brief:'双曲线 $e>1$，抛物线 $e=1$。',body:`<p>双曲线：$\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$，$c^2=a^2+b^2$。抛物线：$y^2=2px$，焦点 $(p/2,0)$。</p>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
</html>
