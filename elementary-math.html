ection><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>将三角化为代数有理式。</p></section></div>`},{id:'elementary_math-c1s4-34',name:'海伦公式',tags:["def", "thm", "der", "app", "note"],brief:'用三边长表示三角形面积，p为半周长。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用三边长表示三角形面积，p为半周长。</p><div class="la-fml">$$S=\\sqrt{p(p-a)(p-b)(p-c)}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S=\\sqrt{p(p-a)(p-b)(p-c)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由余弦定理和面积公式推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>已知三边求面积。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>p=(a+b+c)/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>海伦（古希腊）。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与秦九韶三斜求积等价。</p></section></div>`}]},{name:'1.5 反三角函数',color:'#7c3aed',desc:'反三角定义与性质',items:[{id:'elementary_math-c1s5-1',name:'反正弦函数',tags:["def", "thm", "der", "app", "note"],brief:'正弦函数在[-π/2,π/2]上的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正弦函数在[-π/2,π/2]上的反函数。</p><div class="la-fml">$$y=\\arcsin x,\\ x\\in[-1,1],\\ y\\in[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\arcsin x,\\ x\\in[-1,1],\\ y\\in[-\\frac{\\pi}{2},\\frac{\\pi}{2}]$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>限制正弦到单调区间后取反函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角度、三角方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>arcsin(sinx)不一定等于x（需x在主值区间）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角函数研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>定义域[-1,1]，值域[-π/2,π/2]，奇函数。</p></section></div>`},{id:'elementary_math-c1s5-2',name:'反余弦函数',tags:["def", "thm", "der", "app", "note"],brief:'余弦函数在[0,π]上的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>余弦函数在[0,π]上的反函数。</p><div class="la-fml">$$y=\\arccos x,\\ x\\in[-1,1],\\ y\\in[0,\\pi]$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\arccos x,\\ x\\in[-1,1],\\ y\\in[0,\\pi]$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>限制余弦到单调递减区间后取反函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>arccosx+arcsinx=π/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>非奇非偶，递减。</p></section></div>`},{id:'elementary_math-c1s5-3',name:'反正切函数',tags:["def", "thm", "der", "app", "note"],brief:'正切函数在(-π/2,π/2)上的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正切函数在(-π/2,π/2)上的反函数。</p><div class="la-fml">$$y=\\arctan x,\\ x\\in\\mathbb{R},\\ y\\in(-\\frac{\\pi}{2},\\frac{\\pi}{2})$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\arctan x,\\ x\\in\\mathbb{R},\\ y\\in(-\\frac{\\pi}{2},\\frac{\\pi}{2})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>限制正切到单调区间后取反函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角度、斜率转角度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>水平渐近线y=±π/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>奇函数，递增，值域开区间。</p></section></div>`},{id:'elementary_math-c1s5-4',name:'反余切函数',tags:["def", "thm", "der", "app", "note"],brief:'余切函数在(0,π)上的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>余切函数在(0,π)上的反函数。</p><div class="la-fml">$$y=\\operatorname{arccot} x,\\ x\\in\\mathbb{R},\\ y\\in(0,\\pi)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\operatorname{arccot} x,\\ x\\in\\mathbb{R},\\ y\\in(0,\\pi)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>类似反正切。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>arctanx+arccotx=π/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>递减。</p></section></div>`},{id:'elementary_math-c1s5-5',name:'反正弦性质',tags:["def", "thm", "der", "app", "note"],brief:'反正弦是奇函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>反正弦是奇函数。</p><div class="la-fml">$$\\arcsin(-x)=-\\arcsin x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\arcsin(-x)=-\\arcsin x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由正弦是奇函数推出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简反三角表达式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>sin(arcsinx)=x(x∈[-1,1])。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>arcsinx+arccosx=π/2。</p></section></div>`},{id:'elementary_math-c1s5-6',name:'反三角恒等式',tags:["def", "thm", "der", "app", "note"],brief:'反正弦与反余弦之和恒为π/2。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>反正弦与反余弦之和恒为π/2。</p><div class="la-fml">$$\\arcsin x+\\arccos x=\\frac{\\pi}{2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\arcsin x+\\arccos x=\\frac{\\pi}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设α=arcsinx，则sinα=x，cos(π/2-α)=x，且π/2-α∈[0,π]=arccos的值域，故arccosx=π/2-α。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简反三角表达式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对一切x∈[-1,1]成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>类似arctanx+arccotx=π/2。</p></section></div>`},{id:'elementary_math-c1s5-7',name:'反三角函数求值',tags:["def", "der", "app", "note"],brief:'求反三角函数值时，先确定是否在定义域内，再找对应主值角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>求反三角函数值时，先确定是否在定义域内，再找对应主值角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角方程求解。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意主值区间限制。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角基本运算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>arcsin(sinx)=x仅当x∈[-π/2,π/2]。</p></section></div>`},{id:'elementary_math-c1s5-8',name:'反三角复合',tags:["def", "thm", "der", "app", "note"],brief:'反三角函数的三角函数化简。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>反三角函数的三角函数化简。</p><div class="la-fml">$$\\sin(\\arccos x)=\\sqrt{1-x^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin(\\arccos x)=\\sqrt{1-x^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设α=arccosx，则cosα=x，sinα=√(1-x²)（因α∈[0,π],sinα≥0）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简表达式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意符号由反三角的值域决定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角恒等变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>tan(arcsinx)=x/√(1-x²)。</p></section></div>`},{id:'elementary_math-c1s5-9',name:'反正切恒等式',tags:["def", "thm", "der", "app", "note"],brief:'正数x的反正切与反余切之和为π/2。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正数x的反正切与反余切之和为π/2。</p><div class="la-fml">$$\\arctan x+\\arctan\\frac{1}{x}=\\frac{\\pi}{2}\\ (x>0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\arctan x+\\arctan\\frac{1}{x}=\\frac{\\pi}{2}\\ (x>0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设α=arctanx，则tanα=x，cotα=1/x，故arctan(1/x)=π/2-α。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简反三角表达式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>x<0时结果为-π/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到arctan a+arctan b=arctan[(a+b)/(1-ab)]。</p></section></div>`},{id:'elementary_math-c1s5-10',name:'反三角函数导数预备',tags:["def", "thm", "der", "app", "note"],brief:'反正弦的导数（微积分预备知识）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>反正弦的导数（微积分预备知识）。</p><div class="la-fml">$$(\\arcsin x)'=\\frac{1}{\\sqrt{1-x^2}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(\\arcsin x)'=\\frac{1}{\\sqrt{1-x^2}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数求导法则推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>微积分基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>(arccosx)'=-1/√(1-x²)；(arctanx)'=1/(1+x²)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>微积分发展。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>反三角函数的不定积分。</p></section></div>`},{id:'elementary_math-c1s5-11',name:'反三角方程',tags:["def", "der", "app", "note"],brief:'含反三角函数的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含反三角函数的方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>通过设辅助角转化为代数方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解三角方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意反三角的值域限制。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>arcsin x=α则x=sinα且α∈[-π/2,π/2]。</p></section></div>`},{id:'elementary_math-c1s5-12',name:'余弦定理反三角应用',tags:["def", "der", "app", "note"],brief:'用反余弦求三角形内角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用反余弦求三角形内角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由余弦定理cosC=(a²+b²-c²)/(2ab)，再用arccos求角。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解三角形。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>结果在[0,π]内，与arccos值域一致。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角学应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与正弦定理配合使用。</p></section></div>`}]},{name:'1.6 代数式与分式',color:'#2563eb',desc:'整式、分式、根式化简',items:[{id:'elementary_math-c1s6-1',name:'代数式',tags:["def", "der", "app", "note"],brief:'用运算符号把数和字母连接而成的式子。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用运算符号把数和字母连接而成的式子。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由具体数值计算抽象而来。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示数量关系、列方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>单独一个数或字母也是代数式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数符号化的产物。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>代数式分为有理式和无理式。</p></section></div>`},{id:'elementary_math-c1s6-2',name:'整式',tags:["def", "der", "app", "note"],brief:'单项式和多项式的统称，分母不含字母。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>单项式和多项式的统称，分母不含字母。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由数与字母的积或和组成。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>代数运算的基本对象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>整式包括单项式（一项）和多项式（多项）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数学核心概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多项式环。</p></section></div>`},{id:'elementary_math-c1s6-3',name:'单项式',tags:["def", "thm", "der", "app", "note"],brief:'数与字母的积，单独一个数或字母也是单项式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>数与字母的积，单独一个数或字母也是单项式。</p><div class="la-fml">$$ax^n$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax^n$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由乘法运算构成。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示简单数量关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>系数、次数是单项式的两个要素。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数基本概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>单项式构成多项式的基。</p></section></div>`},{id:'elementary_math-c1s6-4',name:'多项式',tags:["def", "thm", "der", "app", "note"],brief:'几个单项式的和，按降幂排列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>几个单项式的和，按降幂排列。</p><div class="la-fml">$$a_nx^n+\\cdots+a_1x+a_0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_nx^n+\\cdots+a_1x+a_0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单项式相加构成。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>方程、函数、插值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>次数是最高次项的次数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数学核心研究对象。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多项式环的唯一分解定理。</p></section></div>`},{id:'elementary_math-c1s6-5',name:'同类项',tags:["def", "der", "app", "note"],brief:'所含字母相同且相同字母指数也相同的单项式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>所含字母相同且相同字母指数也相同的单项式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由项的结构定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>合并同类项化简多项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>合并时系数相加减，字母和指数不变。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数化简基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>同类项合并是多项式加法的本质。</p></section></div>`},{id:'elementary_math-c1s6-6',name:'合并同类项',tags:["def", "der", "app", "note"],brief:'把多项式中的同类项合并成一项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把多项式中的同类项合并成一项。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用分配律ac+bc=(a+b)c。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简多项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>只合并系数，字母部分不变。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数化简基本操作。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多项式标准化。</p></section></div>`},{id:'elementary_math-c1s6-7',name:'整式加减',tags:["def", "der", "app", "note"],brief:'整式加减即去括号后合并同类项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>整式加减即去括号后合并同类项。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由加法运算律和合并同类项。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简表达式、求值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>去括号时注意符号变化。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数运算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多项式环的加法。</p></section></div>`},{id:'elementary_math-c1s6-8',name:'整式乘法',tags:["def", "der", "app", "note"],brief:'单项式乘单项式、单项式乘多项式、多项式乘多项式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>单项式乘单项式、单项式乘多项式、多项式乘多项式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用乘法分配律和同底数幂乘法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展开、因式分解逆运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>多项式乘多项式用分配律逐项相乘。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数运算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多项式环的乘法。</p></section></div>`},{id:'elementary_math-c1s6-9',name:'分式',tags:["def", "thm", "der", "app", "note"],brief:'分子分母都是整式，分母含字母的式子。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分子分母都是整式，分母含字母的式子。</p><div class="la-fml">$$\\frac{A}{B}\\ (B\\text{含字母}, B\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{A}{B}\\ (B\\text{含字母}, B\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由除法运算引入。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示比率、分式方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分母不为零；分式基本性质：A/B=AC/BC(C≠0)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分数概念的推广。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>有理函数域。</p></section></div>`},{id:'elementary_math-c1s6-10',name:'分式基本性质',tags:["def", "thm", "der", "app", "note"],brief:'分式分子分母同乘（除以）非零整式，值不变。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分式分子分母同乘（除以）非零整式，值不变。</p><div class="la-fml">$$\\frac{A}{B}=\\frac{A\\cdot C}{B\\cdot C}=\\frac{A\\div C}{B\\div C}\\ (C\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{A}{B}=\\frac{A\\cdot C}{B\\cdot C}=\\frac{A\\div C}{B\\div C}\\ (C\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分数基本性质推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>约分、通分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>C必须非零且使原分式有意义。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分式运算基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>分式域的构造。</p></section></div>`},{id:'elementary_math-c1s6-11',name:'约分',tags:["def", "der", "app", "note"],brief:'把分式分子分母的公因式约去。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把分式分子分母的公因式约去。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用分式基本性质。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简分式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>约去的是公因式，要彻底约分到最简。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分式化简。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>最简分式（分子分母互质）。</p></section></div>`},{id:'elementary_math-c1s6-12',name:'通分',tags:["def", "der", "app", "note"],brief:'把异分母分式化为同分母分式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把异分母分式化为同分母分式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用分式基本性质，分子分母同乘适当整式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式加减运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>最简公分母是各分母系数最小公倍数与字母最高次幂的积。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分式运算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到多个分式。</p></section></div>`},{id:'elementary_math-c1s6-13',name:'分式加减',tags:["def", "thm", "der", "app", "note"],brief:'异分母分式加减先通分再加减。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>异分母分式加减先通分再加减。</p><div class="la-fml">$$\\frac{A}{B}\\pm\\frac{C}{D}=\\frac{AD\\pm BC}{BD}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{A}{B}\\pm\\frac{C}{D}=\\frac{AD\\pm BC}{BD}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用通分转化为同分母。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>结果要约分到最简。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分式运算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>有理函数的加法。</p></section></div>`},{id:'elementary_math-c1s6-14',name:'分式乘除',tags:["def", "thm", "der", "app", "note"],brief:'分式乘除：分子乘分子、分母乘分母；除法变乘法取倒数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分式乘除：分子乘分子、分母乘分母；除法变乘法取倒数。</p><div class="la-fml">$$\\frac{A}{B}\\cdot\\frac{C}{D}=\\frac{AC}{BD},\\ \\frac{A}{B}\\div\\frac{C}{D}=\\frac{AD}{BC}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{A}{B}\\cdot\\frac{C}{D}=\\frac{AC}{BD},\\ \\frac{A}{B}\\div\\frac{C}{D}=\\frac{AD}{BC}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分数乘除法推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>除法先化为乘法再约分。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分式运算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>有理函数域的乘法。</p></section></div>`},{id:'elementary_math-c1s6-15',name:'二次根式',tags:["def", "thm", "der", "app", "note"],brief:'形如√a(a≥0)的式子。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>形如√a(a≥0)的式子。</p><div class="la-fml">$$\\sqrt{a}\\ (a\\geq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sqrt{a}\\ (a\\geq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平方根概念引入。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示无理数、几何计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>双重非负：a≥0且√a≥0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>根式运算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>n次根式。</p></section></div>`},{id:'elementary_math-c1s6-16',name:'二次根式性质',tags:["def", "thm", "der", "app", "note"],brief:'积的算术平方根等于各因式算术平方根的积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>积的算术平方根等于各因式算术平方根的积。</p><div class="la-fml">$$\\sqrt{ab}=\\sqrt{a}\\cdot\\sqrt{b}\\ (a,b\\geq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sqrt{ab}=\\sqrt{a}\\cdot\\sqrt{b}\\ (a,b\\geq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由(√a·√b)²=ab推出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>根式化简。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a,b必须非负。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>根式运算性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>√(a/b)=√a/√b(a≥0,b>0)。</p></section></div>`},{id:'elementary_math-c1s6-17',name:'分母有理化',tags:["def", "der", "app", "note"],brief:'将分母中的根号化去。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将分母中的根号化去。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>分子分母同乘分母的有理化因式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>根式化简、求值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>√a的有理化因式是√a；√a±√b的是√a∓√b。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>根式化简技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>共轭根式的应用。</p></section></div>`},{id:'elementary_math-c1s6-18',name:'最简二次根式',tags:["def", "der", "app", "note"],brief:'被开方数不含分母，且不含能开尽方的因数或因式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>被开方数不含分母，且不含能开尽方的因数或因式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由化简目标定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>根式运算的最终形式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>运算结果要化为最简二次根式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>根式标准化。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>同类二次根式才能合并。</p></section></div>`}]},{name:'1.7 因式分解',color:'#0f766e',desc:'分解方法与技巧',items:[{id:'elementary_math-c1s7-1',name:'因式分解',tags:["def", "der", "app", "note"],brief:'把一个多项式化为几个整式的积的形式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把一个多项式化为几个整式的积的形式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>整式乘法的逆运算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解方程、化简、求值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分解要彻底（到不可约因式）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数学基本问题。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多项式环的唯一分解性。</p></section></div>`},{id:'elementary_math-c1s7-2',name:'提公因式法',tags:["def", "thm", "der", "app", "note"],brief:'把多项式各项的公因式提到括号外面。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把多项式各项的公因式提到括号外面。</p><div class="la-fml">$$ma+mb+mc=m(a+b+c)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ma+mb+mc=m(a+b+c)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>逆用分配律。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>因式分解的首选方法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>公因式取系数最大公约数与字母最低次幂。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>最基本的分解方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>分组提公因式。</p></section></div>`},{id:'elementary_math-c1s7-3',name:'公式法',tags:["def", "der", "app", "note"],brief:'利用乘法公式反向进行因式分解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>利用乘法公式反向进行因式分解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>乘法公式的逆用。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解特殊形式的多项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常用：平方差、完全平方、立方和差。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数恒等式的应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>更多公式如完全立方、十字相乘等。</p></section></div>`},{id:'elementary_math-c1s7-4',name:'十字相乘法',tags:["def", "thm", "der", "app", "note"],brief:'对二次三项式x²+(p+q)x+pq分解为(x+p)(x+q)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对二次三项式x²+(p+q)x+pq分解为(x+p)(x+q)。</p><div class="la-fml">$$x^2+(p+q)x+pq=(x+p)(x+q)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x^2+(p+q)x+pq=(x+p)(x+q)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>逆用多项式乘法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解二次三项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>找两个数p,q使p+q=一次项系数，pq=常数项。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分解技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到ax²+bx+c（a≠1）。</p></section></div>`},{id:'elementary_math-c1s7-5',name:'分组分解法',tags:["def", "der", "app", "note"],brief:'将多项式适当分组后分别分解，再提取公因式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将多项式适当分组后分别分解，再提取公因式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用分组创造公因式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解四项及以上多项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分组原则：分组后能提公因式或用公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分解技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>灵活分组是关键。</p></section></div>`},{id:'elementary_math-c1s7-6',name:'配方法分解',tags:["def", "der", "app", "note"],brief:'通过添加项配成完全平方再分解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>通过添加项配成完全平方再分解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>a²+2ab+b²=(a+b)²的逆用。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解二次式、解二次方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>配方法是重要的代数变形技巧。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代巴比伦已用配方法解方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>求二次函数顶点、解二次方程。</p></section></div>`},{id:'elementary_math-c1s7-7',name:'求根公式法',tags:["def", "thm", "der", "app", "note"],brief:'若二次方程有根x₁,x₂，则二次式可分解为a(x-x₁)(x-x₂)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若二次方程有根x₁,x₂，则二次式可分解为a(x-x₁)(x-x₂)。</p><div class="la-fml">$$ax^2+bx+c=a(x-x_1)(x-x_2)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax^2+bx+c=a(x-x_1)(x-x_2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由因式定理：若f(r)=0则(x-r)是因式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解二次三项式（尤其判别式非负时）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>判别式<0时在实数域不可约。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>因式定理的应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到高次多项式。</p></section></div>`},{id:'elementary_math-c1s7-8',name:'因式定理',tags:["def", "thm", "der", "app", "note"],brief:'多项式f(x)有因式(x-a)当且仅当f(a)=0。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>多项式f(x)有因式(x-a)当且仅当f(a)=0。</p><div class="la-fml">$$f(a)=0\\Leftrightarrow(x-a)\\text{是}f(x)\\text{的因式}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(a)=0\\Leftrightarrow(x-a)\\text{是}f(x)\\text{的因式}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由带余除法f(x)=(x-a)q(x)+r，r=f(a)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解多项式、求根。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是高次多项式分解的重要工具。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>多项式理论基本定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>余数定理：f(a)等于f(x)除以(x-a)的余数。</p></section></div>`},{id:'elementary_math-c1s7-9',name:'换元法分解',tags:["def", "der", "app", "note"],brief:'引入新变量简化多项式结构后分解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>引入新变量简化多项式结构后分解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>变量替换化繁为简。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解复杂多项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>换元后注意还原。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数化简技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>常用换元：整体换元、倒数换元、平均换元。</p></section></div>`},{id:'elementary_math-c1s7-10',name:'待定系数法分解',tags:["def", "der", "app", "note"],brief:'设出分解后的形式，再比较系数求出待定系数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>设出分解后的形式，再比较系数求出待定系数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用多项式恒等条件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解结构特殊的多项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>假设的形式必须正确。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与多项式插值的联系。</p></section></div>`},{id:'elementary_math-c1s7-11',name:'分解彻底性',tags:["def", "der", "app", "note"],brief:'因式分解要分解到不能再分解为止（在指定数域内）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>因式分解要分解到不能再分解为止（在指定数域内）。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由多项式唯一分解定理保证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确保分解结果最简。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>同一多项式在不同数域分解结果不同（如x²-2在Q不可约，在R可约）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数域对分解的影响。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复数域上多项式总可分解为一次因式之积。</p></section></div>`},{id:'elementary_math-c1s7-12',name:'双十字相乘法',tags:["def", "der", "app", "note"],brief:'对二次齐次式如Ax²+Bxy+Cy²+Dx+Ey+F用双十字相乘分解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对二次齐次式如Ax²+Bxy+Cy²+Dx+Ey+F用双十字相乘分解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>十字相乘法的推广，分两次交叉相乘。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分解二元二次多项式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>适用于含交叉项xy的多项式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>可推广到三元二次齐次式。</p></section></div>`},{id:'elementary_math-c1s7-13',name:'余数定理',tags:["def", "thm", "der", "app", "note"],brief:'多项式f(x)除以(x-a)的余数等于f(a)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>多项式f(x)除以(x-a)的余数等于f(a)。</p><div class="la-fml">$$f(x)=(x-a)q(x)+f(a)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x)=(x-a)q(x)+f(a)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由带余除法：f(x)=(x-a)q(x)+r，代入x=a得r=f(a)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不求商直接求余数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>因式定理是其余数为0的特例。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>多项式理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>综合除法。</p></section></div>`}]},{name:'1.8 方程',color:'#c2410c',desc:'各类方程解法',items:[{id:'elementary_math-c1s8-1',name:'方程与方程的解',tags:["def", "der", "app", "note"],brief:'含未知数的等式叫方程；使方程成立的未知数值叫方程的解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含未知数的等式叫方程；使方程成立的未知数值叫方程的解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等式概念推广。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>建模求解未知量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>解方程要注意增根和失根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>最古老的数学问题之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>方程论与伽罗瓦理论。</p></section></div>`},{id:'elementary_math-c1s8-2',name:'一元一次方程',tags:["def", "thm", "der", "app", "note"],brief:'只含一个未知数且次数为1的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>只含一个未知数且次数为1的方程。</p><div class="la-fml">$$ax+b=0\\Rightarrow x=-\\frac{b}{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax+b=0\\Rightarrow x=-\\frac{b}{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>移项、合并同类项、系数化1。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>最基本的方程，大量实际问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a≠0时有唯一解。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代已系统求解。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线性方程的推广。</p></section></div>`},{id:'elementary_math-c1s8-3',name:'二元一次方程组',tags:["def", "thm", "der", "app", "note"],brief:'由两个二元一次方程组成的方程组。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由两个二元一次方程组成的方程组。</p><div class="la-fml">$$\\begin{cases}a_1x+b_1y=c_1\\\\a_2x+b_2y=c_2\\end{cases}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\begin{cases}a_1x+b_1y=c_1\\\\a_2x+b_2y=c_2\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>代入消元或加减消元。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>两变量实际问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>解的情况：唯一解、无解、无穷多解。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>线性方程组基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n元线性方程组（矩阵法）。</p></section></div>`},{id:'elementary_math-c1s8-4',name:'代入消元法',tags:["def", "der", "app", "note"],brief:'将一个方程中的一个未知数用另一个表示，代入另一方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将一个方程中的一个未知数用另一个表示，代入另一方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等量代换。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解方程组。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>选择系数简单的变量代入。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>消元法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>高斯消元法的特例。</p></section></div>`},{id:'elementary_math-c1s8-5',name:'加减消元法',tags:["def", "der", "app", "note"],brief:'将方程组中某未知数系数化为相同或相反后加减消去。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将方程组中某未知数系数化为相同或相反后加减消去。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等式性质。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解方程组。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>系数化相同用减法，化相反用加法。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>消元法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线性代数的行变换。</p></section></div>`},{id:'elementary_math-c1s8-6',name:'一元二次方程',tags:["def", "thm", "der", "app", "note"],brief:'只含一个未知数且最高次为2的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>只含一个未知数且最高次为2的方程。</p><div class="la-fml">$$ax^2+bx+c=0\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax^2+bx+c=0\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>配方法或因式分解法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抛物线、最值、实际问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>判别式Δ=b²-4ac决定根的情况。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>公元前2000年巴比伦已会解。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>韦达定理、求根公式。</p></section></div>`},{id:'elementary_math-c1s8-7',name:'配方法解二次方程',tags:["def", "thm", "der", "app", "note"],brief:'通过配方将二次方程化为完全平方求解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>通过配方将二次方程化为完全平方求解。</p><div class="la-fml">$$ax^2+bx+c=0\\Rightarrow x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax^2+bx+c=0\\Rightarrow x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两边除以a，配方(x+b/2a)²=(b²-4ac)/4a²，开方求解。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解二次方程、推导求根公式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>当Δ≥0时有实根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>求根公式的推导方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>配方法是二次问题的通用技巧。</p></section></div>`},{id:'elementary_math-c1s8-8',name:'求根公式',tags:["def", "thm", "der", "app", "note"],brief:'一元二次方程的求根公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一元二次方程的求根公式。</p><div class="la-fml">$$x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由配方法推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>直接求解二次方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Δ=b²-4ac，Δ>0两不等实根，Δ=0两等根，Δ<0无实根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>公元9世纪花拉子米给出文字版。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到三次、四次方程求根公式。</p></section></div>`},{id:'elementary_math-c1s8-9',name:'判别式',tags:["def", "thm", "der", "app", "note"],brief:'一元二次方程根的判别式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一元二次方程根的判别式。</p><div class="la-fml">$$\\Delta=b^2-4ac$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\Delta=b^2-4ac$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由求根公式中根号内的部分定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断根的情况。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Δ>0：两个不等实根；Δ=0：两个相等实根；Δ<0：无实根（有两共轭复根）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程论基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到高次方程的判别式。</p></section></div>`},{id:'elementary_math-c1s8-10',name:'韦达定理',tags:["def", "thm", "der", "app", "note"],brief:'一元二次方程两根之和与积的关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一元二次方程两根之和与积的关系。</p><div class="la-fml">$$x_1+x_2=-\\frac{b}{a},\\ x_1x_2=\\frac{c}{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x_1+x_2=-\\frac{b}{a},\\ x_1x_2=\\frac{c}{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由求根公式x₁,x₂相加相乘化简。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不解方程求根的和积、构造方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对复根也成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>韦达16世纪发现。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n次方程的根与系数关系。</p></section></div>`},{id:'elementary_math-c1s8-11',name:'因式分解法解方程',tags:["def", "der", "app", "note"],brief:'将方程一边因式分解，另一边为零，令各因式为零求解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将方程一边因式分解，另一边为零，令各因式为零求解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若ab=0则a=0或b=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解可分解的方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须右边为零。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解方程基本方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>高次方程的因式分解法。</p></section></div>`},{id:'elementary_math-c1s8-12',name:'分式方程',tags:["def", "der", "app", "note"],brief:'分母含未知数的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分母含未知数的方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>去分母化为整式方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实际问题建模。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须验根（去分母可能产生增根）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程类型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>有理方程。</p></section></div>`},{id:'elementary_math-c1s8-13',name:'无理方程',tags:["def", "der", "app", "note"],brief:'根号内含未知数的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>根号内含未知数的方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>换元或平方去根号。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何、物理问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须验根（平方可能产生增根）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程类型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>根式可解条件。</p></section></div>`},{id:'elementary_math-c1s8-14',name:'绝对值方程',tags:["def", "thm", "der", "app", "note"],brief:'含绝对值的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含绝对值的方程。</p><div class="la-fml">$$|f(x)|=c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|f(x)|=c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>分类讨论去绝对值或平方。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>距离、分段问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>c<0时无解；c=0时f(x)=0；c>0时f(x)=±c。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程类型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>绝对值不等式。</p></section></div>`},{id:'elementary_math-c1s8-15',name:'方程组的解',tags:["def", "der", "app", "note"],brief:'方程组中各方程公共解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>方程组中各方程公共解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>同时满足所有方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>多变量建模。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意解的存在性和唯一性。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程组理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线性方程组的矩阵解法。</p></section></div>`},{id:'elementary_math-c1s8-16',name:'增根与失根',tags:["def", "der", "app", "note"],brief:'解方程变形过程中产生的不满足原方程的根叫增根，丢失的根叫失根。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解方程变形过程中产生的不满足原方程的根叫增根，丢失的根叫失根。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>非同解变形导致。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>验根的依据。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>去分母、平方等操作可能增根；除以含未知数式子可能失根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程变形的等价性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>同解原理。</p></section></div>`},{id:'elementary_math-c1s8-17',name:'一元高次方程',tags:["def", "der", "app", "note"],brief:'次数≥3的整式方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>次数≥3的整式方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由多项式定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>高次问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三次、四次有求根公式，五次及以上无通用求根公式（阿贝尔定理）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>伽罗瓦理论给出可解性判据。</p></section></div>`},{id:'elementary_math-c1s8-18',name:'因式分解法解高次方程',tags:["def", "der", "app", "note"],brief:'将高次方程因式分解为低次方程求解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将高次方程因式分解为低次方程求解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若f(x)=g(x)h(x)=0则g(x)=0或h(x)=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解可分解的高次方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>先试有理根（有理根定理）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>有理根定理：可能有理根为常数项因数/首项系数因数。</p></section></div>`},{id:'elementary_math-c1s8-19',name:'二元二次方程组',tags:["def", "der", "app", "note"],brief:'含两个未知数且最高次为2的方程组。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含两个未知数且最高次为2的方程组。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>消元降次。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解析几何交点。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常用代入消元转化为一元二次。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程组。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>直线与圆锥曲线交点。</p></section></div>`},{id:'elementary_math-c1s8-20',name:'无理方程解法',tags:["def", "thm", "der", "app", "note"],brief:'含根号的方程，通过平方或换元求解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含根号的方程，通过平方或换元求解。</p><div class="la-fml">$$\\sqrt{f(x)}=g(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sqrt{f(x)}=g(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两边平方去根号。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须验根，平方可能增根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程类型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>注意g(x)≥0的隐含条件。</p></section></div>`},{id:'elementary_math-c1s8-21',name:'指数方程解法',tags:["def", "thm", "der", "app", "note"],brief:'含指数的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含指数的方程。</p><div class="la-fml">$$a^{f(x)}=b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^{f(x)}=b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>取对数或化为同底。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>增长衰减问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>0,a≠1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>超越方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>a^f(x)=a^g(x)⟺f(x)=g(x)。</p></section></div>`},{id:'elementary_math-c1s8-22',name:'对数方程解法',tags:["def", "thm", "der", "app", "note"],brief:'含对数的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含对数的方程。</p><div class="la-fml">$$\\log_a f(x)=b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\log_a f(x)=b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>化为指数式或同底比较。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>对数问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须验根，真数>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>超越方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>log_a f(x)=log_a g(x)⟺f(x)=g(x)>0。</p></section></div>`}]},{name:'1.9 不等式',color:'#7c3aed',desc:'不等式性质与证明',items:[{id:'elementary_math-c1s9-1',name:'不等式',tags:["def", "der", "app", "note"],brief:'用不等号(>、<、≥、≤、≠)连接的式子。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用不等号(>、<、≥、≤、≠)连接的式子。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实数的有序性定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>比较大小、求范围、优化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>解不等式要注意不等号方向变化。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分析学基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>不等式是分析的核心工具。</p></section></div>`},{id:'elementary_math-c1s9-2',name:'不等式性质1',tags:["def", "thm", "der", "app", "note"],brief:'不等式的对称性（反对称）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不等式的对称性（反对称）。</p><div class="la-fml">$$a>b\\Leftrightarrow b<a$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a>b\\Leftrightarrow b<a$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实数序关系的反对称性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式变形。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>b与b<a等价。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>序的基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>偏序关系的反对称性。</p></section></div>`},{id:'elementary_math-c1s9-3',name:'不等式性质2',tags:["def", "thm", "der", "app", "note"],brief:'不等式的传递性。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不等式的传递性。</p><div class="la-fml">$$a>b,\\ b>c\\Rightarrow a>c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a>b,\\ b>c\\Rightarrow a>c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>实数序关系的传递性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式传递比较。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>传递性是不等式证明的常用工具。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>序的基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>偏序关系的传递性。</p></section></div>`},{id:'elementary_math-c1s9-4',name:'不等式性质3',tags:["def", "thm", "der", "app", "note"],brief:'不等式两边同加一数，不等号方向不变。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不等式两边同加一数，不等号方向不变。</p><div class="la-fml">$$a>b\\Rightarrow a+c>b+c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a>b\\Rightarrow a+c>b+c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>加法保序。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>移项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>移项要变号。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>序与加法的相容性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>有序群的性质。</p></section></div>`},{id:'elementary_math-c1s9-5',name:'不等式性质4',tags:["def", "thm", "der", "app", "note"],brief:'不等式两边同乘正数，不等号方向不变；乘负数则反向。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不等式两边同乘正数，不等号方向不变；乘负数则反向。</p><div class="la-fml">$$a>b,\\ c>0\\Rightarrow ac>bc$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a>b,\\ c>0\\Rightarrow ac>bc$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>乘法与序的相容性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>系数化1。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>乘负数时不等号变向！</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>序与乘法的相容性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>有序域的性质。</p></section></div>`},{id:'elementary_math-c1s9-6',name:'不等式性质5',tags:["def", "thm", "der", "app", "note"],brief:'正数不等式两边乘方（n为正整数），不等号方向不变。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正数不等式两边乘方（n为正整数），不等号方向不变。</p><div class="la-fml">$$a>b>0\\Rightarrow a^n>b^n>0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a>b>0\\Rightarrow a^n>b^n>0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由性质4递推。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式变形。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>要求a,b>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>幂的单调性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>开方也有类似性质。</p></section></div>`},{id:'elementary_math-c1s9-7',name:'比较法',tags:["def", "der", "app", "note"],brief:'通过比较两边的大小来证明不等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>通过比较两边的大小来证明不等式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>作差与0比较，或作商与1比较。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>作差法最常用。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式证明基本方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>比较法是最直接的证明方法。</p></section></div>`},{id:'elementary_math-c1s9-8',name:'基本不等式',tags:["def", "thm", "der", "app", "note"],brief:'对任意实数a,b，a²+b²≥2ab，等号当且仅当a=b。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对任意实数a,b，a²+b²≥2ab，等号当且仅当a=b。</p><div class="la-fml">$$a^2+b^2\\geq 2ab$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^2+b^2\\geq 2ab$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由(a-b)²≥0展开得a²-2ab+b²≥0，即a²+b²≥2ab。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求最值、证明不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等号当且仅当a=b。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>最基本的不等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到均值不等式。</p></section></div>`},{id:'elementary_math-c1s9-9',name:'均值不等式',tags:["def", "thm", "der", "app", "note"],brief:'两个正数的算术平均数不小于几何平均数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个正数的算术平均数不小于几何平均数。</p><div class="la-fml">$$\\frac{a+b}{2}\\geq\\sqrt{ab}\\ (a,b>0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{a+b}{2}\\geq\\sqrt{ab}\\ (a,b>0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由(√a-√b)²≥0推出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求最值（积定和最小，和定积最大）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等号当且仅当a=b；要求a,b>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>均值不等式链：调和≤几何≤算术≤平方。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n个正数。</p></section></div>`},{id:'elementary_math-c1s9-10',name:'均值不等式链',tags:["def", "thm", "der", "app", "note"],brief:'调和平均≤几何平均≤算术平均≤平方平均。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>调和平均≤几何平均≤算术平均≤平方平均。</p><div class="la-fml">$$\\frac{n}{\\sum\\frac{1}{a_i}}\\leq\\sqrt[n]{\\prod a_i}\\leq\\frac{\\sum a_i}{n}\\leq\\sqrt{\\frac{\\sum a_i^2}{n}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{n}{\\sum\\frac{1}{a_i}}\\leq\\sqrt[n]{\\prod a_i}\\leq\\frac{\\sum a_i}{n}\\leq\\sqrt{\\frac{\\sum a_i^2}{n}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>数学归纳法或凸函数Jensen不等式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求最值、证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等号当且仅当所有aᵢ相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>均值不等式的完整形式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>加权均值不等式。</p></section></div>`},{id:'elementary_math-c1s9-11',name:'绝对值不等式',tags:["def", "thm", "der", "app", "note"],brief:'绝对值的三角不等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>绝对值的三角不等式。</p><div class="la-fml">$$|a|-|b|\\leq|a\\pm b|\\leq|a|+|b|$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|a|-|b|\\leq|a\\pm b|\\leq|a|+|b|$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由-|a|≤a≤|a|同理对b，相加导出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>估计、证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|a+b|≤|a|+|b|等号当且仅当ab≥0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分析学基本不等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到向量的三角不等式。</p></section></div>`},{id:'elementary_math-c1s9-12',name:'一元一次不等式',tags:["def", "thm", "der", "app", "note"],brief:'只含一个未知数且次数为1的不等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>只含一个未知数且次数为1的不等式。</p><div class="la-fml">$$ax>b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax>b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>移项、系数化1。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>0时x>b/a；a<0时x<b/a；a=0时讨论b。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线性不等式组。</p></section></div>`},{id:'elementary_math-c1s9-13',name:'一元二次不等式',tags:["def", "thm", "der", "app", "note"],brief:'含一个未知数且最高次为2的不等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含一个未知数且最高次为2的不等式。</p><div class="la-fml">$$ax^2+bx+c>0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax^2+bx+c>0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>结合二次函数图象与根。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>看开口方向和判别式确定解集。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>二次不等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>高次不等式用穿根法。</p></section></div>`},{id:'elementary_math-c1s9-14',name:'分式不等式',tags:["def", "thm", "der", "app", "note"],brief:'分母含未知数的不等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分母含未知数的不等式。</p><div class="la-fml">$$\\frac{f(x)}{g(x)}>0\\Leftrightarrow f(x)g(x)>0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{f(x)}{g(x)}>0\\Leftrightarrow f(x)g(x)>0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>转化为整式不等式（注意分母不为零）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>不能直接去分母（不知符号）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式类型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>高次分式不等式用穿根法。</p></section></div>`},{id:'elementary_math-c1s9-15',name:'绝对值不等式解法',tags:["def", "thm", "der", "app", "note"],brief:'绝对值不等式的等价转化。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>绝对值不等式的等价转化。</p><div class="la-fml">$$|f(x)|<a\\Leftrightarrow -a<f(x)<a$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|f(x)|<a\\Leftrightarrow -a<f(x)<a$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由绝对值定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解绝对值不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|f(x)|>a⟺f(x)>a或f(x)<-a。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式解法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多个绝对值用零点分段法。</p></section></div>`},{id:'elementary_math-c1s9-16',name:'不等式恒成立',tags:["def", "der", "app", "note"],brief:'不等式对定义域内所有x都成立。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不等式对定义域内所有x都成立。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>转化为最值问题：f(x)≥a恒成立⟺f(x)min≥a。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求参数范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意分离参数法。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>存在性问题与恒成立问题对偶。</p></section></div>`},{id:'elementary_math-c1s9-17',name:'分析法证明不等式',tags:["def", "der", "app", "note"],brief:'从结论出发，逐步寻求使它成立的充分条件。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从结论出发，逐步寻求使它成立的充分条件。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>执果索因。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常与综合法结合使用。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>证明方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>逆向思维。</p></section></div>`},{id:'elementary_math-c1s9-18',name:'综合法证明不等式',tags:["def", "der", "app", "note"],brief:'从已知条件出发，利用不等式性质推导出结论。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从已知条件出发，利用不等式性质推导出结论。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由因导果。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常用基本不等式作为起点。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>证明方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与分析法互逆。</p></section></div>`},{id:'elementary_math-c1s9-19',name:'放缩法证明不等式',tags:["def", "der", "app", "note"],brief:'将不等式一侧适当放大或缩小以达到证明目的。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将不等式一侧适当放大或缩小以达到证明目的。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用不等式传递性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式证明、数列求和估计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>放缩要适度，不能过头。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>裂项放缩、均值放缩。</p></section></div>`},{id:'elementary_math-c1s9-20',name:'柯西不等式',tags:["def", "thm", "der", "app", "note"],brief:'两组实数的柯西不等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两组实数的柯西不等式。</p><div class="la-fml">$$(\\sum a_i b_i)^2\\leq(\\sum a_i^2)(\\sum b_i^2)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(\\sum a_i b_i)^2\\leq(\\sum a_i^2)(\\sum b_i^2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由判别式法或向量数量积。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明不等式、求最值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等号当且仅当aᵢ/bᵢ为常数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>柯西1821年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到赫尔德不等式。</p></section></div>`},{id:'elementary_math-c1s9-21',name:'排序不等式',tags:["def", "der", "app", "note"],brief:'两组有序数反序和≤乱序和≤同序和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两组有序数反序和≤乱序和≤同序和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由交换调整法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明对称不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等号当且仅当其中一组全相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式经典。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>切比雪夫不等式是其推论。</p></section></div>`},{id:'elementary_math-c1s9-22',name:'高次不等式穿根法',tags:["def", "der", "app", "note"],brief:'将高次不等式因式分解后，用数轴穿根法求解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将高次不等式因式分解后，用数轴穿根法求解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由各因式符号变化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解高次不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>奇穿偶不穿（奇次根穿过，偶次根不穿）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式解法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>数轴标根法。</p></section></div>`},{id:'elementary_math-c1s9-23',name:'权方和不等式',tags:["def", "thm", "der", "app", "note"],brief:'Holder不等式的特例。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>Holder不等式的特例。</p><div class="la-fml">$$\\sum\\frac{a_i^{m+1}}{b_i^m}\\geq\\frac{(\\sum a_i)^{m+1}}{(\\sum b_i)^m}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sum\\frac{a_i^{m+1}}{b_i^m}\\geq\\frac{(\\sum a_i)^{m+1}}{(\\sum b_i)^m}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由赫尔德不等式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式不等式、最值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>aᵢ,bᵢ>0，m>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>不等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>m=1时为柯西分式形式。</p></section></div>`},{id:'elementary_math-c1s9-24',name:'琴生不等式',tags:["def", "der", "app", "note"],brief:'凸函数中f((x₁+...+xₙ)/n)≤(f(x₁)+...+f(xₙ))/n。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>凸函数中f((x₁+...+xₙ)/n)≤(f(x₁)+...+f(xₙ))/n。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由凸函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>凹函数不等号反向。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>琴生1906年。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>加权琴生不等式。</p></section></div>`},{id:'elementary_math-c1s9-25',name:'反证法证明不等式',tags:["def", "der", "app", "note"],brief:'假设结论不成立，推出矛盾。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>假设结论不成立，推出矛盾。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>逻辑反证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>适用于存在性、唯一性命题。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>证明方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与逆否命题等价。</p></section></div>`},{id:'elementary_math-c1s9-26',name:'数学归纳法证不等式',tags:["def", "der", "app", "note"],brief:'用归纳法证明与n有关的不等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用归纳法证明与n有关的不等式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>归纳基础+归纳递推。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数列不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>递推步需灵活放缩。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>证明方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>加强命题再归纳。</p></section></div>`},{id:'elementary_math-c1s9-27',name:'方程根的分布',tags:["def", "der", "app", "note"],brief:'二次方程根在指定区间内的条件。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>二次方程根在指定区间内的条件。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由二次函数图象和零点定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定参数范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>考虑开口、判别式、对称轴、端点函数值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>二次方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>转化为函数零点问题。</p></section></div>`},{id:'elementary_math-c1s9-28',name:'超越方程',tags:["def", "der", "app", "note"],brief:'含指数、对数、三角函数等超越函数的方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含指数、对数、三角函数等超越函数的方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>无法用代数方法精确求解。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数值分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常用图象法或二分法求近似解。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方程论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>牛顿迭代法求数值解。</p></section></div>`},{id:'elementary_math-c1s9-29',name:'参数方程',tags:["def", "der", "app", "note"],brief:'用参数表示曲线上点的坐标。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用参数表示曲线上点的坐标。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>引入中间变量t，x=f(t),y=g(t)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解析几何、运动轨迹。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>消去参数得普通方程。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>极坐标方程是特例。</p></section></div>`},{id:'elementary_math-c1s9-30',name:'方程组的几何意义',tags:["def", "der", "app", "note"],brief:'方程组的解对应图象的交点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>方程组的解对应图象的交点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方程与曲线关系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>无解=平行，无数解=重合。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数形结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线性方程组与矩阵。</p></section></div>`},{id:'elementary_math-c1s9-31',name:'不等式几何意义',tags:["def", "der", "app", "note"],brief:'不等式表示平面区域。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不等式表示平面区域。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由线性规划。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>线性规划、区域表示。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Ax+By+C>0表示直线一侧。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数形结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>可行域与最优解。</p></section></div>`}]}]},
{id:'elementary_math-ch2',num:'第二章',title:'函数',en:'FUNCTIONS',sub:'函数概念 · 初等函数 · 函数性质 · 抽象函数 · 数列',desc:'从函数概念到各类初等函数的性质与数列，构建函数论的完整体系。',sections:[{name:'2.1 函数概念与表示',color:'#2563eb',desc:'映射、定义域、值域',items:[{id:'elementary_math-c2s1-1',name:'函数定义',tags:["def", "thm", "der", "app", "note"],brief:'设A,B非空数集，若对A中每个x，按对应法则f，B中都有唯一确定的y与之对应，则f是A到B的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>设A,B非空数集，若对A中每个x，按对应法则f，B中都有唯一确定的y与之对应，则f是A到B的函数。</p><div class="la-fml">$$f:A\\to B,\\ x\\mapsto y=f(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f:A\\to B,\\ x\\mapsto y=f(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由映射概念限制到数集。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述变量间依赖关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>函数三要素：定义域、对应法则、值域。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>莱布尼茨1673年首次使用function一词。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到一般集合上的映射。</p></section></div>`},{id:'elementary_math-c2s1-2',name:'定义域',tags:["def", "der", "app", "note"],brief:'函数自变量x的取值集合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数自变量x的取值集合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实际意义或表达式有意义的条件确定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定函数研究范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分母≠0、偶次根号下≥0、对数真数>0等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数概念的要素。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>自然定义域与实际定义域的区别。</p></section></div>`},{id:'elementary_math-c2s1-3',name:'值域',tags:["def", "der", "app", "note"],brief:'函数值y的取值集合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数值y的取值集合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义域和对应法则确定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>了解函数输出范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>值域是B的子集，不一定等于B。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数概念的要素。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>满射时值域=B。</p></section></div>`},{id:'elementary_math-c2s1-4',name:'对应法则',tags:["def", "der", "app", "note"],brief:'函数中自变量到因变量的对应规律。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数中自变量到因变量的对应规律。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>函数的核心。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示函数关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>相同定义域值域但对应法则不同是不同函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数概念的要素。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对应法则可用解析式、图象、表格表示。</p></section></div>`},{id:'elementary_math-c2s1-5',name:'函数相等',tags:["def", "der", "app", "note"],brief:'两个函数相等当且仅当定义域和对应法则都相同。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个函数相等当且仅当定义域和对应法则都相同。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数三要素，值域由前两者决定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断函数是否相同。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>值域相同不一定是同一函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>函数的同构。</p></section></div>`},{id:'elementary_math-c2s1-6',name:'区间表示',tags:["def", "thm", "der", "app", "note"],brief:'用区间表示数集：闭区间[a,b]、开区间(a,b)、半开半闭、无穷区间。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用区间表示数集：闭区间[a,b]、开区间(a,b)、半开半闭、无穷区间。</p><div class="la-fml">$$[a,b]=\\{x\\mid a\\leq x\\leq b\\}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$[a,b]=\\{x\\mid a\\leq x\\leq b\\}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实数的有序性和连通性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简洁表示定义域、值域。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意开闭端点和无穷的写法。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>集合表示法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>邻域U(a,δ)=(a-δ,a+δ)。</p></section></div>`},{id:'elementary_math-c2s1-7',name:'映射',tags:["def", "thm", "der", "app", "note"],brief:'设A,B非空集合，若对A中每个元素，B中都有唯一确定元素与之对应，则f是A到B的映射。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>设A,B非空集合，若对A中每个元素，B中都有唯一确定元素与之对应，则f是A到B的映射。</p><div class="la-fml">$$f:A\\to B$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f:A\\to B$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>函数的推广（不限数集）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抽象代数中同态、同构。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>函数是数集到数集的映射。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数概念的推广。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>单射、满射、双射。</p></section></div>`},{id:'elementary_math-c2s1-8',name:'单射',tags:["def", "thm", "der", "app", "note"],brief:'若不同原像对应不同像，则f是单射（一一对应）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若不同原像对应不同像，则f是单射（一一对应）。</p><div class="la-fml">$$f(x_1)=f(x_2)\\Rightarrow x_1=x_2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x_1)=f(x_2)\\Rightarrow x_1=x_2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由映射定义加条件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>可逆的必要条件。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>单射才有逆映射（在值域上）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>映射分类。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>单射也称嵌入。</p></section></div>`},{id:'elementary_math-c2s1-9',name:'满射',tags:["def", "thm", "der", "app", "note"],brief:'若B中每个元素都有原像，则f是满射。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若B中每个元素都有原像，则f是满射。</p><div class="la-fml">$$\\forall y\\in B,\\exists x\\in A, f(x)=y$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\forall y\\in B,\\exists x\\in A, f(x)=y$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由映射定义加条件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>值域=B。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>满射的值域等于目标集。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>映射分类。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>满射也称到上映射。</p></section></div>`},{id:'elementary_math-c2s1-10',name:'双射',tags:["def", "der", "app", "note"],brief:'既是单射又是满射的映射。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>既是单射又是满射的映射。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>单射+满射。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>存在逆映射。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>双射建立两集合的一一对应。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>映射分类。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>双射的逆映射也是双射。</p></section></div>`},{id:'elementary_math-c2s1-11',name:'函数表示法',tags:["def", "der", "app", "note"],brief:'解析法、图象法、列表法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解析法、图象法、列表法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>从不同角度表示函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>根据需要选择表示方法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三种方法各有优劣。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数表示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>分段函数用解析法分段表示。</p></section></div>`},{id:'elementary_math-c2s1-12',name:'分段函数',tags:["def", "der", "app", "note"],brief:'在定义域不同区间上有不同对应法则的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在定义域不同区间上有不同对应法则的函数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实际问题的分段特征。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>绝对值函数、取整函数等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分段函数是一个函数，不是多个函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数表示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>连续但不可导的典型例子。</p></section></div>`},{id:'elementary_math-c2s1-13',name:'求函数定义域',tags:["def", "der", "app", "note"],brief:'使函数解析式有意义的自变量集合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>使函数解析式有意义的自变量集合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>根据各运算有意义的条件列不等式组。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数研究的第一步。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分式分母≠0，偶次根号下≥0，对数真数>0，零次幂底数≠0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>实际问题还需考虑实际意义。</p></section></div>`},{id:'elementary_math-c2s1-14',name:'求函数值域',tags:["def", "der", "app", "note"],brief:'由定义域和对应法则求函数值的集合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由定义域和对应法则求函数值的集合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>常用方法：直接法、配方法、换元法、判别式法、单调性法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>了解函数取值范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>值域由定义域和对应法则共同决定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>反函数定义域即原函数值域。</p></section></div>`},{id:'elementary_math-c2s1-15',name:'函数求值',tags:["def", "der", "app", "note"],brief:'给定x求f(x)或反过来。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>给定x求f(x)或反过来。</p></section><section class="la-kp-s
