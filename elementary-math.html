ec la-kp-der"><h5>推 导</h5><p>代入对应法则。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数基本运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意分段函数要代入对应段。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数基本操作。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复合函数求值由内到外。</p></section></div>`}]},{name:'2.2 初等函数',color:'#7c3aed',desc:'幂、指、对、三角、反三角',items:[{id:'elementary_math-c2s2-1',name:'幂函数',tags:["def", "thm", "der", "app", "note"],brief:'底数为自变量、指数为常数的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>底数为自变量、指数为常数的函数。</p><div class="la-fml">$$y=x^\\alpha\\ (\\alpha\\in\\mathbb{R})$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=x^\\alpha\\ (\\alpha\\in\\mathbb{R})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由幂运算定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>各种物理关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>α不同时定义域、图象差异大；恒过(1,1)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>最基本的函数类之一。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>α=0时为y=1(x≠0)。</p></section></div>`},{id:'elementary_math-c2s2-2',name:'幂函数性质',tags:["def", "der", "app", "note"],brief:'幂函数y=x^α，α>0时在(0,+∞)递增，α<0时递减。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>幂函数y=x^α，α>0时在(0,+∞)递增，α<0时递减。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由指数函数性质或求导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断单调性、画图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>α>0时图象过(0,0)和(1,1)；α<0时过(1,1)，以坐标轴为渐近线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>幂函数研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>第一象限图象必过(1,1)。</p></section></div>`},{id:'elementary_math-c2s2-3',name:'三角函数',tags:["def", "thm", "der", "app", "note"],brief:'以角为自变量的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>以角为自变量的函数。</p><div class="la-fml">$$y=\\sin x,\\ y=\\cos x,\\ y=\\tan x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\sin x,\\ y=\\cos x,\\ y=\\tan x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单位圆或直角三角形定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>周期运动、波动。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>正弦余弦周期2π，正切周期π。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代天文学。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>欧拉公式统一三角函数与指数函数。</p></section></div>`},{id:'elementary_math-c2s2-4',name:'反三角函数',tags:["def", "thm", "der", "app", "note"],brief:'三角函数在主值区间上的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角函数在主值区间上的反函数。</p><div class="la-fml">$$y=\\arcsin x,\\ y=\\arccos x,\\ y=\\arctan x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\arcsin x,\\ y=\\arccos x,\\ y=\\arctan x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>限制三角函数到单调区间后取反函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角度、解三角方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意主值区间。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反三角函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>反三角恒等式。</p></section></div>`},{id:'elementary_math-c2s2-5',name:'常数函数',tags:["def", "thm", "der", "app", "note"],brief:'函数值恒为常数c的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数值恒为常数c的函数。</p><div class="la-fml">$$y=c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对应法则不依赖自变量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>基准线、常数模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>既是奇函数又是偶函数当且仅当c=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>最简单的函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>零函数是特殊的常数函数。</p></section></div>`},{id:'elementary_math-c2s2-6',name:'一次函数',tags:["def", "thm", "der", "app", "note"],brief:'最高次为1的多项式函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>最高次为1的多项式函数。</p><div class="la-fml">$$y=kx+b\\ (k\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=kx+b\\ (k\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由多项式定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>线性关系、直线方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>k>0递增，k<0递减；b是y轴截距。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>线性函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>k=0时为常数函数。</p></section></div>`},{id:'elementary_math-c2s2-7',name:'二次函数',tags:["def", "thm", "der", "app", "note"],brief:'最高次为2的多项式函数，图象是抛物线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>最高次为2的多项式函数，图象是抛物线。</p><div class="la-fml">$$y=ax^2+bx+c\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=ax^2+bx+c\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由多项式定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>最值问题、抛物线运动。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>顶点(-b/2a, (4ac-b²)/4a)；a>0开口向上有最小值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>圆锥曲线的一种。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二次函数是最简单的非线性函数。</p></section></div>`},{id:'elementary_math-c2s2-8',name:'反比例函数',tags:["def", "thm", "der", "app", "note"],brief:'形如y=k/x的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>形如y=k/x的函数。</p><div class="la-fml">$$y=\\frac{k}{x}\\ (k\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\frac{k}{x}\\ (k\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反比例关系定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>反比关系、双曲线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>k>0时图象在一、三象限；k<0时在二、四象限。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反比例关系。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等轴双曲线。</p></section></div>`},{id:'elementary_math-c2s2-9',name:'对勾函数',tags:["def", "thm", "der", "app", "note"],brief:'形如y=x+a/x(a>0)的函数，图象如对勾。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>形如y=x+a/x(a>0)的函数，图象如对勾。</p><div class="la-fml">$$y=x+\\frac{a}{x}\\ (a>0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=x+\\frac{a}{x}\\ (a>0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由均值不等式分析。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>最值问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>在(0,√a]递减，[√a,+∞)递增；最小值2√a。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>典型函数模型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>可推广到y=ax+b/x。</p></section></div>`},{id:'elementary_math-c2s2-10',name:'初等函数',tags:["def", "der", "app", "note"],brief:'由基本初等函数（幂、指、对、三角、反三角、常数）经有限次四则运算和复合得到的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由基本初等函数（幂、指、对、三角、反三角、常数）经有限次四则运算和复合得到的函数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由基本初等函数构造。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>微积分研究的主要对象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分段函数一般不是初等函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数分类。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>初等函数在定义域内连续。</p></section></div>`},{id:'elementary_math-c2s2-11',name:'绝对值函数',tags:["def", "thm", "der", "app", "note"],brief:'y=|x|的图象是V形折线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>y=|x|的图象是V形折线。</p><div class="la-fml">$$y=|x|$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=|x|$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由绝对值定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>距离、分段。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>在x=0处连续但不可导。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分段函数原型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>|f(x)|的图象是将f(x)下方部分翻折到上方。</p></section></div>`},{id:'elementary_math-c2s2-12',name:'取整函数',tags:["def", "thm", "der", "app", "note"],brief:'不超过x的最大整数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不超过x的最大整数。</p><div class="la-fml">$$y=[x]=\\lfloor x\\rfloor$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=[x]=\\lfloor x\\rfloor$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由整数部分定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计数、离散化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>[x]≤x<[x]+1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>高斯函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>小数部分{x}=x-[x]。</p></section></div>`},{id:'elementary_math-c2s2-13',name:'符号函数',tags:["def", "thm", "der", "app", "note"],brief:'表示x的符号。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>表示x的符号。</p><div class="la-fml">$$y=sgn(x)=\\begin{cases}1, & x>0 \\\\ 0, & x=0 \\\\ -1, & x<0\\end{cases}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=sgn(x)=\\begin{cases}1, & x>0 \\\\ 0, & x=0 \\\\ -1, & x<0\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由符号定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断正负。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|x|=x·sgn(x)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>特殊函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>不连续函数的例子。</p></section></div>`},{id:'elementary_math-c2s2-14',name:'狄利克雷函数',tags:["def", "thm", "der", "app", "note"],brief:'有理点取1，无理点取0的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有理点取1，无理点取0的函数。</p><div class="la-fml">$$D(x)=\\begin{cases}1, & x\\in\\mathbb{Q} \\\\ 0, & x\\notin\\mathbb{Q}\\end{cases}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$D(x)=\\begin{cases}1, & x\\in\\mathbb{Q} \\\\ 0, & x\\notin\\mathbb{Q}\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由有理数集定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>反例函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>处处不连续，处处不可导。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>狄利克雷构造。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>没有最小正周期的周期函数。</p></section></div>`},{id:'elementary_math-c2s2-15',name:'双曲函数',tags:["def", "thm", "der", "app", "note"],brief:'由指数函数定义的双曲正弦、余弦。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由指数函数定义的双曲正弦、余弦。</p><div class="la-fml">$$\\sinh x=\\frac{e^x-e^{-x}}{2},\\ \\cosh x=\\frac{e^x+e^{-x}}{2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sinh x=\\frac{e^x-e^{-x}}{2},\\ \\cosh x=\\frac{e^x+e^{-x}}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由eˣ和e⁻ˣ组合。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>悬链线、相对论。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>cosh²x-sinh²x=1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>双曲几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与三角函数形式相似。</p></section></div>`},{id:'elementary_math-c2s2-16',name:'反双曲函数',tags:["def", "thm", "der", "app", "note"],brief:'双曲函数的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>双曲函数的反函数。</p><div class="la-fml">$$\\text{arsinh}\\,x=\\ln(x+\\sqrt{x^2+1})$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\text{arsinh}\\,x=\\ln(x+\\sqrt{x^2+1})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数求解。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>积分计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>arsinh定义域R。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反双曲函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>用对数表示。</p></section></div>`},{id:'elementary_math-c2s2-17',name:'幂指函数',tags:["def", "thm", "der", "app", "note"],brief:'底数和指数都是自变量的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>底数和指数都是自变量的函数。</p><div class="la-fml">$$y=x^x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=x^x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>取对数法求导：lny=xlnx。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>优化问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>x>0时定义。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>特殊函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>最小值在x=1/e处。</p></section></div>`}]},{name:'2.3 函数性质',color:'#0f766e',desc:'单调、有界、周期、奇偶',items:[{id:'elementary_math-c2s3-1',name:'单调性定义',tags:["def", "der", "app", "note"],brief:'若对区间I内任意x₁<x₂，都有f(x₁)<f(x₂)，则f在I上递增。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若对区间I内任意x₁<x₂，都有f(x₁)<f(x₂)，则f在I上递增。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数值随自变量增大的变化趋势定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断函数增减、求值域。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>递增/递减统称单调；严格单调才有反函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>单调函数几乎处处可导（勒贝格定理）。</p></section></div>`},{id:'elementary_math-c2s3-2',name:'单调性证明',tags:["def", "der", "app", "note"],brief:'用定义法（作差比较）或导数法证明单调性。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用定义法（作差比较）或导数法证明单调性。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>定义法：f(x₁)-f(x₂)与0比较；导数法：f'(x)>0则递增。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明函数单调。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义法对一切函数适用，导数法只对可导函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>单调性证明。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复合函数单调性：同增异减。</p></section></div>`},{id:'elementary_math-c2s3-3',name:'单调区间',tags:["def", "der", "app", "note"],brief:'函数在其上单调的区间。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数在其上单调的区间。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单调性定义确定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分析函数变化趋势。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一个函数可有多个单调区间，不能用∪连接。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数分析。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>单调区间端点根据定义域确定。</p></section></div>`},{id:'elementary_math-c2s3-4',name:'最值',tags:["def", "thm", "der", "app", "note"],brief:'函数在定义域或区间上的最大值和最小值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数在定义域或区间上的最大值和最小值。</p><div class="la-fml">$$f(x_0)\\geq f(x)\\ \\forall x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x_0)\\geq f(x)\\ \\forall x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单调性和端点值确定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>优化问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>最值是全局概念，极值是局部概念。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>极值问题。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>闭区间上连续函数必有最值（最值定理）。</p></section></div>`},{id:'elementary_math-c2s3-5',name:'极值',tags:["def", "der", "app", "note"],brief:'在某点附近函数值最大（小）的叫极大（小）值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在某点附近函数值最大（小）的叫极大（小）值。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由局部比较定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>优化问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>极值是局部概念，极大值不一定大于极小值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>微积分核心概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>费马定理：极值点处导数为0（若可导）。</p></section></div>`},{id:'elementary_math-c2s3-6',name:'奇偶性定义',tags:["def", "thm", "der", "app", "note"],brief:'偶函数关于y轴对称，奇函数关于原点对称。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>偶函数关于y轴对称，奇函数关于原点对称。</p><div class="la-fml">$$f(-x)=f(x)\\text{偶},\\ f(-x)=-f(x)\\text{奇}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(-x)=f(x)\\text{偶},\\ f(-x)=-f(x)\\text{奇}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对称性定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化函数分析、积分计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义域必须关于原点对称。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数对称性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>奇×奇=偶，奇×偶=奇，偶×偶=偶。</p></section></div>`},{id:'elementary_math-c2s3-7',name:'奇偶性判断',tags:["def", "der", "app", "note"],brief:'先看定义域是否关于原点对称，再验证f(-x)与f(x)的关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>先看定义域是否关于原点对称，再验证f(-x)与f(x)的关系。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断函数奇偶性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>f(-x)=f(x)偶，f(-x)=-f(x)奇，否则非奇非偶。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>任一函数可分解为奇函数+偶函数。</p></section></div>`},{id:'elementary_math-c2s3-8',name:'奇偶函数运算',tags:["def", "thm", "der", "app", "note"],brief:'奇偶函数的和差积商的奇偶性。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>奇偶函数的和差积商的奇偶性。</p><div class="la-fml">$$奇\\pm奇=奇,\\ 偶\\pm偶=偶$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$奇\\pm奇=奇,\\ 偶\\pm偶=偶$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义直接验证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>快速判断复合函数奇偶性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>奇±奇=奇，偶±偶=偶，奇×奇=偶，奇×偶=奇，偶×偶=偶。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>类似奇偶函数的复合。</p></section></div>`},{id:'elementary_math-c2s3-9',name:'周期性定义',tags:["def", "thm", "der", "app", "note"],brief:'若存在非零常数T，使f(x+T)=f(x)对定义域内所有x成立，则f是周期函数，T是周期。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若存在非零常数T，使f(x+T)=f(x)对定义域内所有x成立，则f是周期函数，T是周期。</p><div class="la-fml">$$f(x+T)=f(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x+T)=f(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数值的重复规律定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述周期运动。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>若T是周期则kT(k∈Z,k≠0)也是周期；最小正周期叫基本周期。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>周期现象的数学描述。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>非常数连续周期函数必有最小正周期（狄利克雷函数除外）。</p></section></div>`},{id:'elementary_math-c2s3-10',name:'周期函数性质',tags:["def", "der", "app", "note"],brief:'周期函数的图象每隔一个周期重复。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>周期函数的图象每隔一个周期重复。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由周期性定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化周期函数研究（只需研究一个周期）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>周期函数定义域至少一侧无界。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>周期函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>两个周期函数之和不一定是周期函数（周期不可公度时）。</p></section></div>`},{id:'elementary_math-c2s3-11',name:'有界性定义',tags:["def", "thm", "der", "app", "note"],brief:'若存在M>0使对定义域内所有x有|f(x)|≤M，则f有界。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若存在M>0使对定义域内所有x有|f(x)|≤M，则f有界。</p><div class="la-fml">$$|f(x)|\\leq M$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|f(x)|\\leq M$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数值的范围定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断函数是否有界。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>有界⟺有上界且有下界。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>有界性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>闭区间上连续函数必有界（有界性定理）。</p></section></div>`},{id:'elementary_math-c2s3-12',name:'对称性',tags:["def", "der", "app", "note"],brief:'函数图象的对称性质：关于y轴、原点、直线x=a等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数图象的对称性质：关于y轴、原点、直线x=a等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标变换验证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>利用对称性简化研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>f(a+x)=f(a-x)⟺关于x=a对称。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>几何性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>中心对称与轴对称的判定。</p></section></div>`},{id:'elementary_math-c2s3-13',name:'函数图象平移',tags:["def", "thm", "der", "app", "note"],brief:'y=f(x)向右平移h、向上平移k得到y=f(x-h)+k。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>y=f(x)向右平移h、向上平移k得到y=f(x-h)+k。</p><div class="la-fml">$$y=f(x-h)+k$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(x-h)+k$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标变换。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数图象绘制。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>左加右减，上加下减。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>图象变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>h,k可正可负。</p></section></div>`},{id:'elementary_math-c2s3-14',name:'函数图象伸缩',tags:["def", "thm", "der", "app", "note"],brief:'y=f(x)横向伸缩a倍得y=f(ax)，纵向伸缩b倍得y=bf(x)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>y=f(x)横向伸缩a倍得y=f(ax)，纵向伸缩b倍得y=bf(x)。</p><div class="la-fml">$$y=f(ax),\\ y=bf(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(ax),\\ y=bf(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标缩放。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数图象绘制。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>1横向压缩，0<a<1横向拉伸。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>图象变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与周期、振幅相关。</p></section></div>`},{id:'elementary_math-c2s3-15',name:'函数图象对称变换',tags:["def", "thm", "der", "app", "note"],brief:'y=f(-x)关于y轴对称，y=-f(x)关于x轴对称。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>y=f(-x)关于y轴对称，y=-f(x)关于x轴对称。</p><div class="la-fml">$$y=f(-x),\\ y=-f(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(-x),\\ y=-f(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标反射。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数图象绘制。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>y=-f(-x)关于原点对称。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>图象变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>奇偶函数的对称性即此。</p></section></div>`},{id:'elementary_math-c2s3-16',name:'二次函数最值',tags:["def", "thm", "der", "app", "note"],brief:'二次函数在顶点处取最值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>二次函数在顶点处取最值。</p><div class="la-fml">$$y_{\\text{最值}}=\\frac{4ac-b^2}{4a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y_{\\text{最值}}=\\frac{4ac-b^2}{4a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由配方法y=a(x+b/2a)²+(4ac-b²)/4a。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>最值问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>0时取最小值，a<0时取最大值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>二次函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>在闭区间上需比较端点和顶点。</p></section></div>`},{id:'elementary_math-c2s3-17',name:'二次函数零点',tags:["def", "thm", "der", "app", "note"],brief:'二次函数与x轴交点的横坐标。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>二次函数与x轴交点的横坐标。</p><div class="la-fml">$$x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令y=0解二次方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求零点、画图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Δ>0两个零点，Δ=0一个，Δ<0无实零点。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>二次函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>零点即对应方程的根。</p></section></div>`},{id:'elementary_math-c2s3-18',name:'二次函数对称轴',tags:["def", "thm", "der", "app", "note"],brief:'二次函数图象的对称轴。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>二次函数图象的对称轴。</p><div class="la-fml">$$x=-\\frac{b}{2a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x=-\\frac{b}{2a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由配方法或顶点横坐标。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分析二次函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对称轴处取最值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>二次函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>关于对称轴对称的点函数值相等。</p></section></div>`},{id:'elementary_math-c2s3-19',name:'函数零点存在定理',tags:["def", "der", "app", "note"],brief:'若f在[a,b]连续且f(a)·f(b)<0，则在(a,b)内至少有一个零点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若f在[a,b]连续且f(a)·f(b)<0，则在(a,b)内至少有一个零点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由介值定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断零点存在、二分法求根。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是充分条件非必要条件。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>连续函数性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二分法求方程近似解。</p></section></div>`},{id:'elementary_math-c2s3-20',name:'函数图象平移变换',tags:["def", "thm", "der", "app", "note"],brief:'向右平移a个单位，向上平移b个单位。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向右平移a个单位，向上平移b个单位。</p><div class="la-fml">$$y=f(x)\\to y=f(x-a)+b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(x)\\to y=f(x-a)+b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标变换。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>画函数图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>左加右减，上加下减。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>图象变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>注意平移方向与符号。</p></section></div>`},{id:'elementary_math-c2s3-21',name:'函数图象伸缩变换',tags:["def", "thm", "der", "app", "note"],brief:'纵坐标伸缩A倍，横坐标伸缩1/ω倍。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>纵坐标伸缩A倍，横坐标伸缩1/ω倍。</p><div class="la-fml">$$y=f(x)\\to y=Af(\\omega x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(x)\\to y=Af(\\omega x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标变换。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>画函数图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>A>1纵向拉伸，ω>1横向压缩。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>图象变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>三角函数的振幅和周期。</p></section></div>`},{id:'elementary_math-c2s3-22',name:'反函数性质',tags:["def", "der", "app", "note"],brief:'y=f⁻¹(x)与y=f(x)关于y=x对称。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>y=f⁻¹(x)与y=f(x)关于y=x对称。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求反函数、对数与指数互化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义域与值域互换；单调函数才有反函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>f(f⁻¹(x))=x。</p></section></div>`},{id:'elementary_math-c2s3-23',name:'复合函数单调性',tags:["def", "der", "app", "note"],brief:'同增异减原则：内外函数单调性相同则增，不同则减。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同增异减原则：内外函数单调性相同则增，不同则减。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单调性定义逐层分析。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断复合函数单调区间。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意定义域。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>复合函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多层复合逐层判断。</p></section></div>`},{id:'elementary_math-c2s3-24',name:'复合函数定义域',tags:["def", "der", "app", "note"],brief:'内层函数的值域须落在外层函数定义域内。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>内层函数的值域须落在外层函数定义域内。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由复合函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求复合函数定义域。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>y=f(g(x))需g(x)∈D_f。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>定义域是x的范围。</p></section></div>`},{id:'elementary_math-c2s3-25',name:'函数值域求法',tags:["def", "der", "app", "note"],brief:'观察法、配方法、换元法、判别式法、单调性法等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>观察法、配方法、换元法、判别式法、单调性法等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数性质。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求函数值域。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>先求定义域。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数分析。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复杂函数可用导数。</p></section></div>`}]},{name:'2.4 抽象函数与复合函数',color:'#c2410c',desc:'无解析式函数、复合',items:[{id:'elementary_math-c2s4-1',name:'抽象函数',tags:["def", "der", "app", "note"],brief:'没有给出具体解析式，只给出某些性质（如f(x+y)=f(x)+f(y)）的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>没有给出具体解析式，只给出某些性质（如f(x+y)=f(x)+f(y)）的函数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数方程定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数方程、函数性质研究。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常见模型：f(x+y)=f(x)+f(y)对应正比例函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>柯西方程等函数方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>不连续解需选择公理。</p></section></div>`},{id:'elementary_math-c2s4-2',name:'柯西方程',tags:["def", "thm", "der", "app", "note"],brief:'满足f(x+y)=f(x)+f(y)的函数方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>满足f(x+y)=f(x)+f(y)的函数方程。</p><div class="la-fml">$$f(x+y)=f(x)+f(y)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x+y)=f(x)+f(y)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若f连续则f(x)=kx。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抽象函数的原型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>连续/单调/有界条件下解为f(x)=kx。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>柯西1821年研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>无连续性条件有野生解。</p></section></div>`},{id:'elementary_math-c2s4-3',name:'指数型抽象函数',tags:["def", "thm", "der", "app", "note"],brief:'满足f(x+y)=f(x)f(y)的函数，对应指数函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>满足f(x+y)=f(x)f(y)的函数，对应指数函数。</p><div class="la-fml">$$f(x+y)=f(x)f(y)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x+y)=f(x)f(y)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若f连续且不恒为0，则f(x)=aˣ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抽象函数模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>f(0)=1，f(x)>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>指数函数的函数方程刻画。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>f(x)≡0也是解。</p></section></div>`},{id:'elementary_math-c2s4-4',name:'对数型抽象函数',tags:["def", "thm", "der", "app", "note"],brief:'满足f(xy)=f(x)+f(y)的函数，对应对数函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>满足f(xy)=f(x)+f(y)的函数，对应对数函数。</p><div class="la-fml">$$f(xy)=f(x)+f(y)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(xy)=f(x)+f(y)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>若f连续且在(0,+∞)上，则f(x)=k·lnx。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抽象函数模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>f(1)=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数函数的函数方程刻画。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>f在0处无定义。</p></section></div>`},{id:'elementary_math-c2s4-5',name:'复合函数',tags:["def", "thm", "der", "app", "note"],brief:'若y=f(u),u=g(x)，则y=f(g(x))叫复合函数，u为中间变量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若y=f(u),u=g(x)，则y=f(g(x))叫复合函数，u为中间变量。</p><div class="la-fml">$$y=f(g(x))$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(g(x))$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>函数的复合运算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>复杂函数的分解与合成。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>内层值域与外层定义域的交集非空才能复合。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数复合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复合函数定义域是使g(x)在f定义域内的x集合。</p></section></div>`},{id:'elementary_math-c2s4-6',name:'复合函数奇偶性',tags:["def", "der", "app", "note"],brief:'复合函数奇偶性：内层偶则复合偶；内层奇则与外层奇偶性相同。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>复合函数奇偶性：内层偶则复合偶；内层奇则与外层奇偶性相同。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义验证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断复合函数奇偶性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>g偶⇒f(g(x))偶；g奇⇒f(g(x))的奇偶性与f相同。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>复合函数性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多层复合的奇偶性判断。</p></section></div>`},{id:'elementary_math-c2s4-7',name:'反函数',tags:["def", "thm", "der", "app", "note"],brief:'若函数f是双射，则其逆映射叫f的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若函数f是双射，则其逆映射叫f的反函数。</p><div class="la-fml">$$y=f^{-1}(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f^{-1}(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由逆映射定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求反函数、指数对数互化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>原函数与反函数图象关于y=x对称。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反函数概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>严格单调函数必有反函数。</p></section></div>`},{id:'elementary_math-c2s4-8',name:'求反函数步骤',tags:["def", "der", "app", "note"],brief:'1.由y=f(x)解出x=f⁻¹(y)；2.交换x,y得y=f⁻¹(x)；3.注明定义域（原函数值域）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>1.由y=f(x)解出x=f⁻¹(y)；2.交换x,y得y=f⁻¹(x)；3.注明定义域（原函数值域）。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求反函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意反函数的定义域是原函数的值域。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>反函数求法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>分段函数求反函数要分段处理。</p></section></div>`},{id:'elementary_math-c2s4-9',name:'隐函数',tags:["def", "der", "app", "note"],brief:'未显式解出y的函数关系F(x,y)=0。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>未显式解出y的函数关系F(x,y)=0。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方程定义的函数关系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆锥曲线方程、隐函数求导。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一个方程可能确定多个隐函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数概念推广。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>隐函数存在定理。</p></section></div>`},{id:'elementary_math-c2s4-10',name:'参数方程表示函数',tags:["def", "thm", "der", "app", "note"],brief:'用参数t表示x,y的函数关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用参数t表示x,y的函数关系。</p><div class="la-fml">$$\\begin{cases}x=\\varphi(t)\\\\y=\\psi(t)\\end{cases}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\begin{cases}x=\\varphi(t)\\\\y=\\psi(t)\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>消去参数得普通方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>运动轨迹、曲线参数化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>参数方程可表示非函数曲线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>参数方程求导。</p></section></div>`},{id:'elementary_math-c2s4-11',name:'函数渐近线',tags:["def", "der", "app", "note"],brief:'函数图象无限接近的直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数图象无限接近的直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由极限行为分析。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>画函数图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分水平、垂直、斜渐近线三类。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数图象分析。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>斜渐近线y=kx+b由极限求。</p></section></div>`},{id:'elementary_math-c2s4-12',name:'函数凸性',tags:["def", "der", "app", "note"],brief:'函数图象的凹凸方向。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数图象的凹凸方向。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由二阶导数符号判断（预备知识）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不等式、优化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>凸函数满足f((x₁+x₂)/2)≤(f(x₁)+f(x₂))/2。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>凸分析。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>琴生不等式的基础。</p></section></div>`},{id:'elementary_math-c2s4-13',name:'函数拐点',tags:["def", "der", "app", "note"],brief:'函数图象凹凸改变的点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数图象凹凸改变的点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>二阶导数为零且变号的点。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>画函数图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>拐点处二阶导数为零或不存在。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>曲线分析。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与极值点的区别。</p></section></div>`},{id:'elementary_math-c2s4-14',name:'隐函数存在性',tags:["def", "der", "app", "note"],brief:'F(x,y)=0在一定条件下能确定y=f(x)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>F(x,y)=0在一定条件下能确定y=f(x)。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由隐函数定理（偏导连续且F_y≠0）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>曲线方程、求导。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>隐函数不一定能显式解出。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>隐函数定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多元隐函数组。</p></section></div>`},{id:'elementary_math-c2s4-15',name:'极坐标方程',tags:["def", "thm", "der", "app", "note"],brief:'用极坐标(r,θ)表示平面上的点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用极坐标(r,θ)表示平面上的点。</p><div class="la-fml">$$x=r\\cos\\theta,\\ y=r\\sin\\theta$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x=r\\cos\\theta,\\ y=r\\sin\\theta$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由三角函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>对称图形、积分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>极坐标与直角坐标可互换。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>牛顿引入。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>极坐标方程求导。</p></section></div>`},{id:'elementary_math-c2s4-16',name:'极坐标与直角坐标转换',tags:["def", "thm", "der", "app", "note"],brief:'极坐标与直角坐标的互换公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>极坐标与直角坐标的互换公式。</p><div class="la-fml">$$r=\\sqrt{x^2+y^2},\\ \\theta=\\arctan\\frac{y}{x}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r=\\sqrt{x^2+y^2},\\ \\theta=\\arctan\\frac{y}{x}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由直角三角形边角关系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>坐标系转换。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意象限对θ的影响。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>解析几何。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>柱坐标、球坐标。</p></section></div>`},{id:'elementary_math-c2s4-17',name:'函数交点',tags:["def", "der", "app", "note"],brief:'两函数图象交点对应方程f(x)=g(x)的解。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两函数图象交点对应方程f(x)=g(x)的解。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令f(x)=g(x)求解。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求图象交点。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>交点个数=方程实根个数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数形结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>超越方程图象法求解。</p></section></div>`}]},{name:'2.5 数列',color:'#7c3aed',desc:'等差、等比、求和',items:[{id:'elementary_math-c2s5-1',name:'数列定义',tags:["def", "thm", "der", "app", "note"],brief:'按一定次序排列的一列数，可看作定义在正整数集上的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>按一定次序排列的一列数，可看作定义在正整数集上的函数。</p><div class="la-fml">$$\\{a_n\\},\\ a_n=f(n)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\{a_n\\},\\ a_n=f(n)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数概念限制到正整数集。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述离散变化、求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>数列有穷或无穷；有序列。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>离散数学基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>数列的极限是微积分的入口。</p></section></div>`},{id:'elementary_math-c2s5-2',name:'数列通项公式',tags:["def", "thm", "der", "app", "note"],brief:'数列第n项与n的关系式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>数列第n项与n的关系式。</p><div class="la-fml">$$a_n=f(n)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=f(n)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由数列规律归纳。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求数列任意项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>并非所有数列都有通项公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列表示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>递推公式也是表示数列的方法。</p></section></div>`},{id:'elementary_math-c2s5-3',name:'数列前n项和',tags:["def", "thm", "der", "app", "note"],brief:'数列前n项之和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>数列前n项之和。</p><div class="la-fml">$$S_n=a_1+a_2+\\cdots+a_n$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S_n=a_1+a_2+\\cdots+a_n$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由加法定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求和问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>aₙ=Sₙ-Sₙ₋₁(n≥2)，a₁=S₁。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>级数的部分和。</p></section></div>`},{id:'elementary_math-c2s5-4',name:'等差数列',tags:["def", "thm", "der", "app", "note"],brief:'从第二项起，每一项与前一项的差为常数d的数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从第二项起，每一项与前一项的差为常数d的数列。</p><div class="la-fml">$$a_n=a_1+(n-1)d$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1+(n-1)d$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由公差d递推：aₙ=aₙ₋₁+d。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>均匀变化的量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>d>0递增，d<0递减，d=0常数列。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代已有等差求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等差数列的和公式。</p></section></div>`},{id:'elementary_math-c2s5-5',name:'等差数列求和',tags:["def", "thm", "der", "app", "note"],brief:'等差数列前n项和公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等差数列前n项和公式。</p><div class="la-fml">$$S_n=\\frac{n(a_1+a_n)}{2}=na_1+\\frac{n(n-1)}{2}d$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S_n=\\frac{n(a_1+a_n)}{2}=na_1+\\frac{n(n-1)}{2}d$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>倒序相加法：Sₙ=a₁+...+aₙ，Sₙ=aₙ+...+a₁，相加得2Sₙ=n(a₁+aₙ)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>也可用首项末项平均值×项数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>高斯少年时巧妙求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Sₙ是关于n的二次函数（d≠0时）。</p></section></div>`},{id:'elementary_math-c2s5-6',name:'等差中项',tags:["def", "thm", "der", "app", "note"],brief:'a,A,b成等差数列，则A叫a,b的等差中项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>a,A,b成等差数列，则A叫a,b的等差中项。</p><div class="la-fml">$$A=\\frac{a+b}{2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$A=\\frac{a+b}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由A-a=b-A得2A=a+b。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等差数列性质。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a,b的等差中项即平均值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>中项概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n个数的等差中项。</p></section></div>`},{id:'elementary_math-c2s5-7',name:'等差数列性质',tags:["def", "der", "app", "note"],brief:'等差数列中，若m+n=p+q，则aₘ+aₙ=aₚ+a_q。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等差数列中，若m+n=p+q，则aₘ+aₙ=aₚ+a_q。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由通项公式直接验证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>下标和相等则项和相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等比数列有类似积的性质。</p></section></div>`},{id:'elementary_math-c2s5-8',name:'等比数列',tags:["def", "thm", "der", "app", "note"],brief:'从第二项起，每一项与前一项的比为常数q的数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从第二项起，每一项与前一项的比为常数q的数列。</p><div class="la-fml">$$a_n=a_1q^{n-1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1q^{n-1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由公比q递推：aₙ=aₙ₋₁·q。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>指数增长/衰减、复利。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a₁≠0,q≠0；q>0各项同号。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代已有等比数列。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等比数列求和。</p></section></div>`},{id:'elementary_math-c2s5-9',name:'等比数列求和',tags:["def", "thm", "der", "app", "note"],brief:'等比数列前n项和公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等比数列前n项和公式。</p><div class="la-fml">$$S_n=\\frac{a_1(1-q^n)}{1-q}\\ (q\\neq 1)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S_n=\\frac{a_1(1-q^n)}{1-q}\\ (q\\neq 1)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>错位相减法：Sₙ=a₁+a₁q+...+a₁qⁿ⁻¹，qSₙ=a₁q+...+a₁qⁿ，相减得(1-q)Sₙ=a₁(1-qⁿ)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>q=1时Sₙ=na₁。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>等比求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>|q|<1时无穷等比级数和为a₁/(1-q)。</p></section></div>`},{id:'elementary_math-c2s5-10',name:'等比中项',tags:["def", "thm", "der", "app", "note"],brief:'a,G,b成等比数列，则G叫a,b的等比中项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>a,G,b成等比数列，则G叫a,b的等比中项。</p><div class="la-fml">$$G=\\pm\\sqrt{ab}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$G=\\pm\\sqrt{ab}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由G/a=b/G得G²=ab。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等比数列性质。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a,b同号时等比中项存在且有两个。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>中项概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>几何平均即等比中项（非负）。</p></section></div>`},{id:'elementary_math-c2s5-11',name:'等比数列性质',tags:["def", "der", "app", "note"],brief:'等比数列中，若m+n=p+q，则aₘ·aₙ=aₚ·a_q。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等比数列中，若m+n=p+q，则aₘ·aₙ=aₚ·a_q。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由通项公式验证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>下标和相等则项积相等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与等差数列的和性质对应。</p></section></div>`},{id:'elementary_math-c2s5-12',name:'数列求和方法',tags:["def", "der", "app", "note"],brief:'公式法、倒序相加、错位相减、裂项相消、分组求和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>公式法、倒序相加、错位相减、裂项相消、分组求和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>根据数列特点选择方法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>各类数列求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等差用公式/倒序相加，等比用公式/错位相减，1/[n(n+1)]用裂项。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>求和技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复杂数列需灵活组合方法。</p></section></div>`},{id:'elementary_math-c2s5-13',name:'裂项相消',tags:["def", "thm", "der", "app", "note"],brief:'将通项拆成两项之差，求和时中间项抵消。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将通项拆成两项之差，求和时中间项抵消。</p><div class="la-fml">$$\\frac{1}{n(n+1)}=\\frac{1}{n}-\\frac{1}{n+1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{1}{n(n+1)}=\\frac{1}{n}-\\frac{1}{n+1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>通分验证。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式数列求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>关键是正确裂项。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>求和技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到1/[n(n+k)]=1/k·(1/n-1/(n+k))。</p></section></div>`},{id:'elementary_math-c2s5-14',name:'错位相减',tags:["def", "der", "app", "note"],brief:'适用于等差数列×等比数列的求和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>适用于等差数列×等比数列的求和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>乘以公比后错位相减。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等差×等比数列求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>计算时注意项数和符号。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>求和技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等比数列求和即错位相减的特例。</p></section></div>`},{id:'elementary_math-c2s5-15',name:'数列递推',tags:["def", "thm", "der", "app", "note"],brief:'用递推关系定义的数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用递推关系定义的数列。</p><div class="la-fml">$$a_{n+1}=f(a_n)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_{n+1}=f(a_n)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由前项求后项。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>递推数列。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需要初始条件。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>递推是定义数列的重要方式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>线性递推数列（斐波那契等）。</p></section></div>`},{id:'elementary_math-c2s5-16',name:'斐波那契数列',tags:["def", "thm", "der", "app", "note"],brief:'从第三项起每项等于前两项之和的数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从第三项起每项等于前两项之和的数列。</p><div class="la-fml">$$F_n=F_{n-1}+F_{n-2},\\ F_1=F_2=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$F_n=F_{n-1}+F_{n-2},\\ F_1=F_2=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由递推关系定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>自然生长、黄金分割。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>1,1,2,3,5,8,13,21,...</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>斐波那契1202年研究兔子繁殖。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>通项可用黄金分割比表示。</p></section></div>`},{id:'elementary_math-c2s5-17',name:'等差数列判定',tags:["def", "der", "app", "note"],brief:'证明数列是等差数列的方法：定义法(aₙ₊₁-aₙ=d)、中项法(2aₙ₊₁=aₙ+aₙ₊₂)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>证明数列是等差数列的方法：定义法(aₙ₊₁-aₙ=d)、中项法(2aₙ₊₁=aₙ+aₙ₊₂)。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等差数列定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断数列类型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两种方法等价。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列判定。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>等比数列类似判定。</p></section></div>`},{id:'elementary_math-c2s5-18',name:'等比数列判定',tags:["def", "der", "app", "note"],brief:'证明数列是等比数列的方法：定义法(aₙ₊₁/aₙ=q)、中项法(aₙ₊₁²=aₙ·aₙ₊₂)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>证明数列是等比数列的方法：定义法(aₙ₊₁/aₙ=q)、中项法(aₙ₊₁²=aₙ·aₙ₊₂)。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等比数列定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断数列类型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意各项非零。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列判定。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与等差数列判定对偶。</p></section></div>`},{id:'elementary_math-c2s5-19',name:'数列通项求法',tags:["def", "der", "app", "note"],brief:'求数列通项的方法：观察法、累加累乘法、构造法、数学归纳法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>求数列通项的方法：观察法、累加累乘法、构造法、数学归纳法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>根据递推关系特点选择。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>由递推求通项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>aₙ₊₁=aₙ+f(n)用累加，aₙ₊₁=aₙ·f(n)用累乘。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>特征方程法解线性递推。</p></section></div>`},{id:'elementary_math-c2s5-20',name:'累加求通项',tags:["def", "thm", "der", "app", "note"],brief:'对aₙ₊₁-aₙ=f(n)型递推，累加求通项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对aₙ₊₁-aₙ=f(n)型递推，累加求通项。</p><div class="la-fml">$$a_n=a_1+\\sum_{k=1}^{n-1}(a_{k+1}-a_k)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1+\\sum_{k=1}^{n-1}(a_{k+1}-a_k)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>aₙ=a₁+(a₂-a₁)+(a₃-a₂)+...+(aₙ-aₙ₋₁)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求递推数列通项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需已知a₁。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>递推解法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对应离散微积分。</p></section></div>`},{id:'elementary_math-c2s5-21',name:'累乘求通项',tags:["def", "thm", "der", "app", "note"],brief:'对aₙ₊₁/aₙ=f(n)型递推，累乘求通项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对aₙ₊₁/aₙ=f(n)型递推，累乘求通项。</p><div class="la-fml">$$a_n=a_1\\cdot\\prod_{k=1}^{n-1}\\frac{a_{k+1}}{a_k}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1\\cdot\\prod_{k=1}^{n-1}\\frac{a_{k+1}}{a_k}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>aₙ=a₁·(a₂/a₁)·(a₃/a₂)·...·(aₙ/aₙ₋₁)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求递推数列通项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需已知a₁。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>递推解法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与累加法对偶。</p></section></div>`},{id:'elementary_math-c2s5-22',name:'构造法求通项',tags:["def", "der", "app", "note"],brief:'对非线性递推，通过变形构造等差或等比数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对非线性递推，通过变形构造等差或等比数列。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>如aₙ₊₁=paₙ+q，设aₙ₊₁+c=p(aₙ+c)构造等比。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求复杂递推通项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>关键是正确构造辅助数列。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>递推技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>特征方程法的特例。</p></section></div>`},{id:'elementary_math-c2s5-23',name:'数列极限概念',tags:["def", "thm", "der", "app", "note"],brief:'当n无限增大时，aₙ无限趋近于常数A。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>当n无限增大时，aₙ无限趋近于常数A。</p><div class="la-fml">$$\\lim_{n\\to\\infty}a_n=A$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lim_{n\\to\\infty}a_n=A$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由ε-N定义严格描述。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>微积分基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>极限存在则数列收敛，否则发散。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分析严格化。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>数列极限是函数极限的基础。</p></section></div>`},{id:'elementary_math-c2s5-24',name:'特征方程法',tags:["def", "der", "app", "note"],brief:'对aₙ₊₂=paₙ₊₁+qaₙ型递推，解特征方程x²=px+q。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对aₙ₊₂=paₙ₊₁+qaₙ型递推，解特征方程x²=px+q。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设aₙ=xⁿ代入递推得特征方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>二阶线性递推求通项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两根不等时aₙ=Ax₁ⁿ+Bx₂ⁿ。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>线性递推。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>重根时aₙ=(A+Bn)xⁿ。</p></section></div>`},{id:'elementary_math-c2s5-25',name:'不动点法求通项',tags:["def", "der", "app", "note"],brief:'对aₙ₊₁=f(aₙ)，求f(x)=x的不动点构造辅助数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对aₙ₊₁=f(aₙ)，求f(x)=x的不动点构造辅助数列。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不动点处递推可线性化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式线性递推。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>f(x)=(ax+b)/(cx+d)型常用。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>迭代理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与特征方程法相关。</p></section></div>`},{id:'elementary_math-c2s5-26',name:'数学归纳法',tags:["def", "der", "app", "note"],brief:'证明与正整数有关的命题的方法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>证明与正整数有关的命题的方法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>归纳基础+归纳递推。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数列命题、整除性证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两步缺一不可。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>皮亚诺公理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>第二数学归纳法、反向归纳法。</p></section></div>`},{id:'elementary_math-c2s5-27',name:'倒序相加求和',tags:["def", "der", "app", "note"],brief:'将数列倒序后与原式相加，利用对称性求和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将数列倒序后与原式相加，利用对称性求和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>如等差数列求和。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等差数列、组合数求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>高斯求和法。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>等差数列求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>C(n,k)的求和常用。</p></section></div>`},{id:'elementary_math-c2s5-28',name:'错位相减求和',tags:["def", "der", "app", "note"],brief:'等差×等比型数列求和方法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等差×等比型数列求和方法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>Sₙ减去qSₙ错位相减。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>aₙ=(an+b)qⁿ型求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意项数和系数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>乘公比错位相减。</p></section></div>`},{id:'elementary_math-c2s5-29',name:'裂项相消求和',tags:["def", "der", "app", "note"],brief:'将通项拆成两项之差，求和时中间项抵消。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将通项拆成两项之差，求和时中间项抵消。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>如1/[n(n+1)]=1/n-1/(n+1)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式数列求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>关键是正确裂项。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>根式、阶乘型也可裂项。</p></section></div>`},{id:'elementary_math-c2s5-30',name:'分组求和法',tags:["def", "der", "app", "note"],brief:'将数列分成若干组分别求和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将数列分成若干组分别求和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>如奇数项和偶数项分组。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>周期数列、分段数列求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>根据规律合理分组。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数列求和。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与并项求和类似。</p></section></div>`},{id:'elementary_math-c2s5-31',name:'数列与函数关系',tags:["def", "der", "app", "note"],brief:'数列是定义在正整数集上的特殊函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>数列是定义在正整数集上的特殊函数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>aₙ=f(n)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用函数观点研究数列。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>数列的单调性即函数单调性。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数与数列。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>数列极限与函数极限联系。</p></section></div>`}]}]},
{id:'elementary_math-ch3',num:'第三章',title:'几何',en:'GEOMETRY',sub:'向量 · 平面几何 · 立体几何 · 解析几何',desc:'从向量到平面、立体、解析几何，构建完整的几何体系。',sections:[{name:'3.1 平面向量',color:'#2563eb',desc:'向量运算、数量积',items:[{id:'elementary_math-c3s1-1',name:'向量定义',tags:["def", "der", "app", "note"],brief:'既有大小又有方向的量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>既有大小又有方向的量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>区别于只有大小的标量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>力、速度、位移等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>向量可用有向线段表示，与起点无关（自由向量）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量概念由力学引入。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维向量。</p></section></div>`},{id:'elementary_math-c3s1-2',name:'向量的模',tags:["def", "thm", "der", "app", "note"],brief:'向量的大小（长度）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量的大小（长度）。</p><div class="la-fml">$$|\\vec{a}|$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\vec{a}|$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>有向线段的长度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算向量长度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|a|≥0；|a|=0⟺a是零向量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量的数量特征。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到向量范数。</p></section></div>`},{id:'elementary_math-c3s1-3',name:'零向量',tags:["def", "thm", "der", "app", "note"],brief:'长度为0的向量，方向任意。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>长度为0的向量，方向任意。</p><div class="la-fml">$$\\vec{0}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{0}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由模为零定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量运算的单位元。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>零向量与任意向量平行；注意与实数0的区别。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>向量空间的零元。</p></section></div>`},{id:'elementary_math-c3s1-4',name:'单位向量',tags:["def", "thm", "der", "app", "note"],brief:'长度为1的向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>长度为1的向量。</p><div class="la-fml">$$|\\vec{a}|=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|\\vec{a}|=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由模为1定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示方向。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与a同向的单位向量为a/|a|。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方向的标准化表示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>标准基向量是特殊单位向量。</p></section></div>`},{id:'elementary_math-c3s1-5',name:'相等向量',tags:["def", "der", "app", "note"],brief:'长度相等且方向相同的向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>长度相等且方向相同的向量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由模和方向同时相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量比较。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与起点位置无关。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>自由向量的性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>向量空间的元素相等。</p></section></div>`},{id:'elementary_math-c3s1-6',name:'相反向量',tags:["def", "der", "app", "note"],brief:'长度相等方向相反的向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>长度相等方向相反的向量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由负向量定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量减法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a的相反向量是-a。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>加法逆元。</p></section></div>`},{id:'elementary_math-c3s1-7',name:'共线向量',tags:["def", "der", "app", "note"],brief:'方向相同或相反的非零向量，也叫平行向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>方向相同或相反的非零向量，也叫平行向量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方向关系定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断向量平行。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>零向量与任意向量共线。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量关系。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>两向量共线⟺存在λ使a=λb。</p></section></div>`},{id:'elementary_math-c3s1-8',name:'向量加法',tags:["def", "thm", "der", "app", "note"],brief:'向量加法满足三角形法则或平行四边形法则。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量加法满足三角形法则或平行四边形法则。</p><div class="la-fml">$$\\vec{a}+\\vec{b}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}+\\vec{b}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>几何作图或坐标运算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>力的合成、位移合成。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>满足交换律和结合律。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>由平行四边形法则确立。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>向量空间的加法。</p></section></div>`},{id:'elementary_math-c3s1-9',name:'三角形法则',tags:["def", "der", "app", "note"],brief:'首尾相接：将b的起点移到a的终点，则从a起点到b终点的向量为a+b。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>首尾相接：将b的起点移到a的终点，则从a起点到b终点的向量为a+b。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>几何作图。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量加法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>适用于多个向量相加（多边形法则）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量加法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n个向量。</p></section></div>`},{id:'elementary_math-c3s1-10',name:'平行四边形法则',tags:["def", "der", "app", "note"],brief:'共起点：以a,b为邻边作平行四边形，对角线向量为a+b。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>共起点：以a,b为邻边作平行四边形，对角线向量为a+b。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>几何作图。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>力的合成。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三角形法则和平行四边形法则等价。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>力的平行四边形法则。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>仅适用于两个向量。</p></section></div>`},{id:'elementary_math-c3s1-11',name:'向量减法',tags:["def", "thm", "der", "app", "note"],brief:'向量减法等于加上相反向量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量减法等于加上相反向量。</p><div class="la-fml">$$\\vec{a}-\\vec{b}=\\vec{a}+(-\\vec{b})$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}-\\vec{b}=\\vec{a}+(-\\vec{b})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由加法和负向量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>几何上：a-b是从b终点指向a终点的向量（共起点时）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>向量空间的减法。</p></section></div>`},{id:'elementary_math-c3s1-12',name:'数乘向量',tags:["def", "thm", "der", "app", "note"],brief:'实数λ与向量a的乘积，长度为|λ||a|，方向：λ>0同向，λ<0反向。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>实数λ与向量a的乘积，长度为|λ||a|，方向：λ>0同向，λ<0反向。</p><div class="la-fml">$$\\lambda\\vec{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lambda\\vec{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由缩放定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量缩放、共线判断。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>λ=0时为零向量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>向量空间的数乘。</p></section></div>`},{id:'elementary_math-c3s1-13',name:'向量共线定理',tags:["def", "thm", "der", "app", "note"],brief:'向量b与非零向量a共线当且仅当存在唯一实数λ使b=λa。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量b与非零向量a共线当且仅当存在唯一实数λ使b=λa。</p><div class="la-fml">$$\\vec{b}=\\lambda\\vec{a}\\ (\\vec{a}\\neq\\vec{0})$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{b}=\\lambda\\vec{a}\\ (\\vec{a}\\neq\\vec{0})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由共线定义和数乘。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断共线、求参数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a≠0是条件。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数基本定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到三维。</p></section></div>`},{id:'elementary_math-c3s1-14',name:'平面向量基本定理',tags:["def", "thm", "der", "app", "note"],brief:'若e₁,e₂不共线，则平面内任一向量a可唯一表示为a=λ₁e₁+λ₂e₂。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若e₁,e₂不共线，则平面内任一向量a可唯一表示为a=λ₁e₁+λ₂e₂。</p><div class="la-fml">$$\\vec{a}=\\lambda_1\\vec{e_1}+\\lambda_2\\vec{e_2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}=\\lambda_1\\vec{e_1}+\\lambda_2\\vec{e_2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平行四边形法则分解。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>建立坐标系、向量分解。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>e₁,e₂叫一组基底。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量坐标化的基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维空间的基。</p></section></div>`},{id:'elementary_math-c3s1-15',name:'向量坐标',tags:["def", "thm", "der", "app", "note"],brief:'在直角坐标系中，向量a=xi+yj，记作(x,y)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在直角坐标系中，向量a=xi+yj，记作(x,y)。</p><div class="la-fml">$$\\vec{a}=(x,y)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}=(x,y)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由基本定理取i,j为基底。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量运算坐标化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>坐标等于终点坐标减起点坐标。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数与解析几何结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维坐标向量。</p></section></div>`},{id:'elementary_math-c3s1-16',name:'向量坐标运算',tags:["def", "thm", "der", "app", "note"],brief:'向量加减对应坐标加减，数乘对应坐标数乘。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量加减对应坐标加减，数乘对应坐标数乘。</p><div class="la-fml">$$(x_1,y_1)\\pm(x_2,y_2)=(x_1\\pm x_2, y_1\\pm y_2)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(x_1,y_1)\\pm(x_2,y_2)=(x_1\\pm x_2, y_1\\pm y_2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由基本定理和运算律。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>向量计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>坐标运算使向量代数化。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>坐标法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维。</p></section></div>`},{id:'elementary_math-c3s1-17',name:'数量积',tags:["def", "thm", "der", "app", "note"],brief:'向量a,b的数量积（点积）等于模长乘积乘夹角余弦。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向量a,b的数量积（点积）等于模长乘积乘夹角余弦。</p><div class="la-fml">$$\\vec{a}\\cdot\\vec{b}=|\\vec{a}||\\vec{b}|\\cos\\theta$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}\\cdot\\vec{b}=|\\vec{a}||\\vec{b}|\\cos\\theta$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由投影定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求夹角、判断垂直、物理做功。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>数量积是标量；a·a=|a|²。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>向量代数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到内积空间。</p></section></div>`},{id:'elementary_math-c3s1-18',name:'数量积坐标公式',tags:["def", "thm", "der", "app", "note"],brief:'坐标形式的数量积等于对应坐标乘积之和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>坐标形式的数量积等于对应坐标乘积之和。</p><div class="la-fml">$$\\vec{a}\\cdot\\vec{b}=x_1x_2+y_1y_2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}\\cdot\\vec{b}=x_1x_2+y_1y_2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由i·i=j·j=1,i·j=0展开。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算数量积。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是计算夹角和模的基础。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>坐标法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n维：a·b=Σxᵢyᵢ。</p></section></div>`},{id:'elementary_math-c3s1-19',name:'向量垂直',tags:["def", "thm", "der", "app", "note"],brief:'两非零向量垂直当且仅当数量积为零。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两非零向量垂直当且仅当数量积为零。</p><div class="la-fml">$$\\vec{a}\\perp\\vec{b}\\Leftrightarrow\\vec{a}\\cdot\\vec{b}=0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\vec{a}\\perp\\vec{b}\\Leftrightarrow\\vec{a}\\cdot\\vec{b}=0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由a·b=|a||b|cosθ，θ=90°时cosθ=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断垂直。</p></section><sectio
