<script>
const LA_FIG = {  };
const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', note:'注 记', his:'背 景', ext:'拓 展'};
const LA_DATA = [
{id:'elementary_math-ch1',num:'第一章',title:'数与式子计算',en:'NUMBERS & ALGEBRAIC EXPRESSIONS',sub:'实数运算 · 指数对数 · 三角函数 · 式与方程 · 不等式',desc:'从实数系到代数式、方程与不等式，构建初等代数的完整运算体系。',sections:[{name:'1.1 实数系与运算律',color:'#2563eb',desc:'实数、绝对值、运算律',items:[{id:'elementary_math-c1s1-1',name:'自然数',tags:["def", "thm", "der", "app", "note"],brief:'自然数是计数的基础，包括0和正整数。在数论中有时不含0。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>自然数是计数的基础，包括0和正整数。在数论中有时不含0。</p><div class="la-fml">$$\\mathbb{N}=\\{0,1,2,\\dots\\}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathbb{N}=\\{0,1,2,\\dots\\}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由皮亚诺公理严格定义：0是自然数，每个自然数n有唯一后继n+1，归纳公理成立。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计数、排序、归纳法的基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>不同教材对0是否属于自然数有不同约定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>皮亚诺1889年给出公理系统。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到序数和基数。</p></section></div>`},{id:'elementary_math-c1s1-2',name:'整数',tags:["def", "thm", "der", "app", "note"],brief:'整数是自然数及其相反数构成的集合，对加减乘封闭。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>整数是自然数及其相反数构成的集合，对加减乘封闭。</p><div class="la-fml">$$\\mathbb{Z}=\\{\\dots,-2,-1,0,1,2,\\dots\\}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathbb{Z}=\\{\\dots,-2,-1,0,1,2,\\dots\\}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>在自然数集上添加负元，使减法封闭。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示盈亏、温度、方向等具有相反意义的量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>整数集是环（对加减乘封闭，除法不封闭）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>负数在公元7世纪由印度数学家引入。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>模n剩余类环。</p></section></div>`},{id:'elementary_math-c1s1-3',name:'有理数',tags:["def", "thm", "der", "app", "note"],brief:'有理数是可表为两个整数之比的数，包括整数和分数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有理数是可表为两个整数之比的数，包括整数和分数。</p><div class="la-fml">$$\\mathbb{Q}=\\{\\frac{p}{q}\\mid p,q\\in\\mathbb{Z}, q\\neq 0\\}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathbb{Q}=\\{\\frac{p}{q}\\mid p,q\\in\\mathbb{Z}, q\\neq 0\\}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>在整数环上构造分式域得到。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实际测量中的有限小数和循环小数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>有理数集可数（可与自然数一一对应）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古希腊毕达哥拉斯学派认为万物皆数（有理数）。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>p进数是有理数的另一种完备化。</p></section></div>`},{id:'elementary_math-c1s1-4',name:'无理数',tags:["def", "der", "app", "note"],brief:'不能表为两个整数之比的实数，即无限不循环小数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不能表为两个整数之比的实数，即无限不循环小数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>证明√2是无理数：设√2=p/q，推出p,q均为偶数，与既约矛盾。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>√2, π, e等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>无理数集不可数，比有理数多得多。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>公元前5世纪希帕索斯发现√2不可公度，动摇毕达哥拉斯学派。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>代数数与超越数的分类。</p></section></div>`},{id:'elementary_math-c1s1-5',name:'实数系',tags:["def", "thm", "der", "app", "note"],brief:'有理数与无理数的并集，构成完备有序域。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有理数与无理数的并集，构成完备有序域。</p><div class="la-fml">$$\\mathbb{R}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathbb{R}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由有理数经戴德金分割或柯西序列完备化得到。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>微积分与数学分析的基础数域。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>实数不可数但可定义，具有完备性（确界原理）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>19世纪戴德金、康托尔、魏尔斯特拉斯分别给出严格构造。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>实数的完备性等价于确界原理、单调有界定理、区间套定理、有限覆盖定理、柯西收敛准则。</p></section></div>`},{id:'elementary_math-c1s1-6',name:'数轴',tags:["def", "der", "app", "note"],brief:'规定了原点、正方向和单位长度的直线，实数与数轴上的点一一对应。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>规定了原点、正方向和单位长度的直线，实数与数轴上的点一一对应。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用实数的有序性和稠密性建立对应。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何直观表示实数，比较大小。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>稠密性：任意两个实数之间存在无穷多个实数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>笛卡尔创立解析几何时数与形结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到复平面和n维欧氏空间。</p></section></div>`},{id:'elementary_math-c1s1-7',name:'相反数',tags:["def", "thm", "der", "app", "note"],brief:'实数a的相反数是-a，满足a+(-a)=0。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>实数a的相反数是-a，满足a+(-a)=0。</p><div class="la-fml">$$a+(-a)=0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a+(-a)=0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由加法逆元的存在性定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简符号、去括号。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>0的相反数是0；互为相反数的两数和为0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>负数概念确立后自然产生。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>在抽象代数中即加法群的逆元。</p></section></div>`},{id:'elementary_math-c1s1-8',name:'绝对值',tags:["def", "thm", "der", "app", "note"],brief:'实数a的绝对值是数轴上表示a的点到原点的距离。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>实数a的绝对值是数轴上表示a的点到原点的距离。</p><div class="la-fml">$$|a|=\\begin{cases}a, & a\\geq 0 \\\\ -a, & a<0\\end{cases}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|a|=\\begin{cases}a, & a\\geq 0 \\\\ -a, & a<0\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离定义导出分段表达式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>距离度量、误差分析、不等式估计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|a-b|表示a,b两点间的距离；|a|≥0，等号当且仅当a=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分析学中描述邻域和极限的基础工具。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到向量的模、范数。</p></section></div>`},{id:'elementary_math-c1s1-9',name:'倒数',tags:["def", "thm", "der", "app", "note"],brief:'非零实数a的倒数是1/a，满足a·(1/a)=1。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>非零实数a的倒数是1/a，满足a·(1/a)=1。</p><div class="la-fml">$$a\\cdot\\frac{1}{a}=1\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a\\cdot\\frac{1}{a}=1\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由乘法逆元的存在性定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>除法转化为乘法、解方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>0没有倒数；倒数等于本身的数是±1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分数运算的基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>域中每个非零元有乘法逆元。</p></section></div>`},{id:'elementary_math-c1s1-10',name:'加法交换律',tags:["def", "thm", "der", "app", "note"],brief:'两个数相加，交换加数位置，和不变。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个数相加，交换加数位置，和不变。</p><div class="la-fml">$$a+b=b+a$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a+b=b+a$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实数域的公理直接给出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化加法运算、凑整。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>在矩阵乘法中不成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>运算基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>交换群（阿贝尔群）的定义特征。</p></section></div>`},{id:'elementary_math-c1s1-11',name:'加法结合律',tags:["def", "thm", "der", "app", "note"],brief:'三个数相加，先把前两个相加或先把后两个相加，和不变。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三个数相加，先把前两个相加或先把后两个相加，和不变。</p><div class="la-fml">$$(a+b)+c=a+(b+c)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(a+b)+c=a+(b+c)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>实数域公理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>灵活结合凑整简化计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>保证连加结果唯一。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>运算基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>半群只需结合律，不需要交换律。</p></section></div>`},{id:'elementary_math-c1s1-12',name:'乘法交换律',tags:["def", "thm", "der", "app", "note"],brief:'两个数相乘，交换因数位置，积不变。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个数相乘，交换因数位置，积不变。</p><div class="la-fml">$$ab=ba$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ab=ba$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>实数域公理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化乘法、约分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>矩阵乘法、向量叉乘不满足交换律。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>运算基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>非交换代数的研究对象。</p></section></div>`},{id:'elementary_math-c1s1-13',name:'乘法结合律',tags:["def", "thm", "der", "app", "note"],brief:'三个数相乘，先乘前两个或先乘后两个，积不变。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三个数相乘，先乘前两个或先乘后两个，积不变。</p><div class="la-fml">$$(ab)c=a(bc)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(ab)c=a(bc)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>实数域公理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>灵活结合凑整简化计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>保证连乘结果唯一。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>运算基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>结合代数的基础。</p></section></div>`},{id:'elementary_math-c1s1-14',name:'分配律',tags:["def", "thm", "der", "app", "note"],brief:'一个数乘两个数的和，等于这个数分别乘这两个数再相加。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一个数乘两个数的和，等于这个数分别乘这两个数再相加。</p><div class="la-fml">$$a(b+c)=ab+ac$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a(b+c)=ab+ac$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>实数域公理，连接加法与乘法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>整式乘法、因式分解、简便运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是连接加法和乘法的唯一桥梁。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>运算基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>环的定义特征之一。</p></section></div>`},{id:'elementary_math-c1s1-15',name:'实数大小比较',tags:["def", "der", "app", "note"],brief:'数轴上右边的数总比左边的大；正数>0>负数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>数轴上右边的数总比左边的大；正数>0>负数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用有序域的序关系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>比较大小、解不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|a|>|b|等价于a²>b²（对实数成立）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>有序域的基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复数没有自然的大小关系。</p></section></div>`},{id:'elementary_math-c1s1-16',name:'科学记数法',tags:["def", "thm", "der", "app", "note"],brief:'把一个数写成a×10ⁿ的形式，其中1≤|a|<10。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把一个数写成a×10ⁿ的形式，其中1≤|a|<10。</p><div class="la-fml">$$a\\times 10^n\\ (1\\leq|a|<10)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a\\times 10^n\\ (1\\leq|a|<10)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用10的幂次缩放。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示极大或极小数，如光速3×10⁸m/s。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>n为整数，确定n的方法是数小数点移动位数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>科学计算中标准化表示。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>浮点表示法的原型。</p></section></div>`},{id:'elementary_math-c1s1-17',name:'有效数字',tags:["def", "der", "app", "note"],brief:'从左边第一个非零数字起，到末位数字止的所有数字。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从左边第一个非零数字起，到末位数字止的所有数字。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由测量精度决定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示近似值的精度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>0在中间和末尾都算有效数字，如0.0120有3位有效数字。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>误差分析基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>相对误差与有效数字位数的关系。</p></section></div>`},{id:'elementary_math-c1s1-18',name:'实数的稠密性',tags:["def", "der", "app", "note"],brief:'任意两个不相等的实数之间，存在无穷多个有理数和无理数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任意两个不相等的实数之间，存在无穷多个有理数和无理数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用区间套或直接构造中间值。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>极限存在性的基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>稠密但不完备（有理数不完备，实数完备）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>分析严格化的关键概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>完备性是实数区别于有理数的本质。</p></section></div>`},{id:'elementary_math-c1s1-19',name:'确界原理',tags:["def", "thm", "der", "app", "note"],brief:'非空有上界的实数集必有上确界（最小上界）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>非空有上界的实数集必有上确界（最小上界）。</p><div class="la-fml">$$\\forall S\\subseteq\\mathbb{R}, S\\neq\\varnothing, S\\text{有上界}\\Rightarrow\\exists\\sup S$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\forall S\\subseteq\\mathbb{R}, S\\neq\\varnothing, S\\text{有上界}\\Rightarrow\\exists\\sup S$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>实数完备性的等价表述，由戴德金分割证明。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明极限存在、最值定理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>确界可能属于集合也可能不属于。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>实数完备性的核心定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>确界原理与单调有界、区间套、有限覆盖、柯西准则等价。</p></section></div>`},{id:'elementary_math-c1s1-20',name:'运算顺序',tags:["def", "der", "app", "note"],brief:'先乘方开方，再乘除，最后加减；有括号先算括号内。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>先乘方开方，再乘除，最后加减；有括号先算括号内。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>约定运算优先级避免歧义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>所有数值计算的基础规则。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>同级运算从左到右。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>长期形成的约定。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>表达式求值的语法分析。</p></section></div>`},{id:'elementary_math-c1s1-21',name:'复数概念',tags:["def", "thm", "der", "app", "note"],brief:'实数的扩充，由实部a和虚部b组成。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>实数的扩充，由实部a和虚部b组成。</p><div class="la-fml">$$z=a+bi\\ (a,b\\in\\mathbb{R},\\ i^2=-1)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$z=a+bi\\ (a,b\\in\\mathbb{R},\\ i^2=-1)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>为使x²=-1有解而引入虚数单位i。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解方程、电学、信号处理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a=实部，b=虚部；b=0时为实数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>卡尔达诺、欧拉系统使用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复数域是代数闭域。</p></section></div>`}]},{name:'1.2 乘方与开方',color:'#7c3aed',desc:'幂运算、根式',items:[{id:'elementary_math-c1s2-1',name:'乘方',tags:["def", "thm", "der", "app", "note"],brief:'n个相同因数a相乘的积，记作aⁿ，a叫底数，n叫指数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n个相同因数a相乘的积，记作aⁿ，a叫底数，n叫指数。</p><div class="la-fml">$$a^n=\\underbrace{a\\cdot a\\cdots a}_{n\\text{个}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^n=\\underbrace{a\\cdot a\\cdots a}_{n\\text{个}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由乘法的重复运算定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>面积体积、增长率、科学记数法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a⁰=1(a≠0)；a⁻ⁿ=1/aⁿ。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代已有幂的概念，符号由笛卡尔确立。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到实数指数幂和复指数。</p></section></div>`},{id:'elementary_math-c1s2-2',name:'同底数幂乘法',tags:["def", "thm", "der", "app", "note"],brief:'同底数幂相乘，底数不变，指数相加。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同底数幂相乘，底数不变，指数相加。</p><div class="la-fml">$$a^m\\cdot a^n=a^{m+n}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^m\\cdot a^n=a^{m+n}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>aᵐ·aⁿ = (m个a相乘)·(n个a相乘) = (m+n)个a相乘 = aᵐ⁺ⁿ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简幂的运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a≠0时对整数m,n成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>指数运算基本律。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>群的指数律。</p></section></div>`},{id:'elementary_math-c1s2-3',name:'同底数幂除法',tags:["def", "thm", "der", "app", "note"],brief:'同底数幂相除，底数不变，指数相减。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同底数幂相除，底数不变，指数相减。</p><div class="la-fml">$$a^m\\div a^n=a^{m-n}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^m\\div a^n=a^{m-n}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>aᵐ/aⁿ = aᵐ·a⁻ⁿ = aᵐ⁻ⁿ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简幂的运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a≠0，结果指数可为负。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>指数运算基本律。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>定义了负整数指数幂。</p></section></div>`},{id:'elementary_math-c1s2-4',name:'幂的乘方',tags:["def", "thm", "der", "app", "note"],brief:'幂的乘方，底数不变，指数相乘。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>幂的乘方，底数不变，指数相乘。</p><div class="la-fml">$$(a^m)^n=a^{mn}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(a^m)^n=a^{mn}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>(aᵐ)ⁿ = n个aᵐ相乘 = aᵐ⁺ᵐ⁺…⁺ᵐ(n个) = aᵐⁿ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简幂的运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与积的乘方区分。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>指数运算基本律。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>矩阵幂的类似性质。</p></section></div>`},{id:'elementary_math-c1s2-5',name:'积的乘方',tags:["def", "thm", "der", "app", "note"],brief:'积的乘方等于各因数分别乘方的积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>积的乘方等于各因数分别乘方的积。</p><div class="la-fml">$$(ab)^n=a^n b^n$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(ab)^n=a^n b^n$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>(ab)ⁿ = ab·ab·…·ab(n个) = (a·a·…·a)(b·b·…·b) = aⁿbⁿ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简幂的运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>(a+b)ⁿ≠aⁿ+bⁿ（n>1时）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>指数运算基本律。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>交换环中成立。</p></section></div>`},{id:'elementary_math-c1s2-6',name:'商的乘方',tags:["def", "thm", "der", "app", "note"],brief:'商的乘方等于分子分母分别乘方的商。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>商的乘方等于分子分母分别乘方的商。</p><div class="la-fml">$$\\left(\\frac{a}{b}\\right)^n=\\frac{a^n}{b^n}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\left(\\frac{a}{b}\\right)^n=\\frac{a^n}{b^n}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>(a/b)ⁿ = (a·b⁻¹)ⁿ = aⁿ·b⁻ⁿ = aⁿ/bⁿ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简分式的幂。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>b≠0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>指数运算基本律。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>域中成立。</p></section></div>`},{id:'elementary_math-c1s2-7',name:'零指数幂',tags:["def", "thm", "der", "app", "note"],brief:'任何非零数的零次幂等于1。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>任何非零数的零次幂等于1。</p><div class="la-fml">$$a^0=1\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^0=1\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由aᵐ÷aᵐ=aᵐ⁻ᵐ=a⁰=1(a≠0)导出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一指数运算律。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>0⁰无定义（不定式）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>为使指数律在m=n时也成立。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>组合数学中0⁰约定为1。</p></section></div>`},{id:'elementary_math-c1s2-8',name:'负整数指数幂',tags:["def", "thm", "der", "app", "note"],brief:'非零数的负整数次幂等于其正整数次幂的倒数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>非零数的负整数次幂等于其正整数次幂的倒数。</p><div class="la-fml">$$a^{-n}=\\frac{1}{a^n}\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^{-n}=\\frac{1}{a^n}\\ (a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由a⁰÷aⁿ=a⁻ⁿ=1/aⁿ导出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示小数、科学记数法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a≠0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>指数律推广到负指数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>群中逆元的幂表示。</p></section></div>`},{id:'elementary_math-c1s2-9',name:'平方根',tags:["def", "thm", "der", "app", "note"],brief:'若x²=a，则x叫a的平方根，记作±√a。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若x²=a，则x叫a的平方根，记作±√a。</p><div class="la-fml">$$x^2=a\\Rightarrow x=\\pm\\sqrt{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x^2=a\\Rightarrow x=\\pm\\sqrt{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>乘方的逆运算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解方程、距离计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a≥0时才有实平方根；√a表示算术平方根（非负）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代已知开平方。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复数中负数也有平方根。</p></section></div>`},{id:'elementary_math-c1s2-10',name:'算术平方根',tags:["def", "thm", "der", "app", "note"],brief:'非负数a的非负平方根叫算术平方根。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>非负数a的非负平方根叫算术平方根。</p><div class="la-fml">$$\\sqrt{a}\\geq 0\\ (a\\geq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sqrt{a}\\geq 0\\ (a\\geq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>在平方根中取非负的那个。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>距离公式、二次根式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>√a有双重非负性：a≥0且√a≥0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>区分正负根的需要。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般n次算术根。</p></section></div>`},{id:'elementary_math-c1s2-11',name:'立方根',tags:["def", "thm", "der", "app", "note"],brief:'若x³=a，则x叫a的立方根，记作∛a。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若x³=a，则x叫a的立方根，记作∛a。</p><div class="la-fml">$$x^3=a\\Rightarrow x=\\sqrt[3]{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x^3=a\\Rightarrow x=\\sqrt[3]{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>乘方的逆运算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>体积计算、解方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>实数都有唯一实立方根，符号与被开方数相同。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代已知开立方。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>奇数次方根的唯一性。</p></section></div>`},{id:'elementary_math-c1s2-12',name:'n次方根',tags:["def", "thm", "der", "app", "note"],brief:'若xⁿ=a，则x叫a的n次方根。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若xⁿ=a，则x叫a的n次方根。</p><div class="la-fml">$$x^n=a\\Rightarrow x=\\sqrt[n]{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x^n=a\\Rightarrow x=\\sqrt[n]{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>乘方的逆运算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解高次方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>n奇：唯一实根；n偶：a≥0时有两个实根±ⁿ√a，a<0时无实根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>根式理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复数域中恒有n个n次方根。</p></section></div>`},{id:'elementary_math-c1s2-13',name:'根式的性质',tags:["def", "thm", "der", "app", "note"],brief:'n次根号下a的n次方，偶次取绝对值，奇次取本身。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n次根号下a的n次方，偶次取绝对值，奇次取本身。</p><div class="la-fml">$$\\sqrt[n]{a^n}=\\begin{cases}|a|, & n\\text{偶} \\\\ a, & n\\text{奇}\\end{cases}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sqrt[n]{a^n}=\\begin{cases}|a|, & n\\text{偶} \\\\ a, & n\\text{奇}\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由n次方根的定义直接导出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>根式化简。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意偶次根式结果非负。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>根式运算基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>ⁿ√(ab)=ⁿ√a·ⁿ√b（a,b≥0,n偶时）。</p></section></div>`},{id:'elementary_math-c1s2-14',name:'分数指数幂',tags:["def", "thm", "der", "app", "note"],brief:'分数指数幂m/n表示开n次方再乘m次方（或反之）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分数指数幂m/n表示开n次方再乘m次方（或反之）。</p><div class="la-fml">$$a^{m/n}=\\sqrt[n]{a^m}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^{m/n}=\\sqrt[n]{a^m}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>要求(a^{1/n})ⁿ=a，故a^{1/n}=ⁿ√a。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统一根式与幂的运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>0时对一切有理数指数成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧拉系统引入分数指数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到实数指数幂（用极限）。</p></section></div>`},{id:'elementary_math-c1s2-15',name:'无理数指数幂',tags:["def", "thm", "der", "app", "note"],brief:'无理数指数幂通过有理数指数幂的极限定义。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>无理数指数幂通过有理数指数幂的极限定义。</p><div class="la-fml">$$a^\\alpha=\\lim_{q\\to\\alpha}a^q\\ (a>0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^\\alpha=\\lim_{q\\to\\alpha}a^q\\ (a>0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用确界或极限定义，保证指数函数连续。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>指数函数、对数函数的定义域扩张。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>要求底数a>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>实数完备性使定义成为可能。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复指数幂与欧拉公式。</p></section></div>`},{id:'elementary_math-c1s2-16',name:'平方差公式',tags:["def", "thm", "der", "app", "note"],brief:'两数平方差等于两数和与差的积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两数平方差等于两数和与差的积。</p><div class="la-fml">$$a^2-b^2=(a+b)(a-b)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^2-b^2=(a+b)(a-b)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>(a+b)(a-b)=a²-ab+ab-b²=a²-b²。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>因式分解、简便计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>最基本的乘法公式之一。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古希腊几何代数中已有。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>平方和无类似实分解。</p></section></div>`},{id:'elementary_math-c1s2-17',name:'完全平方公式',tags:["def", "thm", "der", "app", "note"],brief:'两数和（差）的平方等于平方和加（减）两倍积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两数和（差）的平方等于平方和加（减）两倍积。</p><div class="la-fml">$$(a\\pm b)^2=a^2\\pm 2ab+b^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(a\\pm b)^2=a^2\\pm 2ab+b^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>(a+b)²=(a+b)(a+b)=a²+ab+ab+b²=a²+2ab+b²。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>因式分解、配方法、二次函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>中间项符号与左边一致。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代几何证明（面积法）。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二项式定理的特例。</p></section></div>`},{id:'elementary_math-c1s2-18',name:'完全立方公式',tags:["def", "thm", "der", "app", "note"],brief:'两数和（差）的立方展开式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两数和（差）的立方展开式。</p><div class="la-fml">$$(a\\pm b)^3=a^3\\pm 3a^2b+3ab^2\\pm b^3$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(a\\pm b)^3=a^3\\pm 3a^2b+3ab^2\\pm b^3$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>(a+b)³=(a+b)(a+b)²=(a+b)(a²+2ab+b²)=a³+3a²b+3ab²+b³。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>因式分解、展开。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>符号正负交替。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>二项式定理的特例。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二项式定理：(a+b)ⁿ=∑C(n,k)aⁿ⁻ᵏbᵏ。</p></section></div>`},{id:'elementary_math-c1s2-19',name:'立方和差公式',tags:["def", "thm", "der", "app", "note"],brief:'两数立方和（差）分解公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两数立方和（差）分解公式。</p><div class="la-fml">$$a^3\\pm b^3=(a\\pm b)(a^2\\mp ab+b^2)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^3\\pm b^3=(a\\pm b)(a^2\\mp ab+b^2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>验证：(a+b)(a²-ab+b²)=a³+b³，直接展开。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>因式分解。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意中间项符号与左边相反。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>代数基本恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>n次幂和差的分解。</p></section></div>`}]},{name:'1.3 指数与对数',color:'#0f766e',desc:'指数函数、对数运算',items:[{id:'elementary_math-c1s3-1',name:'指数函数',tags:["def", "thm", "der", "app", "note"],brief:'以常数a为底数、自变量x为指数的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>以常数a为底数、自变量x为指数的函数。</p><div class="la-fml">$$y=a^x\\ (a>0, a\\neq 1)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=a^x\\ (a>0, a\\neq 1)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实数指数幂定义，要求a>0保证对所有实数x有意义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>指数增长/衰减模型、复利计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>1时递增，0<a<1时递减；恒过(0,1)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧拉深入研究指数函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>eˣ是最重要的指数函数，其导数等于自身。</p></section></div>`},{id:'elementary_math-c1s3-2',name:'指数函数性质',tags:["def", "der", "app", "note"],brief:'指数函数y=aˣ的定义域R，值域(0,+∞)，恒过(0,1)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>指数函数y=aˣ的定义域R，值域(0,+∞)，恒过(0,1)。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由aˣ>0和a⁰=1导出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解指数方程、指数不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>1时x→-∞,y→0⁺；0<a<1时x→+∞,y→0⁺。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数性质研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>指数函数是微分方程y'=y的解。</p></section></div>`},{id:'elementary_math-c1s3-3',name:'对数的定义',tags:["def", "thm", "der", "app", "note"],brief:'若aᵇ=N(a>0,a≠1)，则b叫以a为底N的对数，记作logₐN。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若aᵇ=N(a>0,a≠1)，则b叫以a为底N的对数，记作logₐN。</p><div class="la-fml">$$a^b=N\\Leftrightarrow\\log_a N=b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^b=N\\Leftrightarrow\\log_a N=b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>指数运算的逆运算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化乘除为加减、简化计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>N>0（真数必须为正）；logₐ1=0，logₐa=1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>纳皮尔1614年发明对数，极大简化天文计算。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对数将乘法群同构到加法群。</p></section></div>`},{id:'elementary_math-c1s3-4',name:'常用对数与自然对数',tags:["def", "thm", "der", "app", "note"],brief:'以10为底的对数叫常用对数(lg)，以e为底的叫自然对数(ln)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>以10为底的对数叫常用对数(lg)，以e为底的叫自然对数(ln)。</p><div class="la-fml">$$\\lg N=\\log_{10}N,\\ \\ln N=\\log_e N$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\lg N=\\log_{10}N,\\ \\ln N=\\log_e N$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>选择便于计算的底数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>常用对数用于数量级；自然对数用于微积分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>e≈2.71828，是最重要的数学常数之一。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>布里格斯推广常用对数；自然对数因导数简单而得名。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>换底公式可在任意底数间转换。</p></section></div>`},{id:'elementary_math-c1s3-5',name:'对数运算法则',tags:["def", "thm", "der", "app", "note"],brief:'积的对数等于对数的和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>积的对数等于对数的和。</p><div class="la-fml">$$\\log_a(MN)=\\log_a M+\\log_a N$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\log_a(MN)=\\log_a M+\\log_a N$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设logₐM=p, logₐN=q，则M=aᵖ,N=aᵠ，MN=aᵖ⁺ᵠ，故logₐ(MN)=p+q。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化乘为加，简化计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>M,N>0；logₐ(M+N)≠logₐM+logₐN。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数的核心价值所在。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对数是乘法群到加法群的同构。</p></section></div>`},{id:'elementary_math-c1s3-6',name:'商的对数',tags:["def", "thm", "der", "app", "note"],brief:'商的对数等于对数的差。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>商的对数等于对数的差。</p><div class="la-fml">$$\\log_a\\frac{M}{N}=\\log_a M-\\log_a N$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\log_a\\frac{M}{N}=\\log_a M-\\log_a N$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>类似积的对数，利用aᵖ/aᵠ=aᵖ⁻ᵠ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化除为减。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>M,N>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对数的群同构性质。</p></section></div>`},{id:'elementary_math-c1s3-7',name:'幂的对数',tags:["def", "thm", "der", "app", "note"],brief:'幂的对数等于指数乘以底数的对数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>幂的对数等于指数乘以底数的对数。</p><div class="la-fml">$$\\log_a M^n=n\\log_a M$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\log_a M^n=n\\log_a M$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设logₐM=p，则M=aᵖ，Mⁿ=aⁿᵖ，故logₐMⁿ=np=nlogₐM。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>将幂运算降为乘法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对一切实数n成立（M>0）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数基本性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>导数(lnx)'=1/x的代数根源。</p></section></div>`},{id:'elementary_math-c1s3-8',name:'换底公式',tags:["def", "thm", "der", "app", "note"],brief:'对数可在任意两个底数间转换。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对数可在任意两个底数间转换。</p><div class="la-fml">$$\\log_a b=\\frac{\\log_c b}{\\log_c a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\log_a b=\\frac{\\log_c b}{\\log_c a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设logₐb=x，则aˣ=b，两边取以c为底的对数：xlogₐc... 即x=log_c b/log_c a。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计算不同底数的对数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>常用推论：logₐb·log_b a=1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数计算的核心公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到多个底数的链式转换。</p></section></div>`},{id:'elementary_math-c1s3-9',name:'对数函数',tags:["def", "thm", "der", "app", "note"],brief:'指数函数y=aˣ的反函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>指数函数y=aˣ的反函数。</p><div class="la-fml">$$y=\\log_a x\\ (a>0, a\\neq 1)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\log_a x\\ (a>0, a\\neq 1)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数定义，定义域(0,+∞)，值域R。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数据压缩（分贝、里氏震级）、求解指数方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>1时递增，0<a<1时递减；恒过(1,0)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数函数与指数函数互为反函数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>lnx的导数为1/x，是微积分的基础。</p></section></div>`},{id:'elementary_math-c1s3-10',name:'对数函数性质',tags:["def", "der", "app", "note"],brief:'对数函数y=logₐx定义域(0,+∞)，值域R，恒过(1,0)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对数函数y=logₐx定义域(0,+∞)，值域R，恒过(1,0)。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由指数函数性质反推。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解对数方程、对数不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>1时x→0⁺,y→-∞；0<a<1时x→0⁺,y→+∞。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对数函数增长极慢。</p></section></div>`},{id:'elementary_math-c1s3-11',name:'指数方程',tags:["def", "thm", "der", "app", "note"],brief:'底数相同的指数方程可化为指数相等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>底数相同的指数方程可化为指数相等。</p><div class="la-fml">$$a^{f(x)}=a^{g(x)}\\Leftrightarrow f(x)=g(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^{f(x)}=a^{g(x)}\\Leftrightarrow f(x)=g(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>指数函数单调，故aᵘ=aᵛ⟺u=v。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解含指数的方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>底数不同时取对数化为代数方程。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>超越方程的基本类型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>数值方法求解一般指数方程。</p></section></div>`},{id:'elementary_math-c1s3-12',name:'对数方程',tags:["def", "thm", "der", "app", "note"],brief:'底数相同的对数方程可化为真数相等且为正。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>底数相同的对数方程可化为真数相等且为正。</p><div class="la-fml">$$\\log_a f(x)=\\log_a g(x)\\Leftrightarrow f(x)=g(x)>0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\log_a f(x)=\\log_a g(x)\\Leftrightarrow f(x)=g(x)>0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对数函数单调且定义域为正。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解含对数的方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须验根，确保真数>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>超越方程的基本类型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对数方程的增根问题。</p></section></div>`},{id:'elementary_math-c1s3-13',name:'指数不等式',tags:["def", "thm", "der", "app", "note"],brief:'解指数不等式时需讨论底数a与1的大小关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解指数不等式时需讨论底数a与1的大小关系。</p><div class="la-fml">$$a^{f(x)}>a^{g(x)}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^{f(x)}>a^{g(x)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>a>1时指数函数递增，不等号方向不变；0<a<1时递减，不等号反向。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解指数不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意底数分类讨论。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>单调性的应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般超越不等式的解法。</p></section></div>`},{id:'elementary_math-c1s3-14',name:'对数不等式',tags:["def", "thm", "der", "app", "note"],brief:'解对数不等式时需讨论底数并保证真数为正。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解对数不等式时需讨论底数并保证真数为正。</p><div class="la-fml">$$\\log_a f(x)>\\log_a g(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\log_a f(x)>\\log_a g(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对数函数单调性+定义域限制。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解对数不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必须同时满足真数>0和单调性条件。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>单调性的应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>定义域优先原则。</p></section></div>`},{id:'elementary_math-c1s3-15',name:'指数对数互化',tags:["def", "thm", "der", "app", "note"],brief:'指数式与对数式可互相转化。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>指数式与对数式可互相转化。</p><div class="la-fml">$$a^b=N\\Leftrightarrow b=\\log_a N$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^b=N\\Leftrightarrow b=\\log_a N$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对数的定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>沟通指数与对数运算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>转化时注意a>0,a≠1,N>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数的本质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>对数是指数的逆运算。</p></section></div>`},{id:'elementary_math-c1s3-16',name:'对数恒等式',tags:["def", "thm", "der", "app", "note"],brief:'对数与指数互逆的恒等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对数与指数互逆的恒等式。</p><div class="la-fml">$$a^{\\log_a N}=N,\\ \\log_a a^N=N$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^{\\log_a N}=N,\\ \\log_a a^N=N$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>直接由对数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简指数对数混合表达式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>a>0,a≠1,N>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>对数基本恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>反函数复合的一般性质。</p></section></div>`},{id:'elementary_math-c1s3-17',name:'自然指数e',tags:["def", "thm", "der", "app", "note"],brief:'自然对数的底数，一个超越数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>自然对数的底数，一个超越数。</p><div class="la-fml">$$e=\\lim_{n\\to\\infty}\\left(1+\\frac{1}{n}\\right)^n\\approx 2.71828$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$e=\\lim_{n\\to\\infty}\\left(1+\\frac{1}{n}\\right)^n\\approx 2.71828$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由复利极限或级数∑1/n!定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>微积分、指数增长模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>e是无理数也是超越数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧拉深入研究，命名为e。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>e^(iπ)+1=0（欧拉恒等式）。</p></section></div>`},{id:'elementary_math-c1s3-18',name:'复利与连续复利',tags:["def", "thm", "der", "app", "note"],brief:'离散复利在n→∞时趋于连续复利Peʳᵗ。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>离散复利在n→∞时趋于连续复利Peʳᵗ。</p><div class="la-fml">$$A=P\\left(1+\\frac{r}{n}\\right)^{nt}\\xrightarrow{n\\to\\infty}Pe^{rt}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$A=P\\left(1+\\frac{r}{n}\\right)^{nt}\\xrightarrow{n\\to\\infty}Pe^{rt}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用lim(1+r/n)ⁿ=eʳ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>金融利息计算、人口增长模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>连续复利是指数增长模型。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>伯努利研究复利时发现e。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>指数增长/衰减微分方程dA/dt=rA的解。</p></section></div>`},{id:'elementary_math-c1s3-19',name:'指数函数图象变换',tags:["def", "thm", "der", "app", "note"],brief:'指数函数y=aˣ平移h右k上得到y=a^(x-h)+k。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>指数函数y=aˣ平移h右k上得到y=a^(x-h)+k。</p><div class="la-fml">$$y=a^{x-h}+k$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=a^{x-h}+k$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数图象平移规律。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>绘制指数型函数图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>h>0右移，k>0上移。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与对数函数图象关于y=x对称。</p></section></div>`},{id:'elementary_math-c1s3-20',name:'对数函数图象变换',tags:["def", "thm", "der", "app", "note"],brief:'对数函数y=logₐx平移h右k上。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对数函数y=logₐx平移h右k上。</p><div class="la-fml">$$y=\\log_a(x-h)+k$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\log_a(x-h)+k$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数图象平移规律。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>绘制对数型函数图象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义域受平移影响：x>h。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>函数变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>渐近线也随之平移。</p></section></div>`},{id:'elementary_math-c1s3-21',name:'指数方程换元法',tags:["def", "der", "app", "note"],brief:'对形如a^(2x)+b·aˣ+c=0的方程，令t=aˣ化为二次方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对形如a^(2x)+b·aˣ+c=0的方程，令t=aˣ化为二次方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令t=aˣ>0，原方程变为t²+bt+c=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解复合指数方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意t>0的限制，负根要舍去。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>换元法应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>也适用于对数方程。</p></section></div>`},{id:'elementary_math-c1s3-22',name:'对数方程换元法',tags:["def", "der", "app", "note"],brief:'对形如(logₐx)²+b·logₐx+c=0的方程，令t=logₐx化为二次方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对形如(logₐx)²+b·logₐx+c=0的方程，令t=logₐx化为二次方程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令t=logₐx，原方程变为t²+bt+c=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解复合对数方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>解得t后再求x，注意真数>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>换元法应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与指数方程换元对偶。</p></section></div>`},{id:'elementary_math-c1s3-23',name:'指对数混合方程',tags:["def", "der", "app", "note"],brief:'同时含指数和对数的方程，常需两边取对数或指数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同时含指数和对数的方程，常需两边取对数或指数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>利用指对互化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解超越方程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意定义域和验根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>超越方程。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般需数值方法求解。</p></section></div>`}]},{name:'1.4 三角函数',color:'#c2410c',desc:'六大三角函数、恒等式',items:[{id:'elementary_math-c1s4-1',name:'角的概念与弧度制',tags:["def", "thm", "der", "app", "note"],brief:'角由一条射线绕端点旋转形成，弧度制用弧长与半径之比度量角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>角由一条射线绕端点旋转形成，弧度制用弧长与半径之比度量角。</p><div class="la-fml">$$\\theta(\\text{rad})=\\frac{\\pi}{180^\\circ}\\theta(^\\circ)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\theta(\\text{rad})=\\frac{\\pi}{180^\\circ}\\theta(^\\circ)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>弧长l=rθ，故θ=l/r；整圆2πr对应2π弧度=360°。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>高等数学中统一使用弧度制。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>180°=π rad；1°=π/180 rad。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>弧度制由欧拉正式引入。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>弧度无量纲，使三角函数导数公式简洁。</p></section></div>`},{id:'elementary_math-c1s4-2',name:'任意角',tags:["def", "der", "app", "note"],brief:'按逆时针旋转为正角，顺时针为负角，未旋转为零角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>按逆时针旋转为正角，顺时针为负角，未旋转为零角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>推广角的概念到任意实数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>表示旋转方向和周期运动。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>终边相同的角相差360°的整数倍。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>从0°~360°推广到全体实数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>角的集合与实数集一一对应。</p></section></div>`},{id:'elementary_math-c1s4-3',name:'象限角',tags:["def", "der", "app", "note"],brief:'终边落在第几象限就叫第几象限角，终边在坐标轴上叫轴线角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>终边落在第几象限就叫第几象限角，终边在坐标轴上叫轴线角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由终边位置定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断三角函数符号。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>终边相同角：α+k·360°(k∈Z)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>坐标系中角的分类。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>各象限角的三角函数符号规律。</p></section></div>`},{id:'elementary_math-c1s4-4',name:'正弦函数',tags:["def", "thm", "der", "app", "note"],brief:'在角α终边上任取一点P(x,y)，r=√(x²+y²)，则sinα=y/r。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在角α终边上任取一点P(x,y)，r=√(x²+y²)，则sinα=y/r。</p><div class="la-fml">$$\\sin\\alpha=\\frac{y}{r}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\alpha=\\frac{y}{r}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>锐角情形对边/斜边，推广到任意角。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>周期性、波动、交流电。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>值域[-1,1]，周期2π。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代天文学中已有正弦表。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>sinx=(e^(ix)-e^(-ix))/(2i)（欧拉公式）。</p></section></div>`},{id:'elementary_math-c1s4-5',name:'余弦函数',tags:["def", "thm", "der", "app", "note"],brief:'角α的余弦为邻边比斜边（推广：x/r）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>角α的余弦为邻边比斜边（推广：x/r）。</p><div class="la-fml">$$\\cos\\alpha=\\frac{x}{r}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cos\\alpha=\\frac{x}{r}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>周期运动、投影。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>值域[-1,1]，周期2π，偶函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>余角的正弦。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>cosx=(e^(ix)+e^(-ix))/2。</p></section></div>`},{id:'elementary_math-c1s4-6',name:'正切函数',tags:["def", "thm", "der", "app", "note"],brief:'角α的正切为对边比邻边（推广：y/x）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>角α的正切为对边比邻边（推广：y/x）。</p><div class="la-fml">$$\\tan\\alpha=\\frac{y}{x}=\\frac{\\sin\\alpha}{\\cos\\alpha}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\tan\\alpha=\\frac{y}{x}=\\frac{\\sin\\alpha}{\\cos\\alpha}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由正弦余弦之比定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>斜率、仰角俯角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义域x≠π/2+kπ，周期π，奇函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>与坡度直接相关。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>正切函数在每个周期内单调递增。</p></section></div>`},{id:'elementary_math-c1s4-7',name:'余切函数',tags:["def", "thm", "der", "app", "note"],brief:'角α的余切为邻边比对边。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>角α的余切为邻边比对边。</p><div class="la-fml">$$\\cot\\alpha=\\frac{x}{y}=\\frac{\\cos\\alpha}{\\sin\\alpha}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cot\\alpha=\\frac{x}{y}=\\frac{\\cos\\alpha}{\\sin\\alpha}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>正切的倒数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角恒等变换。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义域x≠kπ，周期π，奇函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>余角的正切。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>cotα=1/tanα。</p></section></div>`},{id:'elementary_math-c1s4-8',name:'正割余割',tags:["def", "thm", "der", "app", "note"],brief:'正割是余弦的倒数，余割是正弦的倒数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正割是余弦的倒数，余割是正弦的倒数。</p><div class="la-fml">$$\\sec\\alpha=\\frac{1}{\\cos\\alpha},\\ \\csc\\alpha=\\frac{1}{\\sin\\alpha}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sec\\alpha=\\frac{1}{\\cos\\alpha},\\ \\csc\\alpha=\\frac{1}{\\sin\\alpha}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由倒数关系定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角恒等式、微积分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>secα值域|secα|≥1；cscα同。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>航海和天文学中使用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>在微积分中导数公式简洁。</p></section></div>`},{id:'elementary_math-c1s4-9',name:'同角三角函数关系',tags:["def", "thm", "der", "app", "note"],brief:'同一个角的正弦余弦平方和为1。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同一个角的正弦余弦平方和为1。</p><div class="la-fml">$$\\sin^2\\alpha+\\cos^2\\alpha=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin^2\\alpha+\\cos^2\\alpha=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义sinα=y/r, cosα=x/r，sin²+cos²=(y²+x²)/r²=r²/r²=1。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角函数化简求值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>还有tanα=sinα/cosα，1+tan²α=sec²α等。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等式的基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>单位圆上的点满足x²+y²=1。</p></section></div>`},{id:'elementary_math-c1s4-10',name:'商数关系',tags:["def", "thm", "der", "app", "note"],brief:'正切等于正弦除以余弦。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正切等于正弦除以余弦。</p><div class="la-fml">$$\\tan\\alpha=\\frac{\\sin\\alpha}{\\cos\\alpha}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\tan\\alpha=\\frac{\\sin\\alpha}{\\cos\\alpha}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>tanα=(y/r)/(x/r)=y/x=sinα/cosα。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>切化弦、弦化切。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>cosα≠0时成立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>基本恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>类似cotα=cosα/sinα。</p></section></div>`},{id:'elementary_math-c1s4-11',name:'倒数关系',tags:["def", "thm", "der", "app", "note"],brief:'正弦与余割、余弦与正割、正切与余切互为倒数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正弦与余割、余弦与正割、正切与余切互为倒数。</p><div class="la-fml">$$\\sin\\alpha\\csc\\alpha=1,\\ \\cos\\alpha\\sec\\alpha=1,\\ \\tan\\alpha\\cot\\alpha=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\alpha\\csc\\alpha=1,\\ \\cos\\alpha\\sec\\alpha=1,\\ \\tan\\alpha\\cot\\alpha=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义直接得出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角恒等变换。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意定义域限制。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>基本恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>六个三角函数三对互逆。</p></section></div>`},{id:'elementary_math-c1s4-12',name:'诱导公式',tags:["def", "thm", "der", "app", "note"],brief:'利用周期性和对称性将任意角三角函数化为锐角三角函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>利用周期性和对称性将任意角三角函数化为锐角三角函数。</p><div class="la-fml">$$\\sin(\\alpha+2k\\pi)=\\sin\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin(\\alpha+2k\\pi)=\\sin\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由终边相同角和单位圆对称性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求任意角三角函数值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>口诀：奇变偶不变，符号看象限。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>简化三角计算的基本工具。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>共36组诱导公式可统一记忆。</p></section></div>`},{id:'elementary_math-c1s4-13',name:'正弦的诱导',tags:["def", "thm", "der", "app", "note"],brief:'正弦关于y轴对称，关于原点中心对称。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正弦关于y轴对称，关于原点中心对称。</p><div class="la-fml">$$\\sin(\\pi-\\alpha)=\\sin\\alpha,\\ \\sin(\\pi+\\alpha)=-\\sin\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin(\\pi-\\alpha)=\\sin\\alpha,\\ \\sin(\\pi+\\alpha)=-\\sin\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单位圆上点的坐标对称性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简三角函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>sin(-α)=-sinα（奇函数）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>单位圆对称性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>sin(π/2-α)=cosα。</p></section></div>`},{id:'elementary_math-c1s4-14',name:'余弦的诱导',tags:["def", "thm", "der", "app", "note"],brief:'余弦关于原点中心对称。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>余弦关于原点中心对称。</p><div class="la-fml">$$\\cos(\\pi-\\alpha)=-\\cos\\alpha,\\ \\cos(\\pi+\\alpha)=-\\cos\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cos(\\pi-\\alpha)=-\\cos\\alpha,\\ \\cos(\\pi+\\alpha)=-\\cos\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>单位圆对称性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简三角函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>cos(-α)=cosα（偶函数）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>单位圆对称性。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>cos(π/2-α)=sinα。</p></section></div>`},{id:'elementary_math-c1s4-15',name:'和角公式',tags:["def", "thm", "der", "app", "note"],brief:'两角和的正弦展开式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两角和的正弦展开式。</p><div class="la-fml">$$\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用单位圆上两点距离或向量点积推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角恒等变换、求角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是所有三角恒等式的基础。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>托勒密已有类似结果。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>由和角公式可推出差角、倍角、半角公式。</p></section></div>`},{id:'elementary_math-c1s4-16',name:'余弦和角公式',tags:["def", "thm", "der", "app", "note"],brief:'两角和的余弦展开式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两角和的余弦展开式。</p><div class="la-fml">$$\\cos(\\alpha+\\beta)=\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cos(\\alpha+\\beta)=\\cos\\alpha\\cos\\beta-\\sin\\alpha\\sin\\beta$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单位圆或复数乘法推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角恒等变换。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与正弦和角公式符号规律不同。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>核心三角恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>用复数证明：cos(α+β)+isin(α+β)=(cosα+isinα)(cosβ+isinβ)。</p></section></div>`},{id:'elementary_math-c1s4-17',name:'正切和角公式',tags:["def", "thm", "der", "app", "note"],brief:'两角和的正切公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两角和的正切公式。</p><div class="la-fml">$$\\tan(\\alpha+\\beta)=\\frac{\\tan\\alpha+\\tan\\beta}{1-\\tan\\alpha\\tan\\beta}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\tan(\\alpha+\\beta)=\\frac{\\tan\\alpha+\\tan\\beta}{1-\\tan\\alpha\\tan\\beta}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由sin(α+β)/cos(α+β)，分子分母同除以cosαcosβ。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求两角和的正切。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分母不为零，且各正切有意义。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>由和角公式导出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>tan(α-β)=(tanα-tanβ)/(1+tanαtanβ)。</p></section></div>`},{id:'elementary_math-c1s4-18',name:'倍角公式',tags:["def", "thm", "der", "app", "note"],brief:'二倍角的正弦公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>二倍角的正弦公式。</p><div class="la-fml">$$\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令β=α代入和角公式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>降次、化简。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>cos2α=cos²α-sin²α=2cos²α-1=1-2sin²α。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>和角公式的直接推论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>倍角公式的推广（多倍角）。</p></section></div>`},{id:'elementary_math-c1s4-19',name:'余弦倍角',tags:["def", "thm", "der", "app", "note"],brief:'二倍角余弦的三种形式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>二倍角余弦的三种形式。</p><div class="la-fml">$$\\cos 2\\alpha=\\cos^2\\alpha-\\sin^2\\alpha=2\\cos^2\\alpha-1=1-2\\sin^2\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\cos 2\\alpha=\\cos^2\\alpha-\\sin^2\\alpha=2\\cos^2\\alpha-1=1-2\\sin^2\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由cos(α+α)展开，再用sin²+cos²=1变形。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>降幂公式的来源。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三种形式各有用途。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>倍角公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>由此得降幂公式cos²α=(1+cos2α)/2。</p></section></div>`},{id:'elementary_math-c1s4-20',name:'半角公式',tags:["def", "thm", "der", "app", "note"],brief:'半角的正弦公式，符号由α/2所在象限决定。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>半角的正弦公式，符号由α/2所在象限决定。</p><div class="la-fml">$$\\sin\\frac{\\alpha}{2}=\\pm\\sqrt{\\frac{1-\\cos\\alpha}{2}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\frac{\\alpha}{2}=\\pm\\sqrt{\\frac{1-\\cos\\alpha}{2}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由cos2α=1-2sin²α反解。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求半角三角函数值。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>符号由α/2象限确定。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>倍角公式的逆用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>tan(α/2)=sinα/(1+cosα)=(1-cosα)/sinα。</p></section></div>`},{id:'elementary_math-c1s4-21',name:'和差化积',tags:["def", "thm", "der", "app", "note"],brief:'两个正弦的和化为积的形式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个正弦的和化为积的形式。</p><div class="la-fml">$$\\sin\\alpha+\\sin\\beta=2\\sin\\frac{\\alpha+\\beta}{2}\\cos\\frac{\\alpha-\\beta}{2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\alpha+\\sin\\beta=2\\sin\\frac{\\alpha+\\beta}{2}\\cos\\frac{\\alpha-\\beta}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>令α=(u+v)/2, β=(u-v)/2代入和角公式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角恒等变换、求积。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>共四组和差化积公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与积化和差互逆。</p></section></div>`},{id:'elementary_math-c1s4-22',name:'积化和差',tags:["def", "thm", "der", "app", "note"],brief:'正弦余弦的积化为和差。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正弦余弦的积化为和差。</p><div class="la-fml">$$\\sin\\alpha\\cos\\beta=\\frac{1}{2}[\\sin(\\alpha+\\beta)+\\sin(\\alpha-\\beta)]$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\alpha\\cos\\beta=\\frac{1}{2}[\\sin(\\alpha+\\beta)+\\sin(\\alpha-\\beta)]$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由和角与差角公式相加/减。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>积分计算、信号处理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>共四组积化和差公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>傅里叶分析的基础工具。</p></section></div>`},{id:'elementary_math-c1s4-23',name:'辅助角公式',tags:["def", "thm", "der", "app", "note"],brief:'将同角正余弦线性组合化为单一正弦函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将同角正余弦线性组合化为单一正弦函数。</p><div class="la-fml">$$a\\sin x+b\\cos x=\\sqrt{a^2+b^2}\\sin(x+\\varphi)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a\\sin x+b\\cos x=\\sqrt{a^2+b^2}\\sin(x+\\varphi)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>展开右端对比系数，得cosφ=a/√(a²+b²), sinφ=b/√(a²+b²)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求最值、化简。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>φ满足tanφ=b/a。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等式的重要应用。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>是简谐运动合成的数学基础。</p></section></div>`},{id:'elementary_math-c1s4-24',name:'正弦定理',tags:["def", "thm", "der", "app", "note"],brief:'三角形中各边与对角正弦之比相等，等于外接圆直径。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形中各边与对角正弦之比相等，等于外接圆直径。</p><div class="la-fml">$$\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}=2R$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{a}{\\sin A}=\\frac{b}{\\sin B}=\\frac{c}{\\sin C}=2R$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由外接圆上同弧所对圆周角相等，或向量法证明。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解三角形（已知两角一边或两边一对角）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>R为外接圆半径。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古希腊已有球面正弦定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到球面三角形。</p></section></div>`},{id:'elementary_math-c1s4-25',name:'余弦定理',tags:["def", "thm", "der", "app", "note"],brief:'三角形一边的平方等于另两边平方和减去两倍积乘夹角余弦。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形一边的平方等于另两边平方和减去两倍积乘夹角余弦。</p><div class="la-fml">$$a^2=b^2+c^2-2bc\\cos A$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^2=b^2+c^2-2bc\\cos A$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由向量的模长平方或坐标法推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解三角形（已知两边夹角或三边）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>勾股定理是其特例（A=90°时cosA=0）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>欧几里得《几何原本》已有几何表述。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到高维向量夹角。</p></section></div>`},{id:'elementary_math-c1s4-26',name:'三角形面积公式',tags:["def", "thm", "der", "app", "note"],brief:'三角形面积等于两边及其夹角正弦乘积的一半。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形面积等于两边及其夹角正弦乘积的一半。</p><div class="la-fml">$$S=\\frac{1}{2}ab\\sin C$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S=\\frac{1}{2}ab\\sin C$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由底乘高/2，高为bsinC。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求三角形面积。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>还有海伦公式S=√[p(p-a)(p-b)(p-c)]。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>古代测量学基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>用向量叉积表示面积。</p></section></div>`},{id:'elementary_math-c1s4-27',name:'正弦函数图象',tags:["def", "thm", "der", "app", "note"],brief:'正弦函数图象是周期为2π的波浪线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正弦函数图象是周期为2π的波浪线。</p><div class="la-fml">$$y=\\sin x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\sin x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单位圆上点的纵坐标描点得到。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>波动、交流电。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>五点法作图：(0,0),(π/2,1),(π,0),(3π/2,-1),(2π,0)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角学与函数结合。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>正弦曲线是最简单的周期函数。</p></section></div>`},{id:'elementary_math-c1s4-28',name:'余弦函数图象',tags:["def", "thm", "der", "app", "note"],brief:'余弦函数图象是正弦曲线向左平移π/2。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>余弦函数图象是正弦曲线向左平移π/2。</p><div class="la-fml">$$y=\\cos x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\cos x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>cosx=sin(x+π/2)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>相位差、振动。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>偶函数，关于y轴对称。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>由正弦平移得到。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>相位变换的基础。</p></section></div>`},{id:'elementary_math-c1s4-29',name:'正切函数图象',tags:["def", "thm", "der", "app", "note"],brief:'正切函数图象是周期为π的曲线，有垂直渐近线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正切函数图象是周期为π的曲线，有垂直渐近线。</p><div class="la-fml">$$y=\\tan x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\tan x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义和周期性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>斜率、周期性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>渐近线x=π/2+kπ；在每个周期内递增。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角函数图象。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>无最值，值域R。</p></section></div>`},{id:'elementary_math-c1s4-30',name:'积化和差公式',tags:["def", "thm", "der", "app", "note"],brief:'将三角函数乘积转化为和差。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将三角函数乘积转化为和差。</p><div class="la-fml">$$\\sin\\alpha\\cos\\beta=\\frac{1}{2}[\\sin(\\alpha+\\beta)+\\sin(\\alpha-\\beta)]$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\alpha\\cos\\beta=\\frac{1}{2}[\\sin(\\alpha+\\beta)+\\sin(\\alpha-\\beta)]$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由和角公式加减消元。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>积分、化简。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>共四个公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与和差化积互逆。</p></section></div>`},{id:'elementary_math-c1s4-31',name:'和差化积公式',tags:["def", "thm", "der", "app", "note"],brief:'将三角函数和差转化为乘积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将三角函数和差转化为乘积。</p><div class="la-fml">$$\\sin\\alpha+\\sin\\beta=2\\sin\\frac{\\alpha+\\beta}{2}\\cos\\frac{\\alpha-\\beta}{2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\alpha+\\sin\\beta=2\\sin\\frac{\\alpha+\\beta}{2}\\cos\\frac{\\alpha-\\beta}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由积化和差反推。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>化简、证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>共四个公式。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与积化和差互逆。</p></section></div>`},{id:'elementary_math-c1s4-32',name:'三倍角公式',tags:["def", "thm", "der", "app", "note"],brief:'三倍角的正弦、余弦公式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三倍角的正弦、余弦公式。</p><div class="la-fml">$$\\sin 3\\alpha=3\\sin\\alpha-4\\sin^3\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin 3\\alpha=3\\sin\\alpha-4\\sin^3\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由和角公式sin(2α+α)展开。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角化简。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>cos3α=4cos³α-3cosα。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等变换。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与三次方程求解相关。</p></section></div>`},{id:'elementary_math-c1s4-33',name:'万能公式',tags:["def", "thm", "der", "app", "note"],brief:'用半角正切表示各三角函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用半角正切表示各三角函数。</p><div class="la-fml">$$\\sin\\alpha=\\frac{2\\tan(\\alpha/2)}{1+\\tan^2(\\alpha/2)}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sin\\alpha=\\frac{2\\tan(\\alpha/2)}{1+\\tan^2(\\alpha/2)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由二倍角公式推导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角有理式积分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>令t=tan(α/2)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>三角恒等变换。</p></s
