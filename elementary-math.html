<script>
const LA_FIG = {  };
const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', note:'注 记', his:'背 景', ext:'拓 展'};
const LA_DATA = [
{id:'elementary_math-ch1',num:'第一章',title:'数与式',en:'NUMBERS & EXPRESSIONS',sub:'实数·代数式',desc:'',sections:[{name:'1.1 实数',color:'#2563eb',desc:'',items:[{id:'elementary_math-1',name:'实数的分类',tags:["def", "thm", "der", "exa", "app", "note"],brief:'有理数与无理数统称实数。有理数包括整数和分数（有限小数或无限循环小数），无理数是无限不循环小数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有理数与无理数统称实数。有理数包括整数和分数（有限小数或无限循环小数），无理数是无限不循环小数。</p><div class="la-fml">$$\\mathbb{R}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\mathbb{R}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>从有理数集出发，通过戴德金分割或柯西序列完备化构造实数集。有理数在实数中稠密，但测度为零。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>判断 √2 是无理数：假设 √2=p/q（既约），则 2q²=p²，故 p 为偶数，设 p=2k，得 q²=2k²，q 也为偶数，矛盾。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实数系是微积分的基础，其完备性保证了极限运算的封闭性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意区分有理数的稠密性与实数的完备性：有理数之间仍有无穷多无理数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>实数理论由戴德金、康托尔等人在19世纪完成，严格化了微积分基础。</p></section></div>`},{id:'elementary_math-2',name:'绝对值与不等式',tags:["def", "thm", "der", "exa", "app", "note"],brief:'实数 a 的绝对值 |a| 表示其在数轴上到原点的距离，非负。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>实数 a 的绝对值 |a| 表示其在数轴上到原点的距离，非负。</p><div class="la-fml">$$|a|\\geq 0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|a|\\geq 0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义 |a|=max(a,-a)，可推得三角不等式 |a+b|≤|a|+|b|，等号当且仅当 ab≥0。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>解不等式 |x-3|<5：-5<x-3<5，得 -2<x<8。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>绝对值不等式是分析学中估计的基本工具。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|a-b| 表示 a,b 在数轴上的距离，|a+b|≤|a|+|b| 与 |a-b|≥||a|-|b|| 常配合使用。</p></section></div>`}]},{name:'1.2 代数式',color:'#7c3aed',desc:'',items:[{id:'elementary_math-1',name:'整式的运算',tags:["def", "der", "exa", "app", "note"],brief:'整式包括单项式和多项式，进行加减乘除运算。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>整式包括单项式和多项式，进行加减乘除运算。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>乘法公式由分配律导出：(a+b)²=a²+2ab+b²，(a-b)(a+b)=a²-b²，(a+b)³=a³+3a²b+3ab²+b³。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>计算 (x+2)(x-3)：x²-3x+2x-6=x²-x-6。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>整式运算是代数变形的基础，广泛用于方程求解和因式分解。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意乘法公式的逆用即因式分解。</p></section></div>`},{id:'elementary_math-2',name:'因式分解',tags:["def", "der", "exa", "app", "note"],brief:'把一个多项式化为几个整式乘积的形式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>把一个多项式化为几个整式乘积的形式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>常用方法：提公因式法、公式法、十字相乘法、分组分解法。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>分解 x²-5x+6：找两数积为6和为-5，即-2和-3，故=(x-2)(x-3)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>因式分解是解方程、化简分式的关键步骤。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分解必须在指定数域内进行到不能再分为止。</p></section></div>`}]}]},
{id:'elementary_math-ch2',num:'第二章',title:'方程与不等式',en:'EQUATIONS & INEQUALITIES',sub:'方程求解',desc:'',sections:[{name:'2.1 方程',color:'#0f766e',desc:'',items:[{id:'elementary_math-1',name:'一元二次方程',tags:["def", "thm", "der", "exa", "app", "note"],brief:'只含一个未知数且最高次数为2的整式方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>只含一个未知数且最高次数为2的整式方程。</p><div class="la-fml">$$ax^2+bx+c=0\\,(a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$ax^2+bx+c=0\\,(a\\neq 0)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>配方法：两边除以 a 得 x²+(b/a)x=-c/a，配方 (x+b/2a)²=(b²-4ac)/4a²，开方得求根公式 x=(-b±√(b²-4ac))/2a。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>解方程 x²-5x+6=0：Δ=25-24=1，x=(5±1)/2，得 x=2 或 x=3。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>二次方程是描述抛物线运动、电路振荡等的基本模型。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>判别式 Δ=b²-4ac：Δ>0 两不等实根，Δ=0 重根，Δ<0 共轭复根。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>求根公式由花拉子米在9世纪首次给出文字表述。</p></section></div>`},{id:'elementary_math-2',name:'韦达定理',tags:["def", "thm", "der", "exa", "app", "note"],brief:'一元二次方程两根之和与积与系数的关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一元二次方程两根之和与积与系数的关系。</p><div class="la-fml">$$x_1+x_2=-\\frac{b}{a},\\,x_1 x_2=\\frac{c}{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x_1+x_2=-\\frac{b}{a},\\,x_1 x_2=\\frac{c}{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由求根公式 x₁=(-b+√Δ)/2a，x₂=(-b-√Δ)/2a，相加得 -b/a，相乘得 c/a。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>已知 x²-3x+2=0，不解方程求 x₁²+x₂²：=(x₁+x₂)²-2x₁x₂=9-4=5。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>韦达定理可推广到 n 次方程，是多项式根与系数关系的基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>利用韦达定理可在不解方程的情况下计算根的对称多项式。</p></section></div>`}]}]},
{id:'elementary_math-ch3',num:'第三章',title:'函数',en:'FUNCTIONS',sub:'函数概念与性质',desc:'',sections:[{name:'3.1 函数概念',color:'#2563eb',desc:'',items:[{id:'elementary_math-1',name:'函数的定义',tags:["def", "thm", "der", "exa", "app", "note"],brief:'设 A,B 为非空数集，若对 A 中每个 x，按对应法则 f 都有 B 中唯一确定的 y 与之对应，则 f 为 A 上的…',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>设 A,B 为非空数集，若对 A 中每个 x，按对应法则 f 都有 B 中唯一确定的 y 与之对应，则 f 为 A 上的函数。</p><div class="la-fml">$$y=f(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>函数由定义域、值域和对应法则三要素确定。两个函数相同当且仅当定义域和对应法则都相同。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>求 f(x)=√(x-1) 的定义域：x-1≥0，即 x≥1。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数是数学建模的核心工具，描述变量间依赖关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意 f(x) 与 f(a) 的区别：前者是函数，后者是函数值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>现代函数定义由狄利克雷在1837年给出。</p></section></div>`},{id:'elementary_math-2',name:'函数的单调性',tags:["def", "der", "exa", "app", "note"],brief:'若对区间 I 内任意 x₁<x₂，都有 f(x₁)<f(x₂)，则 f 在 I 上单调递增。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若对区间 I 内任意 x₁<x₂，都有 f(x₁)<f(x₂)，则 f 在 I 上单调递增。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>单调性可通过定义或导数符号判断：若 f'(x)>0 则递增，f'(x)<0 则递减。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>证明 f(x)=x³ 在 ℝ 上递增：f(x₁)-f(x₂)=(x₁-x₂)(x₁²+x₁x₂+x₂²)，当 x₁<x₂ 时第一项负，第二项恒正，故 f(x₁)<f(x₂)。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>单调性用于求最值、解方程、证明不等式。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>单调函数必有反函数，且反函数与原函数单调性相同。</p></section></div>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
</html>
