{id:'elementary_math-ch2',num:'第二章',title:'函数',en:'FUNCTIONS',sub:'初等函数·函数性质·图象·数列',desc:'函数概念、初等函数、性质与图象，以及数列。',sections:[{name:'2.1 函数概念',color:'#2563eb',desc:'函数的基本概念',items:[{id:'elementary_math-c2s1-1',name:'映射',tags:["def", "thm", "der", "app", "note"],brief:'集合 $A$ 到 $B$ 的对应关系，每元素有唯一像。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>集合 $A$ 到 $B$ 的对应关系，每元素有唯一像。</p><div class="la-fml">$$f:A\\to B$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f:A\\to B$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对应关系定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数的一般化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>一一对应、满射、单射。</p></section></div>`},{id:'elementary_math-c2s1-2',name:'函数定义',tags:["def", "thm", "der", "app", "note"],brief:'非空数集 $D$ 上，每个 $x$ 有唯一 $y$ 对应。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>非空数集 $D$ 上，每个 $x$ 有唯一 $y$ 对应。</p><div class="la-fml">$$y=f(x),\\ x\\in D$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(x),\\ x\\in D$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由映射特殊化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述变量关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义域 $D$，值域 $f(D)$。</p></section></div>`},{id:'elementary_math-c2s1-3',name:'定义域',tags:["def", "der", "app", "note"],brief:'自变量 $x$ 的取值集合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>自变量 $x$ 的取值集合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>确定函数有效范围。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需保证解析式有意义。</p></section></div>`},{id:'elementary_math-c2s1-4',name:'值域',tags:["def", "der", "app"],brief:'函数值 $y$ 的集合。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数值 $y$ 的集合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义域和对应法则。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述输出范围。</p></section></div>`},{id:'elementary_math-c2s1-5',name:'函数三要素',tags:["def", "der", "note"],brief:'定义域、对应法则、值域。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>定义域、对应法则、值域。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数定义。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>定义域和对应法则决定值域。</p></section></div>`},{id:'elementary_math-c2s1-6',name:'函数表示法',tags:["def", "der", "app"],brief:'解析法、列表法、图象法。',fig:'xy-axes',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解析法、列表法、图象法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不同描述方式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>各有适用场景。</p></section></div>`},{id:'elementary_math-c2s1-7',name:'分段函数',tags:["def", "der", "app"],brief:'不同区间用不同表达式的函数。',fig:'abs-x',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不同区间用不同表达式的函数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由实际需要。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>绝对值、计费。</p></section></div>`},{id:'elementary_math-c2s1-8',name:'复合函数',tags:["def", "thm", "der", "app", "note"],brief:'一个函数的输出作为另一个的输入。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一个函数的输出作为另一个的输入。</p><div class="la-fml">$$y=f(g(x))$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(g(x))$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数复合。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>复杂函数分解。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$g(x)$ 的值域须在 $f$ 定义域内。</p></section></div>`},{id:'elementary_math-c2s1-9',name:'反函数',tags:["def", "thm", "der", "app", "note"],brief:'若 $y=f(x)$ 一一对应，则 $x=f^{-1}(y)$。',fig:'line-yx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若 $y=f(x)$ 一一对应，则 $x=f^{-1}(y)$。</p><div class="la-fml">$$y=f^{-1}(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f^{-1}(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由逆映射。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>对数与指数互化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>图象关于 $y=x$ 对称。</p></section></div>`},{id:'elementary_math-c2s1-10',name:'求反函数步骤',tags:["def", "der"],brief:'解出 $x$，交换 $x,y$，注明定义域。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解出 $x$，交换 $x,y$，注明定义域。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数定义。</p></section></div>`},{id:'elementary_math-c2s1-11',name:'函数定义域求法',tags:["def", "der", "app"],brief:'分母不为零、根号内非负、对数真数正。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分母不为零、根号内非负、对数真数正。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由解析式要求。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求定义域。</p></section></div>`},{id:'elementary_math-c2s1-12',name:'函数对应法则',tags:["def", "der", "app"],brief:'$f$ 表示对应关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$f$ 表示对应关系。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>理解函数。</p></section></div>`}]},{name:'2.2 初等函数',color:'#3b82f6',desc:'基本初等函数及复合',items:[{id:'elementary_math-c2s2-1',name:'常数函数',tags:["def", "thm", "der", "app", "note"],brief:'函数值恒为常数 $c$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数值恒为常数 $c$。</p><div class="la-fml">$$y=c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>最简单的函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>基准线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>图象为水平线。</p></section></div>`},{id:'elementary_math-c2s2-2',name:'幂函数',tags:["def", "thm", "der", "app", "note"],brief:'底数为自变量，指数为常数。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>底数为自变量，指数为常数。</p><div class="la-fml">$$y=x^\\alpha$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=x^\\alpha$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由乘方。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>各种增长规律。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$lpha$ 不同图象不同。</p></section></div>`},{id:'elementary_math-c2s2-3',name:'三角函数',tags:["def", "der", "app"],brief:'$\\sin x,\\cos x,	an x$ 等。',fig:'sin-curve',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$\\sin x,\\cos x,	an x$ 等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单位圆。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>周期现象。</p></section></div>`},{id:'elementary_math-c2s2-4',name:'反三角函数',tags:["def", "der", "app", "note"],brief:'$rcsin x,rccos x,rctan x$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$rcsin x,rccos x,rctan x$。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由三角函数反函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>注意主值区间。</p></section></div>`},{id:'elementary_math-c2s2-5',name:'初等函数',tags:["def", "der", "note"],brief:'基本初等函数经有限次四则和复合得到。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>基本初等函数经有限次四则和复合得到。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由基本初等函数构造。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分段函数一般不是。</p></section></div>`},{id:'elementary_math-c2s2-6',name:'双曲函数',tags:["def", "thm", "app", "note"],brief:'由指数函数定义。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由指数函数定义。</p><div class="la-fml">$$\\sinh x=\\frac{e^x-e^{-x}}{2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\sinh x=\\frac{e^x-e^{-x}}{2}$$</div></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>悬链线。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\cosh^2x-\\sinh^2x=1$。</p></section></div>`},{id:'elementary_math-c2s2-7',name:'绝对值函数',tags:["def", "thm", "der"],brief:'取绝对值的函数。',fig:'abs-x',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>取绝对值的函数。</p><div class="la-fml">$$y=|x|$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=|x|$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由绝对值定义。</p></section></div>`},{id:'elementary_math-c2s2-8',name:'取整函数',tags:["def", "thm", "der"],brief:'不超过 $x$ 的最大整数。',fig:'floor-x',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>不超过 $x$ 的最大整数。</p><div class="la-fml">$$y=\\lfloor x\\rfloor$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\lfloor x\\rfloor$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由整数部分。</p></section></div>`},{id:'elementary_math-c2s2-9',name:'符号函数',tags:["def", "thm", "der", "note"],brief:'表示 $x$ 的符号。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>表示 $x$ 的符号。</p><div class="la-fml">$$y=\\mathrm{sgn}\\,x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=\\mathrm{sgn}\\,x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由符号定义。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$|x|=x\\,\\mathrm{sgn}\\,x$。</p></section></div>`},{id:'elementary_math-c2s2-10',name:'狄利克雷函数',tags:["def", "thm", "der", "app", "note"],brief:'有理点取 $1$，无理点取 $0$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有理点取 $1$，无理点取 $0$。</p><div class="la-fml">$$D(x)=\\begin{cases}1,&x\\in\\mathbb{Q}\\\\0,&x\\notin\\mathbb{Q}\\end{cases}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$D(x)=\\begin{cases}1,&x\\in\\mathbb{Q}\\\\0,&x\\notin\\mathbb{Q}\\end{cases}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由有理数集。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>反例函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>处处不连续。</p></section></div>`},{id:'elementary_math-c2s2-11',name:'幂函数图象',tags:["def", "der", "note"],brief:'$y=x^lpha$ 随 $lpha$ 不同图象不同。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$y=x^lpha$ 随 $lpha$ 不同图象不同。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由指数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>过 $(1,1)$。</p></section></div>`},{id:'elementary_math-c2s2-12',name:'指数函数性质',tags:["def", "der"],brief:'过 $(0,1)$，$a>1$ 递增，$0<a<1$ 递减。',fig:'exp-y',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过 $(0,1)$，$a>1$ 递增，$0<a<1$ 递减。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由指数。</p></section></div>`},{id:'elementary_math-c2s2-13',name:'对数函数性质',tags:["def", "der"],brief:'过 $(1,0)$，$a>1$ 递增，$0<a<1$ 递减。',fig:'ln-y',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过 $(1,0)$，$a>1$ 递增，$0<a<1$ 递减。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数。</p></section></div>`},{id:'elementary_math-c2s2-14',name:'三角函数性质',tags:["def", "der"],brief:'周期性、奇偶性、单调性、有界性。',fig:'sin-curve',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>周期性、奇偶性、单调性、有界性。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单位圆。</p></section></div>`},{id:'elementary_math-c2s2-15',name:'反三角函数值域',tags:["def", "der", "app"],brief:'$rcsin x\\in[-\\pi/2,\\pi/2]$，$rccos x\\in[0,\\pi]$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$rcsin x\\in[-\\pi/2,\\pi/2]$，$rccos x\\in[0,\\pi]$。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由主值规定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角。</p></section></div>`},{id:'elementary_math-c2s2-16',name:'复合函数定义域',tags:["def", "der", "app"],brief:'内层值域须在外层定义域内。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>内层值域须在外层定义域内。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由复合定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求定义域。</p></section></div>`},{id:'elementary_math-c2s2-17',name:'复合函数值域',tags:["def", "der", "app"],brief:'由内到外逐层求。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由内到外逐层求。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由复合定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求值域。</p></section></div>`},{id:'elementary_math-c2s2-18',name:'幂指函数',tags:["def", "thm", "der", "note"],brief:'底数指数均为自变量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>底数指数均为自变量。</p><div class="la-fml">$$y=x^x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=x^x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>取对数法。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$x>0$。</p></section></div>`}]},{name:'2.3 函数性质',color:'#6366f1',desc:'单调性、奇偶性、周期性等',items:[{id:'elementary_math-c2s3-1',name:'单调性',tags:["def", "der", "app"],brief:'$x_1<x_2$ 时 $f(x_1)<f(x_2)$ 为增，反之为减。',fig:'line-yx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$x_1<x_2$ 时 $f(x_1)<f(x_2)$ 为增，反之为减。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>判断函数变化趋势。</p></section></div>`},{id:'elementary_math-c2s3-2',name:'奇偶性',tags:["def", "thm", "der", "app", "note"],brief:'$f(-x)=f(x)$ 偶，$f(-x)=-f(x)$ 奇。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$f(-x)=f(x)$ 偶，$f(-x)=-f(x)$ 奇。</p><div class="la-fml">$$f(-x)=\\pm f(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(-x)=\\pm f(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对称性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>奇关于原点对称，偶关于 $y$ 轴对称。</p></section></div>`},{id:'elementary_math-c2s3-3',name:'周期性',tags:["def", "thm", "der", "app", "note"],brief:'存在非零 $T$ 使函数值重复。',fig:'sin-curve',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>存在非零 $T$ 使函数值重复。</p><div class="la-fml">$$f(x+T)=f(x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x+T)=f(x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由周期现象。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>三角函数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>最小正周期。</p></section></div>`},{id:'elementary_math-c2s3-4',name:'有界性',tags:["def", "thm", "der", "app", "note"],brief:'存在 $M$ 使所有函数值不超过 $M$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>存在 $M$ 使所有函数值不超过 $M$。</p><div class="la-fml">$$|f(x)|\\leq M$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|f(x)|\\leq M$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由范围限定。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>稳定性。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\sin x$ 有界。</p></section></div>`},{id:'elementary_math-c2s3-5',name:'最大值最小值',tags:["def", "der", "app", "note"],brief:'函数在定义域上的最大或最小值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数在定义域上的最大或最小值。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由有界性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>优化问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>不一定存在。</p></section></div>`},{id:'elementary_math-c2s3-6',name:'零点',tags:["def", "thm", "der", "app"],brief:'使函数值为零的 $x_0$。',fig:'xy-axes',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>使函数值为零的 $x_0$。</p><div class="la-fml">$$f(x_0)=0$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x_0)=0$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方程 $f(x)=0$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解方程。</p></section></div>`},{id:'elementary_math-c2s3-7',name:'零点存在定理',tags:["def", "der", "app"],brief:'$f$ 在 $[a,b]$ 连续且 $f(a)f(b)<0$，则有零点。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$f$ 在 $[a,b]$ 连续且 $f(a)f(b)<0$，则有零点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由介值定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>二分法求根。</p></section></div>`},{id:'elementary_math-c2s3-8',name:'函数凸性',tags:["def", "der", "note"],brief:'图象的凹凸方向。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>图象的凹凸方向。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由二阶符号（预备）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>凸：$f((x_1+x_2)/2)\\leq$ 平均。</p></section></div>`},{id:'elementary_math-c2s3-9',name:'函数拐点',tags:["def", "der"],brief:'凹凸改变的点。',fig:'cubic-yx3',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>凹凸改变的点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由凸性变化。</p></section></div>`},{id:'elementary_math-c2s3-10',name:'函数渐近线',tags:["def", "der", "note"],brief:'图象无限接近的直线。',fig:'hyperbola-1overx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>图象无限接近的直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由极限行为。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>水平、垂直、斜渐近线。</p></section></div>`},{id:'elementary_math-c2s3-11',name:'单调区间',tags:["def", "der", "app"],brief:'函数单调递增或递减的区间。',fig:'line-yx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>函数单调递增或递减的区间。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单调性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分析函数。</p></section></div>`},{id:'elementary_math-c2s3-12',name:'奇偶函数性质',tags:["def", "der"],brief:'奇关于原点对称，偶关于 $y$ 轴对称。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>奇关于原点对称，偶关于 $y$ 轴对称。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section></div>`},{id:'elementary_math-c2s3-13',name:'周期函数性质',tags:["def", "der"],brief:'若 $T$ 为周期则 $kT$ 也是周期。',fig:'sin-curve',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若 $T$ 为周期则 $kT$ 也是周期。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由周期定义。</p></section></div>`},{id:'elementary_math-c2s3-14',name:'函数最值求法',tags:["def", "der", "app"],brief:'配方法、均值不等式、单调性、图象法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>配方法、均值不等式、单调性、图象法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不同方法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求最值。</p></section></div>`},{id:'elementary_math-c2s3-15',name:'函数值域求法',tags:["def", "der", "app"],brief:'观察法、配方法、换元法、判别式法、单调性。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>观察法、配方法、换元法、判别式法、单调性。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不同方法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求值域。</p></section></div>`},{id:'elementary_math-c2s3-16',name:'函数零点个数',tags:["def", "der"],brief:'图象与 $x$ 轴交点数。',fig:'xy-axes',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>图象与 $x$ 轴交点数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由零点定义。</p></section></div>`},{id:'elementary_math-c2s3-17',name:'二次函数最值',tags:["def", "thm", "der", "app"],brief:'顶点处取最值。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>顶点处取最值。</p><div class="la-fml">$$y_{min/max}=\\frac{4ac-b^2}{4a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y_{min/max}=\\frac{4ac-b^2}{4a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由配方法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>最值问题。</p></section></div>`}]},{name:'2.4 函数图象与曲线',color:'#8b5cf6',desc:'函数的几何表示',items:[{id:'elementary_math-c2s4-1',name:'函数图象',tags:["def", "der", "app"],brief:'所有点 $(x,f(x))$ 的集合。',fig:'xy-axes',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>所有点 $(x,f(x))$ 的集合。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>直观理解函数。</p></section></div>`},{id:'elementary_math-c2s4-2',name:'一次函数图象',tags:["def", "thm", "der", "app"],brief:'一条直线，$k$ 为斜率。',fig:'line-yx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一条直线，$k$ 为斜率。</p><div class="la-fml">$$y=kx+b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=kx+b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由直线方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>线性关系。</p></section></div>`},{id:'elementary_math-c2s4-3',name:'二次函数图象',tags:["def", "thm", "der", "app"],brief:'抛物线，开口由 $a$ 决定。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>抛物线，开口由 $a$ 决定。</p><div class="la-fml">$$y=ax^2+bx+c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=ax^2+bx+c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由配方法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>最值、根。</p></section></div>`},{id:'elementary_math-c2s4-4',name:'三次函数图象',tags:["def", "thm", "der"],brief:'S 形曲线。',fig:'cubic-yx3',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>S 形曲线。</p><div class="la-fml">$$y=ax^3+bx^2+cx+d$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=ax^3+bx^2+cx+d$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由三次式。</p></section></div>`},{id:'elementary_math-c2s4-5',name:'反比例函数图象',tags:["def", "thm", "der"],brief:'双曲线，关于原点对称。',fig:'hyperbola-1overx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>双曲线，关于原点对称。</p><div class="la-fml">$$y=k/x$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=k/x$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反比例关系。</p></section></div>`},{id:'elementary_math-c2s4-6',name:'指数函数图象',tags:["def", "der"],brief:'过 $(0,1)$ 的递增或递减曲线。',fig:'exp-y',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过 $(0,1)$ 的递增或递减曲线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由指数性质。</p></section></div>`},{id:'elementary_math-c2s4-7',name:'对数函数图象',tags:["def", "der"],brief:'过 $(1,0)$ 的曲线。',fig:'ln-y',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过 $(1,0)$ 的曲线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由反函数。</p></section></div>`},{id:'elementary_math-c2s4-8',name:'三角函数图象',tags:["def", "der"],brief:'正弦、余弦、正切曲线。',fig:'sin-curve',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正弦、余弦、正切曲线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由单位圆。</p></section></div>`},{id:'elementary_math-c2s4-9',name:'图象平移',tags:["def", "thm", "der", "note"],brief:'右移 $a$，上移 $b$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>右移 $a$，上移 $b$。</p><div class="la-fml">$$y=f(x-a)+b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=f(x-a)+b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标变换。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>左加右减，上加下减。</p></section></div>`},{id:'elementary_math-c2s4-10',name:'图象伸缩',tags:["def", "thm", "der"],brief:'纵伸 $A$ 倍，横缩 $1/\\omega$ 倍。',fig:'sin-curve',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>纵伸 $A$ 倍，横缩 $1/\\omega$ 倍。</p><div class="la-fml">$$y=Af(\\omega x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=Af(\\omega x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标变换。</p></section></div>`},{id:'elementary_math-c2s4-11',name:'图象对称',tags:["def", "thm", "der"],brief:'关于 $x$ 轴或 $y$ 轴对称。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>关于 $x$ 轴或 $y$ 轴对称。</p><div class="la-fml">$$y=-f(x),\\ y=f(-x)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=-f(x),\\ y=f(-x)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由坐标变换。</p></section></div>`},{id:'elementary_math-c2s4-12',name:'翻折变换',tags:["def", "thm", "der"],brief:'将 $x$ 轴下方部分翻到上方。',fig:'abs-x',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将 $x$ 轴下方部分翻到上方。</p><div class="la-fml">$$y=|f(x)|$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=|f(x)|$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由绝对值。</p></section></div>`},{id:'elementary_math-c2s4-13',name:'函数交点',tags:["def", "der", "app"],brief:'$f(x)=g(x)$ 的解对应图象交点。',fig:'xy-axes',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$f(x)=g(x)$ 的解对应图象交点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方程与图象。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解方程。</p></section></div>`},{id:'elementary_math-c2s4-14',name:'函数图象绘制',tags:["def", "der", "app"],brief:'列表、描点、连线。',fig:'xy-axes',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>列表、描点、连线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由图象定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>画函数图。</p></section></div>`},{id:'elementary_math-c2s4-15',name:'正比例函数',tags:["def", "thm", "der"],brief:'过原点的直线。',fig:'line-yx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过原点的直线。</p><div class="la-fml">$$y=kx$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$y=kx$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由比例关系。</p></section></div>`},{id:'elementary_math-c2s4-16',name:'反比例函数性质',tags:["def", "der"],brief:'$k>0$ 图象在一三象限。',fig:'hyperbola-1overx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$k>0$ 图象在一三象限。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由比例关系。</p></section></div>`},{id:'elementary_math-c2s4-17',name:'二次函数顶点',tags:["def", "thm", "der"],brief:'抛物线顶点坐标。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>抛物线顶点坐标。</p><div class="la-fml">$$\\left(-\\frac{b}{2a},\\frac{4ac-b^2}{4a}\\right)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\left(-\\frac{b}{2a},\\frac{4ac-b^2}{4a}\\right)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由配方法。</p></section></div>`},{id:'elementary_math-c2s4-18',name:'二次函数对称轴',tags:["def", "thm", "der"],brief:'抛物线对称轴。',fig:'parabola-yx2',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>抛物线对称轴。</p><div class="la-fml">$$x=-\\frac{b}{2a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$x=-\\frac{b}{2a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由配方法。</p></section></div>`},{id:'elementary_math-c2s4-19',name:'指数函数图象性质',tags:["def", "der"],brief:'恒过 $(0,1)$，$x$ 轴为渐近线。',fig:'exp-y',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>恒过 $(0,1)$，$x$ 轴为渐近线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由指数。</p></section></div>`},{id:'elementary_math-c2s4-20',name:'对数函数图象性质',tags:["def", "der"],brief:'恒过 $(1,0)$，$y$ 轴为渐近线。',fig:'ln-y',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>恒过 $(1,0)$，$y$ 轴为渐近线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对数。</p></section></div>`},{id:'elementary_math-c2s4-21',name:'三角函数图象变换',tags:["def", "der", "app"],brief:'$y=A\\sin(\\omega x+arphi)$ 的振幅、周期、相位。',fig:'sin-curve',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$y=A\\sin(\\omega x+arphi)$ 的振幅、周期、相位。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由变换。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>振动。</p></section></div>`}]},{name:'2.5 抽象函数',color:'#a855f7',desc:'无具体表达式的函数',items:[{id:'elementary_math-c2s5-1',name:'抽象函数概念',tags:["def", "der", "app", "note"],brief:'只给性质不给解析式的函数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>只给性质不给解析式的函数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数性质。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>训练逻辑思维。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需用性质推理。</p></section></div>`},{id:'elementary_math-c2s5-2',name:'抽象函数求值',tags:["def", "der", "app"],brief:'利用已知性质求特定函数值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>利用已知性质求特定函数值。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>赋值法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>函数方程。</p></section></div>`},{id:'elementary_math-c2s5-3',name:'抽象函数单调性',tags:["def", "der", "app"],brief:'由定义和已知性质判断。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由定义和已知性质判断。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>取 $x_1<x_2$ 比较。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解抽象不等式。</p></section></div>`},{id:'elementary_math-c2s5-4',name:'抽象函数奇偶性',tags:["def", "der"],brief:'由 $f(-x)$ 与 $f(x)$ 关系判断。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由 $f(-x)$ 与 $f(x)$ 关系判断。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>赋值 $x	o -x$。</p></section></div>`},{id:'elementary_math-c2s5-5',name:'抽象函数周期性',tags:["def", "der"],brief:'寻找 $T$ 使 $f(x+T)=f(x)$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>寻找 $T$ 使 $f(x+T)=f(x)$。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由递推关系。</p></section></div>`},{id:'elementary_math-c2s5-6',name:'函数方程',tags:["def", "der", "app", "note"],brief:'含未知函数的等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>含未知函数的等式。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由函数性质。</p></section><section class="la-kp-sec la-kp-ex"><h5>例 题</h5><p>已知 $f(x+1)=x^2$，令 $t=x+1$ 则 $f(t)=(t-1)^2=t^2-2t+1$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>柯西方程等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$f(x+y)=f(x)+f(y)$ 为柯西方程。</p></section></div>`},{id:'elementary_math-c2s5-7',name:'赋值法',tags:["def", "der", "app"],brief:'给自变量赋特殊值求函数值或性质。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>给自变量赋特殊值求函数值或性质。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由任意性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解抽象函数题。</p></section></div>`},{id:'elementary_math-c2s5-8',name:'抽象函数周期性求法',tags:["def", "der", "app"],brief:'由递推关系找周期。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由递推关系找周期。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>赋值。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求周期。</p></section></div>`},{id:'elementary_math-c2s5-9',name:'抽象函数对称性',tags:["def", "der", "app"],brief:'由 $f(a+x)=f(a-x)$ 知对称轴。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由 $f(a+x)=f(a-x)$ 知对称轴。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对称定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>对称性。</p></section></div>`}]},{name:'2.6 数列',color:'#d946ef',desc:'按顺序排列的数',items:[{id:'elementary_math-c2s6-1',name:'数列概念',tags:["def", "thm", "der", "app", "note"],brief:'按一定顺序排列的一列数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>按一定顺序排列的一列数。</p><div class="la-fml">$$\\{a_n\\}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\{a_n\\}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由正整数集上的函数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述离散变化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$a_n$ 为第 $n$ 项。</p></section></div>`},{id:'elementary_math-c2s6-2',name:'通项公式',tags:["def", "thm", "der", "app"],brief:'用 $n$ 表示第 $n$ 项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用 $n$ 表示第 $n$ 项。</p><div class="la-fml">$$a_n=f(n)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=f(n)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由数列规律。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求任意项。</p></section></div>`},{id:'elementary_math-c2s6-3',name:'递推公式',tags:["def", "thm", "der", "app", "note"],brief:'用前项表示后项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用前项表示后项。</p><div class="la-fml">$$a_{n+1}=f(a_n)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_{n+1}=f(a_n)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由递推关系。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>定义数列。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>需首项。</p></section></div>`},{id:'elementary_math-c2s6-4',name:'等差数列',tags:["def", "thm", "der", "app", "note"],brief:'相邻两项差为常数 $d$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>相邻两项差为常数 $d$。</p><div class="la-fml">$$a_n=a_1+(n-1)d$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1+(n-1)d$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由递推 $a_{n+1}-a_n=d$。</p></section><section class="la-kp-sec la-kp-ex"><h5>例 题</h5><p>已知 $a_1=1,d=2$，则 $a_n=1+2(n-1)=2n-1$，$a_{10}=19$，$S_{10}=100$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>均匀变化。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$a_m+a_n=a_p+a_q$ 若 $m+n=p+q$。</p></section></div>`},{id:'elementary_math-c2s6-5',name:'等差求和',tags:["def", "thm", "der", "app"],brief:'倒序相加法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>倒序相加法。</p><div class="la-fml">$$S_n=\\frac{n(a_1+a_n)}{2}=na_1+\\frac{n(n-1)}{2}d$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S_n=\\frac{n(a_1+a_n)}{2}=na_1+\\frac{n(n-1)}{2}d$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>高斯配对。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求和。</p></section></div>`},{id:'elementary_math-c2s6-6',name:'等比数列',tags:["def", "thm", "der", "app", "note"],brief:'相邻两项比为常数 $q$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>相邻两项比为常数 $q$。</p><div class="la-fml">$$a_n=a_1q^{n-1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1q^{n-1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由递推 $a_{n+1}/a_n=q$。</p></section><section class="la-kp-sec la-kp-ex"><h5>例 题</h5><p>已知 $a_1=2,q=3$，则 $a_n=2\\cdot3^{n-1}$，$a_4=54$，$S_4=80$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>指数增长。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$a_ma_n=a_pa_q$ 若 $m+n=p+q$。</p></section></div>`},{id:'elementary_math-c2s6-7',name:'等比求和',tags:["def", "thm", "der", "app", "note"],brief:'错位相减法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>错位相减法。</p><div class="la-fml">$$S_n=\\frac{a_1(1-q^n)}{1-q}\\ (q\\neq 1)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S_n=\\frac{a_1(1-q^n)}{1-q}\\ (q\\neq 1)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>$S_n-qS_n$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$|q|<1$ 时无穷和 $a_1/(1-q)$。</p></section></div>`},{id:'elementary_math-c2s6-8',name:'等差中项',tags:["def", "thm", "der"],brief:'$a,A,b$ 成等差则 $A$ 为中项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$a,A,b$ 成等差则 $A$ 为中项。</p><div class="la-fml">$$2A=a+b$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$2A=a+b$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等差定义。</p></section></div>`},{id:'elementary_math-c2s6-9',name:'等比中项',tags:["def", "thm", "der"],brief:'$a,G,b$ 成等比则 $G$ 为中项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$a,G,b$ 成等比则 $G$ 为中项。</p><div class="la-fml">$$G^2=ab$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$G^2=ab$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等比定义。</p></section></div>`},{id:'elementary_math-c2s6-10',name:'数列求和方法',tags:["def", "der", "app"],brief:'公式法、倒序相加、错位相减、裂项相消、分组求和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>公式法、倒序相加、错位相减、裂项相消、分组求和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不同方法适用不同类型。</p></section><section class="la-kp-sec la-kp-ex"><h5>例 题</h5><p>$1+2+\\cdots+100=\\frac{100\\times101}{2}=5050$，等差数列求和。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求和。</p></section></div>`},{id:'elementary_math-c2s6-11',name:'裂项相消',tags:["def", "thm", "der", "app"],brief:'拆成两项差，求和抵消。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>拆成两项差，求和抵消。</p><div class="la-fml">$$\\frac{1}{n(n+1)}=\\frac{1}{n}-\\frac{1}{n+1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{1}{n(n+1)}=\\frac{1}{n}-\\frac{1}{n+1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>分式拆分。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式数列求和。</p></section></div>`},{id:'elementary_math-c2s6-12',name:'错位相减',tags:["def", "der", "app"],brief:'等差乘等比型求和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等差乘等比型求和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>$S_n-qS_n$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>$(an+b)q^n$ 求和。</p></section></div>`},{id:'elementary_math-c2s6-13',name:'分组求和',tags:["def", "der", "app"],brief:'分组后分别求和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分组后分别求和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>按规律分组。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>周期数列。</p></section></div>`},{id:'elementary_math-c2s6-14',name:'特征方程法',tags:["def", "der", "app", "note"],brief:'解 $x^2=px+q$ 求线性递推通项。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解 $x^2=px+q$ 求线性递推通项。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设 $a_n=x^n$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>二阶线性递推。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两根不等时 $a_n=Ax_1^n+Bx_2^n$。</p></section></div>`},{id:'elementary_math-c2s6-15',name:'不动点法',tags:["def", "der", "app"],brief:'解 $f(x)=x$ 构造辅助数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>解 $f(x)=x$ 构造辅助数列。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不动点线性化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分式递推。</p></section></div>`},{id:'elementary_math-c2s6-16',name:'数学归纳法',tags:["def", "der", "app", "note"],brief:'基础步+归纳步。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>基础步+归纳步。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由皮亚诺公理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明与 $n$ 有关命题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两步缺一不可。</p></section></div>`},{id:'elementary_math-c2s6-17',name:'等差数列性质',tags:["def", "der", "app"],brief:'$a_m+a_n=a_p+a_q$ 若 $m+n=p+q$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$a_m+a_n=a_p+a_q$ 若 $m+n=p+q$。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由通项。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化计算。</p></section></div>`},{id:'elementary_math-c2s6-18',name:'等比数列性质',tags:["def", "der", "app"],brief:'$a_ma_n=a_pa_q$ 若 $m+n=p+q$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$a_ma_n=a_pa_q$ 若 $m+n=p+q$。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由通项。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化计算。</p></section></div>`},{id:'elementary_math-c2s6-19',name:'数列单调性',tags:["def", "der", "app"],brief:'$a_{n+1}>a_n$ 递增，反之递减。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$a_{n+1}>a_n$ 递增，反之递减。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分析数列。</p></section></div>`},{id:'elementary_math-c2s6-20',name:'数列有界性',tags:["def", "der"],brief:'存在 $M$ 使 $|a_n|\\leq M$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>存在 $M$ 使 $|a_n|\\leq M$。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section></div>`},{id:'elementary_math-c2s6-21',name:'等差等比综合',tags:["def", "der", "app"],brief:'等差与等比结合的问题。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等差与等比结合的问题。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>综合应用。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>综合题。</p></section></div>`},{id:'elementary_math-c2s6-22',name:'数列求和倒序相加',tags:["def", "der", "app"],brief:'将数列倒序与原式相加。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将数列倒序与原式相加。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>高斯法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等差、组合数求和。</p></section></div>`},{id:'elementary_math-c2s6-23',name:'数列通项求法',tags:["def", "der", "app"],brief:'观察法、公式法、累加法、累乘法、构造法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>观察法、公式法、累加法、累乘法、构造法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>不同方法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求通项。</p></section></div>`},{id:'elementary_math-c2s6-24',name:'累加法',tags:["def", "thm", "der", "app"],brief:'适用于 $a_{n+1}-a_n=f(n)$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>适用于 $a_{n+1}-a_n=f(n)$。</p><div class="la-fml">$$a_n=a_1+\\sum_{k=1}^{n-1}(a_{k+1}-a_k)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1+\\sum_{k=1}^{n-1}(a_{k+1}-a_k)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>累加。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求通项。</p></section></div>`},{id:'elementary_math-c2s6-25',name:'累乘法',tags:["def", "thm", "der", "app"],brief:'适用于 $a_{n+1}/a_n=f(n)$。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>适用于 $a_{n+1}/a_n=f(n)$。</p><div class="la-fml">$$a_n=a_1\\cdot\\prod_{k=1}^{n-1}\\frac{a_{k+1}}{a_k}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a_n=a_1\\cdot\\prod_{k=1}^{n-1}\\frac{a_{k+1}}{a_k}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>累乘。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求通项。</p></section></div>`},{id:'elementary_math-c2s6-26',name:'构造法求通项',tags:["def", "der", "app", "note"],brief:'构造等差或等比数列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>构造等差或等比数列。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>变形递推。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求通项。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$a_{n+1}=pa_n+q$ 构造等比。</p></section></div>`}]}]},
{id:'elementary_math-ch3',num:'第三章',title:'几何',en:'GEOMETRY',sub:'平面几何·向量·解析几何·立体几何·空间曲面',desc:'平面几何、向量、坐标几何、立体几何与空间曲面。',sections:[{name:'3.1 平面几何基础',color:'#2563eb',desc:'点线面基本图形',items:[{id:'elementary_math-c3s1-1',name:'点线面',tags:["def", "der", "app"],brief:'点无大小，线无粗细，面无厚薄。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>点无大小，线无粗细，面无厚薄。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>欧几里得公理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何基础。</p></section></div>`},{id:'elementary_math-c3s1-2',name:'直线',tags:["def", "der", "note"],brief:'向两端无限延伸的线。',fig:'line-yx',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>向两端无限延伸的线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>公理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两点确定一条直线。</p></section></div>`},{id:'elementary_math-c3s1-3',name:'射线',tags:["def", "der"],brief:'有一个端点，向一端无限延伸。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有一个端点，向一端无限延伸。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>直线的一部分。</p></section></div>`},{id:'elementary_math-c3s1-4',name:'线段',tags:["def", "der", "app"],brief:'两点间的有限部分。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两点间的有限部分。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>直线的一部分。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>度量长度。</p></section></div>`},{id:'elementary_math-c3s1-5',name:'角',tags:["def", "thm", "der", "app", "note"],brief:'由两条有公共端点的射线组成。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由两条有公共端点的射线组成。</p><div class="la-fml">$$\\angle AOB$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\angle AOB$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设 $\\triangle ABC$ 与 $\\triangle DEF$ 三边对应相等。将 $\\triangle DEF$ 叠放在 $\\triangle ABC$ 上使 $BC$ 与 $EF$ 重合，$A$ 与 $D$ 在 $BC$ 同侧。因 $AB=DE$，$AC=DF$，$A$ 与 $D$ 同时在以 $B(E)$ 为圆心 $AB$ 为半径的圆弧上，又在以 $C(F)$ 为圆心 $AC$ 为半径的圆弧上，两弧交点唯一，故 $A$ 与 $D$ 重合。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述方向差。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>度、弧度。</p></section></div>`},{id:'elementary_math-c3s1-6',name:'角的分类',tags:["def", "der", "note"],brief:'锐角、直角、钝角、平角、周角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>锐角、直角、钝角、平角、周角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角度大小。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$90^\\circ$ 直角，$180^\\circ$ 平角。</p></section></div>`},{id:'elementary_math-c3s1-7',name:'相交线',tags:["def", "der", "note"],brief:'有公共点的两条直线。',fig:'parallel-lines',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有公共点的两条直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由直线位置。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对顶角相等。</p></section></div>`},{id:'elementary_math-c3s1-8',name:'平行线',tags:["def", "der", "note"],brief:'同一平面内不相交的直线。',fig:'parallel-lines',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同一平面内不相交的直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由位置关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>同位角、内错角、同旁内角。</p></section></div>`},{id:'elementary_math-c3s1-9',name:'垂直',tags:["def", "der", "app", "note"],brief:'相交成直角的两条直线。',fig:'tri-right',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>相交成直角的两条直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>直角坐标系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>垂线段最短。</p></section></div>`},{id:'elementary_math-c3s1-10',name:'距离',tags:["def", "der", "app", "note"],brief:'两点间线段的长度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两点间线段的长度。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由度量。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何度量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>点到直线距离为垂线段长。</p></section></div>`},{id:'elementary_math-c3s1-11',name:'角平分线',tags:["def", "der", "app", "note"],brief:'将角分成相等两部分的射线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将角分成相等两部分的射线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何作图。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>角平分线上点到角两边等距。</p></section></div>`},{id:'elementary_math-c3s1-12',name:'线段垂直平分线',tags:["def", "der", "note"],brief:'过线段中点且垂直的直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>过线段中点且垂直的直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>线上点到两端等距。</p></section></div>`},{id:'elementary_math-c3s1-13',name:'对顶角',tags:["def", "der", "note"],brief:'两直线相交形成的相对的角。',fig:'parallel-lines',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两直线相交形成的相对的角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由相交。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>对顶角相等。</p></section></div>`},{id:'elementary_math-c3s1-14',name:'同位角内错角',tags:["def", "der", "note"],brief:'平行线被截形成的角。',fig:'parallel-lines',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平行线被截形成的角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由位置。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>两直线平行则同位角相等。</p></section></div>`}]},{name:'3.2 三角形',color:'#3b82f6',desc:'三角形性质与全等相似',items:[{id:'elementary_math-c3s2-1',name:'三角形分类',tags:["def", "der"],brief:'按角：锐角、直角、钝角；按边：不等边、等腰、等边。',fig:'tri-right',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>按角：锐角、直角、钝角；按边：不等边、等腰、等边。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角和边。</p></section></div>`},{id:'elementary_math-c3s2-2',name:'三角形内角和',tags:["def", "thm", "der", "app"],brief:'三内角和为 $180^\\circ$。',fig:'tri-centers',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三内角和为 $180^\\circ$。</p><div class="la-fml">$$\\angle A+\\angle B+\\angle C=180^\\circ$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\angle A+\\angle B+\\angle C=180^\\circ$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>平移一角。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角。</p></section></div>`},{id:'elementary_math-c3s2-3',name:'三角形外角',tags:["def", "der", "note"],brief:'一个外角等于不相邻两内角和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一个外角等于不相邻两内角和。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由内角和。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>外角大于任一不相邻内角。</p></section></div>`},{id:'elementary_math-c3s2-4',name:'三角形三边关系',tags:["def", "thm", "der"],brief:'两边之和大于第三边，差小于第三边。',fig:'triangle-ineq',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两边之和大于第三边，差小于第三边。</p><div class="la-fml">$$a+b>c,\\ |a-b|<c$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a+b>c,\\ |a-b|<c$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两点间线段最短。</p></section></div>`},{id:'elementary_math-c3s2-5',name:'全等三角形',tags:["def", "der", "app"],brief:'能够完全重合的三角形。',fig:'congruent-tri',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>能够完全重合的三角形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设 $\\triangle ABC$ 与 $\\triangle DEF$ 三边对应相等。将 $\\triangle DEF$ 叠放在 $\\triangle ABC$ 上使 $BC$ 与 $EF$ 重合，$A$ 与 $D$ 在 $BC$ 同侧。因 $AB=DE$，$AC=DF$，$A$ 与 $D$ 同时在以 $B(E)$ 为圆心 $AB$ 为半径的圆弧上，又在以 $C(F)$ 为圆心 $AC$ 为半径的圆弧上，两弧交点唯一，故 $A$ 与 $D$ 重合。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明边角相等。</p></section></div>`},{id:'elementary_math-c3s2-6',name:'全等判定',tags:["def", "der", "app"],brief:'SSS、SAS、ASA、AAS、HL（直角）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>SSS、SAS、ASA、AAS、HL（直角）。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>SSS：三边对应相等，两三角形可完全重合。SAS：两边及夹角对应相等，叠合后两边重合则夹角确定第三边位置唯一。ASA：两角及夹边对应相等，由角边角可确定三角形。AAS：两角及一对边相等，第三角相等转化为ASA。注意SSA不能判定全等（反例：两边及非夹角可能构成两个不同三角形）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明全等。</p></section></div>`},{id:'elementary_math-c3s2-7',name:'相似三角形',tags:["def", "der", "app"],brief:'对应角相等，对应边成比例。',fig:'similar-tri',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对应角相等，对应边成比例。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>AA判定：两角对应相等则第三角也等，由正弦定理 $\\frac{a}{\\sin A}$ 成比例，三边成比例。SAS判定：两边成比例且夹角相等，由余弦定理第三边也成比例。SSS判定：三边成比例，由余弦定理三角相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>比例、测量。</p></section></div>`},{id:'elementary_math-c3s2-8',name:'相似判定',tags:["def", "der", "app"],brief:'AA、SAS、SSS（边成比例）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>AA、SAS、SSS（边成比例）。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>AA判定：两角对应相等则第三角也等，由正弦定理三边成比例。SAS判定：两边成比例且夹角相等，由余弦定理第三边也成比例。SSS判定：三边成比例，由余弦定理三个角对应相等。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>证明相似。</p></section></div>`},{id:'elementary_math-c3s2-9',name:'等腰三角形',tags:["def", "der", "note"],brief:'有两边相等的三角形。',fig:'tri-centers',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有两边相等的三角形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由边相等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等边对等角，三线合一。</p></section></div>`},{id:'elementary_math-c3s2-10',name:'等边三角形',tags:["def", "der", "note"],brief:'三边相等的三角形。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三边相等的三角形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>特殊等腰。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三角均 $60^\\circ$。</p></section></div>`},{id:'elementary_math-c3s2-11',name:'直角三角形',tags:["def", "der", "note"],brief:'有一个直角的三角形。',fig:'tri-right',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有一个直角的三角形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>勾股定理。</p></section></div>`},{id:'elementary_math-c3s2-12',name:'勾股定理',tags:["def", "thm", "der", "app"],brief:'直角三角形两直角边平方和等于斜边平方。',fig:'pythagoras',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>直角三角形两直角边平方和等于斜边平方。</p><div class="la-fml">$$a^2+b^2=c^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$a^2+b^2=c^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>面积法。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求边长。</p></section></div>`},{id:'elementary_math-c3s2-13',name:'三角形中线',tags:["def", "der", "note"],brief:'顶点到对边中点的连线。',fig:'tri-centers',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>顶点到对边中点的连线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由中点。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三条中线交于重心。</p></section></div>`},{id:'elementary_math-c3s2-14',name:'三角形高',tags:["def", "der", "note"],brief:'顶点到对边的垂线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>顶点到对边的垂线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由垂直。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三高交于垂心。</p></section></div>`},{id:'elementary_math-c3s2-15',name:'三角形角平分线',tags:["def", "der", "note"],brief:'平分内角的线段。',fig:'circle-inscribed',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>平分内角的线段。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由角平分。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三角平分线交于内心。</p></section></div>`},{id:'elementary_math-c3s2-16',name:'重心',tags:["def", "thm", "der", "app", "note"],brief:'三条中线的交点，分中线之比为 $2:1$（顶点到重心 $:$ 重心到对边中点）。',fig:'tri-centers',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三条中线的交点，分中线之比为 $2:1$（顶点到重心 $:$ 重心到对边中点）。</p><div class="la-fml">$$G\\left(\\frac{x_1+x_2+x_3}{3},\\frac{y_1+y_2+y_3}{3}\\right)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$G\\left(\\frac{x_1+x_2+x_3}{3},\\frac{y_1+y_2+y_3}{3}\\right)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由中线向量性质：$\\overrightarrow{GA}+\\overrightarrow{GB}+\\overrightarrow{GC}=ec{0}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>物理重心。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>重心到顶点距离是到对边中点距离的 $2$ 倍；重心坐标为三顶点坐标的算术平均。</p></section></div>`},{id:'elementary_math-c3s2-17',name:'外心',tags:["def", "thm", "der", "note"],brief:'三边垂直平分线的交点，即外接圆圆心，到三顶点距离相等。',fig:'circle-circumscribed',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三边垂直平分线的交点，即外接圆圆心，到三顶点距离相等。</p><div class="la-fml">$$R=\\frac{abc}{4S}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R=\\frac{abc}{4S}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由正弦定理 $a=2R\\sin A$ 及 $S=rac{1}{2}bc\\sin A$ 推导。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>锐角三角形外心在内部，直角三角形在斜边中点，钝角三角形在外部。</p></section></div>`},{id:'elementary_math-c3s2-18',name:'内心',tags:["def", "thm", "der", "note"],brief:'三条内角平分线的交点，即内切圆圆心，到三边距离相等。',fig:'circle-inscribed',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三条内角平分线的交点，即内切圆圆心，到三边距离相等。</p><div class="la-fml">$$r=\\frac{S}{s},\\quad I\\left(\\frac{ax_A+bx_B+cx_C}{a+b+c},\\frac{ay_A+by_B+cy_C}{a+b+c}\\right)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r=\\frac{S}{s},\\quad I\\left(\\frac{ax_A+bx_B+cx_C}{a+b+c},\\frac{ay_A+by_B+cy_C}{a+b+c}\\right)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>内切圆半径 $r$：面积 $S=rs$，其中 $s=rac{a+b+c}{2}$ 为半周长。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>内心到边的距离等于内切圆半径 $r$；内心坐标按边长加权平均。</p></section></div>`},{id:'elementary_math-c3s2-19',name:'垂心',tags:["def", "der", "note"],brief:'三条高线的交点。',fig:'tri-centers',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三条高线的交点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由高。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>锐角三角形垂心在内部，直角三角形在直角顶点，钝角三角形在外部。垂心分高的两段乘积相等：$AH\\cdot HD=BH\\cdot HE=CH\\cdot HF$。</p></section></div>`},{id:'elementary_math-c3s2-20',name:'三角形面积公式二',tags:["def", "thm", "der", "app"],brief:'底乘高除以2。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>底乘高除以2。</p><div class="la-fml">$$S=\\frac{1}{2}ah$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S=\\frac{1}{2}ah$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平行四边形面积一半。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求面积。</p></section></div>`},{id:'elementary_math-c3s2-21',name:'三角形三边求角',tags:["def", "der", "app"],brief:'用余弦定理。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用余弦定理。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由余弦定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解三角形。</p></section></div>`},{id:'elementary_math-c3s2-22',name:'三角形中线公式',tags:["def", "thm", "der", "app"],brief:'中线长。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>中线长。</p><div class="la-fml">$$m_a=\\frac{1}{2}\\sqrt{2b^2+2c^2-a^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$m_a=\\frac{1}{2}\\sqrt{2b^2+2c^2-a^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由余弦定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求中线。</p></section></div>`},{id:'elementary_math-c3s2-23',name:'三角形角平分线性质',tags:["def", "der", "app"],brief:'角平分线分对边之比等于邻边之比。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>角平分线分对边之比等于邻边之比。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由面积比。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>比例。</p></section></div>`},{id:'elementary_math-c3s2-24',name:'三角形高线公式',tags:["def", "thm", "der", "app"],brief:'高的长度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>高的长度。</p><div class="la-fml">$$h_a=\\frac{2S}{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$h_a=\\frac{2S}{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由面积公式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求高。</p></section></div>`},{id:'elementary_math-c3s2-25',name:'旁心',tags:["def", "thm", "der", "note"],brief:'一内角平分线与另外两外角平分线的交点，旁切圆圆心。共三个旁心。',fig:'excenter',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>一内角平分线与另外两外角平分线的交点，旁切圆圆心。共三个旁心。</p><div class="la-fml">$$r_a=\\frac{S}{s-a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r_a=\\frac{S}{s-a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>旁切圆半径 $r_a$ 对应边 $a$：$S=r_a(s-a)$。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>旁心到三边所在直线距离相等；$r_a=rac{S}{s-a}$，$r_b=rac{S}{s-b}$，$r_c=rac{S}{s-c}$。</p></section></div>`},{id:'elementary_math-c3s2-26',name:'欧拉线',tags:["def", "thm", "der", "note"],brief:'三角形的外心 $O$、重心 $G$、垂心 $H$ 共线，此直线称为欧拉线。',fig:'euler-line',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形的外心 $O$、重心 $G$、垂心 $H$ 共线，此直线称为欧拉线。</p><div class="la-fml">$$\\overrightarrow{OH}=\\overrightarrow{OA}+\\overrightarrow{OB}+\\overrightarrow{OC},\\quad OG:GH=1:2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\overrightarrow{OH}=\\overrightarrow{OA}+\\overrightarrow{OB}+\\overrightarrow{OC},\\quad OG:GH=1:2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由向量关系 $\\overrightarrow{OH}=\\overrightarrow{OA}+\\overrightarrow{OB}+\\overrightarrow{OC}$ 及重心 $\\overrightarrow{OG}=rac{1}{3}(\\overrightarrow{OA}+\\overrightarrow{OB}+\\overrightarrow{OC})$ 得 $O,G,H$ 共线且 $OG:GH=1:2$。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>欧拉线是三角形最重要的特征线之一；正三角形中 $O,G,H$ 重合。</p></section></div>`},{id:'elementary_math-c3s2-27',name:'九点圆',tags:["def", "thm", "der", "note"],brief:'三角形三边中点、三条高的垂足、三顶点到垂心线段的中点，这九个点共圆。',fig:'nine-point-circle',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形三边中点、三条高的垂足、三顶点到垂心线段的中点，这九个点共圆。</p><div class="la-fml">$$R_9=\\frac{R}{2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$R_9=\\frac{R}{2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>九点圆的圆心是 $OH$ 的中点，半径为外接圆半径的一半。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>九点圆又称欧拉圆、费尔巴哈圆；与内切圆、旁切圆均相切（费尔巴哈定理）。</p></section></div>`},{id:'elementary_math-c3s2-28',name:'费马点',tags:["def", "der", "note"],brief:'到三角形三顶点距离之和最小的点。',fig:'fermat-point',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>到三角形三顶点距离之和最小的点。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>当三角形各内角均小于 $120°$ 时，费马点 $F$ 满足 $ngle AFB=ngle BFC=ngle CFA=120°$。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>若有一内角 $\\geq 120°$，则该角顶点即为费马点；可通过向外作等边三角形构造。</p></section></div>`},{id:'elementary_math-c3s2-29',name:'三角形五心二级结论',tags:["def", "thm", "der", "note"],brief:'重心 $G$、外心 $O$、内心 $I$、垂心 $H$、旁心 $I_a,I_b,I_c$ 的位置与度量关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>重心 $G$、外心 $O$、内心 $I$、垂心 $H$、旁心 $I_a,I_b,I_c$ 的位置与度量关系。</p><div class="la-fml">$$OI^2=R^2-2Rr,\\quad IG^2=r^2+4R^2\\cos A\\cos B\\cos C-\\frac{a^2+b^2+c^2}{9}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$OI^2=R^2-2Rr,\\quad IG^2=r^2+4R^2\\cos A\\cos B\\cos C-\\frac{a^2+b^2+c^2}{9}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>欧拉公式 $OI^2=R^2-2Rr$ 联系外心与内心距离。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>正三角形中五心合一；等腰三角形中五心共对称轴；直角三角形中外心在斜边中点、垂心在直角顶点。</p></section></div>`}]},{name:'3.3 圆',color:'#6366f1',desc:'圆的性质与定理',items:[{id:'elementary_math-c3s3-1',name:'圆的定义',tags:["def", "thm", "der", "app"],brief:'到定点距离等于定长的点集。',fig:'circle-parts',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>到定点距离等于定长的点集。</p><div class="la-fml">$$(x-a)^2+(y-b)^2=r^2$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(x-a)^2+(y-b)^2=r^2$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由距离。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何基础。</p></section></div>`},{id:'elementary_math-c3s3-2',name:'垂径定理',tags:["def", "der", "app"],brief:'垂直于弦的直径平分弦。',fig:'tangent-chord',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>垂直于弦的直径平分弦。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设 $CD$ 是 $\\odot O$ 的直径，$AB\\perp CD$ 于 $M$。连 $OA,OB$。$OA=OB$（半径），$OM$ 公共，$\\angle OMA=\\angle OMB=90°$，故 $\\triangle OAM\\cong\\triangle OBM$（HL），$AM=MB$，$\\widehat{AC}=\\widehat{BC}$，$\\widehat{AD}=\\widehat{BD}$。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求弦长。</p></section></div>`},{id:'elementary_math-c3s3-3',name:'圆心角',tags:["def", "der", "note"],brief:'顶点在圆心的角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>顶点在圆心的角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等于所对弧的度数。</p></section></div>`},{id:'elementary_math-c3s3-4',name:'圆周角',tags:["def", "der", "note"],brief:'顶点在圆上的角。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>顶点在圆上的角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>圆周角 $\\angle BAC$ 对弧 $BC$。分三种情况：(1) 圆心 $O$ 在 $\\angle BAC$ 内部：连 $AO$ 延长交圆于 $D$，$\\angle BAC=\\angle BAD+\\angle DAC$，由等腰 $\\triangle OAB$ 得 $\\angle BAD=90°-\\angle AOB/2$，同理 $\\angle DAC=90°-\\angle AOC/2$，故 $\\angle BAC=180°-(\\angle AOB+\\angle AOC)/2=\\frac{1}{2}\\angle BOC$。(2) 圆心在角边上，(3) 圆心在角外，类似证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>等于所对弧度数的一半。</p></section></div>`},{id:'elementary_math-c3s3-5',name:'圆周角定理',tags:["def", "der", "app"],brief:'同弧所对圆周角等于圆心角的一半。',fig:'intersecting-chords',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>同弧所对圆周角等于圆心角的一半。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>圆周角 $\\angle BAC$ 对弧 $BC$。分三种情况：(1) 圆心 $O$ 在 $\\angle BAC$ 内部：连 $AO$ 延长交圆于 $D$，$\\angle BAC=\\angle BAD+\\angle DAC$，由等腰 $\\triangle OAB$ 得 $\\angle BAD=90°-\\angle AOB/2$，同理 $\\angle DAC=90°-\\angle AOC/2$，故 $\\angle BAC=180°-(\\angle AOB+\\angle AOC)/2=\\frac{1}{2}\\angle BOC$。(2) 圆心在角边上，(3) 圆心在角外，类似证明。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求角。</p></section></div>`},{id:'elementary_math-c3s3-6',name:'直径所对圆周角',tags:["def", "der", "app"],brief:'直径所对圆周角为直角。',fig:'circle-circumscribed',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>直径所对圆周角为直角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由圆周角定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>构造直角。</p></section></div>`},{id:'elementary_math-c3s3-7',name:'切线',tags:["def", "der", "note"],brief:'与圆只有一个公共点的直线。',fig:'tangent-chord',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>与圆只有一个公共点的直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>从圆外一点 $P$ 作两切线 $PA,PB$，$A,B$ 为切点。连 $OA,OB,OP$。因 $OA\\perp PA$，$OB\\perp PB$（切线性质），$OA=OB$（半径），$OP$ 公共，故 $\\triangle OAP\\cong\\triangle OBP$（HL），得 $PA=PB$。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>切线垂直于过切点的半径。</p></section></div>`},{id:'elementary_math-c3s3-8',name:'切线长定理',tags:["def", "der"],brief:'从圆外一点引两条切线，切线长相等。',fig:'secant-tangent',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从圆外一点引两条切线，切线长相等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>从圆外一点 $P$ 作两切线 $PA,PB$，$A,B$ 为切点。连 $OA,OB,OP$。因 $OA\\perp PA$，$OB\\perp PB$（切线性质），$OA=OB$（半径），$OP$ 公共，故 $\\triangle OAP\\cong\\triangle OBP$（HL），得 $PA=PB$。</p></section></div>`},{id:'elementary_math-c3s3-9',name:'弦切角定理',tags:["def", "der"],brief:'弦切角等于所夹弧的圆周角。',fig:'tangent-chord',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>弦切角等于所夹弧的圆周角。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>弦切角 $\\angle BAC$（$AB$ 为切线，$AC$ 为弦）等于所夹弧 $\\widehat{AC}$ 所对圆周角。设 $D$ 为弧 $AC$ 上一点，圆心角 $\\angle AOC=2\\angle ADC$。又 $\\angle BAC=180°-\\angle OAC-\\angle OAB$，由 $OA\\perp AB$ 得 $\\angle OAB=90°$，$\\angle BAC=90°-\\angle OAC$，而 $\\angle ADC=90°-\\angle OAC$（等腰 $\\triangle OAC$），故 $\\angle BAC=\\angle ADC$。</p></section></div>`},{id:'elementary_math-c3s3-10',name:'相交弦定理',tags:["def", "thm", "der"],brief:'圆内两弦相交，被交点分成的两段积相等。',fig:'intersecting-chords',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>圆内两弦相交，被交点分成的两段积相等。</p><div class="la-fml">$$PA\\cdot PB=PC\\cdot PD$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$PA\\cdot PB=PC\\cdot PD$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>两弦 $AB,CD$ 交于 $P$。连 $AC,BD$。$\\angle APC=\\angle BPD$（对顶角），$\\angle BAC=\\angle BDC$（同弧所对圆周角），故 $\\triangle APC\\sim\\triangle DPB$，$PA\\cdot PB=PC\\cdot PD$。</p></section></div>`},{id:'elementary_math-c3s3-11',name:'切割线定理',tags:["def", "thm", "der"],brief:'切线长平方等于割线两段积。',fig:'secant-tangent',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>切线长平方等于割线两段积。</p><div class="la-fml">$$PT^2=PA\\cdot PB$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$PT^2=PA\\cdot PB$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>从圆外 $P$ 作切线 $PT$（$T$ 为切点）和割线 $PAB$（交圆于 $A,B$）。连 $TA,TB$。$\\angle PTA=\\angle TBA$（弦切角等于所夹弧所对圆周角），$\\angle P$ 公共，故 $\\triangle PTA\\sim\\triangle PBT$，$PT^2=PA\\cdot PB$。</p></section></div>`},{id:'elementary_math-c3s3-12',name:'圆与圆位置',tags:["def", "der", "note"],brief:'外离、外切、相交、内切、内含。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>外离、外切、相交、内切、内含。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由圆心距与半径关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$d>R+r$ 外离，$d=R+r$ 外切。</p></section></div>`},{id:'elementary_math-c3s3-13',name:'正多边形与圆',tags:["def", "der", "app"],brief:'各边相等各角相等的多边形。',fig:'circle-parts',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>各边相等各角相等的多边形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等分圆周。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>作图。</p></section></div>`},{id:'elementary_math-c3s3-14',name:'扇形',tags:["def", "thm", "der", "app", "note"],brief:'由两条半径和弧围成的图形。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由两条半径和弧围成的图形。</p><div class="la-fml">$$S=\\frac{n\\pi r^2}{360}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S=\\frac{n\\pi r^2}{360}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>圆的部分。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>面积计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>弧长 $l=n\\pi r/180$。</p></section></div>`},{id:'elementary_math-c3s3-15',name:'弓形',tags:["def", "der", "app"],brief:'由弦和弧围成的图形。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由弦和弧围成的图形。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>扇形减三角形。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>面积计算。</p></section></div>`},{id:'elementary_math-c3s3-16',name:'圆心角定理',tags:["def", "der", "app"],brief:'圆心角等于所对弧的度数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>圆心角等于所对弧的度数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求弧。</p></section></div>`},{id:'elementary_math-c3s3-17',name:'弧长公式',tags:["def", "thm", "der", "app"],brief:'弧长计算。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>弧长计算。</p><div class="la-fml">$$l=\\frac{n\\pi r}{180}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$l=\\frac{n\\pi r}{180}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由圆周比例。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求弧长。</p></section></div>`},{id:'elementary_math-c3s3-18',name:'扇形面积公式二',tags:["def", "thm", "der", "app"],brief:'用弧长和半径。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用弧长和半径。</p><div class="la-fml">$$S=\\frac{1}{2}lr$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$S=\\frac{1}{2}lr$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由比例。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>扇形面积。</p></section></div>`},{id:'elementary_math-c3s3-19',name:'圆内接四边形',tags:["def", "der", "app"],brief:'对角互补。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对角互补。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由圆周角。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆内接图形。</p></section></div>`},{id:'elementary_math-c3s3-20',name:'圆外切四边形',tags:["def", "der", "app"],brief:'对边和相等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对边和相等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由切线长。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆外切图形。</p></section></div>`},{id:'elementary_math-c3s3-21',name:'两圆公切线',tags:["def", "der", "app", "note"],brief:'与两圆都相切的直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>与两圆都相切的直线。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由切线。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>两圆位置。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>外公切线、内公切线。</p></section></div>`},{id:'elementary_math-c3s3-22',name:'托勒密定理',tags:["def", "thm", "der", "note"],brief:'圆内接四边形两组对边乘积之和等于对角线乘积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>圆内接四边形两组对边乘积之和等于对角线乘积。</p><div class="la-fml">$$AB\\cdot CD+AD\\cdot BC=AC\\cdot BD$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$AB\\cdot CD+AD\\cdot BC=AC\\cdot BD$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>圆内接四边形 ABCD 中，取点 E 使角ABE=角DBC。则三角形ABE相似三角形DBC（AA），AB*CD=AE*BD。又三角形ABD相似三角形EBC，AD*BC=EC*BD。相加得 AB*CD+AD*BC=(AE+EC)*BD=AC*BD。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>托勒密不等式：对任意四边形 AB*CD+AD*BC>=AC*BD，等号当且仅当四点共圆。</p></section></div>`},{id:'elementary_math-c3s3-23',name:'梅涅劳斯定理',tags:["def", "thm", "der", "note"],brief:'若一条直线与三角形ABC的三边BC,CA,AB（或延长线）分别交于D,E,F，则上述乘积等于1。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若一条直线与三角形ABC的三边BC,CA,AB（或延长线）分别交于D,E,F，则上述乘积等于1。</p><div class="la-fml">$$\\frac{AF}{FB}\\cdot\\frac{BD}{DC}\\cdot\\frac{CE}{EA}=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{AF}{FB}\\cdot\\frac{BD}{DC}\\cdot\\frac{CE}{EA}=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设D,E,F共线。过C作CG平行AB交DE于G。三角形CDG相似三角形BDE得CD/BD=CG/BE，三角形AFE相似三角形CGE得AF/CG=AE/CE。消去CG得 AF/FB*BD/DC*CE/EA=1。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>逆定理也成立：若上述乘积为1，则D,E,F三点共线。常用于证明共线问题。</p></section></div>`},{id:'elementary_math-c3s3-24',name:'塞瓦定理',tags:["def", "thm", "der", "note"],brief:'若三角形ABC内一点O到三顶点连线AO,BO,CO分别交对边于D,E,F，则上述乘积等于1。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若三角形ABC内一点O到三顶点连线AO,BO,CO分别交对边于D,E,F，则上述乘积等于1。</p><div class="la-fml">$$\\frac{BD}{DC}\\cdot\\frac{CE}{EA}\\cdot\\frac{AF}{FB}=1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{BD}{DC}\\cdot\\frac{CE}{EA}\\cdot\\frac{AF}{FB}=1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>设AD,BE,CF共点于O。对三角形ABE用梅涅劳斯定理（截线C-O-D），对三角形AEC截线B-O-F，两式相除整理得 BD/DC*CE/EA*AF/FB=1。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>逆定理也成立。塞瓦定理常用于证明三线共点问题。</p></section></div>`}]},{name:'3.4 向量',color:'#8b5cf6',desc:'向量运算',items:[{id:'elementary_math-c3s4-1',name:'向量概念',tags:["def", "der", "app", "note"],brief:'既有大小又有方向的量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>既有大小又有方向的量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由物理量抽象。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>力、速度。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>用有向线段表示。</p></section></div>`},{id:'elementary_math-c3s4-2',name:'向量加法',tags:["def", "der", "app"],brief:'三角形法则或平行四边形法则。',fig:'vector-add',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>三角形法则或平行四边形法则。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由位移合成。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>力合成。</p></section></div>`},{id:'elementary_math-c3s4-3',name:'向量减法',tags:["def", "thm", "der"
