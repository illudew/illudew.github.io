name:'超几何分布',tags:["def", "der", "app", "note"],brief:'有限总体不放回抽样。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>有限总体不放回抽样。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由组合。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抽样检测。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$N$ 件中 $M$ 件次品抽 $n$ 件。</p></section></div>`},{id:'elementary_math-c4s2-19',name:'正态分布',tags:["def", "thm", "der", "app", "note"],brief:'钟形对称分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>钟形对称分布。</p><div class="la-fml">$$X\\sim N(\\mu,\\sigma^2)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$X\\sim N(\\mu,\\sigma^2)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由中心极限。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>身高、测量误差。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$\\mu$ 均值，$\\sigma$ 标准差。</p></section></div>`},{id:'elementary_math-c4s2-20',name:'几何概型约会问题',tags:["def", "der", "app"],brief:'两人在时间段内到达，求相遇概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两人在时间段内到达，求相遇概率。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>面积比。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何概型经典。</p></section></div>`},{id:'elementary_math-c4s2-21',name:'概率加法公式',tags:["def", "thm", "der", "app"],brief:'并事件概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>并事件概率。</p><div class="la-fml">$$P(A\\cup B)=P(A)+P(B)-P(AB)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A\\cup B)=P(A)+P(B)-P(AB)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由容斥。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求并概率。</p></section></div>`},{id:'elementary_math-c4s2-22',name:'概率乘法公式',tags:["def", "thm", "der", "app"],brief:'交事件概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>交事件概率。</p><div class="la-fml">$$P(AB)=P(A)P(B|A)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(AB)=P(A)P(B|A)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由条件概率。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求交概率。</p></section></div>`},{id:'elementary_math-c4s2-23',name:'完备事件组',tags:["def", "der", "app"],brief:'互斥且并为全集的事件组。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>互斥且并为全集的事件组。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由划分。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>全概率公式。</p></section></div>`},{id:'elementary_math-c4s2-24',name:'伯努利试验',tags:["def", "der", "app", "note"],brief:'只有两种结果的独立重复试验。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>只有两种结果的独立重复试验。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由独立性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>二项分布。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$n$ 次成功 $k$ 次服从 $B(n,p)$。</p></section></div>`},{id:'elementary_math-c4s2-25',name:'几何分布',tags:["def", "thm", "der", "app", "note"],brief:'首次成功所需试验次数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>首次成功所需试验次数。</p><div class="la-fml">$$P(X=k)=(1-p)^{k-1}p$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(X=k)=(1-p)^{k-1}p$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由独立事件。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等待时间。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$E(X)=1/p$。</p></section></div>`},{id:'elementary_math-c4s2-26',name:'泊松分布',tags:["def", "thm", "der", "app", "note"],brief:'稀有事件发生次数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>稀有事件发生次数。</p><div class="la-fml">$$P(X=k)=\\frac{\\lambda^k e^{-\\lambda}}{k!}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(X=k)=\\frac{\\lambda^k e^{-\\lambda}}{k!}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由二项分布极限。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>排队、计数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$E(X)=\\lambda$。</p></section></div>`},{id:'elementary_math-c4s2-27',name:'条件概率性质',tags:["def", "der", "app"],brief:'条件概率满足概率公理。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>条件概率满足概率公理。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>依赖事件。</p></section></div>`},{id:'elementary_math-c4s2-28',name:'独立重复试验应用',tags:["def", "der", "app"],brief:'用二项分布解决实际问题。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用二项分布解决实际问题。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由伯努利试验。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>质量控制。</p></section></div>`},{id:'elementary_math-c4s2-29',name:'随机变量函数',tags:["def", "der", "app"],brief:'$Y=g(X)$ 的分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$Y=g(X)$ 的分布。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由变换。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>衍生随机变量。</p></section></div>`},{id:'elementary_math-c4s2-30',name:'数学期望性质',tags:["def", "thm", "der", "app", "note"],brief:'期望线性性。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>期望线性性。</p><div class="la-fml">$$E(aX+bY)=aE(X)+bE(Y)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E(aX+bY)=aE(X)+bE(Y)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>期望计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>无需独立。</p></section></div>`},{id:'elementary_math-c4s2-31',name:'方差性质',tags:["def", "thm", "der", "app", "note"],brief:'方差性质。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>方差性质。</p><div class="la-fml">$$D(aX+b)=a^2D(X)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$D(aX+b)=a^2D(X)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>方差计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$D(X)=E(X^2)-[E(X)]^2$。</p></section></div>`},{id:'elementary_math-c4s2-32',name:'概率基本性质',tags:["def", "thm", "der", "app", "note"],brief:'概率非负有界。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>概率非负有界。</p><div class="la-fml">$$0\\leq P(A)\\leq 1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$0\\leq P(A)\\leq 1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>概率基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$P(\\Omega)=1$。</p></section></div>`},{id:'elementary_math-c4s2-33',name:'互斥事件概率',tags:["def", "thm", "der", "app"],brief:'互斥事件和的概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>互斥事件和的概率。</p><div class="la-fml">$$P(A\\cup B)=P(A)+P(B)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A\\cup B)=P(A)+P(B)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由互斥。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>求并概率。</p></section></div>`},{id:'elementary_math-c4s2-34',name:'对立事件概率',tags:["def", "thm", "der", "app"],brief:'对立事件概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对立事件概率。</p><div class="la-fml">$$P(\\bar{A})=1-P(A)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(\\bar{A})=1-P(A)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对立。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化计算。</p></section></div>`},{id:'elementary_math-c4s2-35',name:'独立事件概率',tags:["def", "thm", "der", "app"],brief:'独立事件交的概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>独立事件交的概率。</p><div class="la-fml">$$P(AB)=P(A)P(B)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(AB)=P(A)P(B)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由独立。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>联合概率。</p></section></div>`},{id:'elementary_math-c4s2-36',name:'古典概型应用',tags:["def", "der", "app"],brief:'掷骰子、摸球、抽签。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>掷骰子、摸球、抽签。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等可能。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实际问题。</p></section></div>`},{id:'elementary_math-c4s2-37',name:'条件概率应用',tags:["def", "der", "app"],brief:'依赖事件概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>依赖事件概率。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由条件概率。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实际问题。</p></section></div>`}]},{name:'4.3 统计',color:'#6366f1',desc:'数据收集与分析',items:[{id:'elementary_math-c4s3-1',name:'总体与样本',tags:["def", "der", "app", "note"],brief:'研究对象全体为总体，部分为样本。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>研究对象全体为总体，部分为样本。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由统计定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抽样推断。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>样本应具代表性。</p></section></div>`},{id:'elementary_math-c4s3-2',name:'随机抽样',tags:["def", "der", "app", "note"],brief:'每个个体被等可能抽取。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>每个个体被等可能抽取。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由随机性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>获取样本。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>简单随机、系统、分层。</p></section></div>`},{id:'elementary_math-c4s3-3',name:'分层抽样',tags:["def", "der", "app", "note"],brief:'按比例从各层抽取。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>按比例从各层抽取。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分层。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>均匀样本。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>各层比例与总体一致。</p></section></div>`},{id:'elementary_math-c4s3-4',name:'频数与频率',tags:["def", "der", "app", "note"],brief:'频数为出现次数，频率为频数/总数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>频数为出现次数，频率为频数/总数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由统计。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数据分布。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>频率和为 $1$。</p></section></div>`},{id:'elementary_math-c4s3-5',name:'频率分布直方图',tags:["def", "der", "app", "note"],brief:'用矩形表示频率分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用矩形表示频率分布。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分组。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展示分布。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>面积为频率。</p></section></div>`},{id:'elementary_math-c4s3-6',name:'平均数',tags:["def", "thm", "der", "app", "note"],brief:'数据的平均值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>数据的平均值。</p><div class="la-fml">$$\\bar{x}=\\frac{1}{n}\\sum x_i$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\bar{x}=\\frac{1}{n}\\sum x_i$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平均。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>集中趋势。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>受极端值影响。</p></section></div>`},{id:'elementary_math-c4s3-7',name:'中位数',tags:["def", "der", "app", "note"],brief:'排序后中间位置的数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>排序后中间位置的数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由排序。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>集中趋势。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>不受极端值影响。</p></section></div>`},{id:'elementary_math-c4s3-8',name:'众数',tags:["def", "der", "app", "note"],brief:'出现次数最多的数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>出现次数最多的数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由频数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>集中趋势。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>可能不唯一。</p></section></div>`},{id:'elementary_math-c4s3-9',name:'标准差',tags:["def", "thm", "der", "app", "note"],brief:'方差的算术平方根。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>方差的算术平方根。</p><div class="la-fml">$$s=\\sqrt{\\frac{1}{n}\\sum(x_i-\\bar{x})^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$s=\\sqrt{\\frac{1}{n}\\sum(x_i-\\bar{x})^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方差。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>波动大小。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与原数据单位相同。</p></section></div>`},{id:'elementary_math-c4s3-10',name:'线性相关',tags:["def", "der", "app", "note"],brief:'两变量线性关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两变量线性关系。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由散点图。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>变量关系。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>相关不代表因果。</p></section></div>`},{id:'elementary_math-c4s3-11',name:'回归直线',tags:["def", "thm", "der", "app", "note"],brief:'最小二乘拟合直线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>最小二乘拟合直线。</p><div class="la-fml">$$\\hat{y}=bx+a$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\hat{y}=bx+a$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>使残差平方和最小。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>预测。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>过样本中心 $(ar{x},ar{y})$。</p></section></div>`},{id:'elementary_math-c4s3-12',name:'相关系数',tags:["def", "thm", "der", "app", "note"],brief:'线性相关程度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>线性相关程度。</p><div class="la-fml">$$r=\\frac{\\sum(x_i-\\bar{x})(y_i-\\bar{y})}{\\sqrt{\\sum(x_i-\\bar{x})^2\\sum(y_i-\\bar{y})^2}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r=\\frac{\\sum(x_i-\\bar{x})(y_i-\\bar{y})}{\\sqrt{\\sum(x_i-\\bar{x})^2\\sum(y_i-\\bar{y})^2}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>标准化协方差。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>相关性检验。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$|r|\\leq 1$。</p></section></div>`},{id:'elementary_math-c4s3-13',name:'最小二乘法',tags:["def", "der", "app", "note"],brief:'使残差平方和最小的方法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>使残差平方和最小的方法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>求偏导。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>曲线拟合。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>回归核心方法。</p></section></div>`},{id:'elementary_math-c4s3-14',name:'独立性检验',tags:["def", "der", "app", "note"],brief:'检验两分类变量是否有关联。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>检验两分类变量是否有关联。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>卡方检验。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>列联表。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>构造 $K^2$ 统计量。</p></section></div>`},{id:'elementary_math-c4s3-15',name:'统计决策',tags:["def", "der", "app", "note"],brief:'基于数据做决策。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>基于数据做决策。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>假设检验、估计。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>质量管理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>权衡两类错误。</p></section></div>`},{id:'elementary_math-c4s3-16',name:'简单随机抽样',tags:["def", "der", "app", "note"],brief:'每个个体等可能被抽。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>每个个体等可能被抽。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由随机性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>获取样本。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>抽签法、随机数法。</p></section></div>`},{id:'elementary_math-c4s3-17',name:'系统抽样',tags:["def", "der", "app", "note"],brief:'等距抽样。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>等距抽样。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由间隔。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>大规模抽样。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$k=N/n$。</p></section></div>`},{id:'elementary_math-c4s3-18',name:'分层抽样步骤',tags:["def", "der", "app"],brief:'分层、按比、合并。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分层、按比、合并。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分层。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>均匀样本。</p></section></div>`},{id:'elementary_math-c4s3-19',name:'频率分布表',tags:["def", "der", "app"],brief:'分组统计频率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分组统计频率。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分组。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展示分布。</p></section></div>`},{id:'elementary_math-c4s3-20',name:'茎叶图',tags:["def", "der", "app"],brief:'用茎和叶表示数据。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用茎和叶表示数据。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由数位。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展示数据。</p></section></div>`},{id:'elementary_math-c4s3-21',name:'箱线图',tags:["def", "der", "app"],brief:'用五数概括数据。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用五数概括数据。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分位数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展示分布。</p></section></div>`},{id:'elementary_math-c4s3-22',name:'数据离散程度',tags:["def", "der", "app"],brief:'极差、方差、标准差。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>极差、方差、标准差。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由分散度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>比较波动。</p></section></div>`},{id:'elementary_math-c4s3-23',name:'回归直线应用',tags:["def", "der", "app", "note"],brief:'用回归方程预测。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用回归方程预测。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由最小二乘。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>预测。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>外推需谨慎。</p></section></div>`},{id:'elementary_math-c4s3-24',name:'残差分析',tags:["def", "der", "app"],brief:'分析残差判断模型。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>分析残差判断模型。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由残差。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>模型检验。</p></section></div>`},{id:'elementary_math-c4s3-25',name:'卡方检验',tags:["def", "thm", "der", "app"],brief:'观测与期望差异。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>观测与期望差异。</p><div class="la-fml">$$\\chi^2=\\sum\\frac{(f_o-f_e)^2}{f_e}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\chi^2=\\sum\\frac{(f_o-f_e)^2}{f_e}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由皮尔逊。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>独立性检验。</p></section></div>`},{id:'elementary_math-c4s3-26',name:'正态分布应用',tags:["def", "der", "app", "note"],brief:'$3\\sigma$ 原则。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>$3\\sigma$ 原则。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由正态密度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>质量控制。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>$P(\\mu-3\\sigma<X<\\mu+3\\sigma)pprox 0.997$。</p></section></div>`},{id:'elementary_math-c4s3-27',name:'抽样调查',tags:["def", "der", "app"],brief:'从总体抽样本推断总体。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从总体抽样本推断总体。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由统计推断。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>民意调查。</p></section></div>`},{id:'elementary_math-c4s3-28',name:'统计图表',tags:["def", "der", "app"],brief:'条形图、折线图、扇形图。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>条形图、折线图、扇形图。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由可视化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展示数据。</p></section></div>`},{id:'elementary_math-c4s3-29',name:'统计调查方式',tags:["def", "der", "app"],brief:'普查、抽样调查。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>普查、抽样调查。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由调查范围。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数据收集。</p></section></div>`},{id:'elementary_math-c4s3-30',name:'数据平均数计算',tags:["def", "der", "app"],brief:'算术平均。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>算术平均。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由求和除以个数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述集中趋势。</p></section></div>`},{id:'elementary_math-c4s3-31',name:'数据方差意义',tags:["def", "der", "app"],brief:'方差越大波动越大。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>方差越大波动越大。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由偏离。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>比较稳定性。</p></section></div>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
</html>
