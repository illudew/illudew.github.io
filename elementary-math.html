一定顺序排成一列。</p><div class="la-fml">$$A_n^m=\\frac{n!}{(n-m)!}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$A_n^m=\\frac{n!}{(n-m)!}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>第一个位置n种，第二个n-1种，...，第m个n-m+1种。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>有序选取。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>0!=1；Aₙⁿ=n!。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合数学。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>可重复排列nᵐ。</p></section></div>`},{id:'elementary_math-c4s1-4',name:'阶乘',tags:["def", "thm", "der", "app", "note"],brief:'n的阶乘是1到n的连乘积。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n的阶乘是1到n的连乘积。</p><div class="la-fml">$$n!=n(n-1)\\cdots 2\\cdot 1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$n!=n(n-1)\\cdots 2\\cdot 1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>全排列数。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>排列组合计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>0!=1（约定）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>阶乘概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>斯特林公式近似n!≈√(2πn)(n/e)ⁿ。</p></section></div>`},{id:'elementary_math-c4s1-5',name:'组合',tags:["def", "thm", "der", "app", "note"],brief:'从n个不同元素中取m个并成一组（不计顺序）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从n个不同元素中取m个并成一组（不计顺序）。</p><div class="la-fml">$$C_n^m=\\frac{A_n^m}{m!}=\\frac{n!}{m!(n-m)!}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C_n^m=\\frac{A_n^m}{m!}=\\frac{n!}{m!(n-m)!}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>排列数除以m!（每组的排列数）。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>无序选取。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Cₙᵐ=Cₙⁿ⁻ᵐ；Cₙ⁰=1。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合数学。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二项式系数。</p></section></div>`},{id:'elementary_math-c4s1-6',name:'组合数性质',tags:["def", "thm", "der", "app", "note"],brief:'组合数的对称性：Cₙᵐ=Cₙⁿ⁻ᵐ。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>组合数的对称性：Cₙᵐ=Cₙⁿ⁻ᵐ。</p><div class="la-fml">$$C_n^m=C_n^{n-m}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C_n^m=C_n^{n-m}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>取m个等价于留n-m个。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Cₙᵐ+Cₙᵐ⁻¹=Cₙ₊₁ᵐ（帕斯卡恒等式）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合恒等式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>杨辉三角的性质。</p></section></div>`},{id:'elementary_math-c4s1-7',name:'组合数性质2',tags:["def", "thm", "der", "app", "note"],brief:'帕斯卡恒等式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>帕斯卡恒等式。</p><div class="la-fml">$$C_n^m=C_{n-1}^m+C_{n-1}^{m-1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C_n^m=C_{n-1}^m+C_{n-1}^{m-1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>第n个元素取或不取。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>递推计算组合数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是杨辉三角的生成规律。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>帕斯卡1654年系统研究。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二项式定理的系数关系。</p></section></div>`},{id:'elementary_math-c4s1-8',name:'二项式定理',tags:["def", "thm", "der", "app", "note"],brief:'(a+b)ⁿ的展开式。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>(a+b)ⁿ的展开式。</p><div class="la-fml">$$(a+b)^n=\\sum_{k=0}^n C_n^k a^{n-k}b^k$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$(a+b)^n=\\sum_{k=0}^n C_n^k a^{n-k}b^k$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>数学归纳法或组合意义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>二项式展开、近似计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>第k+1项Tₖ₊₁=Cₙᵏaⁿ⁻ᵏbᵏ。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>牛顿推广到任意指数。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二项分布的概率公式。</p></section></div>`},{id:'elementary_math-c4s1-9',name:'二项式系数',tags:["def", "thm", "der", "app", "note"],brief:'二项式展开式的系数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>二项式展开式的系数。</p><div class="la-fml">$$C_n^k$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C_n^k$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由组合意义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>展开式系数。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>系数和=2ⁿ；奇数项和=偶数项和=2ⁿ⁻¹。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>杨辉三角。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>最大系数在中间项。</p></section></div>`},{id:'elementary_math-c4s1-10',name:'排列组合应用',tags:["def", "der", "app", "note"],brief:'计数问题的核心：判断有序（排列）还是无序（组合），分类还是分步。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>计数问题的核心：判断有序（排列）还是无序（组合），分类还是分步。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由计数原理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>实际计数问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>先选后排、捆绑法、插空法、隔板法。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合数学。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>复杂计数需灵活运用。</p></section></div>`},{id:'elementary_math-c4s1-11',name:'捆绑法',tags:["def", "der", "app", "note"],brief:'要求相邻的元素先捆绑成一个整体再排列。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>要求相邻的元素先捆绑成一个整体再排列。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>处理相邻问题。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>排队问题（相邻）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>捆绑后内部还要排列。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>计数技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与插空法对偶。</p></section></div>`},{id:'elementary_math-c4s1-12',name:'插空法',tags:["def", "der", "app", "note"],brief:'要求不相邻的元素先排其他元素，再插入空隙。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>要求不相邻的元素先排其他元素，再插入空隙。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>处理不相邻问题。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>排队问题（不相邻）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>n个元素有n+1个空隙。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>计数技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与捆绑法对偶。</p></section></div>`},{id:'elementary_math-c4s1-13',name:'隔板法',tags:["def", "thm", "der", "app", "note"],brief:'将n个相同元素分给m个人（每人至少1个）的方法数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将n个相同元素分给m个人（每人至少1个）的方法数。</p><div class="la-fml">$$C_{n-1}^{m-1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$C_{n-1}^{m-1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>n个元素间有n-1个空隙，插m-1个隔板。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分配问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>要求元素相同且每人至少1个。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>计数技巧。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>允许0个时转化为n+m-1个元素插m-1个隔板。</p></section></div>`},{id:'elementary_math-c4s1-14',name:'圆排列',tags:["def", "thm", "der", "app", "note"],brief:'n个人围圆桌坐的方法数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n个人围圆桌坐的方法数。</p><div class="la-fml">$$A_n=\\frac{(n-1)!}{1}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$A_n=\\frac{(n-1)!}{1}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>固定一人后其余n-1人排列。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>圆桌座位安排。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>圆排列数=(n-1)!。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合数学。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>项链排列除以2（翻转相同）。</p></section></div>`},{id:'elementary_math-c4s1-15',name:'可重复排列',tags:["def", "thm", "der", "app", "note"],brief:'从n个不同元素中可重复取m个的排列数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从n个不同元素中可重复取m个的排列数。</p><div class="la-fml">$$n^m$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$n^m$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>每个位置n种选择，共m个位置。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>密码、编码。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>允许重复选取。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合数学。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与不可重复排列的区别。</p></section></div>`},{id:'elementary_math-c4s1-16',name:'错位排列',tags:["def", "thm", "der", "app", "note"],brief:'n封信全部装错信封的方法数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n封信全部装错信封的方法数。</p><div class="la-fml">$$D_n=n!\\sum_{k=0}^n\\frac{(-1)^k}{k!}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$D_n=n!\\sum_{k=0}^n\\frac{(-1)^k}{k!}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>容斥原理：总数减去至少一封正确。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>信封问题、排列组合。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>D₄=9，D₅=44。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>蒙莫尔问题。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>Dₙ/n!→1/e。</p></section></div>`},{id:'elementary_math-c4s1-17',name:'多重集排列',tags:["def", "thm", "der", "app", "note"],brief:'n个元素中有重复（n₁个相同，n₂个相同，...）的全排列数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n个元素中有重复（n₁个相同，n₂个相同，...）的全排列数。</p><div class="la-fml">$$\\frac{n!}{n_1!n_2!\\cdots n_k!}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\frac{n!}{n_1!n_2!\\cdots n_k!}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>总数n!除以各组内部排列。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>重复元素排列。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分母是各组重复数的阶乘。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合数学。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>多项式定理的系数。</p></section></div>`},{id:'elementary_math-c4s1-18',name:'容斥原理',tags:["def", "thm", "der", "app", "note"],brief:'两个集合的容斥: 并集=两集合和减交集。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个集合的容斥: 并集=两集合和减交集。</p><div class="la-fml">$$|A_1\\cup A_2|=|A_1|+|A_2|-|A_1\\cap A_2|$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$|A_1\\cup A_2|=|A_1|+|A_2|-|A_1\\cap A_2|$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>加多了交集要减去。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计数重叠元素。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>三集合公式需加减交替。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>组合计数基本原理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>n个集合的容斥公式。</p></section></div>`},{id:'elementary_math-c4s1-19',name:'鸽巢原理',tags:["def", "der", "app", "note"],brief:'n+1个物品放入n个盒子，至少有一个盒子有2个以上物品。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n+1个物品放入n个盒子，至少有一个盒子有2个以上物品。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>反证法：若每个盒子最多1个，总数最多n，矛盾。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>存在性证明。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>推广：kn+1个物品放入n个盒子，至少一盒k+1个。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>狄利克雷原理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>拉姆齐理论的基础。</p></section></div>`}]},{name:'4.2 概率',color:'#7c3aed',desc:'古典、几何、条件概率',items:[{id:'elementary_math-c4s2-1',name:'随机事件',tags:["def", "der", "app", "note"],brief:'在一定条件下可能发生也可能不发生的事件。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在一定条件下可能发生也可能不发生的事件。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由随机性定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述不确定现象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>必然事件概率1，不可能事件概率0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>样本空间与事件域。</p></section></div>`},{id:'elementary_math-c4s2-2',name:'概率定义',tags:["def", "thm", "der", "app", "note"],brief:'古典概型中事件A的概率等于A包含的基本事件数m除以总基本事件数n。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>古典概型中事件A的概率等于A包含的基本事件数m除以总基本事件数n。</p><div class="la-fml">$$P(A)=\\frac{m}{n}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A)=\\frac{m}{n}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等可能性假设。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>古典概率计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>要求基本事件等可能且有限。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率的古典定义。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>几何概型、公理化定义。</p></section></div>`},{id:'elementary_math-c4s2-3',name:'概率基本性质',tags:["def", "thm", "der", "app", "note"],brief:'概率取值在[0,1]之间。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>概率取值在[0,1]之间。</p><div class="la-fml">$$0\\leq P(A)\\leq 1$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$0\\leq P(A)\\leq 1$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由频率性质。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>概率估计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>P(Ω)=1，P(∅)=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论公理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>可列可加性。</p></section></div>`},{id:'elementary_math-c4s2-4',name:'互斥事件',tags:["def", "thm", "der", "app", "note"],brief:'互斥事件（不能同时发生）的和事件概率等于概率之和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>互斥事件（不能同时发生）的和事件概率等于概率之和。</p><div class="la-fml">$$P(A\\cup B)=P(A)+P(B)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A\\cup B)=P(A)+P(B)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由互斥性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>概率计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>互斥即A∩B=∅。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率加法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般情形P(A∪B)=P(A)+P(B)-P(A∩B)。</p></section></div>`},{id:'elementary_math-c4s2-5',name:'对立事件',tags:["def", "thm", "der", "app", "note"],brief:'对立事件概率之和为1。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>对立事件概率之和为1。</p><div class="la-fml">$$P(\\bar{A})=1-P(A)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(\\bar{A})=1-P(A)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由对立定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简化概率计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>A与Ā互斥且A∪Ā=Ω。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>补事件。</p></section></div>`},{id:'elementary_math-c4s2-6',name:'古典概型',tags:["def", "der", "app", "note"],brief:'试验结果有限且等可能的概率模型。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>试验结果有限且等可能的概率模型。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>有限性+等可能性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>掷骰子、摸球等。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>用计数原理求m和n。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论早期模型。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>几何概型推广到无限情形。</p></section></div>`},{id:'elementary_math-c4s2-7',name:'几何概型',tags:["def", "thm", "der", "app", "note"],brief:'试验结果无限且等可能的概率模型。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>试验结果无限且等可能的概率模型。</p><div class="la-fml">$$P(A)=\\frac{\\text{构成A的区域度量}}{\\text{全体结果的区域度量}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A)=\\frac{\\text{构成A的区域度量}}{\\text{全体结果的区域度量}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由等可能性和测度。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>约会问题、投针问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>用长度、面积、体积度量。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论推广。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>蒙特卡洛方法。</p></section></div>`},{id:'elementary_math-c4s2-8',name:'条件概率',tags:["def", "thm", "der", "app", "note"],brief:'在事件B发生的条件下A发生的概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>在事件B发生的条件下A发生的概率。</p><div class="la-fml">$$P(A|B)=\\frac{P(AB)}{P(B)}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A|B)=\\frac{P(AB)}{P(B)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由条件概率定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>依赖事件的概率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>要求P(B)>0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>条件概率。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>P(A|B)≠P(A)说明A,B不独立。</p></section></div>`},{id:'elementary_math-c4s2-9',name:'事件独立性',tags:["def", "thm", "der", "app", "note"],brief:'事件A,B独立当且仅当P(AB)=P(A)P(B)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>事件A,B独立当且仅当P(AB)=P(A)P(B)。</p><div class="la-fml">$$P(AB)=P(A)P(B)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(AB)=P(A)P(B)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由独立性定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>独立事件概率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>独立⟺P(A|B)=P(A)（P(B)>0时）。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>独立概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到n个事件独立。</p></section></div>`},{id:'elementary_math-c4s2-10',name:'独立重复试验',tags:["def", "thm", "der", "app", "note"],brief:'n次独立重复试验中事件A发生k次的概率（二项分布）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n次独立重复试验中事件A发生k次的概率（二项分布）。</p><div class="la-fml">$$P(X=k)=C_n^k p^k(1-p)^{n-k}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(X=k)=C_n^k p^k(1-p)^{n-k}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由独立性和互斥性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>伯努利试验。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>每次试验A发生概率为p。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>二项分布。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>n很大p很小时近似泊松分布。</p></section></div>`},{id:'elementary_math-c4s2-11',name:'全概率公式',tags:["def", "thm", "der", "app", "note"],brief:'若B₁,B₂,...,Bₙ是完备事件组，则P(A)=ΣP(Bᵢ)P(A|Bᵢ)。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>若B₁,B₂,...,Bₙ是完备事件组，则P(A)=ΣP(Bᵢ)P(A|Bᵢ)。</p><div class="la-fml">$$P(A)=\\sum P(B_i)P(A|B_i)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A)=\\sum P(B_i)P(A|B_i)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由互斥分解和条件概率。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>复杂事件概率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>完备事件组：互斥且并为Ω。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>贝叶斯公式的基础。</p></section></div>`},{id:'elementary_math-c4s2-12',name:'贝叶斯公式',tags:["def", "thm", "der", "app", "note"],brief:'已知结果A求原因Bᵢ的概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>已知结果A求原因Bᵢ的概率。</p><div class="la-fml">$$P(B_i|A)=\\frac{P(B_i)P(A|B_i)}{\\sum P(B_j)P(A|B_j)}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(B_i|A)=\\frac{P(B_i)P(A|B_i)}{\\sum P(B_j)P(A|B_j)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由条件概率和全概率公式。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>逆概率、诊断。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>P(Bᵢ)是先验概率，P(Bᵢ|A)是后验概率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>贝叶斯1763年发表。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>贝叶斯统计的基础。</p></section></div>`},{id:'elementary_math-c4s2-13',name:'随机变量',tags:["def", "der", "app", "note"],brief:'将随机试验结果数量化的变量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将随机试验结果数量化的变量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>样本空间到实数的映射。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>用数学方法研究随机现象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>分离散型和连续型。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论现代化。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>随机变量的分布函数。</p></section></div>`},{id:'elementary_math-c4s2-14',name:'离散型随机变量',tags:["def", "der", "app", "note"],brief:'取值为有限或可列个的随机变量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>取值为有限或可列个的随机变量。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由取值特征分类。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>计数型随机现象。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>用分布列描述。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>二项分布、泊松分布、超几何分布。</p></section></div>`},{id:'elementary_math-c4s2-15',name:'分布列',tags:["def", "thm", "der", "app", "note"],brief:'离散型随机变量X取各值的概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>离散型随机变量X取各值的概率。</p><div class="la-fml">$$P(X=x_i)=p_i$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(X=x_i)=p_i$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由概率定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>描述离散型随机变量。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Σpᵢ=1，pᵢ≥0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>分布列即概率质量函数。</p></section></div>`},{id:'elementary_math-c4s2-16',name:'数学期望',tags:["def", "thm", "der", "app", "note"],brief:'离散型随机变量的期望值（加权平均）。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>离散型随机变量的期望值（加权平均）。</p><div class="la-fml">$$E(X)=\\sum x_i p_i$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E(X)=\\sum x_i p_i$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由概率加权平均。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>预测平均结果。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>E(aX+b)=aE(X)+b。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>连续型用积分。</p></section></div>`},{id:'elementary_math-c4s2-17',name:'方差',tags:["def", "thm", "der", "app", "note"],brief:'随机变量取值的离散程度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>随机变量取值的离散程度。</p><div class="la-fml">$$D(X)=\\sum(x_i-E(X))^2 p_i$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$D(X)=\\sum(x_i-E(X))^2 p_i$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由偏离期望的平方的期望。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>衡量波动大小。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>D(aX+b)=a²D(X)；标准差=√D(X)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>方差小说明取值集中。</p></section></div>`},{id:'elementary_math-c4s2-18',name:'期望线性性质',tags:["def", "thm", "der", "app", "note"],brief:'两个随机变量和的期望等于期望之和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个随机变量和的期望等于期望之和。</p><div class="la-fml">$$E(X+Y)=E(X)+E(Y)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$E(X+Y)=E(X)+E(Y)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由期望定义和加法交换律。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>期望计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>无需X,Y独立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>期望性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>E(aX+bY)=aE(X)+bE(Y)。</p></section></div>`},{id:'elementary_math-c4s2-19',name:'独立随机变量方差',tags:["def", "thm", "der", "app", "note"],brief:'独立随机变量和的方差等于方差之和。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>独立随机变量和的方差等于方差之和。</p><div class="la-fml">$$D(X+Y)=D(X)+D(Y)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$D(X+Y)=D(X)+D(Y)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由独立性消去协方差项。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>方差计算。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>要求X,Y独立。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>方差性质。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>不独立时D(X+Y)=D(X)+D(Y)+2Cov(X,Y)。</p></section></div>`},{id:'elementary_math-c4s2-20',name:'协方差',tags:["def", "thm", "der", "app", "note"],brief:'衡量两个随机变量的协同变化程度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>衡量两个随机变量的协同变化程度。</p><div class="la-fml">$$Cov(X,Y)=E[(X-E(X))(Y-E(Y))]$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$Cov(X,Y)=E[(X-E(X))(Y-E(Y))]$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由期望定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>相关性分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Cov(X,Y)=E(XY)-E(X)E(Y)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>独立⟹协方差为0，反之不一定。</p></section></div>`},{id:'elementary_math-c4s2-21',name:'相关系数',tags:["def", "thm", "der", "app", "note"],brief:'标准化的协方差，衡量线性相关程度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>标准化的协方差，衡量线性相关程度。</p><div class="la-fml">$$\\rho=\\frac{Cov(X,Y)}{\\sqrt{D(X)D(Y)}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\rho=\\frac{Cov(X,Y)}{\\sqrt{D(X)D(Y)}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由协方差和标准差。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>相关性分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|ρ|≤1，ρ=±1时完全线性相关。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>ρ=0称不相关（不一定独立）。</p></section></div>`},{id:'elementary_math-c4s2-22',name:'几何概型约会问题',tags:["def", "der", "app", "note"],brief:'两人在约定时间段内到达，求能相遇的概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两人在约定时间段内到达，求能相遇的概率。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>用面积比计算。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>几何概型经典问题。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>设到达时间为x,y，|x-y|≤t时相遇。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率论经典。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>几何概型的典型应用。</p></section></div>`},{id:'elementary_math-c4s2-23',name:'条件概率性质',tags:["def", "thm", "der", "app", "note"],brief:'条件概率满足概率的所有性质。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>条件概率满足概率的所有性质。</p><div class="la-fml">$$P(A|B)=\\frac{P(AB)}{P(B)}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(A|B)=\\frac{P(AB)}{P(B)}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由条件概率定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>依赖事件。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>P(Ω|B)=1，P(∅|B)=0。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>条件概率。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>条件概率也是概率测度。</p></section></div>`},{id:'elementary_math-c4s2-24',name:'全概率公式应用',tags:["def", "der", "app", "note"],brief:'将复杂事件分解为互斥情形分别计算。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将复杂事件分解为互斥情形分别计算。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由完备事件组。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>分层抽样概率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>关键是找到合适的完备事件组。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>概率公式。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>与贝叶斯公式配合使用。</p></section></div>`},{id:'elementary_math-c4s2-25',name:'贝叶斯公式应用',tags:["def", "der", "app", "note"],brief:'已知结果反推原因的概率。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>已知结果反推原因的概率。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由条件概率和全概率。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>医学诊断、垃圾邮件过滤。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>先验概率更新为后验概率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>贝叶斯推断。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>机器学习中的朴素贝叶斯。</p></section></div>`}]},{name:'4.3 统计',color:'#0f766e',desc:'抽样、分布、估计',items:[{id:'elementary_math-c4s3-1',name:'总体与样本',tags:["def", "der", "app", "note"],brief:'研究对象的全体叫总体，从中抽取的部分叫样本。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>研究对象的全体叫总体，从中抽取的部分叫样本。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由统计研究范围。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>抽样调查。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>样本容量是样本中个体数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>统计学基础。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>抽样方法。</p></section></div>`},{id:'elementary_math-c4s3-2',name:'简单随机抽样',tags:["def", "der", "app", "note"],brief:'从总体中逐个不放回抽取，每个个体被抽到的机会相等。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>从总体中逐个不放回抽取，每个个体被抽到的机会相等。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等可能性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>简单抽样。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>抽签法、随机数表法。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>抽样方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>系统抽样、分层抽样。</p></section></div>`},{id:'elementary_math-c4s3-3',name:'系统抽样',tags:["def", "der", "app", "note"],brief:'将总体分成均衡的若干部分，按规则从每部分抽取。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将总体分成均衡的若干部分，按规则从每部分抽取。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>等距抽样。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>大总体抽样。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>先编号，再等距抽取。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>抽样方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>当总体有周期时要注意。</p></section></div>`},{id:'elementary_math-c4s3-4',name:'分层抽样',tags:["def", "der", "app", "note"],brief:'将总体分成互不交叉的层，按比例从各层抽取。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将总体分成互不交叉的层，按比例从各层抽取。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>按层比例。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>总体差异大时抽样。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>各层独立抽取，样本与总体结构相似。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>抽样方法。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>比例分配、最优分配。</p></section></div>`},{id:'elementary_math-c4s3-5',name:'频率分布表',tags:["def", "der", "app", "note"],brief:'将数据分组，统计各组频数和频率的表格。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将数据分组，统计各组频数和频率的表格。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由数据整理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数据分布分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>频率=频数/总数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>描述统计。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>频率分布直方图。</p></section></div>`},{id:'elementary_math-c4s3-6',name:'频率分布直方图',tags:["def", "der", "app", "note"],brief:'用矩形面积表示频率的统计图。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用矩形面积表示频率的统计图。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由频率分布表绘制。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>直观展示数据分布。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>纵轴是频率/组距，面积=频率。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>数据可视化。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>密度曲线的近似。</p></section></div>`},{id:'elementary_math-c4s3-7',name:'众数',tags:["def", "der", "app", "note"],brief:'出现次数最多的数据值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>出现次数最多的数据值。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由频率最高。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数据集中趋势。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>可能有多个众数或没有。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>统计量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>直方图中最高矩形中点。</p></section></div>`},{id:'elementary_math-c4s3-8',name:'中位数',tags:["def", "der", "app", "note"],brief:'将数据从小到大排列后位于中间的数值。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>将数据从小到大排列后位于中间的数值。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由位置定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数据集中趋势。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>n奇取中间，n偶取中间两数平均。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>统计量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>不受极端值影响。</p></section></div>`},{id:'elementary_math-c4s3-9',name:'平均数',tags:["def", "thm", "der", "app", "note"],brief:'所有数据之和除以数据个数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>所有数据之和除以数据个数。</p><div class="la-fml">$$\\bar{x}=\\frac{1}{n}\\sum x_i$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\bar{x}=\\frac{1}{n}\\sum x_i$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由平均定义。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>数据集中趋势。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>加权平均可按频率加权。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>统计量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>受极端值影响大。</p></section></div>`},{id:'elementary_math-c4s3-10',name:'标准差',tags:["def", "thm", "der", "app", "note"],brief:'方差的算术平方根。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>方差的算术平方根。</p><div class="la-fml">$$s=\\sqrt{\\frac{1}{n}\\sum(x_i-\\bar{x})^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$s=\\sqrt{\\frac{1}{n}\\sum(x_i-\\bar{x})^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由方差开方。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>衡量数据波动（与原数据同单位）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与原数据单位一致。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>统计量。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>方差的平方根。</p></section></div>`},{id:'elementary_math-c4s3-11',name:'线性相关',tags:["def", "der", "app", "note"],brief:'两个变量的散点图大致分布在一条直线附近。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个变量的散点图大致分布在一条直线附近。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由散点图形态。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>回归分析基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>正相关/负相关/不相关。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>相关分析。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>相关系数r衡量相关程度。</p></section></div>`},{id:'elementary_math-c4s3-12',name:'线性回归方程',tags:["def", "thm", "der", "app", "note"],brief:'用最小二乘法拟合的直线方程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>用最小二乘法拟合的直线方程。</p><div class="la-fml">$$\\hat{y}=\\hat{b}x+\\hat{a}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\hat{y}=\\hat{b}x+\\hat{a}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>使残差平方和最小。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>预测。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>回归直线过样本中心点(x̄,ȳ)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>高尔顿提出回归概念。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>最小二乘法。</p></section></div>`},{id:'elementary_math-c4s3-13',name:'最小二乘法',tags:["def", "der", "app", "note"],brief:'通过最小化残差平方和估计参数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>通过最小化残差平方和估计参数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对残差平方和求导令其为零。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>参数估计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>是线性回归的核心方法。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>高斯、勒让德独立提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>推广到非线性和多元回归。</p></section></div>`},{id:'elementary_math-c4s3-14',name:'独立性检验',tags:["def", "der", "app", "note"],brief:'检验两个分类变量是否有关联。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>检验两个分类变量是否有关联。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>卡方检验。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>列联表分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>构造K²统计量与临界值比较。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>假设检验。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>卡方分布。</p></section></div>`},{id:'elementary_math-c4s3-15',name:'正态分布',tags:["def", "thm", "der", "app", "note"],brief:'最重要的连续型概率分布，钟形曲线。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>最重要的连续型概率分布，钟形曲线。</p><div class="la-fml">$$f(x)=\\frac{1}{\\sqrt{2\\pi}\\sigma}e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$f(x)=\\frac{1}{\\sqrt{2\\pi}\\sigma}e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由中心极限定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>自然和社会现象广泛适用。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>N(μ,σ²)，μ是期望，σ是标准差。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>棣莫弗-拉普拉斯。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>3σ原则：P(μ-3σ<X<μ+3σ)≈99.7%。</p></section></div>`},{id:'elementary_math-c4s3-16',name:'正态分布性质',tags:["def", "der", "app", "note"],brief:'关于x=μ对称，在μ处取最大值，σ越小越集中。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>关于x=μ对称，在μ处取最大值，σ越小越集中。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由密度函数分析。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>质量控制、误差分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>P(μ-σ<X<μ+σ)≈68.3%。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>正态分布。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>标准化Z=(X-μ)/σ~N(0,1)。</p></section></div>`},{id:'elementary_math-c4s3-17',name:'标准正态分布',tags:["def", "thm", "der", "app", "note"],brief:'均值为0、标准差为1的正态分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>均值为0、标准差为1的正态分布。</p><div class="la-fml">$$Z=\\frac{X-\\mu}{\\sigma}\\sim N(0,1)$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$Z=\\frac{X-\\mu}{\\sigma}\\sim N(0,1)$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>对一般正态变量标准化。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>查标准正态分布表求概率。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>Φ(z)表示标准正态分布函数。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>正态分布标准化。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>一般正态概率转化为标准正态查表。</p></section></div>`},{id:'elementary_math-c4s3-18',name:'3σ原则',tags:["def", "thm", "der", "app", "note"],brief:'正态变量落在(μ-3σ,μ+3σ)内的概率约99.7%。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>正态变量落在(μ-3σ,μ+3σ)内的概率约99.7%。</p><div class="la-fml">$$P(\\mu-3\\sigma<X<\\mu+3\\sigma)\\approx 99.7\\%$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(\\mu-3\\sigma<X<\\mu+3\\sigma)\\approx 99.7\\%$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由正态分布密度积分。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>质量控制（异常值判定）。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>几乎所有数据都在3σ范围内。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>统计过程控制。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>6σ管理法源于此。</p></section></div>`},{id:'elementary_math-c4s3-19',name:'二项分布',tags:["def", "thm", "der", "app", "note"],brief:'n次独立伯努利试验中成功次数的分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>n次独立伯努利试验中成功次数的分布。</p><div class="la-fml">$$X\\sim B(n,p),\\ P(X=k)=C_n^k p^k(1-p)^{n-k}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$X\\sim B(n,p),\\ P(X=k)=C_n^k p^k(1-p)^{n-k}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由独立重复试验。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>产品检验、抽样。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>E(X)=np，D(X)=np(1-p)。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>伯努利。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>n大p小时近似泊松分布。</p></section></div>`},{id:'elementary_math-c4s3-20',name:'超几何分布',tags:["def", "der", "app", "note"],brief:'N件产品中有M件次品，抽n件中次品数的分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>N件产品中有M件次品，抽n件中次品数的分布。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由古典概型。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>不放回抽样。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>与二项分布的区别是不放回。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>抽样分布。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>N很大时近似二项分布。</p></section></div>`},{id:'elementary_math-c4s3-21',name:'几何分布',tags:["def", "thm", "der", "app", "note"],brief:'首次成功所需试验次数的分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>首次成功所需试验次数的分布。</p><div class="la-fml">$$P(X=k)=(1-p)^{k-1}p$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(X=k)=(1-p)^{k-1}p$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>前k-1次失败第k次成功。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>等待时间。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>无记忆性。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>离散分布。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>E(X)=1/p。</p></section></div>`},{id:'elementary_math-c4s3-22',name:'泊松分布',tags:["def", "thm", "der", "app", "note"],brief:'稀有事件发生次数的分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>稀有事件发生次数的分布。</p><div class="la-fml">$$P(X=k)=\\frac{\\lambda^k e^{-\\lambda}}{k!}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$P(X=k)=\\frac{\\lambda^k e^{-\\lambda}}{k!}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>二项分布n→∞,np=λ的极限。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>电话呼叫、粒子衰变。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>E(X)=D(X)=λ。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>泊松1837年提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>泊松过程的基础。</p></section></div>`},{id:'elementary_math-c4s3-23',name:'抽样分布',tags:["def", "der", "app", "note"],brief:'样本统计量的概率分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>样本统计量的概率分布。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由抽样过程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统计推断基础。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>样本均值、样本方差的分布。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>推断统计。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>t分布、卡方分布、F分布。</p></section></div>`},{id:'elementary_math-c4s3-24',name:'样本均值分布',tags:["def", "thm", "der", "app", "note"],brief:'当总体正态时，样本均值服从正态分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>当总体正态时，样本均值服从正态分布。</p><div class="la-fml">$$\\bar{X}\\sim N(\\mu,\\frac{\\sigma^2}{n})$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\bar{X}\\sim N(\\mu,\\frac{\\sigma^2}{n})$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由正态分布的可加性。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>均值估计。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>标准误=σ/√n。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>中心极限定理。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>总体非正态时大样本也近似正态。</p></section></div>`},{id:'elementary_math-c4s3-25',name:'中心极限定理',tags:["def", "der", "app", "note"],brief:'大量独立同分布随机变量之和近似服从正态分布。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>大量独立同分布随机变量之和近似服从正态分布。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>概率论基本定理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>解释为何很多自然现象服从正态分布。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>无需总体分布正态，只需n足够大。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>棣莫弗-拉普拉斯、林德伯格-莱维。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>统计学的基石。</p></section></div>`},{id:'elementary_math-c4s3-26',name:'参数估计',tags:["def", "der", "app", "note"],brief:'由样本统计量估计总体参数。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>由样本统计量估计总体参数。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>点估计和区间估计。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>统计推断。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>点估计给一个值，区间估计给一个范围。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>推断统计。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>矩估计、最大似然估计。</p></section></div>`},{id:'elementary_math-c4s3-27',name:'假设检验',tags:["def", "der", "app", "note"],brief:'根据样本判断关于总体的假设是否成立。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>根据样本判断关于总体的假设是否成立。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>小概率原理。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>科学决策。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>原假设H₀和备择假设H₁。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>内曼-皮尔逊。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>第一类错误（弃真）和第二类错误（取伪）。</p></section></div>`},{id:'elementary_math-c4s3-28',name:'方差分析',tags:["def", "der", "app", "note"],brief:'检验多个总体均值是否相等的统计方法。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>检验多个总体均值是否相等的统计方法。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>分解总变异为组间和组内。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>多组比较。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>F检验。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>费希尔提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>单因素、双因素方差分析。</p></section></div>`},{id:'elementary_math-c4s3-29',name:'线性相关关系',tags:["def", "der", "app", "note"],brief:'两个变量之间的线性依存关系。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>两个变量之间的线性依存关系。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由散点图观察。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>变量关系分析。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>相关不代表因果。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>统计推断。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>用相关系数r度量。</p></section></div>`},{id:'elementary_math-c4s3-30',name:'相关系数r',tags:["def", "thm", "der", "app", "note"],brief:'衡量两个变量线性相关程度的量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>衡量两个变量线性相关程度的量。</p><div class="la-fml">$$r=\\frac{\\sum(x_i-\\bar{x})(y_i-\\bar{y})}{\\sqrt{\\sum(x_i-\\bar{x})^2\\sum(y_i-\\bar{y})^2}}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$r=\\frac{\\sum(x_i-\\bar{x})(y_i-\\bar{y})}{\\sqrt{\\sum(x_i-\\bar{x})^2\\sum(y_i-\\bar{y})^2}}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>标准化后的协方差。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>相关性检验。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>|r|≤1，|r|越接近1线性相关越强。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>皮尔逊提出。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>r=0只表示无线性相关，可能有非线性关系。</p></section></div>`},{id:'elementary_math-c4s3-31',name:'回归分析应用',tags:["def", "der", "app", "note"],brief:'利用回归方程进行预测和控制。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>利用回归方程进行预测和控制。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由回归方程。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>经济预测、工程。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>外推要谨慎。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>应用统计。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>残差分析检验模型。</p></section></div>`},{id:'elementary_math-c4s3-32',name:'卡方检验',tags:["def", "thm", "der", "app", "note"],brief:'观测频数与期望频数差异的统计量。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>观测频数与期望频数差异的统计量。</p><div class="la-fml">$$\\chi^2=\\sum\\frac{(f_o-f_e)^2}{f_e}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\chi^2=\\sum\\frac{(f_o-f_e)^2}{f_e}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由皮尔逊提出。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>拟合优度、独立性检验。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>自由度影响临界值。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>皮尔逊1900年。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>卡方分布表。</p></section></div>`},{id:'elementary_math-c4s3-33',name:'统计决策',tags:["def", "der", "app", "note"],brief:'基于数据做出决策的过程。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>基于数据做出决策的过程。</p></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>假设检验、区间估计。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>质量管理、A/B测试。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>权衡两类错误。</p></section><section class="la-kp-sec la-kp-his"><h5>背 景</h5><p>决策理论。</p></section><section class="la-kp-sec la-kp-ext"><h5>拓 展</h5><p>贝叶斯决策。</p></section></div>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
</html>
