<script>
const LA_FIG = {  };
const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', his:'注 记'};
const LA_DATA = [
{id:'la-ch1',num:'第一章',title:'拉格朗日力学',en:'LAGRANGIAN MECHANICS',sub:'广义坐标、拉氏方程、变分原理',desc:'从牛顿力学到拉格朗日力学，用能量（动能减势能）而非力描述系统运动。广义坐标的引入使约束力自动消去。',sections:[{name:'1.1 约束与广义坐标',color:'#2563eb',desc:'自由度、完整约束',items:[{id:'la-k1-1',name:'约束的分类',tags:["def"],brief:'完整约束 $f(q_1,\\dots,q_n,t)=0$；非完整约束含速度不可积。',body:`<p><strong>完整约束</strong>可表示为坐标与时间的代数方程，减少自由度。<strong>非完整约束</strong>（如 rolling without slipping）含速度项且不可积，需用拉格朗日乘子法。约束数为 $k$，自由度 $s=3N-k$。</p>`},{id:'la-k1-2',name:'广义坐标',tags:["def", "app"],brief:'$q_1,\\dots,q_s$ 为独立描述系统位形的 $s$ 个变量。',body:`<p>广义坐标可以是角度、长度或其他合适变量。笛卡尔坐标 $\\boldsymbol r_i=\\boldsymbol r_i(q_1,\\dots,q_s,t)$。选择合适的广义坐标可大幅简化问题。</p>`},{id:'la-k1-3',name:'拉格朗日量',tags:["def", "thm"],brief:'$L=T-V$，拉氏方程：$\\frac{d}{dt}\\frac{\\partial L}{\\partial\\dot q_i}-\\frac{\\partial L}{\\partial q_i}=Q_i$。',body:`<p>主动力有势时 $Q_i=0$，得欧拉-拉格朗日方程：</p><div class="la-fml">$$\\frac{d}{dt}\\frac{\\partial L}{\\partial\\dot q_i}-\\frac{\\partial L}{\\partial q_i}=0$$</div><p>$L$ 是 $q,\\dot q,t$ 的函数。此方程对任意广义坐标协变，无需分析约束力。</p>`}]},{name:'1.2 最小作用量原理',color:'#7c3aed',desc:'哈密顿原理、变分法',items:[{id:'la-k1-4',name:'哈密顿原理',tags:["thm", "his"],brief:'$\\delta S=0$，作用量 $S=\\int_{t_1}^{t_2} L(q,\\dot q,t)\\,dt$。',body:`<p>真实运动使作用量取极值（变分为零）。这是力学的变分原理表述，比牛顿定律更基本、更普适，可推广到场论。</p><div class="la-fml">$$\\delta S=\\delta\\int_{t_1}^{t_2}L\\,dt=0$$</div>`},{id:'la-k1-5',name:'循环坐标与守恒律',tags:["thm", "der"],brief:'若 $\\partial L/\\partial q_i=0$，则 $p_i=\\partial L/\\partial\\dot q_i$ 守恒。',body:`<p>循环坐标（不出现于 $L$ 中的坐标）对应守恒动量。空间均匀性→动量守恒；各向同性→角动量守恒；时间均匀性→能量守恒（诺特定理）。</p>`},{id:'la-k1-6',name:'能量函数',tags:["def", "thm"],brief:'$h=\\sum p_i\\dot q_i-L$，当 $\\partial L/\\partial t=0$ 时 $h$ 守恒。',body:`<p>若势能不含速度且变换不显含时间，$h=E=T+V$ 即机械能。能量守恒是时间平移对称性的结果。</p>`}]}]},
{id:'la-ch2',num:'第二章',title:'哈密顿力学',en:'HAMILTONIAN MECHANICS',sub:'正则方程、泊松括号、正则变换',desc:'哈密顿力学以广义坐标和广义动量为独立变量，在相空间中描述运动，方程更对称优美。',sections:[{name:'2.1 正则方程',color:'#2563eb',desc:'勒让德变换',items:[{id:'la-k2-1',name:'哈密顿量',tags:["def", "thm"],brief:'$H(q,p,t)=\\sum p_i\\dot q_i-L$，正则方程：$\\dot q_i=\\frac{\\partial H}{\\partial p_i}$，$\\dot p_i=-\\frac{\\partial H}{\\partial q_i}$。',body:`<p>通过勒让德变换将 $L(q,\\dot q,t)$ 换为 $H(q,p,t)$。正则方程是 $2s$ 个一阶方程，比拉氏方程（$s$ 个二阶）更对称。$H$ 守恒当且仅当 $\\partial H/\\partial t=0$。</p>`},{id:'la-k2-2',name:'相空间与刘维尔定理',tags:["thm", "der"],brief:'相空间体积元不变：$\\sum(\\partial\\dot q_i/\\partial q_i+\\partial\\dot p_i/\\partial p_i)=0$。',body:`<p>刘维尔定理：哈密顿系统的相空间密度沿轨道不变。这是统计力学的基础，也意味着哈密顿流保持相空间体积（不可压缩）。</p>`}]},{name:'2.2 泊松括号',color:'#7c3aed',desc:'运动方程的括号形式',items:[{id:'la-k2-3',name:'泊松括号定义',tags:["def", "thm"],brief:'$\\{f,g\\}=\\sum_i\\left(\\frac{\\partial f}{\\partial q_i}\\frac{\\partial g}{\\partial p_i}-\\frac{\\partial f}{\\partial p_i}\\frac{\\partial g}{\\partial q_i}\\right)$。',body:`<p>泊松括号满足反对称性、双线性、雅可比恒等式，构成李代数。任意力学量的时间演化：</p><div class="la-fml">$$\\frac{df}{dt}=\\{f,H\\}+\\frac{\\partial f}{\\partial t}$$</div>`},{id:'la-k2-4',name:'基本泊松括号',tags:["thm", "der"],brief:'$\\{q_i,q_j\\}=0$，$\\{p_i,p_j\\}=0$，$\\{q_i,p_j\\}=\\delta_{ij}$。',body:`<p>这些是量子力学正则对易关系 $[\\hat q_i,\\hat p_j]=i\\hbar\\delta_{ij}$ 的经典对应。狄拉克指出：经典泊松括号 → 量子对易子。</p>`},{id:'la-k2-5',name:'正则变换',tags:["def", "thm"],brief:'保持正则方程形式的变换 $(q,p)\\to(Q,P)$，满足 $\\sum p_i dq_i-\\sum P_i dQ_i=dF$。',body:`<p>生成函数 $F$ 有四种基本形式。正则变换可简化哈密顿量，是求解力学问题的强大工具（如作用量-角变量）。</p>`}]}]},
{id:'la-ch3',num:'第三章',title:'刚体力学',en:'RIGID BODY DYNAMICS',sub:'惯量张量、欧拉方程、陀螺',desc:'刚体是特殊的质点系，内部距离不变。转动用惯量张量和欧拉方程描述。',sections:[{name:'3.1 惯量张量',color:'#2563eb',desc:'转动惯量与惯量主轴',items:[{id:'la-k3-1',name:'惯量张量',tags:["def", "thm"],brief:'$I_{ij}=\\int\\rho(r^2\\delta_{ij}-x_ix_j)\\,dV$，对称二阶张量。',body:`<p>刚体转动动能 $T=\\frac12\\sum I_{ij}\\omega_i\\omega_j$。通过正交变换可将 $I_{ij}$ 对角化，得到三个主转动惯量 $I_1,I_2,I_3$ 和惯量主轴。</p>`},{id:'la-k3-2',name:'平行轴定理',tags:["thm", "der"],brief:'$I=I_{cm}+Md^2$。',body:`<p>刚体对任意轴的转动惯量等于对过质心平行轴的转动惯量加上 $Md^2$（$d$ 为两轴距离）。用于简化计算。</p>`}]},{name:'3.2 欧拉方程与陀螺',color:'#7c3aed',desc:'定点转动',items:[{id:'la-k3-3',name:'欧拉方程',tags:["def", "thm"],brief:'$I_1\\dot\\omega_1-(I_2-I_3)\\omega_2\\omega_3=M_1$（循环置换）。',body:`<p>在惯量主轴坐标系中，刚体定点转动的动力学方程。无外力矩时（$M=0$）欧拉陀螺可解析求解，能量和角动量守恒。</p>`},{id:'la-k3-4',name:'对称陀螺的进动',tags:["thm", "app", "exa"],brief:'$\\dot\\phi=\\frac{L_z-I_3\\omega_3\\cos\\theta}{I_1\\sin^2\\theta}$。',body:`<p>对称陀螺（$I_1=I_2\\neq I_3$）在重力场中运动：自转轴绕竖直轴进动，同时可能章动。快速自转的陀螺表现为规则进动。</p>`}]}]},
{id:'la-ch4',num:'第四章',title:'微振动',en:'SMALL OSCILLATIONS',sub:'简正模、本征频率',desc:'系统在稳定平衡位置附近的小振动可解耦为独立的简正模。',sections:[{name:'4.1 简正模理论',color:'#0f766e',desc:'广义本征值问题',items:[{id:'la-k4-1',name:'简正模方程',tags:["def", "thm", "der"],brief:'$\\det(K-\\omega^2 M)=0$ 确定本征频率。',body:`<p>小振动时，势能在平衡位置展开 $V=V_0+\\frac12\\sum K_{ij}q_iq_j$，动能 $T=\\frac12\\sum M_{ij}\\dot q_i\\dot q_j$。运动方程 $M\\ddot q+Kq=0$。设 $q=a e^{i\\omega t}$，得广义本征值问题 $(K-\\omega^2 M)a=0$。</p>`},{id:'la-k4-2',name:'简正坐标',tags:["thm", "der"],brief:'通过本征向量构造简正坐标 $\\xi$，使 $L=\\sum\\frac12(\\dot\\xi_i^2-\\omega_i^2\\xi_i^2)$。',body:`<p>简正坐标下系统解耦为 $s$ 个独立简谐振子。每个简正模以单一频率振动，是系统的集体模式。</p>`}]},{name:'4.2 耦合振子与非线性',color:'#c2410c',desc:'实例与推广',items:[{id:'la-k4-3',name:'双耦合振子',tags:["exa", "app"],brief:'两个弹簧振子耦合后出现对称模与反对称模。',body:`<p>等质量双振子用弹簧耦合：对称模（同相）频率较低，反对称模（反相）频率较高。能量在两振子间周期性转移（拍现象）。</p>`},{id:'la-k4-4',name:'非线性振动',tags:["def", "app"],brief:'达芬方程 $\\ddot x+\\omega_0^2 x+\\alpha x^3=f\\cos\\Omega t$。',body:`<p>非线性恢复力导致频率随振幅变化、次谐波/超谐波共振、混沌等现象。摄动法（林德斯泰特-庞加莱）可求近似解。</p>`}]}]},
{id:'la-ch5',num:'第五章',title:'散射理论',en:'SCATTERING THEORY',sub:'散射截面、卢瑟福散射',desc:'两体碰撞问题转化为单体等效问题，散射截面是实验可测量。',sections:[{name:'5.1 散射截面',color:'#2563eb',desc:'微分散射截面',items:[{id:'la-k5-1',name:'微分散射截面',tags:["def", "thm"],brief:'$\\sigma(\\theta)=\\frac{b}{\\sin\\theta}\\left|\\frac{db}{d\\theta}\\right|$。',body:`<p>瞄准距离 $b$ 与散射角 $\\theta$ 的关系决定截面。总截面 $\\sigma_{tot}=\\int\\sigma(\\theta)\\,d\\Omega$。两体问题约化为约化质量 $\\mu$ 的单体散射。</p>`},{id:'la-k5-2',name:'卢瑟福散射',tags:["exa", "his", "thm"],brief:'$\\sigma(\\theta)=\\left(\\frac{k}{4E}\\right)^2\\csc^4(\\theta/2)$。',body:`<p>库仑势 $V=k/r$ 的散射。$\\alpha$ 粒子被金核散射的实验验证了原子核式结构模型。小角度截面发散，是长程力的特征。</p>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
</html>
