const LA_FIG = { 'b-field':`<svg viewBox="0 0 260 160" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="11" fill="#475569"><line x1="20" y1="80" x2="240" y2="80" stroke="#dc2626" stroke-width="2.5"/><polygon points="240,80 230,75 230,85" fill="#dc2626"/><circle cx="130" cy="80" r="14" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/><text x="125" y="85" fill="#fff">I</text><text x="100" y="60" fill="#dc2626">B</text><text x="100" y="105" fill="#dc2626">B</text><path d="M130,80 m-50,0 a50,50 0 0 1 100,0" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" opacity=".5"/></svg>`,'e-field':`<svg viewBox="0 0 260 180" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="11" fill="#475569"><circle cx="130" cy="90" r="12" fill="#dc2626"/><text x="124" y="94" fill="#fff">+</text><line x1="130" y1="30" x2="130" y2="60" stroke="#2563eb" stroke-width="1.8"/><polygon points="130,60 125,52 135,52" fill="#2563eb"/><line x1="130" y1="120" x2="130" y2="160" stroke="#2563eb" stroke-width="1.8"/><polygon points="130,160 125,152 135,152" fill="#2563eb"/><line x1="60" y1="90" x2="100" y2="90" stroke="#2563eb" stroke-width="1.8"/><polygon points="100,90 92,85 92,95" fill="#2563eb"/><line x1="160" y1="90" x2="200" y2="90" stroke="#2563eb" stroke-width="1.8"/><polygon points="200,90 192,85 192,95" fill="#2563eb"/><line x1="75" y1="40" x2="105" y2="65" stroke="#2563eb" stroke-width="1.8"/><polygon points="105,65 97,60 99,70" fill="#2563eb"/><line x1="185" y1="40" x2="155" y2="65" stroke="#2563eb" stroke-width="1.8"/><polygon points="155,65 163,60 161,70" fill="#2563eb"/></svg>`,'inductor':`<svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif" font-size="11" fill="#475569"><line x1="20" y1="60" x2="80" y2="60" stroke="#475569" stroke-width="2"/><path d="M80,60 Q90,30 100,60 Q110,90 120,60 Q130,30 140,60 Q150,90 160,60 Q170,30 180,60 Q190,90 200,60" fill="none" stroke="#7c3aed" stroke-width="2"/><line x1="200" y1="60" x2="260" y2="60" stroke="#475569" stroke-width="2"/><text x="120" y="110" fill="#7c3aed">L</text></svg>` };
const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', note:'注 记', his:'背 景', ext:'拓 展'};
const LA_DATA = [
{id:'electromagnetism-ch1',num:'第一章',title:'静电场',en:'ELECTROSTATICS',sub:'库仑定律与高斯定理',desc:'',sections:[{name:'1.1 电场',color:'#2563eb',desc:'',items:[{id:'electromagnetism-1',name:'库仑定律',tags:["def", "thm", "der", "exa", "app", "note"],brief:'真空中两个静止点电荷间的作用力，与电量乘积成正比，与距离平方成反比。',fig:'e-field',figCap:'正点电荷的电场线',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>真空中两个静止点电荷间的作用力，与电量乘积成正比，与距离平方成反比。</p><div class="la-fml">$$F=k\\frac{q_1 q_2}{r^2}\\hat{r}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$F=k\\frac{q_1 q_2}{r^2}\\hat{r}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>库仑定律的矢量形式 F₁₂=kq₁q₂(r₂-r₁)/|r₂-r₁|³。叠加原理：多个电荷对某电荷的合力为各电荷单独作用力的矢量和。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>两个电量 1μC 的点电荷相距 1m，作用力 F=9×10⁹×10⁻¹²/1=9×10⁻³N。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>库仑定律是静电学的基础，与万有引力定律形式相似。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>库仑定律只适用于静止点电荷，运动电荷需考虑推迟效应。</p></section></div>`},{id:'electromagnetism-2',name:'高斯定理',tags:["def", "thm", "der", "exa", "app", "note"],brief:'通过任意闭合曲面的电通量等于该面所包围的电荷代数和除以 ε₀。',fig:'e-field',figCap:'高斯面与电通量',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>通过任意闭合曲面的电通量等于该面所包围的电荷代数和除以 ε₀。</p><div class="la-fml">$$\\oint_S E\\cdot dS=\\frac{q_{enc}}{\\varepsilon_0}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\oint_S E\\cdot dS=\\frac{q_{enc}}{\\varepsilon_0}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由库仑定律和叠加原理可严格证明高斯定理。利用对称性（球、柱、面对称）可简化电场计算。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>求均匀带电球壳（Q，R）的电场：r>R 时 E=Q/(4πε₀r²)；r<R 时 E=0。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>高斯定理是麦克斯韦方程组之一，适用于静电和变化电场。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>高斯定理普遍成立，但用其求 E 需高度对称性。</p></section></div>`}]},{name:'1.2 电势',color:'#7c3aed',desc:'',items:[{id:'electromagnetism-1',name:'电势与电场',tags:["def", "thm", "der", "exa", "app", "note"],brief:'电势 U 是单位正电荷的电势能，电场是电势的负梯度。',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电势 U 是单位正电荷的电势能，电场是电势的负梯度。</p><div class="la-fml">$$U=\\frac{W}{q},\\,E=-\\nabla U$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$U=\\frac{W}{q},\\,E=-\\nabla U$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由电场力做功与路径无关（保守场）定义电势差 U_AB=∫_A^B E·dl。点电荷电势 U=q/(4πε₀r)（取无穷远为零势）。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>点电荷 q=1nC 在 r=1m 处的电势 U=9×10⁹×10⁻⁹/1=9V。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>电势是标量，计算比电场（矢量）更简便。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>电势的零点可任选，电势差与零点选择无关。</p></section></div>`}]}]},
{id:'electromagnetism-ch2',num:'第二章',title:'静磁场',en:'MAGNETOSTATICS',sub:'毕奥-萨伐尔定律',desc:'',sections:[{name:'2.1 磁场',color:'#0f766e',desc:'',items:[{id:'electromagnetism-1',name:'毕奥-萨伐尔定律',tags:["def", "thm", "der", "exa", "app", "note"],brief:'电流元 Idl 在空间某点产生的磁感应强度 dB。',fig:'b-field',figCap:'载流直导线的磁场',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>电流元 Idl 在空间某点产生的磁感应强度 dB。</p><div class="la-fml">$$dB=\\frac{\\mu_0}{4\\pi}\\frac{Idl\\times\\hat{r}}{r^2}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$dB=\\frac{\\mu_0}{4\\pi}\\frac{Idl\\times\\hat{r}}{r^2}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>由毕奥-萨伐尔定律积分可得：无限长直导线 B=μ₀I/(2πr)，载流圆线圈中心 B=μ₀I/(2R)，螺线管内部 B=μ₀nI。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>长直导线通 10A 电流，距导线 0.1m 处 B=4π×10⁻⁷×10/(2π×0.1)=2×10⁻⁵T。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>毕奥-萨伐尔定律是静磁学的基础，对应静电学的库仑定律。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>磁场方向由右手螺旋定则确定。</p></section></div>`},{id:'electromagnetism-2',name:'安培力与洛伦兹力',tags:["def", "thm", "der", "exa", "app", "note"],brief:'载流导线在磁场中受安培力，运动电荷在磁场中受洛伦兹力。',fig:'b-field',figCap:'运动电荷在磁场中受力',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>载流导线在磁场中受安培力，运动电荷在磁场中受洛伦兹力。</p><div class="la-fml">$$F=Idl\\times B,\\,F=qv\\times B$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$F=Idl\\times B,\\,F=qv\\times B$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>安培力是洛伦兹力的宏观表现。均匀磁场中载流线圈受力矩 τ=m×B（m 为磁矩）。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>电子以 10⁶m/s 垂直进入 0.1T 磁场，洛伦兹力 F=evB=1.6×10⁻¹⁴N。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>洛伦兹力始终垂直于速度，不做功，只改变方向。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>安培力用于电动机，洛伦兹力用于质谱仪、回旋加速器。</p></section></div>`}]}]},
{id:'electromagnetism-ch3',num:'第三章',title:'电磁感应',en:'ELECTROMAGNETIC INDUCTION',sub:'法拉第定律',desc:'',sections:[{name:'3.1 感应',color:'#c2410c',desc:'',items:[{id:'electromagnetism-1',name:'法拉第电磁感应定律',tags:["def", "thm", "der", "exa", "app", "note"],brief:'回路中感应电动势等于磁通量变化率的负值。',fig:'inductor',figCap:'感应线圈',body:`<div class="la-kp"><section class="la-kp-sec la-kp-def"><h5>定 义</h5><p>回路中感应电动势等于磁通量变化率的负值。</p><div class="la-fml">$$\\varepsilon=-\\frac{d\\Phi}{dt}$$</div></section><section class="la-kp-sec la-kp-thm"><h5>定理 · 公式</h5><div class="la-fml">$$\\varepsilon=-\\frac{d\\Phi}{dt}$$</div></section><section class="la-kp-sec la-kp-der"><h5>推 导</h5><p>磁通量 Φ=∫B·dS。负号体现楞次定律：感应电流方向总是阻碍磁通量变化。动生电动势 ε=∫(v×B)·dl。</p></section><section class="la-kp-sec la-kp-exa"><h5>例 题</h5><p>边长 0.1m 的正方形线圈在 0.5T 磁场中以 10rad/s 转动，最大电动势 ε=NBAω=1×0.5×0.01×10=0.05V。</p></section><section class="la-kp-sec la-kp-app"><h5>应 用</h5><p>电磁感应是发电机、变压器的工作原理。</p></section><section class="la-kp-sec la-kp-note"><h5>注 记</h5><p>感应电动势与回路材料无关，只取决于磁通量变化率。</p></section></div>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
document.addEventListener('DOMContentLoaded', () => {
  renderLa();
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laRoadmap')]).catch(()=>{}); }
});
</script>
</body>
</html>
