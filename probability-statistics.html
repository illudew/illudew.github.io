<script>
const LA_FIG = {  };
const LA_TAG_LABEL = {def:'定 义', thm:'定 理', der:'推 导', exa:'例 子', app:'应 用', his:'注 记'};
const LA_DATA = [
{id:'la-ch1',num:'第一章',title:'概率论基础',en:'PROBABILITY FOUNDATIONS',sub:'随机事件、概率公理化、条件概率',desc:'概率是不确定性的数学语言。本章从古典概型出发，建立概率的公理化定义，讨论条件概率、独立性与全概率公式。',sections:[{name:'1.1 概率公理',color:'#2563eb',desc:'柯尔莫哥洛夫公理',items:[{id:'la-k1-1',name:'概率公理',tags:["def", "thm"],brief:'非负性、规范性、可列可加性。',body:`<p><strong>定义</strong>　概率 $P$ 是样本空间 $\\Omega$ 上事件域到 $[0,1]$ 的映射，满足：$P(A)\\ge0$，$P(\\Omega)=1$，对互斥事件 $P(\\bigcup A_i)=\\sum P(A_i)$。</p>`},{id:'la-k1-2',name:'条件概率与独立性',tags:["def", "thm"],brief:'$P(A|B)=P(AB)/P(B)$，独立 $P(AB)=P(A)P(B)$。',body:`<p>全概率公式：$P(B)=\\sum P(A_i)P(B|A_i)$。贝叶斯公式：$P(A_i|B)=\\frac{P(A_i)P(B|A_i)}{P(B)}$。</p>`}]}]},
{id:'la-ch2',num:'第二章',title:'随机变量与分布',en:'RANDOM VARIABLES',sub:'分布函数、常见分布',desc:'随机变量将随机事件数值化。本章讨论离散型与连续型随机变量及其分布。',sections:[{name:'2.1 离散型分布',color:'#7c3aed',desc:'二项、泊松、几何',items:[{id:'la-k2-1',name:'二项分布',tags:["def", "thm"],brief:'$X\\sim B(n,p)$，$P(X=k)=C_n^k p^k(1-p)^{n-k}$。',body:`<p>$n$ 次独立伯努利试验中成功次数。期望 $np$，方差 $np(1-p)$。</p>`},{id:'la-k2-2',name:'泊松分布',tags:["def", "thm"],brief:'$P(X=k)=\\frac{\\lambda^k}{k!}e^{-\\lambda}$，$E(X)=\\lambda$。',body:`<p>稀有事件计数模型。当 $n$ 大 $p$ 小时，$B(n,p)\\approx P(np)$。</p>`}]},{name:'2.2 连续型分布',color:'#0f766e',desc:'均匀、指数、正态',items:[{id:'la-k2-3',name:'正态分布',tags:["def", "thm", "app"],brief:'$f(x)=\\frac1{\\sqrt{2\\pi}\\sigma}e^{-\\frac{(x-\\mu)^2}{2\\sigma^2}}$。',body:`<p>$X\\sim N(\\mu,\\sigma^2)$，标准化 $Z=(X-\\mu)/\\sigma\\sim N(0,1)$。中心极限定理使正态分布无处不在。</p>`},{id:'la-k2-4',name:'指数分布',tags:["def", "thm"],brief:'$f(x)=\\lambda e^{-\\lambda x}(x>0)$，无记忆性。',body:`<p>等待时间模型。$P(X>s+t|X>s)=P(X>t)$。期望 $1/\\lambda$。</p>`}]}]},
{id:'la-ch3',num:'第三章',title:'数字特征',en:'MOMENTS',sub:'期望、方差、协方差、矩',desc:'数字特征概括分布的关键信息：中心位置、离散程度、相关关系。',sections:[{name:'3.1 期望与方差',color:'#c2410c',desc:'均值与波动',items:[{id:'la-k3-1',name:'数学期望',tags:["def", "thm"],brief:'$E(X)=\\int x f(x)dx$，线性性 $E(aX+b)=aE(X)+b$。',body:`<p>期望即加权平均。对函数 $g(X)$，$E[g(X)]=\\int g(x)f(x)dx$。</p>`},{id:'la-k3-2',name:'方差',tags:["def", "thm"],brief:'$D(X)=E[(X-EX)^2]=E(X^2)-(EX)^2$。',body:`<p>方差刻画离散程度。$D(aX+b)=a^2D(X)$。标准差 $\\sigma=\\sqrt{D(X)}$。</p>`}]},{name:'3.2 协方差与相关系数',color:'#7c3aed',desc:'两个变量的线性关系',items:[{id:'la-k3-3',name:'相关系数',tags:["def", "thm"],brief:'$\\rho=\\frac{\\text{Cov}(X,Y)}{\\sigma_X\\sigma_Y}$，$|\\rho|\\le1$。',body:`<p>$\\text{Cov}(X,Y)=E(XY)-E(X)E(Y)$。$\\rho=\\pm1$ 表示完全线性相关。</p>`}]}]},
{id:'la-ch4',num:'第四章',title:'数理统计',en:'MATHEMATICAL STATISTICS',sub:'抽样分布、参数估计、假设检验',desc:'数理统计从样本推断总体。本章覆盖参数估计与假设检验。',sections:[{name:'4.1 参数估计',color:'#2563eb',desc:'点估计与区间估计',items:[{id:'la-k4-1',name:'矩估计与极大似然',tags:["def", "der"],brief:'矩估计用样本矩代替总体矩；MLE 最大化似然函数。',body:`<p>极大似然估计：$\\hat\\theta=\\arg\\max L(\\theta)=\\arg\\max\\prod f(x_i;\\theta)$。</p>`}]},{name:'4.2 假设检验',color:'#0f766e',desc:'显著性检验',items:[{id:'la-k4-2',name:'假设检验',tags:["def", "thm"],brief:'原假设 $H_0$ vs 备择 $H_1$，$p$ 值判断。',body:`<p>第一类错误（弃真）概率为显著性水平 $\\alpha$。当 $p<\\alpha$ 拒绝 $H_0$。</p>`}]}]}
];
const LA_KP = {};
function laBuildCard(item){
  const tags = item.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  return `<div class="la-course-card" onclick="showLaItem('${item.id}')"><div class="la-arc-badges">${tags}</div><h4>${item.name}</h4><p>${item.brief}</p></div>`;
}
function renderLa(){
  const root = document.getElementById('laRoadmap');
  let html = '';
  LA_DATA.forEach(ch => {
    html += `<h2 class="la-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="la-phase-en">${ch.en}</div>`;
    html += `<p class="la-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="la-domain" style="--domain-color:${sec.color};"><div class="la-domain-header"><h3>${sec.name}</h3><span class="la-domain-count">${sec.items.length} 个知识点</span><span class="la-domain-desc">${sec.desc}</span></div><div class="la-domain-grid">`;
      sec.items.forEach(it => { html += laBuildCard(it); LA_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`}; });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;
  const kCount = Object.keys(LA_KP).length;
  const fCount = (root.innerHTML.match(/\$\$/g) || []).length;
  document.getElementById('laKCount').textContent = kCount;
  document.getElementById('laFCount').textContent = Math.round(fCount / 2);
}
function showLaItem(id){
  const rec = LA_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('laCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('laTitle').textContent = it.name;
  document.getElementById('laTags').innerHTML = it.tags.map(t => `<span class="la-arc-badge la-arc-${t}">${LA_TAG_LABEL[t]}</span>`).join('');
  let bodyHtml = it.body;
  if (it.fig && LA_FIG[it.fig]) {
    const figHtml = `<div class="la-fig">${LA_FIG[it.fig]}<div class="la-fig-cap">${it.figCap || ''}</div></div>`;
    bodyHtml = figHtml + bodyHtml;
  }
  document.getElementById('laBody').innerHTML = bodyHtml;
  document.getElementById('laOverlay').classList.add('show');
  document.querySelector('.la-modal').scrollTop = 0;
  if (window.MathJax && window.MathJax.typesetPromise) { window.MathJax.typesetPromise([document.getElementById('laBody')]).catch(()=>{}); }
}
function hideLaInfo(){ document.getElementById('laOverlay').classList.remove('show'); }
function closeLaInfo(e){ if(e.target.id === 'laOverlay') hideLaInfo(); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') hideLaInfo(); });
