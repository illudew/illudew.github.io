<script>
const NM_TAG_LABEL = {def:'定 义', law:'定 律', der:'推 导', mod:'模 型', exp:'实 验', his:'历 史'};

const NM_DATA = [
  {
    id:'nm-ch1', num:'第一章', title:'运动学基础', en:'KINEMATICS',
    sub:'从观察运动到建立数学描述',
    desc:'运动学首先不问"为什么"，而只把"物体怎样运动"说清楚。它的基本顺序是先选参考系，再选坐标，再用位置函数描述运动，最后用导数与积分建立速度、加速度和位移之间的联系。',
    sections:[
      {name:'1.1 物理模型、参考系与坐标', color:'#2563eb', desc:'保留关键因素，暂时忽略次要因素', items:[
        {id:'nm-k1-1', name:'质点模型', tags:['mod','def'], brief:'质点不是"非常小的物体"，而是一种有明确适用范围的理想化。',
          body:`<p><strong>定义</strong>　在所研究的问题中，可以忽略物体尺寸和形状，而只考虑其质量集中于某一点的理想模型。</p>
<p>判断能否使用质点模型，关键不在物体本身多大，而在物体尺寸相对于研究尺度是否足够小，以及是否只关心它整体的位置。</p>
<p>例如研究一辆汽车从甲地到乙地时，车身螺栓的温度、座椅的材料和轮胎橡胶的微观结构通常不是首先需要的量；真正重要的是位置如何随时间改变。</p>
<div class="nm-callout nm-his">历史　物理学并不是把自然界所有细节全部记录下来，而是寻找在特定问题中真正重要的变量。经典力学正是在这种"保留关键因素、暂时忽略次要因素"的思想中建立起来的。</div>`},
        {id:'nm-k1-2', name:'参考系与坐标系', tags:['def'], brief:'先说"相对于谁运动"，再用数值把位置写下来。',
          body:`<p><strong>参考系</strong>　用来规定位置、方向和时间读数的一套参照标准。只要研究运动，就必须先说明"相对于谁运动"。</p>
<p><strong>坐标系</strong>　在参考系中用数值表示位置的一套规则。最常用的是直角坐标系、极坐标系和自然坐标。</p>
<p>平面直角坐标与极坐标对同一位置的描述可以互相换算：</p>
<div class="nm-fml">x = r cos θ,　　y = r sin θ
<span class="note">两种坐标描述的是同一个点 P，只是选取的"度量方式"不同。</span></div>
<p>运动学不回答"为什么"，而回答"怎样运动"。因此第一层工作永远是：选参考系 → 选坐标 → 写出位置函数。</p>`}
      ]},
      {name:'1.2 速度、加速度、曲线运动与相对运动', color:'#7c3aed', desc:'一元微积分如何刻画运动', items:[
        {id:'nm-k1-3', name:'位移、路程与平均速度', tags:['def'], brief:'位移只看初末位置之差，路程是轨迹上实际走过的长度。',
          body:`<p><strong>位移</strong>　从时刻 t₁ 到 t₂，位置变化定义为</p>
<div class="nm-fml">Δx = x₂ − x₁</div>
<p><strong>路程</strong>　运动轨迹上实际走过的长度。位移与路程一般不相等。</p>
<p><strong>平均速度</strong>　时间区间内的位置平均变化率：</p>
<div class="nm-fml">v̄ = Δx / Δt</div>
<p>它只反映整体的平均效果，不反映中间过程的快慢变化。</p>`},
        {id:'nm-k1-4', name:'瞬时速度与加速度', tags:['def','der'], brief:'让时间间隔无限缩小，平均速度就逼近瞬时变化率。',
          body:`<p><strong>瞬时速度</strong>　位置对时间的一元导数：</p>
<div class="nm-fml">v = dx / dt</div>
<p><strong>推导</strong>　设时间间隔越来越小，则平均速度越来越接近某一瞬间的真实变化率。用极限表示：</p>
<div class="nm-fml">v = lim<sub>Δt→0</sub> [ x(t+Δt) − x(t) ] / Δt = dx / dt</div>
<p>这里没有引入多元函数，只对时间这一变量求导。</p>
<p><strong>加速度</strong>　描述速度改变的快慢：</p>
<div class="nm-fml">a = dv / dt = d²x / dt²</div>
<p>加速度可以来自速度大小改变，也可以来自速度方向改变。因此"速度恒定"必须同时包含大小和方向都不变。</p>
<div class="nm-fml">x(t) —d/dt→ v(t) —d/dt→ a(t)
a(t) —∫dt→ v(t) —∫dt→ x(t)
<span class="note">这是运动学最重要的一条计算链，正向求导、反向积分。</span></div>`},
        {id:'nm-k1-5', name:'平面运动的坐标分量', tags:['def'], brief:'两个坐标都是时间的函数，速度与加速度分别分解。',
          body:`<p>平面内的运动用两个时间函数描述：</p>
<div class="nm-fml">x = x(t),　　y = y(t)</div>
<p>速度的两个分量与大小：</p>
<div class="nm-fml">v<sub>x</sub> = dx/dt,　v<sub>y</sub> = dy/dt
v = √( v<sub>x</sub>² + v<sub>y</sub>² )</div>
<p>加速度分量：</p>
<div class="nm-fml">a<sub>x</sub> = dv<sub>x</sub>/dt,　a<sub>y</sub> = dv<sub>y</sub>/dt</div>
<p>当运动天然具有"绕某一点转动"的特点时，用 r 和 θ 比直角坐标更直接。</p>`},
        {id:'nm-k1-6', name:'平面极坐标：径向与横向速度', tags:['def','der'], brief:'单位方向 e_r 本身随时间转动，求导时不能只对 r 求导。',
          body:`<p>在平面极坐标中，定义随 θ 转动的单位方向 e<sub>r</sub> 沿半径向外，e<sub>θ</sub> 沿角度增加方向。位置写成</p>
<div class="nm-fml">r = r e<sub>r</sub></div>
<p><strong>推导</strong>　单位方向在小角位移 dθ 下转过同样的角度，其变化方向指向 e<sub>θ</sub>：</p>
<div class="nm-fml">de<sub>r</sub>/dt = θ̇ e<sub>θ</sub>
de<sub>θ</sub>/dt = −θ̇ e<sub>r</sub></div>
<p>于是</p>
<div class="nm-fml">v = d(r e<sub>r</sub>)/dt = ṙ e<sub>r</sub> + r θ̇ e<sub>θ</sub>
v<sub>r</sub> = ṙ,　　v<sub>θ</sub> = r θ̇</div>
<p>再对速度求一次时间导数并整理，得到加速度分量：</p>
<div class="nm-fml">a<sub>r</sub> = r̈ − r θ̇²
a<sub>θ</sub> = r θ̈ + 2 ṙ θ̇</div>
<p>这两个式子只包含关于时间的一元导数。</p>`},
        {id:'nm-k1-7', name:'自然坐标：切向与法向加速度', tags:['def','law','der'], brief:'把"改变快慢"与"改变方向"精确分离。',
          body:`<p>对沿弯曲轨道运动的质点，最自然的方向是轨道切线方向与法线方向。自然坐标用弧长 s 描述沿轨道的位置，用切向 τ 和法向 n 描述方向。</p>
<div class="nm-fml">v = ds/dt　（切向速度）
a<sub>t</sub> = dv/dt　（切向加速度，描述速度大小的改变）</div>
<p><strong>法向加速度</strong></p>
<div class="nm-fml">a<sub>n</sub> = v² / R
<span class="note">R 是轨迹在该点附近的曲率半径。法向加速度垂直于瞬时速度，专门负责改变速度方向。</span></div>
<p><strong>推导</strong>　取一小段圆弧近似轨迹。两端速度大小都近似为 v，方向夹角为 Δθ。速度矢量本身也形成一条等半径圆弧，所以</p>
<div class="nm-fml">|Δv| ≈ v Δθ
Δs ≈ R Δθ = v Δt</div>
<p>因此</p>
<div class="nm-fml">|Δv| / Δt ≈ (v Δθ) / Δt = (v Δs) / (R Δt) = v² / R</div>
<p>令时间间隔趋于零，即得法向加速度。总加速度为</p>
<div class="nm-fml">a = √( a<sub>t</sub>² + a<sub>n</sub>² )</div>`},
        {id:'nm-k1-8', name:'抛体运动', tags:['mod','der'], brief:'水平方向无加速度，竖直方向加速度为 −g，两者独立。',
          body:`<p>忽略空气阻力，初速度与水平成角度 α 的物体只受重力作用。取竖直向上为正：</p>
<div class="nm-fml">a<sub>x</sub> = 0,　　a<sub>y</sub> = −g</div>
<p>初速度分解为</p>
<div class="nm-fml">v<sub>0x</sub> = v₀ cos α,　　v<sub>0y</sub> = v₀ sin α</div>
<p>积分得到运动方程：</p>
<div class="nm-fml">x = v₀ cos α · t
y = v₀ sin α · t − ½ g t²</div>
<p>消去时间，得到轨迹方程（抛物线）：</p>
<div class="nm-fml">y = x tan α − g x² / ( 2 v₀² cos² α )</div>
<div class="nm-callout">抛体运动的最高点只有竖直速度 v<sub>y</sub> 为零，水平速度 v<sub>x</sub> 仍然存在。因此最高点的总速度一般不为零。"某一分量为零"和"整个矢量为零"必须严格区分。</div>`},
        {id:'nm-k1-9', name:'圆周运动与角速度', tags:['def','law'], brief:'a_n = v²/r = rω²，"向心"是方向描述，不是新的力。',
          body:`<p>当 r 为常数时，极坐标表达式化为圆周运动。此时 ṙ = 0，于是</p>
<div class="nm-fml">v = r θ̇ = r ω</div>
<p><strong>角速度</strong></p>
<div class="nm-fml">ω = dθ / dt</div>
<p>若为匀速圆周运动，ω 为常数。圆周运动的加速度指向圆心，大小为</p>
<div class="nm-fml">a<sub>n</sub> = v² / r = r ω²</div>
<div class="nm-callout">这里的"向心"是方向描述，不是额外的一种基本力。向心加速度可以由绳张力、摩擦力、万有引力或支持力的分量提供。</div>`},
        {id:'nm-k1-10', name:'相对运动：平动参考系', tags:['law','der'], brief:'低速平动参考系之间加速度不变，牛顿第二定律保持同样形式。',
          body:`<p>考虑两个只做平动的参考系 S 与 S′。若 S′ 相对 S 以恒定速度 V 沿 x 方向移动，则一维位置满足</p>
<div class="nm-fml">x = x′ + V t</div>
<p><strong>推导</strong>　对时间求导：</p>
<div class="nm-fml">v = v′ + V</div>
<p>再求导：</p>
<div class="nm-fml">a = a′</div>
<p><strong>定律</strong>　在低速平动参考系之间，经典力学中的加速度保持不变，因此牛顿第二定律可以保持同样形式。</p>
<p>这条关系直接解释了"人在行驶列车中向前走"的问题：地面看到的速度等于列车速度与人在车内速度的代数和。</p>`},
        {id:'nm-k1-11', name:'旋转参考系与科里奥利项', tags:['der','mod'], brief:'坐标基底的转动本身就会带来速度与加速度的修正项。',
          body:`<p>若坐标轴本身以角速度 ω 转动，某个矢量的变化不仅来自矢量本身，也来自坐标基底的转动。对随参考系一起转动的单位向量：</p>
<div class="nm-fml">de<sub>r</sub>/dt = ω × e<sub>r</sub></div>
<p>于是惯性系看到的速度与旋转系看到的速度关系为</p>
<div class="nm-fml">v = v′ + ω × r</div>
<p>再取一次时间导数：</p>
<div class="nm-fml">a = a′ + 2ω × v′ + ω × (ω × r) + ω̇ × r
<span class="note">第二项 → 科里奥利效应；第三项 → 离心效应；第四项 → 欧拉效应。</span></div>
<p>这仍然只涉及时间的一元导数。这是旋转平台、摆在转盘上的运动和地球自转问题的基础。</p>`},
        {id:'nm-k1-12', name:'柱坐标与螺旋线', tags:['def','der'], brief:'圆周运动与匀速直线运动叠加，得到三维螺旋线。',
          body:`<p>当问题具有一条优先的旋转轴时，可以在极坐标之外加入轴向坐标 z，得到柱坐标 (r, θ, z)：</p>
<div class="nm-fml">r = r e<sub>r</sub> + z e<sub>z</sub>
v = ṙ e<sub>r</sub> + r θ̇ e<sub>θ</sub> + ż e<sub>z</sub>
a = (r̈ − r θ̇²) e<sub>r</sub> + (r θ̈ + 2 ṙ θ̇) e<sub>θ</sub> + z̈ e<sub>z</sub></div>
<p>一个质点若在水平面做匀速圆周运动，同时以恒定速度沿竖直方向上升，则三维轨迹是一条螺旋线。设</p>
<div class="nm-fml">r = R,　θ = ωt,　z = v<sub>z</sub> t</div>
<p>则总速度大小为</p>
<div class="nm-fml">v = √( R²ω² + v<sub>z</sub>² )</div>
<p>这个例子把圆周运动和直线运动组合起来，说明复杂轨迹可以由简单运动叠加形成。</p>`}
      ]},
      {name:'1.3 运动图像、实验与建模', color:'#0f766e', desc:'"导数看斜率，积分看面积"', items:[
        {id:'nm-k1-13', name:'x-t、v-t、a-t 图像', tags:['def','der'], brief:'曲线切线斜率是导数，曲线下有向面积是积分。',
          body:`<p>在 x-t 图上，曲线某点切线斜率就是该时刻的速度；在 v-t 图上，曲线斜率就是加速度，而曲线下的有向面积给出位移：</p>
<div class="nm-fml">Δx = ∫<sub>t₁</sub><sup>t₂</sup> v(t) dt
Δv = ∫<sub>t₁</sub><sup>t₂</sup> a(t) dt</div>
<p>因此"导数看斜率，积分看面积"是运动学中最值得形成的视觉直觉。</p>
<p>匀加速运动的 v-t 图像是一条直线。图像下方面积由矩形和三角形组成，因此很容易直接得到位移公式。与其死记</p>
<div class="nm-fml">x = x₀ + v₀t + ½ a t²</div>
<p>不如先记住图像面积的物理意义。</p>
<div class="nm-callout">"瞬时"并不意味着测量时间为零，而是让时间间隔无限缩小的极限过程。真实实验总有有限时间分辨率，因此实验测得的是近似瞬时量；理论中的导数则提供了理想极限。</div>`},
        {id:'nm-k1-14', name:'多阶段运动与连接条件', tags:['mod'], brief:'不要用一个公式包打天下，每阶段写自己的 x(t)、v(t)。',
          body:`<p>很多真实运动由几个阶段组成。例如汽车先匀加速、再匀速、最后刹车。</p>
<p>正确做法是：为每一阶段写自己的 x(t)、v(t)，并在阶段交界处使用<strong>位置和速度连续条件</strong>。</p>
<div class="nm-fml">x<sub>前一阶段</sub>(t<sub>交界</sub>) = x<sub>后一阶段</sub>(t<sub>交界</sub>)
v<sub>前一阶段</sub>(t<sub>交界</sub>) = v<sub>后一阶段</sub>(t<sub>交界</sub>)</div>
<p>这类问题最容易出错的地方不是公式，而是忽略交界时刻的位置与速度必须衔接。</p>`},
        {id:'nm-k1-15', name:'刹车距离与追及相遇', tags:['mod','der'], brief:'制动距离与初速度的平方成正比：速度翻倍，距离变四倍。',
          body:`<p>设汽车初速度为 v₀，刹车后受到近似恒定减速度 a。由</p>
<div class="nm-fml">v = v₀ − a t</div>
<p>在停车时 v = 0，得到</p>
<div class="nm-fml">t = v₀ / a</div>
<p>再由</p>
<div class="nm-fml">x = v₀ t − ½ a t²</div>
<p>得停车距离</p>
<div class="nm-fml">s = v₀² / (2a)</div>
<p>这里最值得注意的是距离与初速度的平方成正比：速度翻倍，理想模型中的制动距离变为四倍。</p>
<p><strong>追及相遇</strong>　两个物体分别做匀速运动，初始位置 x₁₀、x₂₀，速度 v₁、v₂，则相遇条件 x₁ = x₂ 给出</p>
<div class="nm-fml">t = ( x₂₀ − x₁₀ ) / ( v₁ − v₂ )
<span class="note">只要分母符号与实际追赶方向一致即可。</span></div>`},
        {id:'nm-k1-16', name:'视频法测速度与加速度', tags:['exp'], brief:'对数据作差分估计速度，再作差分估计加速度。',
          body:`<p>对一段真实运动视频按固定时间间隔取点，可以得到 x(t) 数据。</p>
<ul>
<li>对数据作差分可估计平均速度；</li>
<li>再对平均速度变化作差分可估计加速度。</li>
</ul>
<p>实验误差意味着曲线不会严格光滑，但物理规律应在误差范围内表现出来。</p>
<p>在光电门、视频分析或雷达测速中，可以获得不同时间的位置或速度数据。把相邻数据点画在 x-t、v-t 图上，就可以观察导数的几何意义。</p>
<div class="nm-callout nm-exp">用 v² 而不是 v 作图，往往更容易观察线性关系——这是能量与运动学实验中一个非常实用的技巧。</div>`},
        {id:'nm-k1-17', name:'变加速度运动与逐次积分', tags:['der'], brief:'常用匀加速公式只是 a 为常量时的特例。',
          body:`<p>设一辆实验小车在一段时间内满足</p>
<div class="nm-fml">a(t) = a₀ + c t</div>
<p>由初始速度 v₀ 出发，对时间积分：</p>
<div class="nm-fml">v(t) = v₀ + a₀ t + ½ c t²</div>
<p>再积分一次：</p>
<div class="nm-fml">x(t) = x₀ + v₀ t + ½ a₀ t² + (1/6) c t³</div>
<p>这个例子说明，常用的匀加速公式只是 a 为常量时的特例。面对一般运动，应先给出真实的 a(t)，再逐次积分得到 v(t) 与 x(t)。</p>
<div class="nm-callout">导数把"整体曲线"压缩为"局部变化率"，积分则把"局部变化率"重新累积成有限变化量。</div>`}
      ]}
    ]
  },

  {
    id:'nm-ch2', num:'第二章', title:'牛顿动力学', en:'NEWTONIAN DYNAMICS',
    sub:'力、相互作用与运动',
    desc:'动力学在运动学之上进一步追问"为什么会这样运动"。它把真实世界中的复杂相互作用集中成可计算的力，并通过自由体图、坐标分解和牛顿定律建立运动方程。核心工具不是更多公式，而是隔离、受力图、坐标分解和牛顿第二定律。',
    sections:[
      {name:'2.1 牛顿定律、惯性与受力分析', color:'#dc2626', desc:'从"维持运动"到"改变运动"', items:[
        {id:'nm-k2-1', name:'牛顿第一定律与惯性', tags:['law','his','exp'], brief:'合外力为零时，物体保持静止或匀速直线运动。',
          body:`<p><strong>定律</strong>　若物体所受合外力为零，则它保持静止或匀速直线运动。</p>
<div class="nm-fml">ΣF = 0　⟹　a = 0</div>
<p><strong>惯性</strong>　物体保持原有运动状态的性质。质量越大，改变其运动状态越困难。</p>
<div class="nm-callout nm-his">历史　古典时代，人们容易把"力"和"运动"直接联系起来，仿佛运动一定需要持续推着物体。伽利略斜面实验与惯性思想改变了这种认识：一个物体保持匀速直线运动并不需要有额外的"维持力"，真正需要解释的是速度为什么发生改变。</div>
<div class="nm-callout nm-exp">实验　气垫导轨、光滑轨道和低摩擦小车都在实验上逼近这一理想状态。实验并不制造"没有力"，而是尽量减小非目标相互作用，使理想模型成为可检验的近似。</div>`},
        {id:'nm-k2-2', name:'牛顿第二定律', tags:['law','der','exp'], brief:'ΣF = ma，把"相互作用强弱"、"惯性大小"与"速度改变快慢"定量联系。',
          body:`<div class="nm-fml">ΣF = m a</div>
<p><strong>推导</strong>　把质量 m 定义为表征惯性大小的标度，把加速度定义为运动状态改变的量，则实验给出的比例关系可统一写成上式。</p>
<p>它的关键不是记忆，而是把"相互作用强弱""惯性大小"和"速度改变快慢"建立定量联系。</p>
<div class="nm-callout nm-exp">实验　在保持质量不变时，逐渐增加拉力，可以测得加速度近似按比例增加；在保持拉力不变时，增加质量，加速度按反比减小。两者结合得到 a ∝ F/m。</div>
<p>二维问题中把它分解为两个一维方程：</p>
<div class="nm-fml">ΣF<sub>x</sub> = m a<sub>x</sub>,　　ΣF<sub>y</sub> = m a<sub>y</sub></div>`},
        {id:'nm-k2-3', name:'牛顿第三定律', tags:['law','def'], brief:'作用力与反作用力大小相等、方向相反，且作用于不同物体。',
          body:`<div class="nm-fml">F<sub>AB</sub> = − F<sub>BA</sub></div>
<p>两物体相互作用时，物体 A 对物体 B 的作用力与物体 B 对物体 A 的作用力大小相等、方向相反，且作用在不同物体上。</p>
<p><strong>作用力与反作用力不能因为方向相反就相互"抵消"</strong>，因为它们作用于不同物体。真正对某一个物体的运动方程有贡献的是作用在这个物体上的全部力。</p>
<div class="nm-callout">判断一对作用力与反作用力的最可靠方法不是看方向，而是问三个问题：<br>
① 作用对象是否不同？<br>
② 来源是否相同？<br>
③ 是否同时出现？<br><br>
例如地面对人的支持力与人对地面的压力是一对第三定律作用力；而地面对人的支持力与人的重力<strong>不是</strong>一对作用力和反作用力，因为它们作用在同一个人身上且来源不同。</div>`},
        {id:'nm-k2-4', name:'自由体图与坐标分解', tags:['mod','der'], brief:'受力分析的第一步不是写方程，而是"隔离对象"。',
          body:`<p>受力分析的第一步不是写方程，而是"隔离对象"：把研究对象从环境中单独拿出来，画出所有外界作用。</p>
<p>自由体图上只画作用在研究对象上的外力——重力、支持力、摩擦力、张力、外力等，不画研究对象施加给别人的力。</p>
<p><strong>推导</strong>　选定坐标轴后，把每一个力沿坐标轴分解，再分别写</p>
<div class="nm-fml">ΣF<sub>x</sub> = m a<sub>x</sub>,　　ΣF<sub>y</sub> = m a<sub>y</sub></div>
<p>二维问题因而被化成两个一维动力学方程。</p>
<div class="nm-callout">成熟的解题流程：<br>
选对象 → 选参考系 → 画自由体图 → 选坐标 → 分解力 → 写 ΣF = ma → 结合约束 → 检查极限情形</div>`},
        {id:'nm-k2-5', name:'重力、支持力与张力', tags:['def'], brief:'支持力大小并不一定等于 mg；张力只在理想条件下各段相同。',
          body:`<p><strong>重力</strong>　在地球表面附近近似写成</p>
<div class="nm-fml">G = m g</div>
<p><strong>支持力</strong>　来自接触面的形变，方向通常垂直于接触面，但<strong>大小并不一定等于 mg</strong>。它由动力学方程决定。</p>
<p><strong>张力</strong>　理想轻绳中的张力沿绳方向。只有在"轻绳、光滑无质量滑轮、无绳伸长"等理想条件成立时，同一根连续绳中的张力才能在各段近似相同。</p>
<div class="nm-callout">"轻滑轮"是一个真正的理想化，而不是永恒成立的事实。滑轮若有转动惯量，两侧张力就不再相等。</div>`},
        {id:'nm-k2-6', name:'静摩擦与滑动摩擦', tags:['def','exp'], brief:'静摩擦会"按需要取值"，直到达到最大值。',
          body:`<p>摩擦是接触面之间微观凸起和黏附等效应的宏观表现。经典力学中常用两种简化模型。</p>
<p><strong>静摩擦</strong></p>
<div class="nm-fml">0 ≤ f<sub>s</sub> ≤ μ<sub>s</sub> N</div>
<p>它会自动取一个足以满足动力学方程的值，直到达到最大静摩擦。</p>
<p><strong>滑动摩擦</strong></p>
<div class="nm-fml">f<sub>k</sub> = μ<sub>k</sub> N</div>
<p>方向与相对运动方向相反。</p>
<div class="nm-callout nm-exp">实验　在水平面上缓慢拉动物体，使其近似匀速。因为加速度近似为零，拉力和滑动摩擦力大小近似相等：F = f<sub>k</sub>。改变正压力 N 并记录拉力，即可估计摩擦系数。</div>
<div class="nm-callout">摩擦力反向的是<strong>相对滑动趋势</strong>，而不是简单反向于运动。汽车转弯时，静摩擦可能指向圆心；传送带加速物体时，静摩擦又可能沿运动方向。</div>`}
      ]},
      {name:'2.2 常见相互作用与约束运动', color:'#ea580c', desc:'斜面、连接体、圆周与弹簧', items:[
        {id:'nm-k2-7', name:'斜面模型', tags:['mod','der'], brief:'最自然的坐标轴沿斜面和垂直斜面，重力分解为两个分量。',
          body:`<p>物体位于倾角为 α 的斜面上时，最自然的坐标轴通常沿斜面和垂直斜面。</p>
<p>重力分解为沿斜面与垂直斜面的分量：</p>
<div class="nm-fml">mg sin α,　　mg cos α</div>
<p>若垂直方向没有加速度，则</p>
<div class="nm-fml">N = mg cos α</div>
<p>若斜面向下为正，且存在滑动摩擦，则</p>
<div class="nm-fml">mg sin α − μ<sub>k</sub> N = m a</div>
<p>所以</p>
<div class="nm-fml">a = g ( sin α − μ<sub>k</sub> cos α )</div>
<p>物体静止在斜面上时，不能直接写 f = μ<sub>s</sub>N。正确关系是</p>
<div class="nm-fml">f = mg sin α,　且满足 f ≤ μ<sub>s</sub> mg cos α
⟹　tan α ≤ μ<sub>s</sub>
<span class="note">只有到了临界状态才有 f = μ<sub>s</sub>N。</span></div>`},
        {id:'nm-k2-8', name:'阿特伍德装置与连接体', tags:['mod','der'], brief:'理想轻绳约束两物体的加速度大小相同。',
          body:`<p>对理想轻绳和光滑滑轮，设 m₂ &gt; m₁，取 m₂ 向下为正、m₁ 向上为正：</p>
<div class="nm-fml">T − m₁ g = m₁ a
m₂ g − T = m₂ a</div>
<p>两式相加消去张力：</p>
<div class="nm-fml">a = ( m₂ − m₁ ) g / ( m₁ + m₂ )</div>
<p>张力随后由任意一个方程求出。</p>
<div class="nm-callout">连接体问题要同时写多个物体的牛顿第二定律，还要使用绳长约束把它们的加速度联系起来。系统的关键不是把两个方程机械相加，而是识别约束关系。</div>`},
        {id:'nm-k2-9', name:'电梯中的视重', tags:['mod','der'], brief:'"变轻"不是重力真的改变，而是接触力改变。',
          body:`<p>人站在电梯地板上，重力与支持力构成最简单的竖直动力学模型。若向上为正：</p>
<div class="nm-fml">N − mg = m a　⟹　N = m ( g + a )</div>
<p>电梯向下加速时 a &lt; 0，支持力减小，人感到"变轻"；这不是重力真的改变，而是接触力改变。</p>
<p>若平台向下加速且 a = −g，则 N = 0，物体"失重"。这里"失重"表示接触支持力为零，不是重力消失。</p>`},
        {id:'nm-k2-10', name:'圆周运动的向心力来源', tags:['law','def'], brief:'向心项不是一种新的基本力，而是由已有相互作用提供的合力。',
          body:`<p>圆周运动要求存在指向圆心的合力：</p>
<div class="nm-fml">ΣF<sub>r</sub> = m v² / r</div>
<p>向心项不是一种新的基本力。它可能由摩擦、绳张力、万有引力、支持力的分量等不同物理作用共同提供。</p>
<p><strong>水平转盘上的静摩擦</strong>　物体与转盘无相对滑动，以半径 r 做匀速圆周运动。所需向心力来自静摩擦：</p>
<div class="nm-fml">f<sub>s</sub> = m v² / r,　且 f<sub>s</sub> ≤ μ<sub>s</sub> mg
⟹　v<sub>max</sub> = √( μ<sub>s</sub> g r )</div>
<p><strong>竖直圆周运动的最高点</strong>　若恰好保持绳子绷紧：</p>
<div class="nm-fml">T + mg = m v² / R
临界条件 T = 0　⟹　v = √( g R )
<span class="note">这只是一般位置中的一个特例，其他位置必须重新列径向方程。</span></div>`},
        {id:'nm-k2-11', name:'胡克定律与弹簧串并联', tags:['def','exp','der'], brief:'并联 k 相加，串联 k 的倒数相加。',
          body:`<p>理想线性弹簧在形变量较小时满足</p>
<div class="nm-fml">F = − k x
<span class="note">负号表示恢复方向与位移方向相反。</span></div>
<div class="nm-callout nm-exp">实验　逐渐增加弹簧伸长量并测力，可以得到近似直线关系。斜率给出劲度系数 k。超出弹性范围后，真实材料可能不再遵循线性关系，因此胡克定律也是一个模型。</div>
<p><strong>并联</strong>　同一位移 x 下两根弹簧都受力：</p>
<div class="nm-fml">F = −k₁x − k₂x = −( k₁ + k₂ ) x
k<sub>eq</sub> = k₁ + k₂</div>
<p><strong>串联</strong>　拉力相同而总伸长等于各自伸长之和：</p>
<div class="nm-fml">x = F/k₁ + F/k₂
1/k<sub>eq</sub> = 1/k₁ + 1/k₂</div>`},
        {id:'nm-k2-12', name:'倾斜弯道的设计速度', tags:['mod','der'], brief:'忽略摩擦时 tan α = v²/(rg)，弯道倾角对应一个设计速度。',
          body:`<p>车辆在倾斜角为 α 的弯道上转弯。忽略摩擦时，支持力的水平分量提供向心力，竖直分量平衡重力：</p>
<div class="nm-fml">N cos α = mg
N sin α = m v² / r</div>
<p>两式相除得</p>
<div class="nm-fml">tan α = v² / ( r g )</div>
<p>因此弯道倾角实际上对应一个设计速度尺度。速度高于或低于这个值，就需要摩擦力额外补偿。</p>`},
        {id:'nm-k2-13', name:'绳长约束与几何约束', tags:['der'], brief:'约束的本质是几何长度不变，而不是额外的动力学定律。',
          body:`<p>两物体通过不可伸长绳连接。若绳总长写成</p>
<div class="nm-fml">L = x₁ + x₂ + 常数</div>
<p>对时间求导得到</p>
<div class="nm-fml">v₁ + v₂ = 0</div>
<p>再次求导得到</p>
<div class="nm-fml">a₁ + a₂ = 0</div>
<p>这里符号的正负来自我们各自定义的坐标方向。</p>
<div class="nm-callout">约束的本质是几何长度不变，而不是额外的动力学定律。约束条件必须和牛顿方程同时使用。</div>
<p>当绳绕过光滑滑轮后两端运动方向不同，但由于绳长不变，它们沿绳方向的位移之和保持一定。对时间求导一次得到速度约束，再求导一次得到加速度约束。</p>`}
      ]},
      {name:'2.3 非惯性系、阻力与动力学建模', color:'#b45309', desc:'当参考系本身在加速', items:[
        {id:'nm-k2-14', name:'惯性力与加速参考系', tags:['def','mod'], brief:'惯性力不是新的基本相互作用，而是参考系加速带来的等效项。',
          body:`<p>在加速参考系中，如果仍希望使用与惯性系同样的运动方程式，就必须引入与参考系运动有关的惯性力。若参考系做平动加速度 A，则</p>
<div class="nm-fml">m a′ = ΣF − m A</div>
<p>旋转参考系还会出现离心力、科里奥利力和欧拉力。它们不是新的基本相互作用，而是由于描述运动所选参考系本身加速而出现的等效项。</p>
<div class="nm-callout">在匀速旋转参考系中，静止于旋转平台上的物体需要一个指向圆心的真实力来提供向心加速度；若改在旋转系中描述，则可以加入离心惯性力使物体"看起来"处于静力平衡。两种描述给出的实验预测相同，只是参考系不同。</div>`},
        {id:'nm-k2-15', name:'线性阻力与终端速度', tags:['mod','der'], brief:'当阻力与重力平衡时，加速度为零，速度趋于终端速度。',
          body:`<p>低速运动时可用线性阻力</p>
<div class="nm-fml">F<sub>d</sub> = − b v</div>
<p>竖直下落时若向下为正：</p>
<div class="nm-fml">mg − b v = m a</div>
<p>当达到终端速度，a = 0，所以</p>
<div class="nm-fml">v<sub>∞</sub> = mg / b</div>
<p><strong>推导</strong>　将 a = dv/dt 代入：</p>
<div class="nm-fml">dv/dt = g − (b/m) v</div>
<p>整理并积分，取初始速度为零，得到</p>
<div class="nm-fml">v(t) = (mg/b) ( 1 − e<sup>−bt/m</sup> )
<span class="note">这里仍然只做一元积分。</span></div>
<p>高速流动中则常见近似 F<sub>d</sub> ∝ −v|v|。这两种模型表达的都是"阻力反向于运动"，但速度依赖关系不同。</p>`},
        {id:'nm-k2-16', name:'极限情形检查与建模流程', tags:['def'], brief:'令参数取极限，看方程是否退化为熟悉的结果。',
          body:`<p>一个成熟的牛顿力学解题流程不是"看到公式就代数"，而是：</p>
<div class="nm-fml">选对象 → 选参考系 → 画自由体图 → 选坐标
→ 分解力 → 写 ΣF = ma → 结合约束 → 检查极限情形</div>
<p>最后一步尤其重要。例如：</p>
<ul>
<li>无摩擦极限 μ → 0；</li>
<li>质量相等极限 m₁ = m₂；</li>
<li>斜面变为水平面 α → 0；</li>
<li>弹簧常数趋于零；</li>
<li>某质量远大于另一质量。</li>
</ul>
<p>都能帮助我们发现符号和方向错误。一个好的动力学方程在参数取极限时应该自动退化到熟悉结果。</p>`},
        {id:'nm-k2-17', name:'力的叠加与矢量性', tags:['exp'], brief:'物体加速度方向与合力方向一致——这是矢量第二定律的直接表现。',
          body:`<p>两个独立方向的拉力可以通过测力计和滑轮组合合成一个总作用。</p>
<div class="nm-callout nm-exp">实验　物体加速度方向与合力方向一致，这一关系是矢量牛顿第二定律的直接表现。</div>
<p>若两个大小相等、方向相反的力作用在同一个质点上，合力为零，质点平动不变；但若它们作用在刚体不同位置并构成力偶，仍可能产生纯转动。这正是从质点动力学走向刚体力学的关键转折。</p>`}
      ]}
    ]
  },

  {
    id:'nm-ch3', num:'第三章', title:'功、能量、动量与守恒', en:'WORK · ENERGY · MOMENTUM',
    sub:'把瞬时动力学压缩成状态之间的关系',
    desc:'能量方法把瞬时动力学压缩成状态之间的关系。它特别适合处理复杂路径、变力和不需要时间信息的问题。动量则关注相互作用前后状态的总平衡，尤其适合快速碰撞与多体系统。',
    sections:[
      {name:'3.1 功、功率与能量的引入', color:'#059669', desc:'从微小功累加到动能定理', items:[
        {id:'nm-k3-1', name:'功的定义与变力做功', tags:['def','der'], brief:'F-x 图像下的有向面积给出一维变力的功。',
          body:`<p>对一维运动，力沿运动方向移动微小距离 dx 时，所做微小功定义为</p>
<div class="nm-fml">dW = F dx</div>
<p>因此从 x₁ 到 x₂ 的总功为</p>
<div class="nm-fml">W = ∫<sub>x₁</sub><sup>x₂</sup> F(x) dx</div>
<p>若力随位置变化，但变化足够平缓，可以把区间分成许多小段，在每小段内用常量近似：</p>
<div class="nm-fml">W ≈ Σ F<sub>i</sub> Δx<sub>i</sub> → W = ∫ F(x) dx</div>
<p>因此积分不是凭空出现的高级技巧，而是"无数个微小功相加"的极限。</p>
<div class="nm-callout">功是<strong>带符号</strong>的量。力与位移同向时功为正，反向时为负，垂直时在理想模型中功为零。功本身不是"力的大小"，而是力与位移共同决定的能量转移量。</div>`},
        {id:'nm-k3-2', name:'动能定理', tags:['law','der'], brief:'合外力所做的总功等于动能的改变量。',
          body:`<p><strong>推导</strong>　由牛顿第二定律 F = ma，又有</p>
<div class="nm-fml">a = dv/dt,　　dx = v dt</div>
<p>所以</p>
<div class="nm-fml">dW = F dx = m a · v dt = m v dv</div>
<p>积分得到</p>
<div class="nm-fml">W = ∫<sub>v₁</sub><sup>v₂</sup> m v dv = ½ m v₂² − ½ m v₁²</div>
<p><strong>动能</strong></p>
<div class="nm-fml">E<sub>k</sub> = ½ m v²</div>
<p><strong>定律</strong>　合外力所做的总功等于动能的改变量：</p>
<div class="nm-fml">W<sub>net</sub> = ΔE<sub>k</sub></div>`},
        {id:'nm-k3-3', name:'功率', tags:['def'], brief:'P = dW/dt，一维共线运动中 P = Fv。',
          body:`<p>功率描述做功的快慢：</p>
<div class="nm-fml">P = dW / dt</div>
<p>由于 dW = F dx 且 dx = v dt，一维共线运动中</p>
<div class="nm-fml">P = F v</div>
<p><strong>平均功率</strong></p>
<div class="nm-fml">P̄ = W / Δt</div>
<p><strong>瞬时功率</strong></p>
<div class="nm-fml">P = dW / dt</div>
<p>若知道功随时间变化，则 P = dW/dt；对于功率恒定的机械装置，短时间 Δt 内完成的功约为 ΔW = P Δt。</p>`},
        {id:'nm-k3-4', name:'重力势能与弹性势能', tags:['def','mod','der'], brief:'保守力做功只取决于高度差，弹簧储能 ½kx²。',
          body:`<p>在高度变化 dh 时，重力所做微小功为</p>
<div class="nm-fml">dW<sub>g</sub> = − mg dh</div>
<p>因此可以定义势能使 dE<sub>p</sub> = −dW<sub>g</sub>，积分得到</p>
<div class="nm-fml">E<sub>p</sub> = mgh + C
<span class="note">零点 C 可以任意选择，因此真正可测的是势能差。</span></div>
<p>对重力，在同一初末高度之间，无论路径多长，重力做功都只取决于高度差：</p>
<div class="nm-fml">W<sub>g</sub> = − mg ( h₂ − h₁ )</div>
<p><strong>弹性势能</strong>　理想弹簧满足胡克定律 F = −kx。从 0 拉到 x，外力做功为</p>
<div class="nm-fml">W<sub>ext</sub> = ∫₀<sup>x</sup> kx dx = ½ k x²
E<sub>s</sub> = ½ k x²</div>`}
      ]},
      {name:'3.2 机械能守恒与能量图像', color:'#0891b2', desc:'状态之间的允许关系', items:[
        {id:'nm-k3-5', name:'机械能守恒', tags:['law','der'], brief:'只有保守力做功时，动能与势能之和保持不变。',
          body:`<p><strong>定律</strong>　对只有保守力做功的系统，动能与势能之和保持不变：</p>
<div class="nm-fml">E<sub>k</sub> + E<sub>p</sub> = 常数</div>
<p><strong>推导</strong>　动能定理给出 ΔE<sub>k</sub> = W。若力为保守力，则 W = −ΔE<sub>p</sub>。因此</p>
<div class="nm-fml">ΔE<sub>k</sub> + ΔE<sub>p</sub> = 0　⟹　E<sub>k</sub> + E<sub>p</sub> = 常数</div>
<p>在一维保守系统中</p>
<div class="nm-fml">½ m v² + E<sub>p</sub>(x) = E₀</div>
<p>直接给出了速度与位置之间的关系，无需关心时间。</p>
<div class="nm-callout">一个可靠的物理结果必须经得起三个检查：<br>
① 量纲必须正确；<br>
② 极限情形必须合理；<br>
③ 改变零势能点不应改变最终可观测速度。</div>`},
        {id:'nm-k3-6', name:'摩擦耗散与能量守恒', tags:['law','mod'], brief:'摩擦力做负功意味着机械能向内部能量转化，而不是"能量消失"。',
          body:`<p>若滑块运动距离 s 并受到恒定滑动摩擦 f<sub>k</sub>，则非保守力做功</p>
<div class="nm-fml">W<sub>f</sub> = − f<sub>k</sub> s</div>
<p>因此</p>
<div class="nm-fml">ΔE<sub>k</sub> + ΔE<sub>p</sub> = W<sub>f</sub></div>
<p>这条式子把摩擦引起的机械能损失直接放到方程右侧。</p>
<p>更一般的写法是</p>
<div class="nm-fml">E<sub>initial</sub> + W<sub>nc</sub> = E<sub>final</sub></div>
<p>摩擦力做负功意味着机械能向热等内部能量转化，而不是说"能量消失"。</p>
<div class="nm-callout nm-exp">实验　比较物体在有摩擦和近似无摩擦轨道上的末速度，可以发现有摩擦时 E<sub>final</sub> &lt; E<sub>initial</sub> 对机械能成立。进一步测量轨道温升或摩擦功，可发现能量并未消失，而是转入其他能量形式。</div>`},
        {id:'nm-k3-7', name:'单摆的能量方法', tags:['mod','der'], brief:'最低点速度 v = √(2gl(1−cos θ₀))，不需要小角度近似。',
          body:`<p>单摆摆长 l，最大偏角为 θ₀，从静止释放。最低点高度差为</p>
<div class="nm-fml">h = l ( 1 − cos θ₀ )</div>
<p>忽略空气阻力，则</p>
<div class="nm-fml">mgl ( 1 − cos θ₀ ) = ½ m v²</div>
<p>因此最低点速度为</p>
<div class="nm-fml">v = √( 2 g l ( 1 − cos θ₀ ) )</div>
<div class="nm-callout">这个结果适用于任意不太大的角度，并不需要小角度近似。能量方法的优势在于：不需要知道摆动过程中张力的详细时间变化。</div>`},
        {id:'nm-k3-8', name:'势能曲线与平衡稳定性', tags:['def','der'], brief:'势能最低点对应稳定平衡，最高点对应不稳定平衡。',
          body:`<p>在一维问题中，如果力只依赖位置 x，可以通过</p>
<div class="nm-fml">E<sub>p</sub>(x) = − ∫ F(x) dx</div>
<p>定义势能。于是</p>
<div class="nm-fml">F(x) = − dE<sub>p</sub> / dx</div>
<p>若势能在某位置附近有最低点，物体稍微偏离后会受到使其返回的趋势，这对应<strong>稳定平衡</strong>；势能最高点附近则对应<strong>不稳定平衡</strong>。弹簧振子的平衡位置就是势能最低点的典型例子。</p>
<p>设平衡点为 x₀，平衡要求 F(x₀) = 0，即</p>
<div class="nm-fml">dE<sub>p</sub>/dx |<sub>x₀</sub> = 0</div>
<p>若附近势能可近似为</p>
<div class="nm-fml">E<sub>p</sub>(x) ≈ E<sub>p</sub>(x₀) + ½ k ( x − x₀ )²</div>
<p>则 F ≈ −k(x − x₀)，自然出现简谐回复力。这说明<strong>简谐运动是许多稳定平衡附近系统的普适近似</strong>。</p>
<p>给定总能量 E 后，可允许运动的区域必须满足 E ≥ E<sub>p</sub>(x)；当 E = E<sub>p</sub>(x) 时速度为零，对应转向点。</p>`},
        {id:'nm-k3-9', name:'效率与工程功率', tags:['def','mod'], brief:'η = E_out/E_in，真实耗散系统通常 0 < η < 1。',
          body:`<p>一个机械系统把输入能量的一部分转变为所需输出，另一部分可能变为热、声和材料内部能。若有用输出能量为 E<sub>out</sub>，输入能量为 E<sub>in</sub>，效率定义为</p>
<div class="nm-fml">η = E<sub>out</sub> / E<sub>in</sub>
<span class="note">对于真实耗散系统，通常 0 &lt; η &lt; 1。</span></div>
<p>以恒定速度 v 将质量 m 的物体竖直提升，若忽略损耗，拉力约为 mg，所需功率</p>
<div class="nm-fml">P = mgv</div>
<p>若考虑效率 η，输入功率需为</p>
<div class="nm-fml">P<sub>in</sub> = mgv / η</div>`}
      ]},
      {name:'3.3 动量、冲量、质心与碰撞', color:'#4f46e5', desc:'快速相互作用与整体视角', items:[
        {id:'nm-k3-10', name:'动量与冲量', tags:['def','law','der'], brief:'J = Δp，力对时间的积累等于动量的改变量。',
          body:`<p><strong>动量</strong></p>
<div class="nm-fml">p = m v</div>
<p><strong>冲量</strong>　力对时间的积累：</p>
<div class="nm-fml">J = ∫<sub>t₁</sub><sup>t₂</sup> F dt</div>
<p><strong>推导</strong>　由牛顿第二定律</p>
<div class="nm-fml">F = m dv/dt = dp/dt</div>
<p>对时间积分得到</p>
<div class="nm-fml">J = Δp</div>
<p><strong>定律</strong>　冲量等于动量的改变量。</p>
<p>在 F-t 图像中，曲线下的面积等于冲量。即使峰值力非常高，只要作用时间很短，总面积仍可能与较小但持续较久的力相同。</p>`},
        {id:'nm-k3-11', name:'动量守恒', tags:['law','der'], brief:'外力冲量为零时，系统总动量保持不变。',
          body:`<p>对一个封闭系统，如果系统受到的外力冲量为零，则系统总动量保持不变：</p>
<div class="nm-fml">p₁ + p₂ + … = 常数</div>
<p><strong>推导</strong>　系统中各内力按照牛顿第三定律成对出现，内部冲量彼此抵消，只留下外力冲量。若外力冲量为零，则总动量不变。</p>
<p>在平面碰撞中，应分别沿 x 和 y 方向守恒：</p>
<div class="nm-fml">Σp<sub>x</sub> = 常数,　　Σp<sub>y</sub> = 常数</div>
<div class="nm-callout">守恒定律必须<strong>逐方向、逐系统边界</strong>判断。例如沙包从上方落入行驶的车内：竖直方向外力冲量不能忽略，竖直动量不能简单守恒；但水平方向外力冲量若近似为零，则水平方向动量仍可守恒。</div>`},
        {id:'nm-k3-12', name:'质心与质心运动定理', tags:['def','law','der'], brief:'质心的运动只由外力决定，内力全部成对抵消。',
          body:`<p>两个质点的质心位置定义为</p>
<div class="nm-fml">x<sub>C</sub> = ( m₁x₁ + m₂x₂ ) / ( m₁ + m₂ )</div>
<p>推广到有限个质点：</p>
<div class="nm-fml">x<sub>C</sub> = Σ m<sub>i</sub>x<sub>i</sub> / Σ m<sub>i</sub></div>
<p>对时间求导得到质心速度，因此</p>
<div class="nm-fml">P<sub>total</sub> = M v<sub>C</sub>
<span class="note">M 是系统总质量。</span></div>
<p><strong>定律</strong>　封闭系统的质心作匀速直线运动；若外力存在，则</p>
<div class="nm-fml">ΣF<sub>ext</sub> = M a<sub>C</sub></div>
<p>由牛顿第二定律 m<sub>i</sub>a<sub>i</sub> = F<sub>i</sub>，所有内力成对抵消，因此质心的运动只由外力决定。</p>
<p>对均匀细杆，质心位于几何中点。更一般地，若取线密度为 λ(x)，一维连续体的质心可写为</p>
<div class="nm-fml">x<sub>C</sub> = ∫ x λ(x) dx / ∫ λ(x) dx</div>`},
        {id:'nm-k3-13', name:'完全非弹性碰撞', tags:['mod','der'], brief:'动量守恒，动能一般不守恒，损失量为 ΔE_k = ½ μ Δv²。',
          body:`<p>两个物体碰撞后粘在一起，碰撞过程中外力冲量可以忽略，则</p>
<div class="nm-fml">m₁v₁ + m₂v₂ = ( m₁ + m₂ ) v
v = ( m₁v₁ + m₂v₂ ) / ( m₁ + m₂ )</div>
<p>动能一般不守恒，但总动量守恒。代入前后动能，可得到损失</p>
<div class="nm-fml">ΔE<sub>k</sub> = ½ · ( m₁m₂ ) / ( m₁ + m₂ ) · ( v₁ − v₂ )²</div>
<p>它总是不小于零，并且只有当碰撞前两物体速度相等时才为零。</p>
<p><strong>恢复系数</strong>　碰撞后相对分离速度与碰撞前相对接近速度之比。对于一维正碰，取右为正：</p>
<div class="nm-fml">e = ( v₂′ − v₁′ ) / ( v₁ − v₂ )
<span class="note">完全弹性碰撞 e = 1，完全非弹性碰撞 e = 0。</span></div>`},
        {id:'nm-k3-14', name:'一维完全弹性碰撞', tags:['der'], brief:'动量守恒 + 动能守恒，等价于"相对速度反向而大小相等"。',
          body:`<p>一维完全弹性碰撞同时满足动量守恒与动能守恒：</p>
<div class="nm-fml">m₁v₁ + m₂v₂ = m₁v₁′ + m₂v₂′
½ m₁v₁² + ½ m₂v₂² = ½ m₁v₁′² + ½ m₂v₂′²</div>
<p>将两式联立并因式分解，可得到</p>
<div class="nm-fml">v₁′ = [(m₁ − m₂)/(m₁ + m₂)] v₁ + [2m₂/(m₁ + m₂)] v₂
v₂′ = [2m₁/(m₁ + m₂)] v₁ + [(m₂ − m₁)/(m₁ + m₂)] v₂</div>
<p>等价地，动量守恒加动能守恒可以改写为"相对速度反向而大小相等"：</p>
<div class="nm-fml">v₁ − v₂ = − ( v₁′ − v₂′ )</div>
<div class="nm-callout">这个关系有时比同时处理两个守恒方程更直观，因为它直接描述碰撞前后相对接近与相对分离。质量相等的弹性正碰会交换速度；轻球撞重球会反弹；重球撞轻球则几乎不减速。</div>`},
        {id:'nm-k3-15', name:'火箭方程与变质量', tags:['mod','der','his'], brief:'Δv = u ln(m₀/m)，提高排气速度和质量比都能增大速度增量。',
          body:`<p>火箭通过高速喷出质量获得反向动量。对于很短时间 dt，设火箭质量从 m 变为 m − dm，喷气相对火箭速度为 u。</p>
<p>对封闭的"火箭加喷出燃料"瞬间系统使用动量守恒，可以得到近似关系</p>
<div class="nm-fml">m dv = u dm</div>
<p>注意这里的 dm 应理解为正的"喷出质量增量的大小"。整理后积分</p>
<div class="nm-fml">∫<sub>v₀</sub><sup>v</sup> dv = u ∫<sub>m₀</sub><sup>m</sup> dm/m
v − v₀ = u ln( m₀ / m )</div>
<div class="nm-callout">变质量问题的难点不是"质量会变"，而是必须明确<strong>系统边界</strong>。若只把火箭本身作为系统，喷出的气体会携带动量穿过系统边界；若把某一瞬间的火箭和即将喷出的气体一起作为封闭系统，就可以先应用普通动量守恒，再令时间间隔趋于零。</div>
<p>该式揭示了为什么提高排气速度和提高质量比都会增大理想火箭速度增量。</p>`},
        {id:'nm-k3-16', name:'缓冲与平均力', tags:['mod','exp'], brief:'延长作用时间可以降低峰值力——安全气囊的原理。',
          body:`<p>同样的动量变化，如果延长作用时间，平均力就可以降低：</p>
<div class="nm-fml">F<sub>avg</sub> ≈ Δp / Δt</div>
<p>物体从速度 v 减到零，动量变化固定为 Δp = −mv。如果把停止时间从 Δt₁ 延长到 Δt₂，平均力近似从 mv/Δt₁ 降低为 mv/Δt₂。</p>
<p>因此软垫、吸能结构和安全带都通过延长减速时间降低峰值力。</p>
<div class="nm-callout nm-exp">实验　用力传感器测量小车碰撞时的 F-t 曲线，可以直接积分得到冲量，再与速度变化计算的 Δp 比较。若两者在实验误差内一致，就检验了冲量定理。</div>`}
      ]}
    ]
  },

  {
    id:'nm-ch4', num:'第四章', title:'转动与刚体力学', en:'ROTATION & RIGID BODY',
    sub:'力的作用位置与质量的分布',
    desc:'转动不是把平动公式中的字母机械地替换，而是要重新认识力的作用位置以及质量如何分布。门、车轮、飞轮和陀螺看似不同，却可以用同一套角量、力矩、转动惯量和角动量语言描述。',
    sections:[
      {name:'4.1 转动的语言：角量、力矩与平衡', color:'#7c3aed', desc:'同样大小的力，推在门把手与推在铰链附近效果完全不同', items:[
        {id:'nm-k4-1', name:'角位移、角速度与角加速度', tags:['def'], brief:'转动的三个基本运动学量，与平动量一一对应。',
          body:`<div class="nm-fml">ω = dθ / dt　（角速度）
α = dω / dt　（角加速度）</div>
<p>对半径固定的圆周运动，弧长满足</p>
<div class="nm-fml">s = r θ</div>
<p>求导得到</p>
<div class="nm-fml">v = r ω,　　a<sub>t</sub> = r α</div>
<p>角量必须用弧度表示，否则 s = rθ 不成立。</p>`},
        {id:'nm-k4-2', name:'力矩', tags:['def'], brief:'M = rF sin φ，力臂是转轴到力的作用线的垂直距离。',
          body:`<p>对固定转轴，力矩的大小等于力的切向作用乘以力臂。若力与半径夹角为 φ，则</p>
<div class="nm-fml">M = r F sin φ
<span class="note">力臂 l 是转轴到力的作用线的垂直距离。</span></div>
<p>对门施加垂直于门面的力时，力矩最大；沿铰链方向推几乎不产生转动。真正决定转动效果的是力臂而不仅是力的大小。</p>
<p>微小转角 dθ 下，力矩所做微小功为</p>
<div class="nm-fml">dW = M dθ　⟹　W = ∫ M dθ
P = M ω
<span class="note">这与平动中的 P = Fv 完全对应。</span></div>`}
      ]},
      {name:'4.2 转动定律与转动惯量', color:'#c2410c', desc:'质量离转轴越远，转动越"难"', items:[
        {id:'nm-k4-3', name:'转动定律', tags:['law','der'], brief:'ΣM = Iα，它是许多质点牛顿第二定律的整体结果。',
          body:`<p><strong>定律</strong>　对绕固定轴转动的刚体，外力矩之和与角加速度的关系为</p>
<div class="nm-fml">ΣM = I α</div>
<p><strong>推导</strong>　对距离转轴为 r 的质点，切向力满足</p>
<div class="nm-fml">F<sub>t</sub> = m a<sub>t</sub> = m r α</div>
<p>力矩为</p>
<div class="nm-fml">M = r F<sub>t</sub> = m r² α</div>
<p>对整个刚体求和。因为同一刚体绕固定轴转动时所有点的角加速度相同，所以</p>
<div class="nm-fml">ΣM = ( Σ m r² ) α = I α</div>
<p>于是转动定律不是凭空出现的，而是许多质点牛顿第二定律的整体结果。</p>`},
        {id:'nm-k4-4', name:'转动惯量', tags:['def','der'], brief:'I = Σmr² 或 I = ∫r²dm，衡量质量相对转轴的分布。',
          body:`<p>对有限个质点：</p>
<div class="nm-fml">I = Σ m r²</div>
<p>对连续物体，用一元积分把物体分成许多质量微元：</p>
<div class="nm-fml">I = ∫ r² dm</div>
<p><strong>推导示例一：均匀细杆绕端点</strong>　线密度 λ = M/L，距端点 x 的微元质量为 dm = λdx：</p>
<div class="nm-fml">I = ∫₀<sup>L</sup> x² λ dx = (M/L)(L³/3) = (1/3) M L²</div>
<p><strong>推导示例二：均匀圆盘绕中心轴</strong>　取半径为 r、宽度 dr 的薄环，面积 dA = 2πr dr：</p>
<div class="nm-fml">dm = (M / πR²) · 2πr dr
I = ∫₀<sup>R</sup> r² dm = (2M/R²) ∫₀<sup>R</sup> r³ dr = ½ M R²</div>`},
        {id:'nm-k4-5', name:'常用转动惯量表', tags:['def'], brief:'物体、转轴、结果必须三者同时确认。',
          body:`<div class="nm-fml">质点 m，距轴 r　　　　　　　　I = m r²
均匀细杆 M, L，过中点垂直杆　　I = (1/12) M L²
均匀细杆 M, L，过端点垂直杆　　I = (1/3) M L²
薄圆环 M, R，过圆心垂直环面　　I = M R²
均匀圆盘 M, R，过圆心垂直盘面　I = ½ M R²
实心球 M, R，过球心　　　　　　I = (2/5) M R²
薄球壳 M, R，过球心　　　　　　I = (2/3) M R²
矩形薄板 M, a, b，过中心垂直板面 I = (1/12) M ( a² + b² )</div>
<div class="nm-callout">记忆常用结果时可以抓住三个层次：质点看 mr²；连续物体看 I = ∫r²dm；形状相似时先估计 I ~ MR²。</div>`},
        {id:'nm-k4-6', name:'平行轴定理与垂直轴定理', tags:['law','der'], brief:'I = I_C + Md²，把表中结果迁移到其他转轴。',
          body:`<p><strong>平行轴定理</strong>　若质量为 M 的刚体绕过质心的轴转动惯量为 I<sub>C</sub>，另一根与其平行、相距 d 的轴转动惯量为</p>
<div class="nm-fml">I = I<sub>C</sub> + M d²</div>
<p><strong>推导</strong>　把各质点到目标轴的距离写成 r² = r<sub>C</sub>² + d² + 2d·r<sub>C</sub> 的形式，对整个物体求和。相对于质心轴的第一矩为零，因此交叉项消失，得到上式。</p>
<p>例如同样质量和长度的细杆，绕中心轴和绕端点转动：</p>
<div class="nm-fml">I<sub>C</sub> = (1/12) M L²
I<sub>E</sub> = I<sub>C</sub> + M (L/2)² = (1/3) M L²</div>
<p><strong>垂直轴定理</strong>　对位于同一平面内的薄板，若 x、y 两轴都在板面内且互相垂直，z 轴垂直板面，则</p>
<div class="nm-fml">I<sub>z</sub> = I<sub>x</sub> + I<sub>y</sub></div>`},
        {id:'nm-k4-7', name:'回转半径', tags:['def'], brief:'I = Mk²，k 是描述质量分布的等效尺度，不是几何半径。',
          body:`<p>为了把质量分布的差异压缩成一个长度，可以定义回转半径 k：</p>
<div class="nm-fml">I = M k²</div>
<p>它的物理意义是：把整个物体的质量都假想集中在离转轴距离 k 的位置时，得到的转动惯量恰好相同。</p>
<p>因此 k 不是物体真实的某一条长度，而是描述质量分布的等效尺度。若大部分质量集中在离轴约 R 的位置，那么通常有 k 与 R 同数量级；若大量质量靠近转轴，则 k 明显小于 R。</p>
<p>对于同样质量和半径的薄环、圆盘和实心球，质量分布相对越来越靠近转轴，所以通常有</p>
<div class="nm-fml">I<sub>ring</sub> &gt; I<sub>disk</sub> &gt; I<sub>sphere</sub></div>
<p>这条大小规律在估算题中很有用：先判断质量离轴的远近，往往就能预判转动惯量的大小规律。</p>`},
        {id:'nm-k4-8', name:'尺度规律与转动动能', tags:['law','der'], brief:'形状相似时 I ~ MR²；转动动能 E_rot = ½Iω²。',
          body:`<p>对形状相似的物体，转动惯量总体满足</p>
<div class="nm-fml">I ∼ M R²</div>
<p>因此在形状相似的刚体中，尺寸放大两倍而质量不变时，转动惯量增大为原来的四倍；若密度保持不变，三维物体的质量同时增大八倍，于是转动惯量总体上按长度的五次方变化。这个尺度规律对于判断工程结构的转动惯量变化非常有用，但必须明确"质量是否随尺寸一起变化"。</p>
<p><strong>转动动能</strong>　对半径 r 的质点，平动动能为</p>
<div class="nm-fml">dE = ½ dm ( r ω )²</div>
<p>积分得</p>
<div class="nm-fml">E<sub>rot</sub> = ½ I ω²</div>`}
      ]},
      {name:'4.3 角动量、滚动与刚体运动', color:'#be123c', desc:'纯滚动是几何约束，不是"没有摩擦"', items:[
        {id:'nm-k4-9', name:'角动量与角动量守恒', tags:['def','law'], brief:'L = Iω，外力矩为零时角动量守恒。',
          body:`<p>对固定轴转动的质点，关于该轴的角动量可用</p>
<div class="nm-fml">L = I ω</div>
<p>轴向合外力矩的作用给出</p>
<div class="nm-fml">M = dL / dt</div>
<p><strong>定律</strong>　因此当外力矩为零时，角动量守恒：</p>
<div class="nm-fml">L = 常数</div>
<p><strong>角冲量</strong></p>
<div class="nm-fml">J<sub>M</sub> = ∫ M dt = ΔL
<span class="note">它与线运动中的冲量—动量定理完全对应。</span></div>
<div class="nm-callout nm-exp">实验　坐在无摩擦转椅上旋转，收缩双臂后转速增加。若外力矩近似为零，I₁ω₁ = I₂ω₂。因为收缩手臂使 I 变小，所以 ω 增大。</div>`},
        {id:'nm-k4-10', name:'纯滚动与斜面加速度', tags:['mod','law','der'], brief:'a = g sin α / (1 + I/(mR²))，惯量越大下滑越慢。',
          body:`<p>圆盘或圆柱在粗糙面上纯滚动时，接触点相对于地面瞬时静止。几何约束为</p>
<div class="nm-fml">v<sub>C</sub> = R ω</div>
<p><strong>纯滚动不是"没有摩擦"</strong>，而是接触点没有相对滑动，因此静摩擦可能存在，也可能在某些理想情形中不做功。</p>
<p>半径 R、质量 m 的刚体沿倾角 α 的斜面纯滚动。沿斜面列平动方程：</p>
<div class="nm-fml">mg sin α − f = m a</div>
<p>绕质心列转动方程：</p>
<div class="nm-fml">f R = I α</div>
<p>纯滚动约束为 a = Rα，于是</p>
<div class="nm-fml">f = ( I / R² ) a
mg sin α = m a ( 1 + I/(mR²) )
a = g sin α / ( 1 + I/(mR²) )</div>
<p>写成 λ = I/(mR²)，则 a = g sin α / (1 + λ)。惯量越大，在平动与转动之间需要分配的能量越多，质心加速就越慢。</p>
<p>若用能量方法，从高度 h 释放：</p>
<div class="nm-fml">mgh = ½ m v² + ½ I ω²,　v = Rω
v = √( 2gh / ( 1 + I/(mR²) ) )</div>
<p>因此同样从高度 h 释放，球的末速度最大，其次是圆盘，圆环最小。</p>`},
        {id:'nm-k4-11', name:'有质量滑轮的张力差', tags:['der','mod'], brief:'T₂ − T₁ = (I/R²)a，轻滑轮是一个真正的理想化。',
          body:`<p>若滑轮有转动惯量 I，两侧张力不再相等。设绳绕滑轮不打滑，则</p>
<div class="nm-fml">( T₂ − T₁ ) R = I α,　α = a / R</div>
<p>因此</p>
<div class="nm-fml">T₂ − T₁ = ( I / R² ) a</div>
<p>这条式子说明为什么"轻滑轮"是一个真正的理想化，而不是永恒成立的事实。当 I → 0 时，才回到两侧张力相等的初等结论。</p>`},
        {id:'nm-k4-12', name:'静力平衡与取矩技巧', tags:['law'], brief:'ΣF = 0 且 ΣM = 0，选择合适取矩点可消去未知支持力。',
          body:`<p>刚体若既不平动也不转动，需要同时满足</p>
<div class="nm-fml">ΣF = 0,　　ΣM = 0</div>
<p>对跷跷板、梯子靠墙和桥梁简化模型，先选取合适的转轴写力矩平衡，往往比列出所有力的分量更直接。</p>
<div class="nm-callout">静力学问题中，选择一个合适的取矩点可以消去一个或多个未知支持力。例如梯子靠墙问题，若以梯脚为参考点，脚部的未知接触力矩直接为零。这个技巧不是数学花招，而是利用力矩本身对取矩轴的几何敏感性。</div>
<div class="nm-callout nm-exp">实验　在水平杆两侧悬挂不同砝码，调节到静止。若取支点为转轴，有 F₁r₁ = F₂r₂。改变力臂后，砝码质量必须反向调整。</div>`},
        {id:'nm-k4-13', name:'转动运动学与飞轮储能', tags:['def','der'], brief:'角加速度恒定时，转动公式与直线运动公式完全对应。',
          body:`<p>与平动完全类似，角加速度、角速度和角位移之间满足</p>
<div class="nm-fml">α = dω/dt,　　ω = dθ/dt</div>
<p>如果角加速度为常量，积分得到</p>
<div class="nm-fml">ω = ω₀ + α t
θ = θ₀ + ω₀ t + ½ α t²
ω² − ω₀² = 2 α ( θ − θ₀ )</div>
<p>这与直线运动公式完全对应，但必须注意角度用弧度表示。</p>
<p>若飞轮转动惯量为 I，受到恒定外力矩 M，则</p>
<div class="nm-fml">α = M / I
ω = (M/I) t
θ = (M/2I) t²</div>
<p><strong>飞轮储能</strong></p>
<div class="nm-fml">E = ½ I ω²</div>
<p>若同样质量和外径下，把更多质量分布在外缘，就可以提高 I，从而提高储能能力。这是机械储能系统的重要原理。</p>`},
        {id:'nm-k4-14', name:'陀螺进动的直觉', tags:['mod','his'], brief:'角动量矢量的方向改变，是进动现象的直觉基础。',
          body:`<p>高速旋转的转子具有较大的角动量。外力矩若只在一段方向作用，角动量矢量会改变<strong>方向</strong>而不是简单改变大小，这就是陀螺进动现象的直觉基础。</p>
<div class="nm-fml">ΔL ≈ M Δt
<span class="note">ΔL 的方向与 M 的方向一致，垂直于 L 本身，因此 L 的端点绕轴画圈。</span></div>
<div class="nm-callout">完整陀螺理论需要更完整的三维转动数学，本讲义只保留固定轴和基本角动量观点。</div>`}
      ]}
    ]
  },

  {
    id:'nm-ch5', num:'第五章', title:'机械振动与波动', en:'OSCILLATION & WAVES',
    sub:'从周期运动到波的传播',
    desc:'稳定平衡点附近的回复作用产生振动；振动状态沿介质或空间传播时形成波。先从简谐振动建立周期运动的语言，再用振动的叠加理解行波、干涉、驻波和拍频。',
    sections:[
      {name:'5.1 振动的基本模型与简谐运动', color:'#2563eb', desc:'稳定平衡附近的普遍近似', items:[
        {id:'nm-k5-1', name:'简谐运动方程', tags:['def','law','der'], brief:'回复力与位移成正比且反向，则系统做简谐运动。',
          body:`<p>若回复力与位移成正比且方向相反：</p>
<div class="nm-fml">F = − k x</div>
<p>则由牛顿第二定律 ma = −kx，所以</p>
<div class="nm-fml">a = − ω² x,　　ω = √( k / m )</div>
<p><strong>定律</strong>　简谐运动满足</p>
<div class="nm-fml">d²x/dt² + ω² x = 0
<span class="note">这里仍然只是同一变量 t 的二阶导数，不涉及偏微分。</span></div>
<p><strong>推导</strong>　我们知道</p>
<div class="nm-fml">d/dt cos(ωt + φ) = −ω sin(ωt + φ)
d²/dt² cos(ωt + φ) = −ω² cos(ωt + φ)</div>
<p>因此 x = A cos(ωt + φ) 满足简谐运动方程。</p>
<div class="nm-callout nm-his">历史　一个非常有用的几何观点是把简谐运动看成匀速圆周运动在某一直径方向上的投影。设圆周角速度为 ω，半径为 A，则投影坐标自然是 x = A cos(ωt + φ)。这个构造同时解释了正弦函数、周期、相位和速度方向之间的关系。</div>`},
        {id:'nm-k5-2', name:'振幅、相位与周期', tags:['def'], brief:'位移最大时速度为零、加速度最大；过平衡位置时反之。',
          body:`<p>振幅 A 表示最大位移；相位 φ 决定初始状态；角频率 ω 决定振动快慢；周期满足</p>
<div class="nm-fml">T = 2π / ω</div>
<p>由 x = A cos(ωt + φ) 可得</p>
<div class="nm-fml">v = −Aω sin(ωt + φ)
a = −Aω² cos(ωt + φ) = −ω² x</div>
<p>因此位移最大时速度为零、加速度最大；位移过平衡位置时速度最大、加速度为零。</p>
<p>位置和速度不是独立变化的，而满足</p>
<div class="nm-fml">x²/A² + v²/(A²ω²) = 1
<span class="note">这是一个椭圆关系，它告诉我们任意时刻的状态必须落在这条曲线上。</span></div>
<p>若 x(0) = x₀，v(0) = v₀，则 x₀ = A cos φ，v₀ = −Aω sin φ，两式共同确定振幅和初始相位。</p>`},
        {id:'nm-k5-3', name:'简谐运动的能量', tags:['der'], brief:'总机械能 E = ½kA²，在动能与势能之间周期转换。',
          body:`<p>总能量</p>
<div class="nm-fml">E = ½ m v² + ½ k x²</div>
<p>代入 v 得</p>
<div class="nm-fml">E = ½ k A²</div>
<p>能量在动能与弹性势能之间周期转换，但总机械能不变。</p>
<div class="nm-callout">对竖直弹簧振子，若直接以自然长度为坐标会在方程中同时出现重力和弹簧静态伸长。把坐标原点移到新的平衡位置，常量项自动消失，得到纯粹的回复运动。这个技巧体现了"选坐标"不仅影响计算难度，也影响物理结构的可见性。</div>`},
        {id:'nm-k5-4', name:'单摆', tags:['mod','exp'], brief:'小角度下 ω = √(g/l)，周期只与摆长有关。',
          body:`<p>单摆在小角度下的切向回复力近似为</p>
<div class="nm-fml">F<sub>t</sub> ≈ − mg ( x / l )</div>
<p>于是</p>
<div class="nm-fml">m d²x/dt² = −( mg / l ) x
ω = √( g / l ),　　T = 2π √( l / g )</div>
<div class="nm-callout">单摆真实回复力与 sin θ 有关。只有当 θ 较小时，才可以使用 sin θ ≈ θ。这意味着简单周期公式严格来说是小角度近似，而不是任意振幅下的精确结果。</div>
<div class="nm-callout nm-exp">实验　改变摆长可测得周期平方与摆长近似成正比：T² ∝ l。这也是利用振动测量重力加速度的经典方法。</div>`},
        {id:'nm-k5-5', name:'非线性回复与简谐近似', tags:['mod'], brief:'小振幅下任意势能谷都近似为简谐振动。',
          body:`<p>如果回复力不再严格正比于位移，例如</p>
<div class="nm-fml">F = − k x − α x³</div>
<p>那么系统就不再是严格的简谐振子。小振幅时 αx³ 很小，仍可近似为简谐运动；振幅增大后，周期会逐渐偏离常数。</p>
<p>这说明简谐运动本身是一种局部近似模型。</p>
<p>设任意一维势能在平衡点附近足够光滑。将势能在平衡位置附近展开到最低非零阶，可得到近似二次形式：</p>
<div class="nm-fml">E<sub>p</sub>(x) ≈ E<sub>p</sub>(x₀) + ½ k ( x − x₀ )²</div>
<p>因此回复力近似与位移成正比，简谐运动自然出现。这给出了简谐模型的更一般物理来源。</p>`}
      ]},
      {name:'5.2 阻尼、受迫振动、共振与拍', color:'#7c3aed', desc:'振幅衰减、峰值响应与包络', items:[
        {id:'nm-k5-6', name:'阻尼振动', tags:['mod','def'], brief:'振幅按指数衰减，能量衰减比振幅更快。',
          body:`<p>若阻力近似与速度成正比：</p>
<div class="nm-fml">F<sub>d</sub> = − b v</div>
<p>则方程为</p>
<div class="nm-fml">m d²x/dt² + b dx/dt + k x = 0
<span class="note">这里始终只处理时间这一自变量，因此所遇到的方程都属于一元微分方程。</span></div>
<p>在欠阻尼情况下，可以写成</p>
<div class="nm-fml">x = A₀ e<sup>−bt/(2m)</sup> cos( ω<sub>d</sub> t + φ )
ω<sub>d</sub> = √( k/m − b²/(4m²) )</div>
<p>线性阻尼系统根据参数大小可表现为欠阻尼、临界阻尼或过阻尼：</p>
<ul>
<li>欠阻尼：会振荡并衰减；</li>
<li>临界阻尼：最快地回到平衡而不过冲；</li>
<li>过阻尼：不振荡但回到平衡较慢。</li>
</ul>
<p>欠阻尼振动幅度近似满足 A(t) = A₀ e<sup>−bt/(2m)</sup>。由于能量与振幅平方成正比，机械振动能量近似满足</p>
<div class="nm-fml">E(t) = E₀ e<sup>−bt/m</sup>
<span class="note">因此能量衰减比振幅衰减更快。</span></div>`},
        {id:'nm-k5-7', name:'受迫振动与共振', tags:['def','exp','mod'], brief:'驱动频率接近固有频率且阻尼较小时，响应显著增强。',
          body:`<p>外力取为 F₀ cos ωt。系统达到稳态后，振动频率与外力频率相同。振幅随驱动频率变化，在阻尼较小时会出现明显峰值。</p>
<div class="nm-fml">稳态振幅的分母包含：( k − mω² )² + b² ω²</div>
<p>因此当驱动频率接近固有频率且阻尼较小时，响应显著增强。</p>
<p><strong>共振</strong>　受迫振动系统在驱动频率接近自身特征频率时，响应显著增强的现象。</p>
<div class="nm-callout">在低频驱动下，系统位移通常与外力近似同相；在高频区，位移趋向与外力反相；在共振附近，相位快速变化。相位本身因此也是实验中重要的信息，而不只是振幅的附属量。</div>
<div class="nm-callout nm-exp">实验　保持驱动力幅值近似不变，逐渐扫描频率并记录稳态振幅。绘制振幅—频率曲线，就可以找到共振区域。实验中必须等待暂态衰减，否则测得的幅度会受到初始条件影响。</div>
<p>桥梁与建筑工程中必须避免在结构固有频率附近长期受到周期性驱动。</p>`},
        {id:'nm-k5-8', name:'拍频', tags:['def','der'], brief:'两频率接近的振动叠加，出现缓慢变化的振幅包络。',
          body:`<p>两列频率很接近的振动</p>
<div class="nm-fml">x₁ = A cos ω₁t,　　x₂ = A cos ω₂t</div>
<p>叠加后</p>
<div class="nm-fml">x = 2A cos[ (ω₁ − ω₂)t / 2 ] · cos[ (ω₁ + ω₂)t / 2 ]</div>
<p>缓慢变化的包络来自频率差，快速振荡来自平均频率。若用普通频率 f₁、f₂ 表示，拍频为</p>
<div class="nm-fml">f<sub>beat</sub> = | f₁ − f₂ |</div>
<div class="nm-callout">两个接近频率的音叉同时发声。若 f₁ = 440 Hz，f₂ = 442 Hz，则拍频为 2 Hz。听到的是每秒约两次的响度周期性变化，而不是只听到 2 Hz 的低频声音。这正体现了快振荡与慢包络的分层结构。</div>
<p>这是一种把高频差异转化为低频可测信号的思想。</p>`},
        {id:'nm-k5-9', name:'耦合振子与正常模', tags:['mod'], brief:'同相运动中间弹簧不伸缩，反相运动中间弹簧强烈参与。',
          body:`<p>两个相邻质量通过弹簧连接时，一个质点的运动会通过中间弹簧传递给另一个质点。于是系统不再只有一个频率，而会出现多个本征振动方式。</p>
<p>设两个质量相同，每个端点再连接相同弹簧：</p>
<ul>
<li><strong>同相模式</strong>：两质点同向同幅运动，中间弹簧不伸缩；</li>
<li><strong>反相模式</strong>：两质点反向运动，中间弹簧发生最大形变。</li>
</ul>
<p>这两个简单模式揭示了"对称运动"和"反对称运动"为什么具有不同频率。复杂结构的正常模态可以从这些最基本的对称性理解。</p>
<p>若质点同时受到左右两根相同弹簧作用，小位移时总回复力仍可写成 F = −2kx，因此系统的特征频率变为</p>
<div class="nm-fml">ω = √( 2k / m )</div>`}
      ]},
      {name:'5.3 机械波：形成、传播与描述', color:'#0f766e', desc:'扰动状态的传播，而非物质的搬运', items:[
        {id:'nm-k5-10', name:'行波的数学描述', tags:['def','der'], brief:'y = A cos(ωt − kx + φ)，波速 v = ω/k = fλ。',
          body:`<p><strong>波不是"物质整体从一处搬到另一处"</strong>，而是扰动状态在介质或空间中的传播。质点可以只在平衡位置附近振动，而能量和信息向前传播。</p>
<p>向 +x 方向传播的简谐行波可写为</p>
<div class="nm-fml">y = A cos( ωt − kx + φ )</div>
<p>其中</p>
<div class="nm-fml">k = 2π / λ,　ω = 2πf,　v = ω / k = f λ</div>
<p>对固定位置 x 的一个介质点，y 随 t 振荡；而波形整体则以速度 v = ω/k 沿空间传播。两者是不同的速度概念。</p>
<p><strong>推导</strong>　保持相位不变需要满足</p>
<div class="nm-fml">ωt − kx = 常数　⟹　dx/dt = ω/k = v</div>
<p>这个推导只对一个关系求时间导数，没有使用偏微分。</p>
<p>相邻波峰相位相差 2π，所以它们的间距为 λ。若波速为 v，每秒通过某点的波峰数是 f，那么 v = fλ。这条关系可从"每个周期推进一个波长"的几何图像直接理解。</p>`},
        {id:'nm-k5-11', name:'叠加原理与干涉', tags:['law','der'], brief:'线性介质中，总位移等于各波单独位移的代数和。',
          body:`<p><strong>定律</strong>　在经典线性介质中，多个波同时存在时，某点的总位移等于各波单独位移的代数和：</p>
<div class="nm-fml">y = y₁ + y₂ + …</div>
<p>设</p>
<div class="nm-fml">y₁ = A cos( ωt − kx )
y₂ = A cos( ωt − kx + φ )</div>
<p>利用和差化积得到</p>
<div class="nm-fml">y = 2A cos(φ/2) · cos( ωt − kx + φ/2 )
A<sub>res</sub> = 2A | cos(φ/2) |</div>
<p>当相位差 φ = 0 时，振幅最大 A<sub>res</sub> = 2A；当 φ = π 时，振幅为零。</p>
<p><strong>路程差与相位差</strong>　两源到观察点的路径差为 Δr 时：</p>
<div class="nm-fml">Δφ = (2π/λ) Δr
相长：Δr = m λ
相消：Δr = ( m + ½ ) λ</div>
<p>这些条件的本质是"波峰和波峰相遇"或"波峰和波谷相遇"。干涉不是额外的一种力，而是线性叠加的结果。</p>`},
        {id:'nm-k5-12', name:'驻波', tags:['def','der'], brief:'两列反向传播的同频波叠加，形成不向前移动的波形。',
          body:`<p>设</p>
<div class="nm-fml">y₁ = A cos( ωt − kx ),　y₂ = A cos( ωt + kx )</div>
<p>相加得</p>
<div class="nm-fml">y = 2A cos kx · cos ωt</div>
<p>其中 cos kx 只决定空间位置的振幅，cos ωt 只决定整体时间变化，因此节点位置固定，波形不向前传播。</p>
<p><strong>节点</strong>是始终静止的位置；<strong>腹部</strong>是振幅达到最大的位置。相邻节点距离为 λ/2，相邻节点与腹部之间距离为 λ/4。</p>
<div class="nm-callout">理想驻波中，空间上存在节点和腹部。波形不整体向前移动，但局部介质仍然在振动。能量在不同区域之间周期交换，因此"没有波形传播"不等于"没有能量变化"。</div>`},
        {id:'nm-k5-13', name:'边界反射与弦的简正模式', tags:['mod','law','der'], brief:'固定端反射倒相，自由端不倒相；弦上驻波满足 L = nλ/2。',
          body:`<p>一端固定的绳，反射波在端点必须满足位移为零，因此形成节点。自由端则允许端点位移达到较大值，近似形成腹部。反射使入射波和反射波叠加，进而形成驻波。</p>
<div class="nm-callout">固定端要求端点位移为零，所以反射波与入射波在端点处趋向反相；自由端允许端点位移明显变化，所以反射过程的相位关系相反。<strong>真正控制反射的是边界条件</strong>，而不是死记口诀。</div>
<p>长度为 L、两端固定的弦，驻波必须满足两端是节点。第 n 阶模式满足</p>
<div class="nm-fml">L = n ( λ<sub>n</sub> / 2 )
λ<sub>n</sub> = 2L / n
f<sub>n</sub> = n v / ( 2L )</div>
<p>整数 n 不是人为规定的，而是端点节点条件自动筛选出来的。这里没有使用偏微分方程，只使用几何边界条件和波速关系。</p>`},
        {id:'nm-k5-14', name:'波速与介质', tags:['exp','law'], brief:'理想弦上的波速 v ≈ √(T/μ)，随张力增大而增大。',
          body:`<p>波传播的不仅是几何形状，还伴随能量传递。在线性小振幅近似下，平均输运功率通常与振幅平方成正比。</p>
<p><strong>理想弦模型</strong></p>
<div class="nm-fml">v ≈ √( T / μ )
<span class="note">T 为张力，μ 为线密度。</span></div>
<div class="nm-callout nm-exp">实验　在弦长和线密度近似不变时改变张力 T，测量驻波频率。实验表明波速随张力增大而增大。</div>
<div class="nm-callout nm-exp">实验　已知弦长 L 和驱动频率 f，观察稳定驻波并测量相邻节点距离 d。由于 d = λ/2，所以 v = fλ = 2fd。改变张力或线密度后重复测量，可以观察波速随介质参数改变。</div>`},
        {id:'nm-k5-15', name:'多普勒效应', tags:['def','der'], brief:'波源运动改变波长，观察者运动改变"遇峰速率"。',
          body:`<p>波源、介质和观察者之间存在相对运动时，观察到的频率会发生变化。</p>
<p>若观察者静止、波源以速度 u<sub>s</sub> 向观察者运动，波源频率为 f₀，则前方波长为</p>
<div class="nm-fml">λ′ = ( v − u<sub>s</sub> ) / f₀
f = v / λ′ = [ v / ( v − u<sub>s</sub> ) ] f₀</div>
<p>若波源静止、观察者以速度 u₀ 向波源运动，则单位时间遇到的波峰增加：</p>
<div class="nm-fml">f = [ ( v + u₀ ) / v ] f₀</div>
<div class="nm-callout">比较两式可以看到：<strong>波源运动改变的是波长，观察者运动改变的是"遇峰速率"。</strong>不同运动方向必须重新建立波峰计数，不能机械套用公式。</div>
<p>当声源相对介质运动时，一个周期内波源并不是留在原地，因此相邻波峰的空间距离改变。若波源向观察者靠近，前方波峰间距减小，观察频率升高；远离则相反。</p>`},
        {id:'nm-k5-16', name:'线性叠加的适用边界', tags:['def'], brief:'强非线性情况下，波形可能变形，简单叠加失效。',
          body:`<p>本章的波叠加建立在线性、小振幅和近似不改变介质性质的条件上。</p>
<p>强非线性情况下，波之间可能相互作用、变形甚至产生冲击结构，此时简单叠加原理不再严格成立。基础牛顿力学课程先掌握线性模型，是因为它已经能够解释大量实验现象。</p>
<div class="nm-callout">对波动最容易混淆的是三个问题：<br>
① 某个位置的质点怎样振动；<br>
② 波形怎样沿空间移动；<br>
③ 能量怎样传播。<br><br>
它们并非同一件事。用固定位置看 y(t) 是时间振动，用固定时刻看 y(x) 是空间波形。</div>
<p>对 y = A cos(ωt − kx)，若固定 t，就得到空间正弦曲线；若固定 x，就得到时间简谐振动。一个公式同时包含两个不同视角，但每次实际绘图时只允许固定其中一个变量。</p>`}
      ]}
    ]
  },

<div class="nm-callout">表格中的"适用条件"与公式本身同样重要。物理公式不是脱离模型独立存在的数学恒等式，而是物理规律在特定近似下的表达。</div>`}

<div class="nm-fml">f′(x) = lim<sub>Δx→0</sub> [ f(x+Δx) − f(x) ] / Δx</div>

<p>真正的物理直觉往往不是得到十位小数，而是知道一个量大约是 10⁻² 还是 10²。估算车辆刹车距离、人体步行速度和小球落地时间，都能帮助检查精确计算结果是否合理。</p>`}

const NM_KP = {};

function nmBuildCard(item){
  const tags = item.tags.map(t =>
    `<span class="nm-arc-badge nm-arc-${t}">${NM_TAG_LABEL[t]}</span>`
  ).join('');
  return `<div class="nm-course-card" onclick="showNmItem('${item.id}')">
    <div class="nm-arc-badges">${tags}</div>
    <h4>${item.name}</h4>
    <p>${item.brief}</p>
  </div>`;
}

function renderNewton(){
  const root = document.getElementById('nmRoadmap');
  let html = '';
  NM_DATA.forEach(ch => {
    html += `<h2 class="nm-phase-title ${ch.id}" id="${ch.id}">${ch.num} · ${ch.title}</h2>`;
    html += `<div class="nm-phase-en">${ch.en}</div>`;
    html += `<p class="nm-phase-desc">${ch.desc}</p>`;
    ch.sections.forEach(sec => {
      html += `<div class="nm-domain" style="--domain-color:${sec.color};">
        <div class="nm-domain-header">
          <h3>${sec.name}</h3>
          <span class="nm-domain-count">${sec.items.length} 个知识点</span>
          <span class="nm-domain-desc">${sec.desc}</span>
        </div>
        <div class="nm-domain-grid">`;
      sec.items.forEach(it => {
        html += nmBuildCard(it);
        NM_KP[it.id] = {item: it, section: sec.name, chapter: `${ch.num} · ${ch.title}`};
      });
      html += `</div></div>`;
    });
  });
  root.innerHTML = html;

  const kCount = Object.keys(NM_KP).length;
  const fCount = (root.innerHTML.match(/class="nm-fml"/g) || []).length;
  document.getElementById('nmKCount').textContent = kCount;
  document.getElementById('nmFCount').textContent = fCount;
}

function showNmItem(id){
  const rec = NM_KP[id];
  if(!rec) return;
  const it = rec.item;
  document.getElementById('nmCrumbs').textContent = rec.chapter + ' ／ ' + rec.section;
  document.getElementById('nmTitle').textContent = it.name;
  document.getElementById('nmTags').innerHTML = it.tags.map(t =>
    `<span class="nm-arc-badge nm-arc-${t}">${NM_TAG_LABEL[t]}</span>`
  ).join('');
  document.getElementById('nmBody').innerHTML = it.body;
  document.getElementById('nmOverlay').classList.add('show');
  document.querySelector('.nm-modal').scrollTop = 0;
}
function hideNmInfo(){
  document.getElementById('nmOverlay').classList.remove('show');
}
function closeNmInfo(e){
  if(e.target.id === 'nmOverlay') hideNmInfo();
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') hideNmInfo();
});

document.addEventListener('DOMContentLoaded', renderNewton);
</script>
