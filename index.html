<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E</title>
<meta name="description" content="E 站点入口">
<style>
  :root{
    --bg-0:#05060c;
    --bg-1:#0b0f1e;
    --fg:#eef1f8;
    --fg-dim:#98a1bd;
    --card:rgba(255,255,255,.045);
    --card-border:rgba(255,255,255,.10);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    color:var(--fg);
    background:radial-gradient(1200px 800px at 50% -10%,#141a33 0%,var(--bg-1) 45%,var(--bg-0) 100%);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* 背景流动光斑 */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;filter:blur(60px);opacity:.55}
  .bg span{position:absolute;border-radius:50%;display:block}
  .bg span:nth-child(1){width:480px;height:480px;left:-10%;top:-12%;background:#2f6bff;animation:float1 18s ease-in-out infinite}
  .bg span:nth-child(2){width:420px;height:420px;right:-8%;top:-6%;background:#8b3dff;animation:float2 22s ease-in-out infinite}
  .bg span:nth-child(3){width:520px;height:520px;left:20%;bottom:-22%;background:#00c2a8;animation:float3 26s ease-in-out infinite}
  @keyframes float1{50%{transform:translate(120px,80px) scale(1.15)}}
  @keyframes float2{50%{transform:translate(-140px,60px) scale(1.1)}}
  @keyframes float3{50%{transform:translate(80px,-90px) scale(1.08)}}

  main{position:relative;z-index:1;width:100%;max-width:1040px}

  header{text-align:center;margin-bottom:40px}

  .logo{
    font-size:clamp(88px,16vw,150px);
    font-weight:800;
    line-height:.9;
    letter-spacing:-.05em;
    background:linear-gradient(150deg,#ffffff 0%,#a8c2ff 45%,#c9a8ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 12px 40px rgba(96,140,255,.35));
    animation:rise .7s both;
  }
  header p{margin-top:14px;color:var(--fg-dim);font-size:14px;letter-spacing:.06em;animation:rise .7s .1s both}

  .sites{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}

  .card{
    position:relative;
    display:flex;flex-direction:column;gap:10px;
    min-height:150px;
    padding:22px;
    border-radius:18px;
    text-decoration:none;color:inherit;
    background:var(--card);
    border:1px solid var(--card-border);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    overflow:hidden;
    transition:transform .28s cubic-bezier(.2,.7,.3,1),border-color .28s,background .28s;
    animation:rise .6s both;
  }
  .card::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(420px 220px at var(--x,25%) var(--y,0%),var(--accent),transparent 72%);
    opacity:0;transition:opacity .35s;
  }
  .card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(255,255,255,.07)}
  .card:hover::before{opacity:.16}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .card .label{
    position:relative;
    font-size:13px;color:var(--fg-dim);letter-spacing:.04em;
  }
  .card .name{
    position:relative;
    margin-top:auto;
    font-size:clamp(20px,2.4vw,26px);
    font-weight:700;
    letter-spacing:-.01em;
    line-height:1.15;
    word-break:break-word;
  }
  .card .name .ehl{color:var(--accent)}

  .card .arrow{
    position:absolute;top:20px;right:20px;
    color:var(--fg-dim);
    transition:transform .28s,color .28s;
  }
  .card:hover .arrow{transform:translate(3px,-3px);color:var(--accent)}

  .card:nth-child(1){animation-delay:.16s}
  .card:nth-child(2){animation-delay:.22s}
  .card:nth-child(3){animation-delay:.28s}
  .card:nth-child(4){animation-delay:.34s}
  .card:nth-child(5){animation-delay:.40s}
  .card:nth-child(6){animation-delay:.46s}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* 手机端:纵向往下放 */
  @media (max-width:720px){
    body{padding:36px 18px;align-items:flex-start}
    header{margin:24px 0 30px}
    .sites{grid-template-columns:1fr;gap:14px}
    .card{min-height:120px;padding:18px}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><span></span><span></span><span></span></div>

  <main>
    <header>
      <h1 class="logo">E</h1>
      <p>选择要进入的站点</p>
    </header>

    <nav class="sites" aria-label="站点导航">
      <!-- 第一列 -->
      <a class="card" href="https://illudew.github.io/exam/" style="--accent:#ffa53d">
        <span class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
        <span class="label">中高考物理</span>
        <span class="name"><span class="ehl">E</span>xam</span>
      </a>

      <!-- 第二列 -->
      <a class="card" href="https://illudew.github.io/Equimophysics/" style="--accent:#a06bff">
        <span class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
        <span class="label">南开物院生存指南</span>
        <span class="name"><span class="ehl">E</span>quimophysics</span>
      </a>

      <!-- 第三列 -->
      <a class="card" href="https://illudew.github.io/vocabulary/" style="--accent:#ff5c8a">
        <span class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
        <span class="label">背单词</span>
        <span class="name"><span class="ehl">E</span>nglish</span>
      </a>

      <!-- 第一列下 -->
      <a class="card" href="https://illudew.github.io/physics/" style="--accent:#4f8cff">
        <span class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
        <span class="label">物理</span>
        <span class="name">tru<span class="ehl">E</span>physics</span>
      </a>

      <!-- 第二列下 -->
      <a class="card" href="https://illudew.github.io/science/" style="--accent:#2fe0c0">
        <span class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
        <span class="label">科研</span>
        <span class="name">sci-<span class="ehl">E</span>-nce</span>
      </a>

      <!-- 第三列下 -->
      <a class="card" href="https://illudew.github.io/ultra/" style="--accent:#a3e635">
        <span class="arrow" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>
        </span>
        <span class="label">世界</span>
        <span class="name">th<span class="ehl">E</span> world</span>
      </a>
    </nav>
  </main>
</body>
</html>
